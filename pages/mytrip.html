<script type="module">
  import { initializeApp, getApps, getApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
  import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
  import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc, updateDoc } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

  const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { 
    apiKey: "AIzaSyCQF8A3ieML0JP3X8X78NCRuiUETRAiu5E", 
    authDomain: "travel-96009.firebaseapp.com", 
    projectId: "travel-96009", 
    storageBucket: "travel-96009.firebasestorage.app", 
    messagingSenderId: "578860064042", 
    appId: "1:578860064042:web:b147880df3a01dd8f75253" 
  };
  const app = !getApps().length ? initializeApp(firebaseConfig) : getApp(); 
  const auth = getAuth(app);
  const db = getFirestore(app); 
  const appId = typeof __app_id !== 'undefined' ? __app_id : "travel-platform-v2";

  let currentUser = null;
  let publicSpots = [];
  let userFavorites = new Set();
  const isGuest = localStorage.getItem('isGuest') === 'true';
  let isListCollapsed = false; 

  window.showToast = function(msg) {
    const el = document.getElementById('toast');
    if(!el) return;
    document.getElementById('toast-msg').innerText = msg;
    el.classList.remove('opacity-0', '-translate-y-4', 'pointer-events-none');
    el.classList.add('opacity-100', 'translate-y-0');
    setTimeout(() => {
      el.classList.remove('opacity-100', 'translate-y-0');
      el.classList.add('opacity-0', '-translate-y-4', 'pointer-events-none');
    }, 3000);
  }

  const LOCATION_MODES = [
    { id: 'spot', label: '景點', icon: 'fa-solid fa-camera' },
    { id: 'food', label: '美食', icon: 'fa-solid fa-utensils' },
    { id: 'shop', label: '購物', icon: 'fa-solid fa-bag-shopping' },
    { id: 'hotel', label: '住宿', icon: 'fa-solid fa-hotel' },
    { id: 'park', label: '樂園', icon: 'fa-solid fa-wand-magic-sparkles' },
    { id: 'car_rental', label: '租車站', icon: 'fa-solid fa-key' },
    { id: 'station', label: '車站', icon: 'fa-solid fa-train' },
    { id: 'airport', label: '機場', icon: 'fa-solid fa-plane-arrival' },
    { id: 'other', label: '其他', icon: 'fa-solid fa-location-dot' }
  ];

  let map = null;
  let markersLayer = null;
  let userMarker = null;
  let isFirstLoad = true;

  function initMap() {
      const mapEl = document.getElementById('map');
      if (!mapEl) return;
      if (mapEl._leaflet_id) { mapEl._leaflet_id = null; }

      const streetLayer = L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
          attribution: '&copy; Google Maps', maxZoom: 20, keepBuffer: 4, updateWhenIdle: true
      });

      map = L.map('map', { zoomControl: false, layers: [streetLayer] }).setView([23.5, 121], 13); 
      L.control.zoom({ position: 'topright' }).addTo(map);

      markersLayer = L.layerGroup().addTo(map);
      
      const resizeObserver = new ResizeObserver(() => { if (map) map.invalidateSize(); });
      resizeObserver.observe(mapEl);

      map.on('locationfound', function(e) {
          if (!userMarker) {
              const userIcon = L.divIcon({ className: 'user-marker', html: `<div class="w-5 h-5 bg-[#4285F4] rounded-full border-[3px] border-white shadow-[0_0_16px_rgba(66,133,244,0.6)]"></div>`, iconSize: [20, 20], iconAnchor: [10, 10] });
              userMarker = L.marker(e.latlng, { icon: userIcon, zIndexOffset: 1000 }).addTo(map);
          } else { userMarker.setLatLng(e.latlng); }
          const locateIcon = document.querySelector('#btn-locate i');
          if(locateIcon) locateIcon.className = 'fa-solid fa-location-crosshairs text-[#4285F4]';
          window.showToast("已取得目前位置");
      });
  }
  
  window.locateUser = function() {
      if(!map) return;
      const locateIcon = document.querySelector('#btn-locate i');
      if(locateIcon) locateIcon.className = 'fa-solid fa-spinner fa-spin text-[#748CAB]';
      window.showToast("正在尋找您的位置...");
      map.locate({ setView: true, maxZoom: 16, enableHighAccuracy: true, timeout: 10000 });
  };

  function renderMarkersOnMap(spots) {
      if(!markersLayer) return;
      markersLayer.clearLayers();
      let validCoords = [];

      spots.forEach(spot => {
          if (spot.lat && spot.lng) {
              validCoords.push([spot.lat, spot.lng]);
              
              const customIcon = L.divIcon({
                  className: 'custom-marker',
                  html: `<div class="marker-pin bg-[#1890FF]"><i class="fa-solid fa-camera"></i></div>`,
                  iconSize: [44, 44], iconAnchor: [22, 44], popupAnchor: [0, -44]
              });
              
              const marker = L.marker([spot.lat, spot.lng], { icon: customIcon });
              marker.on('click', () => window.flyToSpot(spot.id));
              markersLayer.addLayer(marker);
          }
      });

      if (isFirstLoad && validCoords.length > 0) {
          map.setView(validCoords[0], 14);
          isFirstLoad = false;
      }
  }

  window.flyToSpot = function(spotId) {
      const spot = publicSpots.find(s => s.id === spotId);
      if (!spot || !map) return;
      if (spot.lat && spot.lng) {
          let targetLat = spot.lat;
          if(window.innerWidth < 768 && !isListCollapsed) targetLat -= 0.003; 
          map.flyTo([targetLat, spot.lng], 16, { duration: 1 });
      }
      window.showSpotDetail(spotId);
  };

  // --- 💡 修正 4：防觸控穿透與事件隔離 ---
  const sheetPanel = document.getElementById('mobile-list-panel');
  const sheetHeader = document.getElementById('sheet-header');
  const listEl = document.getElementById('explore-list');
  let dragStartY = null;
  let startHeight = 0;

  // 阻絕清單的捲動與觸控事件傳遞給地圖
  if (listEl) {
      listEl.addEventListener('touchstart', (e) => e.stopPropagation(), {passive: true});
      listEl.addEventListener('touchmove', (e) => e.stopPropagation(), {passive: true});
      listEl.addEventListener('touchend', (e) => e.stopPropagation(), {passive: true});
  }

  function applyListLayoutMode() {
      const cards = document.querySelectorAll('.spot-card');
      if(!listEl) return;
      
      if (window.innerWidth >= 768) {
           listEl.className = 'flex-1 overflow-y-auto overflow-x-hidden overscroll-contain px-5 pb-8 pt-1 hide-scrollbar flex flex-col relative gap-0 transition-all bg-white';
           cards.forEach(c => {
              c.classList.remove('w-[85vw]', 'max-w-[340px]', 'snap-start', 'border', 'rounded-[16px]', 'shadow-sm', 'm-1');
              c.classList.add('w-full', 'border-b', 'border-gray-100', 'pb-4', 'mb-4');
           });
           return;
      }

      if (isListCollapsed) {
          listEl.className = 'flex-1 overflow-x-auto overflow-y-hidden overscroll-contain px-4 pb-4 pt-1 hide-scrollbar flex flex-row relative gap-3 min-h-0 snap-x snap-mandatory transition-all bg-white';
          cards.forEach(c => {
              c.classList.remove('w-full', 'border-b', 'pb-4', 'mb-4');
              c.classList.add('w-[85vw]', 'max-w-[340px]', 'snap-start', 'border', 'border-gray-200', 'rounded-[20px]', 'shadow-sm', 'p-0.5'); 
          });
      } else {
          listEl.className = 'flex-1 overflow-y-auto overflow-x-hidden overscroll-contain px-4 pb-8 pt-1 hide-scrollbar flex flex-col relative gap-0 transition-all bg-white';
          cards.forEach(c => {
              c.classList.remove('w-[85vw]', 'max-w-[340px]', 'snap-start', 'border', 'rounded-[20px]', 'shadow-sm', 'p-0.5');
              c.classList.add('w-full', 'border-b', 'border-gray-100', 'pb-4', 'mb-4');
          });
      }
  }
  
  window.addEventListener('resize', applyListLayoutMode);

  if(sheetHeader) {
    sheetHeader.addEventListener('touchstart', (e) => {
        if(window.innerWidth >= 768) return;
        e.stopPropagation(); // 阻止地圖跟隨
        dragStartY = e.touches[0].clientY;
        startHeight = sheetPanel.offsetHeight;
        sheetPanel.style.transition = 'none';
    }, {passive: false});

    sheetHeader.addEventListener('touchmove', (e) => {
        if(window.innerWidth >= 768 || dragStartY === null) return;
        e.stopPropagation(); // 阻止地圖跟隨
        const dy = dragStartY - e.touches[0].clientY;
        let newHeight = startHeight + dy;
        
        if (newHeight < window.innerHeight * 0.1) newHeight = window.innerHeight * 0.1;
        if (newHeight > window.innerHeight * 0.9) newHeight = window.innerHeight * 0.9;
        
        sheetPanel.style.height = `${newHeight}px`;
        document.getElementById('fab-group').style.bottom = `calc(${newHeight}px + 4rem + env(safe-area-inset-bottom) + 16px)`;
    }, {passive: false});

    sheetHeader.addEventListener('touchend', (e) => {
        if(window.innerWidth >= 768 || dragStartY === null) return;
        e.stopPropagation(); // 阻止地圖跟隨
        dragStartY = null;
        sheetPanel.style.transition = 'height 0.3s cubic-bezier(0.2, 0.8, 0.2, 1)';
        document.getElementById('fab-group').style.transition = 'bottom 0.3s cubic-bezier(0.2, 0.8, 0.2, 1)';
        
        const vh = window.innerHeight;
        const currentH = sheetPanel.offsetHeight;
        let targetHeight = '';
        
        if (currentH > vh * 0.6) { targetHeight = '85vh'; isListCollapsed = false; } 
        else if (currentH < vh * 0.35) { targetHeight = '220px'; isListCollapsed = true; } 
        else { targetHeight = '50vh'; isListCollapsed = false; }
        
        sheetPanel.style.height = targetHeight;
        document.getElementById('fab-group').style.bottom = `calc(${targetHeight} + 4rem + env(safe-area-inset-bottom) + 16px)`;
        
        applyListLayoutMode();
        setTimeout(() => { document.getElementById('fab-group').style.transition = ''; }, 300);
    });
  }

  function listenToFavorites(userId) {
      const favRef = collection(db, 'artifacts', appId, 'users', userId, 'favorites');
      onSnapshot(favRef, (snapshot) => {
          userFavorites = new Set(snapshot.docs.map(doc => doc.id));
          publicSpots.forEach(spot => updateFavoriteUI(spot.id));
      });
  }

  function updateFavoriteUI(spotId) {
      const isFav = userFavorites.has(spotId);
      
      const favBtn = document.getElementById('btn-favorite-spot');
      if(favBtn) {
         const icon = favBtn.querySelector('i');
         icon.className = isFav ? 'fa-solid fa-heart text-[#E63946]' : 'fa-regular fa-heart text-[#8796A5]';
      }

      const listFavBtnIcon = document.querySelector(`#list-fav-btn-${spotId} i`);
      if (listFavBtnIcon) {
          listFavBtnIcon.className = isFav ? 'fa-solid fa-heart text-[#E63946] text-[18px]' : 'fa-regular fa-heart text-[#8796A5] text-[18px]';
      }
  }

  function updateFavoriteCountUI(spotId) {
      const spot = publicSpots.find(s => s.id === spotId);
      if (!spot) return;
      document.querySelectorAll(`.fav-count-${spotId}`).forEach(el => el.innerText = spot.favoriteCount || 0);
  }

  window.toggleFavorite = async function(spotId) {
      if (isGuest || !currentUser) { 
          window.showToast("請先登入後才能使用收藏功能"); 
          return; 
      }

      const isFav = userFavorites.has(spotId);
      const spot = publicSpots.find(s => s.id === spotId);
      
      if (isFav) {
          userFavorites.delete(spotId);
          if (spot) spot.favoriteCount = Math.max(0, (spot.favoriteCount || 0) - 1);
      } else {
          userFavorites.add(spotId);
          if (spot) spot.favoriteCount = (spot.favoriteCount || 0) + 1;
      }
      
      updateFavoriteUI(spotId);
      updateFavoriteCountUI(spotId);

      try {
          const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'favorites', spotId);
          if (isFav) await deleteDoc(docRef);
          else await setDoc(docRef, { timestamp: Date.now() });

          if (spot) {
              const spotRef = doc(db, 'artifacts', appId, 'public', 'data', 'spots', spotId);
              await updateDoc(spotRef, { favoriteCount: spot.favoriteCount });
          }
      } catch (e) {
          console.error(e);
      }
  };

  // 💡 已完全拔除假資料，只會呈現 Firebase 動態資料庫的景點
  function loadSpots() {
    const qSpots = collection(db, 'artifacts', appId, 'public', 'data', 'spots');
    onSnapshot(qSpots, (snapshot) => {
      publicSpots = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      const searchInput = document.getElementById('input-explore-search');
      renderListAndMap(searchInput ? searchInput.value : '');
    });
  }

  function renderListAndMap(filter = '') {
    const container = document.getElementById('explore-list');
    if(!container) return;
    
    let spots = publicSpots;
    if (filter) {
        const kw = filter.toLowerCase();
        spots = spots.filter(s => (s.name || '').toLowerCase().includes(kw) || (s.address || s.subtitle || '').toLowerCase().includes(kw));
    }

    if (map) renderMarkersOnMap(spots);

    if (spots.length === 0) {
        container.innerHTML = `<div class="h-full w-full flex flex-col items-center justify-center text-center text-[#8796A5] m-auto"><p class="font-extrabold text-[15px]">未找到景點</p></div>`;
        return;
    }

    container.innerHTML = [...spots].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)).map(spot => {
        const thumbnailHtml = spot.imageUrl
            ? `<img src="${spot.imageUrl}" class="w-full h-full object-cover">`
            : `<div class="w-full h-full bg-gray-200 flex items-center justify-center"><i class="fa-solid fa-image text-gray-400"></i></div>`;

        const isFav = userFavorites.has(spot.id);
        const favIconClass = isFav ? 'fa-solid fa-heart text-[#E63946]' : 'fa-regular fa-heart text-[#8796A5]';
        const mockDistance = Math.floor(Math.random() * 800 + 100) + 'm'; 

        return `
        <div onclick="window.flyToSpot('${spot.id}')" class="spot-card w-full shrink-0 bg-white flex flex-row gap-3 relative cursor-pointer group">
           
           <div class="w-[130px] h-[130px] rounded-[16px] overflow-hidden relative shrink-0">
               ${thumbnailHtml}
           </div>
           
           <div class="flex-1 py-1 pr-1 flex flex-col min-w-0">
              <div class="flex justify-between items-start">
                 <h3 class="text-[17px] font-extrabold text-[#2C3E50] leading-tight pr-2 truncate">${spot.name}</h3>
                 <button id="list-fav-btn-${spot.id}" onclick="event.stopPropagation(); window.toggleFavorite('${spot.id}')" class="p-1 -mt-1 -mr-1">
                     <i class="${favIconClass} text-[18px] transition-transform active:scale-90"></i>
                 </button>
              </div>
              
              <div class="text-[13px] text-[#8796A5] font-bold mt-0.5 flex items-center gap-1">
                 <i class="fa-regular fa-heart text-[11px]"></i>
                 <span class="fav-count-${spot.id}">${spot.favoriteCount || 0}</span>
                 <span>·</span>
                 <span>${mockDistance}</span>
              </div>
              
              <div class="mt-auto flex gap-2">
                 <button onclick="event.stopPropagation(); window.showToast('排入行程');" class="bg-[#F5F7FA] hover:bg-gray-200 text-[#2C3E50] text-[13px] font-extrabold py-1.5 px-3.5 rounded-full flex items-center gap-1.5 transition-colors">
                     <i class="fa-solid fa-plus text-[#E58F65]"></i> 行程
                 </button>
                 <button onclick="event.stopPropagation(); window.flyToSpot('${spot.id}');" class="bg-[#F5F7FA] hover:bg-gray-200 text-[#2C3E50] text-[13px] font-extrabold py-1.5 px-3.5 rounded-full flex items-center gap-1.5 transition-colors">
                     <i class="fa-solid fa-location-dot text-[#A0ABB7]"></i> 位置
                 </button>
              </div>
           </div>
        </div>`;
    }).join('');

    applyListLayoutMode();
  }

  const searchInput = document.getElementById('input-explore-search');
  if(searchInput) {
      searchInput.addEventListener('input', (e) => renderListAndMap(e.target.value));
  }

  window.showSpotDetail = function(spotId) {
      const spot = publicSpots.find(s => s.id === spotId);
      if (!spot) return;

      const locObj = LOCATION_MODES.find(m => m.id === spot.locMode) || LOCATION_MODES[0];

      if (spot.imageUrl) {
          document.getElementById('detail-cover-image').style.backgroundImage = `url('${spot.imageUrl}')`;
          document.getElementById('detail-cover-image').classList.remove('opacity-0');
      } else {
          document.getElementById('detail-cover-image').classList.add('opacity-0');
      }

      document.getElementById('detail-name').innerText = spot.name;
      document.getElementById('detail-cat').innerText = locObj.label;

      const fnContainer = document.getElementById('detail-foreign-names');
      if (spot.foreignName1 || spot.foreignName2) {
          fnContainer.classList.remove('hidden');
          fnContainer.classList.add('flex');
          document.getElementById('detail-foreign-1').innerText = spot.foreignName1 || '';
          document.getElementById('detail-foreign-1').style.display = spot.foreignName1 ? 'block' : 'none';
          document.getElementById('detail-foreign-2').innerText = spot.foreignName2 || '';
          document.getElementById('detail-foreign-2').style.display = spot.foreignName2 ? 'block' : 'none';
      } else {
          fnContainer.classList.add('hidden');
          fnContainer.classList.remove('flex');
      }

      document.getElementById('detail-address').innerText = spot.address || spot.subtitle || '無詳細地址';
      
      const descContainer = document.getElementById('detail-desc-container');
      if (spot.description) {
          document.getElementById('detail-desc').innerHTML = spot.description.replace(/\n/g, '<br>');
          descContainer.classList.remove('hidden');
          descContainer.classList.add('flex');
      } else {
          descContainer.classList.add('hidden');
          descContainer.classList.remove('flex');
      }

      const navBtn = document.getElementById('circle-nav-btn');
      if (spot.lat && spot.lng) navBtn.href = `https://www.google.com/maps/dir/?api=1&destination=${spot.lat},${spot.lng}`;
      else navBtn.href = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(spot.address || spot.name)}`;

      const webBtn = document.getElementById('circle-web-btn');
      if (spot.website) { webBtn.href = spot.website; webBtn.style.display = 'flex'; } 
      else webBtn.style.display = 'none';

      const phoneBtn = document.getElementById('circle-phone-btn');
      if (spot.phone) { phoneBtn.href = `tel:${spot.phone}`; phoneBtn.style.display = 'flex'; } 
      else phoneBtn.style.display = 'none';

      updateFavoriteUI(spot.id);
      const favBtn = document.getElementById('btn-favorite-spot');
      if(favBtn) favBtn.onclick = () => window.toggleFavorite(spot.id);

      document.getElementById('spot-detail-panel').classList.remove('translate-x-full');
  };

  window.closeSpotDetail = function() {
      document.getElementById('spot-detail-panel').classList.add('translate-x-full');
  };

  async function startApp() {
      try {
          if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await signInWithCustomToken(auth, __initial_auth_token);
          else await signInAnonymously(auth);
      } catch (e) {}
      initMap(); 
      loadSpots();
  }

  setTimeout(startApp, 100);
</script>
