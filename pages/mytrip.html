<!-- ========================================== -->
<!-- 行程工坊 (pages/mytrip.html) -->
<!-- ⚠️ 已修正佈局，解開寬度限制，徹底刪除重複選單 -->
<!-- ========================================== -->

<style>
  input[type="time"]::-webkit-calendar-picker-indicator { cursor: pointer; opacity: 0.6; }
  input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  
  .bottom-sheet { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
  .bottom-sheet.open { transform: translateY(0); }
  .bottom-sheet.closed { transform: translateY(100%); }
  .overlay { transition: opacity 0.3s ease; }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .overlay.closed { opacity: 0; pointer-events: none; }
  textarea { resize: none; overflow: hidden; }
  
  /* 表單 UI 樣式 */
  .form-card { background: #FFFFFF; border-radius: 20px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); border: 1px solid rgba(230,235,239,0.8); }
  .form-input { width: 100%; background: #F8FAFC; border: 1px solid transparent; border-radius: 12px; padding: 12px 16px; font-size: 15px; font-weight: 700; color: #2C3E50; outline: none; transition: all 0.2s ease; }
  .form-input::placeholder { color: #94A3B8; font-weight: 500; }
  .form-input:focus { border-color: rgba(116, 140, 171, 0.4); background: #FFFFFF; box-shadow: 0 0 0 3px rgba(116, 140, 171, 0.1); }
  .form-label { display: block; font-size: 12px; font-weight: 700; color: #64748B; margin-bottom: 6px; padding-left: 4px; }
  .form-row { display: flex; gap: 12px; }
  .form-row > div { flex: 1; }
</style>

<!-- 提示訊息 -->
<div id="toast" class="fixed top-[env(safe-area-inset-top,20px)] left-1/2 transform -translate-x-1/2 bg-brand-textMain text-white px-6 py-3 rounded-full shadow-2xl z-[2500] transition-all duration-300 opacity-0 pointer-events-none -translate-y-4 flex items-center gap-2 font-bold text-sm mt-2">
  <i class="fa-solid fa-circle-check text-brand-primary"></i> <span id="toast-msg">成功！</span>
</div>

<!-- 💡 核心修正：移除 max-w-md mx-auto，改為 w-full h-full，完美填滿 SPA 內容區 -->
<div class="w-full h-full bg-brand-bg relative flex flex-col fade-in overflow-hidden">

  <!-- Header 1: 行程列表 (預設顯示) -->
  <header id="header-standard" class="bg-brand-bg pt-[max(16px,env(safe-area-inset-top))] pb-4 px-6 shrink-0 flex justify-between items-end border-b border-brand-light z-10 transition-all">
    <div>
      <p class="text-sm font-bold text-brand-primary mb-1 uppercase tracking-widest mt-2">My Trip</p>
      <h1 class="text-3xl font-extrabold text-brand-dark tracking-tight">我的行程</h1>
    </div>
    <button onclick="window.showToast('這裡會顯示行程相關通知')" class="w-10 h-10 flex items-center justify-center bg-white border border-brand-light shadow-sm rounded-full text-brand-textSub hover:text-brand-primary active:scale-95 transition-all">
      <i class="fa-solid fa-calendar-check text-lg"></i>
    </button>
  </header>

  <!-- Header 2: 行程詳細內容 (預設隱藏) -->
  <header id="header-itinerary" class="hidden bg-brand-bg pt-[max(16px,env(safe-area-inset-top))] pb-2 px-4 shrink-0 flex justify-between items-center border-b border-brand-light z-10">
    <button onclick="window.switchView('plans')" class="w-10 h-10 mt-2 flex items-center justify-center text-brand-dark hover:text-brand-primary transition-colors">
      <i class="fa-solid fa-chevron-left text-xl"></i>
    </button>
    <div class="flex-1 mt-2 flex flex-col items-center justify-center text-center px-1 truncate">
      <h1 id="header-itinerary-title" class="text-[16px] font-extrabold text-brand-dark tracking-tight truncate w-full">載入中...</h1>
      <p id="header-itinerary-subtitle" class="text-[11px] font-bold text-brand-textSub mt-0.5">--</p>
    </div>
    <div class="flex items-center gap-0.5 mt-2">
      <button id="btn-itinerary-edit" onclick="window.toggleEditMode()" class="w-9 h-9 flex items-center justify-center text-brand-dark hover:text-brand-primary transition-colors rounded-full">
        <i class="fa-solid fa-pen text-[16px]"></i>
      </button>
      <button onclick="window.switchView('setup')" class="w-9 h-9 flex items-center justify-center text-brand-dark hover:text-brand-primary transition-colors rounded-full">
        <i class="fa-solid fa-gear text-[18px]"></i>
      </button>
    </div>
  </header>

  <!-- Header 3: 行程設定 (預設隱藏) -->
  <header id="header-setup" class="hidden bg-brand-bg pt-[max(16px,env(safe-area-inset-top))] pb-4 px-6 shrink-0 flex justify-between items-end border-b border-brand-light z-10 transition-all">
    <div>
      <p class="text-sm font-bold text-brand-primary mb-1 uppercase tracking-widest mt-2">Setup</p>
      <h1 id="header-setup-title" class="text-3xl font-extrabold text-brand-dark tracking-tight">行程設定</h1>
    </div>
    <button onclick="window.switchView(state.currentPlanId ? 'itinerary' : 'plans')" class="w-10 h-10 flex items-center justify-center bg-white border border-brand-light shadow-sm rounded-full text-brand-textSub hover:text-brand-textMain active:scale-95 transition-all">
      <i class="fa-solid fa-xmark text-xl"></i>
    </button>
  </header>

  <!-- 主內容 1: 行程列表 -->
  <!-- 💡 因為 SPA 底部已經有 Navbar (並且利用 pb-16 讓出空間了)，這裡只需保留基本的 pb-6 -->
  <div id="view-plans" class="flex-1 overflow-y-auto px-6 pb-6 hide-scrollbar relative pt-2">
    <div id="plans-list" class="space-y-4 mt-4">
      <div class="py-12 text-center text-brand-textSub opacity-50"><i class="fa-solid fa-spinner fa-spin text-4xl mb-4"></i><p class="font-bold text-sm">載入中...</p></div>
    </div>
    <button onclick="window.openSetup(null)" class="w-full mt-6 py-4 border-2 border-dashed border-brand-primary text-brand-primary font-bold rounded-[20px] hover:bg-brand-light transition-all flex justify-center items-center gap-2">
      <i class="fa-solid fa-plus"></i> 建立新行程
    </button>
  </div>

  <!-- 主內容 2: 行程詳細時間軸 -->
  <div id="view-itinerary" class="hidden flex-1 flex flex-col h-full overflow-hidden bg-brand-card relative">
    <div class="px-6 py-3 shrink-0 border-b border-brand-light bg-brand-bg z-10">
      <div id="days-tabs" class="flex overflow-x-auto gap-3 snap-x hide-scrollbar pb-1"></div>
    </div>
    <div id="timeline-container" class="flex-1 overflow-y-auto px-2 pb-24 pt-6 relative bg-brand-card mx-2 mt-2 border border-transparent">
      <!-- 時間軸渲染區 -->
    </div>
    
    <!-- 浮動新增按鈕 -->
    <div id="fab-container" class="absolute bottom-6 right-6 z-20 pointer-events-none hidden transition-transform scale-0 duration-300">
      <button onclick="window.showAddMenu('main')" class="pointer-events-auto w-14 h-14 bg-brand-primary text-brand-card rounded-full shadow-lg shadow-brand-primary/30 flex items-center justify-center text-2xl hover:bg-brand-dark active:scale-95 transition-all">
        <i class="fa-solid fa-plus"></i>
      </button>
    </div>
  </div>

  <!-- 主內容 3: 行程設定 (建立/編輯表單) -->
  <div id="view-setup" class="hidden flex-1 overflow-y-auto px-4 pb-12 hide-scrollbar bg-brand-bg">
    <form id="form-setup" class="space-y-6 mt-4">
      <!-- 基礎設定 -->
      <div class="bg-white p-4 rounded-[24px] border border-brand-light shadow-sm space-y-3">
        <div>
          <label class="block text-[12px] font-bold text-brand-textSub mb-1.5 pl-1">行程名稱 <span class="text-brand-primary">*</span></label>
          <input type="text" id="setup-title" placeholder="例：東京五日遊" required class="w-full text-[15px] font-bold text-brand-dark outline-none bg-brand-bg rounded-xl px-4 py-3 placeholder-brand-textSub/50 border border-transparent focus:border-brand-primary/50 focus:bg-white transition-all">
        </div>
        <div>
          <label class="block text-[12px] font-bold text-brand-textSub mb-1.5 pl-1">出發日期與天數</label>
          <div class="flex items-center bg-brand-bg rounded-xl border border-transparent focus-within:border-brand-primary/50 focus-within:bg-white transition-all h-[46px] overflow-hidden">
            <input type="date" id="setup-start-date" class="flex-1 w-full text-[14px] font-bold text-brand-dark outline-none bg-transparent px-3 py-2">
            <div class="h-6 w-[1px] bg-brand-light"></div>
            <div class="w-24 shrink-0 flex items-center px-3">
              <input type="number" id="setup-days" min="1" max="30" value="3" required class="w-full text-[15px] font-bold text-brand-dark outline-none bg-transparent text-right">
              <span class="text-[13px] font-bold text-brand-textSub shrink-0 ml-1">天</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 航班設定 -->
      <div class="bg-white p-4 rounded-[24px] border border-brand-light shadow-sm">
        <h3 class="text-[14px] font-extrabold text-brand-dark mb-3 flex items-center gap-2">
          <div class="w-7 h-7 rounded-full bg-brand-primary/10 text-brand-primary flex items-center justify-center"><i class="fa-solid fa-plane-departure text-[12px]"></i></div> 航班資訊
        </h3>
        <div class="space-y-4">
          <!-- 去程 -->
          <div class="p-3.5 bg-brand-bg rounded-[20px] border border-brand-light/80 space-y-3 shadow-sm">
            <label class="block text-[13px] font-extrabold text-brand-primary border-b border-brand-light/80 pb-1.5 mb-1"><i class="fa-solid fa-plane-departure mr-1"></i>去程</label>
            <div class="grid grid-cols-2 gap-2.5">
              <div>
                <label class="text-[11px] text-brand-textSub font-bold px-1 block mb-1">航空公司</label>
                <div class="relative">
                  <select id="setup-flight-out-airline" class="w-full text-[14px] font-bold text-brand-dark outline-none bg-white rounded-xl px-3 py-2.5 border border-brand-light/50 focus:border-brand-primary transition-all appearance-none pr-8">
                    <option value="" disabled selected>請選擇航空公司</option>
                    <option value="中華航空">中華航空</option><option value="長榮航空">長榮航空</option><option value="星宇航空">星宇航空</option><option value="台灣虎航">台灣虎航</option><option value="日本航空">日本航空</option><option value="樂桃航空">樂桃航空</option>
                  </select>
                  <i class="fa-solid fa-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-[10px] text-brand-textSub pointer-events-none"></i>
                </div>
              </div>
              <div>
                <label class="text-[11px] text-brand-textSub font-bold px-1 block mb-1">航班編號</label>
                <input type="text" id="setup-flight-out-no" placeholder="例: BR192" class="w-full text-[14px] font-bold text-brand-dark outline-none bg-white rounded-xl px-3 py-2.5 placeholder-brand-textSub/40 border border-brand-light/50 focus:border-brand-primary transition-all">
              </div>
            </div>
            <div class="grid grid-cols-2 gap-2.5">
              <div>
                <label class="text-[11px] text-brand-textSub font-bold px-1 block mb-1">起飛地</label>
                <input type="text" id="setup-flight-out-dept-loc" placeholder="例: 桃園" class="w-full text-[14px] font-bold text-brand-dark outline-none bg-white rounded-xl px-3 py-2.5 placeholder-brand-textSub/40 border border-brand-light/50 focus:border-brand-primary transition-all">
              </div>
              <div>
                <label class="text-[11px] text-brand-textSub font-bold px-1 block mb-1">降落地</label>
                <input type="text" id="setup-flight-out-arr-loc" placeholder="例: 關西" class="w-full text-[14px] font-bold text-brand-dark outline-none bg-white rounded-xl px-3 py-2.5 placeholder-brand-textSub/40 border border-brand-light/50 focus:border-brand-primary transition-all">
              </div>
            </div>
            <div>
              <label class="text-[11px] text-brand-textSub font-bold px-1 block mb-1">航班時間</label>
              <div class="flex items-center gap-2 bg-white rounded-xl px-3 border border-brand-light/50 focus-within:border-brand-primary focus-within:ring-1 focus-within:ring-brand-primary transition-all shadow-sm h-[44px]">
                <input type="time" id="setup-flight-out-dept-time" class="flex-1 w-full text-[14px] font-bold text-brand-dark outline-none bg-transparent text-center">
                <span class="text-[14px] text-brand-textSub font-bold shrink-0">-</span>
                <input type="time" id="setup-flight-out-arr-time" class="flex-1 w-full text-[14px] font-bold text-brand-dark outline-none bg-transparent text-center">
              </div>
            </div>
          </div>
          <!-- 回程 -->
          <div class="p-3.5 bg-brand-bg rounded-[20px] border border-brand-light/80 space-y-3 shadow-sm">
            <label class="block text-[13px] font-extrabold text-brand-primary border-b border-brand-light/80 pb-1.5 mb-1"><i class="fa-solid fa-plane-arrival mr-1"></i>回程</label>
            <div class="grid grid-cols-2 gap-2.5">
              <div>
                <label class="text-[11px] text-brand-textSub font-bold px-1 block mb-1">航空公司</label>
                <div class="relative">
                  <select id="setup-flight-ret-airline" class="w-full text-[14px] font-bold text-brand-dark outline-none bg-white rounded-xl px-3 py-2.5 border border-brand-light/50 focus:border-brand-primary transition-all appearance-none pr-8">
                    <option value="" disabled selected>請選擇航空公司</option>
                    <option value="中華航空">中華航空</option><option value="長榮航空">長榮航空</option><option value="星宇航空">星宇航空</option><option value="台灣虎航">台灣虎航</option><option value="日本航空">日本航空</option><option value="樂桃航空">樂桃航空</option>
                  </select>
                  <i class="fa-solid fa-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-[10px] text-brand-textSub pointer-events-none"></i>
                </div>
              </div>
              <div>
                <label class="text-[11px] text-brand-textSub font-bold px-1 block mb-1">航班編號</label>
                <input type="text" id="setup-flight-ret-no" placeholder="例: JX803" class="w-full text-[14px] font-bold text-brand-dark outline-none bg-white rounded-xl px-3 py-2.5 placeholder-brand-textSub/40 border border-brand-light/50 focus:border-brand-primary transition-all">
              </div>
            </div>
            <div class="grid grid-cols-2 gap-2.5">
              <div>
                <label class="text-[11px] text-brand-textSub font-bold px-1 block mb-1">起飛地</label>
                <input type="text" id="setup-flight-ret-dept-loc" placeholder="例: 關西" class="w-full text-[14px] font-bold text-brand-dark outline-none bg-white rounded-xl px-3 py-2.5 placeholder-brand-textSub/40 border border-brand-light/50 focus:border-brand-primary transition-all">
              </div>
              <div>
                <label class="text-[11px] text-brand-textSub font-bold px-1 block mb-1">降落地</label>
                <input type="text" id="setup-flight-ret-arr-loc" placeholder="例: 桃園" class="w-full text-[14px] font-bold text-brand-dark outline-none bg-white rounded-xl px-3 py-2.5 placeholder-brand-textSub/40 border border-brand-light/50 focus:border-brand-primary transition-all">
              </div>
            </div>
            <div>
              <label class="text-[11px] text-brand-textSub font-bold px-1 block mb-1">航班時間</label>
              <div class="flex items-center gap-2 bg-white rounded-xl px-3 border border-brand-light/50 focus-within:border-brand-primary focus-within:ring-1 focus-within:ring-brand-primary transition-all shadow-sm h-[44px]">
                <input type="time" id="setup-flight-ret-dept-time" class="flex-1 w-full text-[14px] font-bold text-brand-dark outline-none bg-transparent text-center">
                <span class="text-[14px] text-brand-textSub font-bold shrink-0">-</span>
                <input type="time" id="setup-flight-ret-arr-time" class="flex-1 w-full text-[14px] font-bold text-brand-dark outline-none bg-transparent text-center">
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 住宿安排 -->
      <div class="bg-white p-4 rounded-[24px] border border-brand-light shadow-sm relative">
        <h3 class="text-[14px] font-extrabold text-brand-dark mb-3 flex items-center gap-2">
          <div class="w-7 h-7 rounded-full bg-brand-accent/10 text-brand-accent flex items-center justify-center"><i class="fa-solid fa-hotel text-[12px]"></i></div> 住宿安排
        </h3>
        <div id="hotel-list-container" class="space-y-3"></div>
        <button type="button" onclick="window.addSetupHotel()" class="w-full mt-3 py-3 bg-brand-bg border border-brand-light/80 text-brand-accent font-bold rounded-[16px] hover:bg-brand-accent/5 active:scale-95 transition-all flex justify-center items-center gap-2 text-[13px] shadow-sm">
          <i class="fa-solid fa-plus"></i> 新增住宿
        </button>
      </div>

      <button type="submit" class="w-full bg-brand-primary text-brand-card font-bold text-[16px] py-4 rounded-[20px] shadow-lg shadow-brand-primary/20 hover:bg-brand-dark active:scale-[0.98] transition-all mt-6 flex justify-center items-center gap-2">
        <i class="fa-solid fa-cloud-arrow-up text-lg"></i> 儲存行程設定
      </button>
      <button type="button" id="btn-delete-plan" onclick="window.deletePlan()" class="hidden w-full bg-[#FFE5E5] text-[#E63946] font-bold text-[15px] py-4 rounded-[20px] shadow-sm hover:bg-[#FFD1D1] active:scale-[0.98] transition-all mt-4 flex justify-center items-center gap-2">
        <i class="fa-solid fa-trash-can"></i> 刪除此行程計畫
      </button>
    </form>

    <!-- 匯出匯入 -->
    <div class="mt-8 mb-8 border-t border-brand-light pt-6">
      <label class="block text-xs font-bold text-brand-textSub mb-3 pl-1">資料備份與分享</label>
      <div class="flex gap-3">
        <button id="btn-export" onclick="window.handleExport()" type="button" class="flex-1 bg-white border border-brand-light text-brand-dark font-bold py-3 rounded-[16px] shadow-sm hover:bg-brand-light/50 active:scale-95 transition-all flex items-center justify-center gap-2 text-[13px]">
          <i class="fa-solid fa-file-export text-brand-primary"></i> 匯出行程
        </button>
        <button id="btn-import" onclick="document.getElementById('input-import-file').click()" type="button" class="flex-1 bg-white border border-brand-light text-brand-dark font-bold py-3 rounded-[16px] shadow-sm hover:bg-brand-light/50 active:scale-95 transition-all flex items-center justify-center gap-2 text-[13px]">
          <i class="fa-solid fa-file-import text-brand-primary"></i> 匯入行程
        </button>
        <input type="file" id="input-import-file" accept=".json" class="hidden">
      </div>
    </div>
  </div>
</div>

<!-- ================= MODALS & SHEETS ================= -->
<div id="modal-overlay" onclick="window.closeAllModals()" class="overlay closed fixed inset-0 z-[1050] bg-brand-textMain/40 backdrop-blur-[2px]"></div>

<!-- 1. 新增項目選單 -->
<div id="sheet-add-menu" class="bottom-sheet closed fixed inset-x-0 bottom-0 z-[1052] flex flex-col justify-end pointer-events-none">
  <!-- 💡 Modal 內部才需要 max-w-md mx-auto 以保持置中 -->
  <div class="pointer-events-auto relative bg-brand-bg w-full md:max-w-md mx-auto rounded-t-[32px] shadow-2xl flex flex-col pb-safe max-h-[85vh]">
    <div class="w-12 h-1.5 bg-brand-light rounded-full mx-auto mt-4 mb-2 shrink-0"></div>
    <div class="px-6 py-4 flex justify-between items-center shrink-0 border-b border-brand-light/50">
      <h3 id="sheet-add-title" class="text-[18px] font-bold text-brand-dark">選擇新增項目</h3>
      <button onclick="window.closeAllModals()" class="w-8 h-8 flex items-center justify-center bg-white rounded-full text-brand-textSub hover:text-brand-textMain shadow-sm transition-colors"><i class="fa-solid fa-xmark text-lg"></i></button>
    </div>
    <div id="sheet-add-content" class="px-6 py-6 overflow-y-auto hide-scrollbar"></div>
  </div>
</div>

<!-- 2. 搜尋公共景點選單 -->
<div id="sheet-spot-selector" class="bottom-sheet closed fixed inset-x-0 bottom-0 z-[1054] flex flex-col justify-end pointer-events-none">
  <div class="pointer-events-auto relative bg-brand-bg w-full md:max-w-md mx-auto rounded-t-[32px] shadow-2xl flex flex-col h-[85vh]">
    <div class="shrink-0 bg-brand-bg rounded-t-[32px] z-10 border-b border-brand-light/80 pb-3">
      <div class="w-12 h-1.5 bg-brand-light rounded-full mx-auto mt-4 mb-2"></div>
      <div class="px-6 py-2 flex justify-between items-center mb-3">
        <h3 class="text-[18px] font-bold text-brand-dark">選擇景點</h3>
        <button onclick="window.closeAllModals()" class="w-8 h-8 flex items-center justify-center bg-white shadow-sm rounded-full text-brand-textSub hover:text-brand-textMain transition-colors"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <div class="px-6 relative">
         <i class="fa-solid fa-magnifying-glass absolute left-10 top-1/2 -translate-y-1/2 text-brand-textSub"></i>
         <input type="text" id="input-select-spot-search" placeholder="搜尋公共景點庫..." class="w-full bg-white rounded-2xl py-3 pl-11 pr-4 shadow-sm border border-brand-light/80 outline-none focus:border-brand-primary/50 transition-all text-[15px] font-bold text-brand-dark">
      </div>
    </div>
    <div id="selector-spot-list" class="flex-1 overflow-y-auto px-6 py-4 hide-scrollbar space-y-3"></div>
  </div>
</div>

<!-- 3. 新增/編輯 表單 Modal -->
<div id="sheet-form" class="bottom-sheet closed fixed inset-x-0 bottom-0 z-[1055] flex flex-col justify-end pointer-events-none">
  <div class="pointer-events-auto relative bg-brand-bg w-full md:max-w-md mx-auto rounded-t-[32px] shadow-2xl flex flex-col h-[90vh]">
    <div class="shrink-0 bg-brand-bg rounded-t-[32px] z-10 border-b border-brand-light/80 pb-2">
      <div class="w-12 h-1.5 bg-brand-light rounded-full mx-auto mt-4 mb-2"></div>
      <div class="px-6 py-2 flex justify-between items-center">
        <h3 id="form-modal-title" class="text-[18px] font-bold text-brand-dark">新增項目</h3>
        <button onclick="window.closeAllModals()" class="w-8 h-8 flex items-center justify-center bg-white shadow-sm rounded-full text-brand-textSub hover:text-brand-textMain transition-colors"><i class="fa-solid fa-xmark text-lg"></i></button>

<script type="module">
  import { initializeApp, getApps, getApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
  import { getAuth, onAuthStateChanged, signInAnonymously } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
  import { getFirestore, doc, collection, onSnapshot, addDoc, deleteDoc, updateDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

  const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { apiKey: "AIzaSyCQF8A3ieML0JP3X8X78NCRuiUETRAiu5E", authDomain: "travel-96009.firebaseapp.com", projectId: "travel-96009", storageBucket: "travel-96009.firebasestorage.app", messagingSenderId: "578860064042", appId: "1:578860064042:web:b147880df3a01dd8f75253" };
  const app = !getApps().length ? initializeApp(firebaseConfig) : getApp(); 
  const auth = getAuth(app); 
  const db = getFirestore(app); 
  const appId = typeof __app_id !== 'undefined' ? __app_id : "travel-platform-v2";

  const TRANSPORT_MODES = [
    { id: 'flight', label: '航班', icon: 'fa-solid fa-plane' }, { id: 'train', label: '電車', icon: 'fa-solid fa-train' },
    { id: 'bus', label: '公車', icon: 'fa-solid fa-bus' }, { id: 'car', label: '開車', icon: 'fa-solid fa-car' },
    { id: 'taxi', label: '計程車', icon: 'fa-solid fa-taxi' }, { id: 'charter', label: '包車', icon: 'fa-solid fa-van-shuttle' },
    { id: 'ship', label: '船隻', icon: 'fa-solid fa-ship' }, { id: 'walk', label: '步行', icon: 'fa-solid fa-person-walking' }
  ];

  const LOCATION_MODES = [
    { id: 'spot', label: '景點', icon: 'fa-solid fa-camera' }, { id: 'food', label: '美食', icon: 'fa-solid fa-utensils' },
    { id: 'shop', label: '購物', icon: 'fa-solid fa-bag-shopping' }, { id: 'hotel', label: '住宿', icon: 'fa-solid fa-hotel' },
    { id: 'park', label: '樂園', icon: 'fa-solid fa-wand-magic-sparkles' }, { id: 'car_rental', label: '租車站', icon: 'fa-solid fa-key' },
    { id: 'station', label: '車站', icon: 'fa-solid fa-train' }, { id: 'airport', label: '機場', icon: 'fa-solid fa-plane-arrival' },
    { id: 'other', label: '其他', icon: 'fa-solid fa-location-dot' }
  ];

  let state = {
    user: null, isGuest: localStorage.getItem('isGuest') === 'true', 
    plans: [], publicSpots: [], currentPlanId: null, activeDay: 0, editingId: null,
    isEditMode: false, tempTimeRef: '', itemType: 'location', subType: null,
    formData: { timeStart: '', timeEnd: '', name: '', subtitle: '', mode: 'train', locMode: 'spot', operator: '', vehicleNo: '', direction: '', duration: '', extraInfo: '', cost: '', currency: 'JPY', isThrough: false, isTransfer: false, deptLoc: '', arrLoc: '' },
    tripData: { title: '', startDate: '', days: 3, accommodations: [], itinerary: {} }
  };

  // 清除舊的監聽器避免 SPA 重複觸發
  if (window._mytripPlansUnsubscribe) window._mytripPlansUnsubscribe();

  function safeSet(id, val) { const el = document.getElementById(id); if (el) el.value = val || ''; }
  function safeSetSelect(id, val) {
      const el = document.getElementById(id); if (!el) return;
      if (val && !Array.from(el.options).some(opt => opt.value === val)) el.add(new Option(val, val)); 
      el.value = val || '';
  }
  
  window.showToast = function(msg) {
    const el = document.getElementById('toast'); document.getElementById('toast-msg').innerText = msg;
    el.classList.remove('opacity-0', '-translate-y-4', 'pointer-events-none'); el.classList.add('opacity-100', 'translate-y-0');
    setTimeout(() => { el.classList.remove('opacity-100', 'translate-y-0'); el.classList.add('opacity-0', '-translate-y-4', 'pointer-events-none'); }, 3000);
  }

  // Auth & Data loading
  onAuthStateChanged(auth, async (user) => {
    if (!user && !state.isGuest) {
        try { await signInAnonymously(auth); } catch(e) { console.error(e); }
        return;
    }
    state.user = user;
    
    // Load Public Spots
    if(state.isGuest) {
        const localSpots = localStorage.getItem('guest_spots');
        state.publicSpots = localSpots ? JSON.parse(localSpots) : [];
    } else {
        onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'spots'), (snapshot) => {
            state.publicSpots = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        });
    }

    // Load Plans
    if (state.isGuest) {
      const localPlans = localStorage.getItem('guest_plans');
      state.plans = localPlans ? JSON.parse(localPlans) : [];
      renderPlansList();
    } else {
      window._mytripPlansUnsubscribe = onSnapshot(collection(db, 'artifacts', appId, 'users', state.user.uid, 'plans'), (snapshot) => {
        state.plans = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderPlansList();
        if (state.currentPlanId) {
          const activePlan = state.plans.find(p => p.id === state.currentPlanId);
          if (activePlan) { state.tripData = activePlan; if (!document.getElementById('view-itinerary').classList.contains('hidden')) renderItinerary(); }
        }
      });
    }
  });

  // 視圖切換
  window.switchView = function(viewName) {
      ['plans', 'itinerary', 'setup'].forEach(v => {
          document.getElementById(`view-${v}`).classList.add('hidden');
          document.getElementById(`header-${v === 'plans' ? 'standard' : v}`).classList.add('hidden');
      });
      
      document.getElementById(`view-${viewName}`).classList.remove('hidden');
      document.getElementById(`header-${viewName === 'plans' ? 'standard' : viewName}`).classList.remove('hidden');
  }

  // 渲染行程列表
  function renderPlansList() {
    const container = document.getElementById('plans-list');
    if(!container) return;

    if (state.plans.length === 0) { 
      container.innerHTML = `<div class="py-24 text-center text-brand-textSub opacity-50"><i class="fa-solid fa-map-location-dot text-6xl mb-6 text-brand-primary"></i><p class="font-bold">尚無任何行程</p></div>`; return; 
    }
    container.innerHTML = state.plans.sort((a, b) => b.createdAt - a.createdAt).map(plan => `
      <div onclick="window.openPlan('${plan.id}')" class="bg-white rounded-[24px] p-6 border border-brand-light shadow-sm flex items-center justify-between active:scale-[0.98] transition-all cursor-pointer hover:border-brand-primary/30 group">
        <div>
          <h3 class="font-bold text-brand-textMain text-[16px] truncate mb-1 uppercase group-hover:text-brand-primary transition-colors">${plan.title}</h3>
          <p class="text-[11px] text-brand-textSub font-bold tracking-widest">${plan.startDate} · ${plan.days} DAYS</p>
        </div>
        <div class="w-10 h-10 rounded-full bg-brand-bg flex items-center justify-center text-brand-primary group-hover:bg-brand-primary group-hover:text-white transition-colors"><i class="fa-solid fa-chevron-right"></i></div>
      </div>
    `).join('');
  }

  window.openPlan = (id) => { 
    state.currentPlanId = id; state.activeDay = 0; state.isEditMode = false;
    state.tripData = state.plans.find(p => p.id === id) || state.tripData;
    renderItinerary();
    window.switchView('itinerary');
  };

  window.openSetup = (id = null) => {
    state.currentPlanId = id;
    if (id) {
      state.tripData = { ...state.plans.find(p => p.id === id) };
      document.getElementById('btn-delete-plan').classList.remove('hidden');
      document.getElementById('header-setup-title').innerText = '行程設定';
    } else {
      state.tripData = { title: '', startDate: '', days: 3, accommodations: [], itinerary: {} };
      document.getElementById('btn-delete-plan').classList.add('hidden');
      document.getElementById('header-setup-title').innerText = '建立新行程';
    }
    
    safeSet('setup-title', state.tripData.title); safeSet('setup-start-date', state.tripData.startDate); safeSet('setup-days', state.tripData.days);
    
    ['Out', 'Ret'].forEach(dir => {
       safeSetSelect(`setup-flight-${dir.toLowerCase()}-airline`, state.tripData[`flight${dir}Airline`]);
       safeSet(`setup-flight-${dir.toLowerCase()}-no`, state.tripData[`flight${dir}No`]);
       safeSet(`setup-flight-${dir.toLowerCase()}-dept-loc`, state.tripData[`flight${dir}DeptLoc`]);
       safeSet(`setup-flight-${dir.toLowerCase()}-arr-loc`, state.tripData[`flight${dir}ArrLoc`]);
       safeSet(`setup-flight-${dir.toLowerCase()}-dept-time`, state.tripData[`flight${dir}DeptTime`]);
       safeSet(`setup-flight-${dir.toLowerCase()}-arr-time`, state.tripData[`flight${dir}ArrTime`]);
    });
    
    renderSetupHotels(state.tripData.accommodations);
    window.switchView('setup');
  };

  window.addSetupHotel = () => {
    const container = document.getElementById('hotel-list-container'); const index = container.children.length;
    container.insertAdjacentHTML('beforeend', `
      <div class="hotel-item bg-brand-bg/60 p-3 rounded-[16px] border border-brand-light/80 relative mb-3 shadow-sm">
        <div class="flex justify-between items-center mb-2">
          <h4 class="text-[13px] font-extrabold text-brand-dark flex items-center gap-1 pl-1"><i class="fa-solid fa-bed text-brand-accent text-[11px]"></i> 住宿 ${index + 1}</h4>
          <button type="button" onclick="this.closest('.hotel-item').remove()" class="w-6 h-6 flex items-center justify-center bg-white rounded-full text-brand-textSub hover:text-[#E63946] shadow-sm transition-colors"><i class="fa-solid fa-trash-can text-[10px]"></i></button>
        </div>
        <div class="space-y-2">
          <div><input type="text" class="hotel-name w-full text-[13px] font-bold text-brand-dark outline-none bg-white rounded-lg px-3 py-2 border border-brand-light/50 focus:border-brand-primary" placeholder="中文或常用名稱 (必填)"></div>
          <div><input type="text" class="hotel-foreign w-full text-[13px] font-bold text-brand-dark outline-none bg-white rounded-lg px-3 py-2 border border-brand-light/50 focus:border-brand-primary" placeholder="外文名稱 (選填)"></div>
          <div><input type="text" class="hotel-address w-full text-[13px] font-bold text-brand-dark outline-none bg-white rounded-lg px-3 py-2 border border-brand-light/50 focus:border-brand-primary" placeholder="詳細地址 (選填)"></div>
          <div class="flex items-center gap-2 mt-1">
            <span class="text-[12px] font-bold text-brand-textSub pl-1">入住晚數</span>
            <div class="flex bg-white rounded-lg border border-brand-light/50 overflow-hidden h-[36px] w-24">

  function calcDurationStr(startStr, endStr) {
    if (!startStr || !endStr) return ''; let [sh, sm] = startStr.split(':').map(Number); let [eh, em] = endStr.split(':').map(Number);
    if (isNaN(sh) || isNaN(sm) || isNaN(eh) || isNaN(em)) return '';
    let startMin = sh * 60 + sm; let endMin = eh * 60 + em; if (endMin < startMin) endMin += 24 * 60; 
    let diff = endMin - startMin; let h = Math.floor(diff / 60); let m = diff % 60;
    if (h > 0 && m > 0) return `${h}時${m}分`; if (h > 0) return `${h}時`; return `${m}分`;
  }

      if (hasCar) return { cat: '開車', icon: 'fa-solid fa-car', colorClass: 'bg-[#E9C46A]/20 text-[#D4A33B]' };
      if (hasWalk) return { cat: '步行', icon: 'fa-solid fa-person-walking', colorClass: 'bg-brand-textSub/10 text-brand-textSub' };

  window.openSpotSelector = function() {
      document.getElementById('sheet-add-menu').classList.remove('open'); document.getElementById('sheet-add-menu').classList.add('closed');
      const container = document.getElementById('selector-spot-list');
      const renderSpots = (filter = '') => {
          let spots = state.publicSpots; if(filter) spots = spots.filter(s => (s.name||'').toLowerCase().includes(filter.toLowerCase()));
          container.innerHTML = spots.map(spot => {
              const locObj = LOCATION_MODES.find(m => m.id === spot.locMode) || LOCATION_MODES[0];
              return `<div onclick="window.openFormModal('location', null, '${spot.id}')" class="bg-white p-4 rounded-[20px] border border-brand-light shadow-sm flex items-center gap-3 cursor-pointer active:scale-95 transition-all"><div class="w-12 h-12 rounded-full bg-brand-bg text-brand-primary flex items-center justify-center text-xl shrink-0"><i class="${locObj.icon}"></i></div><div class="flex-1 overflow-hidden"><div class="text-[16px] font-extrabold text-brand-dark truncate">${spot.name}</div><div class="text-[12px] font-bold text-brand-textSub mt-0.5 truncate">${locObj.label} ${spot.subtitle ? `· ${spot.subtitle}` : ''}</div></div><button class="w-8 h-8 rounded-full bg-brand-primary/10 text-brand-primary flex items-center justify-center shrink-0"><i class="fa-solid fa-plus text-[12px]"></i></button></div>`;
          }).join('');
      };
      renderSpots(); document.getElementById('input-select-spot-search').oninput = (e) => renderSpots(e.target.value);
      document.getElementById('sheet-spot-selector').classList.remove('closed'); document.getElementById('sheet-spot-selector').classList.add('open');
  };

  window.openFormModal = function(subType, itemId = null, autoFillData = null) {
    state.itemType = (subType === 'transport' || subType === 'flight') ? 'transport' : 'location'; state.subType = subType; state.editingId = itemId;
    ['group-transport-mode', 'group-dynamic-fields', 'group-flight-fields', 'group-transport-fields', 'group-hotel-fields', 'group-transfer-type', 'group-transfer-fields', 'group-through-fields', 'group-selected-spot'].forEach(id => {
        const el = document.getElementById(id);
        if(el) el.classList.add('hidden');
    });
    
    const titleEl = document.getElementById('form-modal-title');
    if (subType === 'location') { titleEl.innerText = itemId ? '編輯地點' : '新增地點'; document.getElementById('group-selected-spot')?.classList.remove('hidden'); } 
    else if (subType === 'hotel') { titleEl.innerText = itemId ? '編輯住宿' : '新增住宿'; document.getElementById('group-dynamic-fields').classList.remove('hidden'); document.getElementById('group-hotel-fields').classList.remove('hidden'); } 
    else if (subType === 'transfer') { titleEl.innerText = itemId ? '編輯轉乘' : '轉乘 / 免換乘'; document.getElementById('group-transfer-type').classList.remove('hidden'); document.getElementById('group-dynamic-fields').classList.remove('hidden'); window.toggleTransferUI(); } 
    else if (subType === 'transport') { titleEl.innerText = itemId ? '編輯交通' : '新增交通'; document.getElementById('group-transport-mode').classList.remove('hidden'); document.getElementById('group-dynamic-fields').classList.remove('hidden'); document.getElementById('group-transport-fields').classList.remove('hidden'); renderTransportModes(); } 
    else if (subType === 'flight') { titleEl.innerText = itemId ? '編輯航班' : '新增航班'; document.getElementById('group-dynamic-fields').classList.remove('hidden'); document.getElementById('group-flight-fields').classList.remove('hidden'); }

    state.formData = { timeStart: '', timeEnd: '', name: '', subtitle: '', mode: 'train', locMode: 'spot', operator: '', vehicleNo: '', direction: '', duration: '', extraInfo: '', cost: '', currency: 'JPY', isThrough: false, isTransfer: false, deptLoc: '', arrLoc: '' };

    if (itemId) {
       state.formData = { ...state.tripData.itinerary[state.activeDay].find(i => i.id === itemId) };
       if (subType === 'location') {
           const locObj = LOCATION_MODES.find(m => m.id === state.formData.locMode) || LOCATION_MODES[0];
           document.getElementById('display-spot-icon').innerHTML = `<i class="${locObj.icon}"></i>`; document.getElementById('display-spot-name').innerText = state.formData.name || ''; document.getElementById('display-spot-sub').innerText = state.formData.subtitle || locObj.label;
       }
    } else {
       if (subType === 'flight') state.formData.mode = 'flight'; if (subType === 'hotel') state.formData.locMode = 'hotel'; if (subType === 'transfer') state.formData.locMode = 'station';
       if (subType === 'location' && autoFillData) {
           const spot = state.publicSpots.find(s => s.id === autoFillData);
           if (spot) { state.formData.name = spot.name; state.formData.subtitle = spot.subtitle; state.formData.locMode = spot.locMode; const locObj = LOCATION_MODES.find(m => m.id === spot.locMode) || LOCATION_MODES[0]; document.getElementById('display-spot-icon').innerHTML = `<i class="${locObj.icon}"></i>`; document.getElementById('display-spot-name').innerText = spot.name || ''; document.getElementById('display-spot-sub').innerText = spot.subtitle || locObj.label; }
       } else if(subType === 'flight' && autoFillData) {
           const dir = autoFillData === 'outbound' ? 'Out' : 'Ret';
           state.formData.operator = state.tripData[`flight${dir}Airline`] || ''; state.formData.vehicleNo = state.tripData[`flight${dir}No`] || ''; state.formData.name = state.tripData[`flight${dir}DeptLoc`] || ''; state.formData.subtitle = state.tripData[`flight${dir}ArrLoc`] || ''; state.formData.timeStart = state.tripData[`flight${dir}DeptTime`] || ''; state.formData.timeEnd = state.tripData[`flight${dir}ArrTime`] || '';
       } else if (subType === 'hotel' && typeof autoFillData === 'number') {
           const h = state.tripData.accommodations[autoFillData]; if(h) { state.formData.name = h.name || ''; state.formData.operator = h.foreignName || ''; state.formData.subtitle = h.address || ''; }
       }
       if (autoFillData === 'autoTime' && state.tempTimeRef) { state.formData.timeStart = state.tempTimeRef; }
    }
    
    safeSet('input-time-start', state.formData.timeStart); safeSet('input-time-end', state.formData.timeEnd); safeSet('input-cost', state.formData.cost);
    if (subType === 'hotel') { safeSet('input-hotel-name', state.formData.name); safeSet('input-hotel-foreign', state.formData.operator); safeSet('input-hotel-address', state.formData.subtitle); } 
    else if (subType === 'flight') { safeSetSelect('input-flight-airline', state.formData.operator); safeSet('input-flight-no', state.formData.vehicleNo); safeSet('input-flight-dept', state.formData.name); safeSet('input-flight-arr', state.formData.subtitle); } 
    else if (subType === 'transport') { safeSet('input-operator', state.formData.operator); safeSet('input-vehicle-no', state.formData.vehicleNo); safeSet('input-route-name', state.formData.name); safeSet('input-direction', state.formData.direction); safeSet('input-duration', state.formData.duration); safeSet('input-extraInfo', state.formData.extraInfo); safeSet('input-transport-dept', state.formData.deptLoc); safeSet('input-transport-arr', state.formData.arrLoc); } 
    else if (subType === 'transfer') {
       const radios = document.getElementsByName('transfer_type');
       if(radios.length > 1) {
           if(state.formData.isThrough) { radios[1].checked = true; safeSet('input-through-sta', state.formData.name); safeSet('input-through-wait', state.formData.duration); } 
           else { radios[0].checked = true; safeSet('input-trans-lineA', state.formData.operator); safeSet('input-trans-staA', state.formData.name); safeSet('input-trans-lineB', state.formData.direction); safeSet('input-trans-staB', state.formData.subtitle); safeSet('input-trans-wait', state.formData.duration); }
           window.toggleTransferUI();
       }
    }
    
    window.selectCurrency(state.formData.currency || 'JPY');
    document.getElementById('sheet-spot-selector')?.classList.add('closed'); document.getElementById('sheet-add-menu')?.classList.add('closed');
    document.getElementById('modal-overlay').classList.remove('closed'); document.getElementById('modal-overlay').classList.add('open');
    document.getElementById('sheet-form').classList.remove('closed'); document.getElementById('sheet-form').classList.add('open');
  }

  function renderTransportModes() {
    document.getElementById('transport-modes-grid').innerHTML = TRANSPORT_MODES.map(mode => `<button type="button" onclick="window.selectTransportMode('${mode.id}')" class="mode-btn py-2.5 rounded-xl flex flex-col items-center gap-1.5 transition-all border ${state.formData.mode === mode.id ? 'bg-brand-accent text-white border-brand-accent shadow-sm' : 'bg-brand-bg text-brand-textSub border-transparent hover:bg-brand-light/50'}"><i class="${mode.icon} text-[16px]"></i><span class="text-[11px] font-bold">${mode.label}</span></button>`).join('');
  }
  
  window.selectTransportMode = (modeId) => { state.formData.mode = modeId; renderTransportModes(); };
  window.toggleTransferUI = () => { const val = document.querySelector('input[name="transfer_type"]:checked').value; document.getElementById('group-transfer-fields').classList.toggle('hidden', val !== 'transfer'); document.getElementById('group-through-fields').classList.toggle('hidden', val !== 'through'); };
  window.selectCurrency = (val) => { state.formData.currency = val; document.getElementById('display-curr-symbol').innerText = val === 'TWD' ? '$' : '¥'; document.querySelectorAll('.curr-btn').forEach(btn => { if (btn.dataset.val === val) { btn.classList.add('bg-white', 'shadow-sm', 'text-brand-dark'); btn.classList.remove('text-brand-textSub', 'bg-transparent'); } else { btn.classList.remove('bg-white', 'shadow-sm', 'text-brand-dark'); btn.classList.add('text-brand-textSub', 'bg-transparent'); } }); };

  document.getElementById('btn-save-item').addEventListener('click', async () => {
      const plan = state.tripData; if (!plan.itinerary[state.activeDay]) plan.itinerary[state.activeDay] = [];
      const data = { id: state.editingId || Date.now().toString(), type: state.itemType, timeStart: document.getElementById('input-time-start').value, timeEnd: document.getElementById('input-time-end').value, cost: document.getElementById('input-cost').value, currency: state.formData.currency };
      
      if (state.subType === 'location') { data.locMode = state.formData.locMode; data.name = state.formData.name; data.subtitle = state.formData.subtitle; data.isThrough = false; data.isTransfer = false; } 
      else if (state.subType === 'hotel') { data.locMode = 'hotel'; data.name = document.getElementById('input-hotel-name').value; data.operator = document.getElementById('input-hotel-foreign').value; data.subtitle = document.getElementById('input-hotel-address').value; data.isThrough = false; data.isTransfer = false; } 
      else if (state.subType === 'transfer') { data.locMode = 'station'; const val = document.querySelector('input[name="transfer_type"]:checked').value; data.isTransfer = (val === 'transfer'); data.isThrough = (val === 'through'); if(data.isTransfer) { data.operator = document.getElementById('input-trans-lineA').value; data.name = document.getElementById('input-trans-staA').value; data.direction = document.getElementById('input-trans-lineB').value; data.subtitle = document.getElementById('input-trans-staB').value; data.duration = document.getElementById('input-trans-wait').value; } else { data.name = document.getElementById('input-through-sta').value; data.duration = document.getElementById('input-through-wait').value; } } 
      else if (state.subType === 'flight') { data.mode = 'flight'; data.operator = document.getElementById('input-flight-airline').value; data.vehicleNo = document.getElementById('input-flight-no').value; data.name = document.getElementById('input-flight-dept').value; data.subtitle = document.getElementById('input-flight-arr').value; } 
      else if (state.subType === 'transport') { data.mode = state.formData.mode; data.operator = document.getElementById('input-operator').value; data.vehicleNo = document.getElementById('input-vehicle-no').value; data.name = document.getElementById('input-route-name').value; data.direction = document.getElementById('input-direction').value; data.duration = document.getElementById('input-duration').value; data.extraInfo = document.getElementById('input-extraInfo').value; data.deptLoc = document.getElementById('input-transport-dept').value; data.arrLoc = document.getElementById('input-transport-arr').value; }
      
      if (state.editingId) { const idx = plan.itinerary[state.activeDay].findIndex(i => i.id === state.editingId); plan.itinerary[state.activeDay][idx] = data; } 
      else { plan.itinerary[state.activeDay].push(data); }
      
      if(state.isGuest) {
          const planIdx = state.plans.findIndex(p => p.id === state.currentPlanId); state.plans[planIdx].itinerary = plan.itinerary;
          localStorage.setItem('guest_plans', JSON.stringify(state.plans)); window.closeAllModals(); window.showToast("已暫存至本機！"); renderItinerary();
      } else {
          await updateDoc(doc(db, 'artifacts', appId, 'users', state.user.uid, 'plans', state.currentPlanId), { itinerary: plan.itinerary });
          window.closeAllModals(); window.showToast("已同步至雲端！");
      }
  });

  document.getElementById('btn-option-edit').addEventListener('click', () => {
      window.closeAllModals();
      setTimeout(() => {
        const item = state.tripData.itinerary[state.activeDay].find(i => i.id === state.editingId);
        if (item) { let guessSubType = item.type; if(item.type === 'location' && item.locMode === 'hotel') guessSubType = 'hotel'; if(item.type === 'location' && (item.isTransfer || item.isThrough)) guessSubType = 'transfer'; if(item.type === 'transport' && item.mode === 'flight') guessSubType = 'flight'; window.openFormModal(guessSubType, item.id); }
      }, 300);
  });

  document.getElementById('btn-option-delete').addEventListener('click', () => {
      window.closeAllModals(); setTimeout(() => { document.getElementById('modal-overlay').classList.remove('closed'); document.getElementById('modal-overlay').classList.add('open'); document.getElementById('modal-delete').classList.remove('closed'); document.getElementById('modal-delete').classList.add('open'); document.getElementById('delete-dialog-content').classList.remove('scale-95', 'opacity-0'); document.getElementById('delete-dialog-content').classList.add('scale-100', 'opacity-100'); }, 300);
  });

  document.getElementById('btn-confirm-delete').addEventListener('click', async () => {
      state.tripData.itinerary[state.activeDay] = state.tripData.itinerary[state.activeDay].filter(i => i.id !== state.editingId);
      if(state.isGuest) {
          const planIdx = state.plans.findIndex(p => p.id === state.currentPlanId); state.plans[planIdx].itinerary = state.tripData.itinerary; localStorage.setItem('guest_plans', JSON.stringify(state.plans)); window.closeAllModals(); window.showToast("已刪除項目"); renderItinerary();
      } else {
          await updateDoc(doc(db, 'artifacts', appId, 'users', state.user.uid, 'plans', state.currentPlanId), { itinerary: state.tripData.itinerary }); window.closeAllModals(); window.showToast("已刪除項目");
      }
  });

  window.handleExport = () => {
    const dataStr = JSON.stringify(state.plans, null, 2); const blob = new Blob([dataStr], { type: "application/json" });
    const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `趣旅行_備份.json`; a.click(); URL.revokeObjectURL(url); window.showToast('已匯出行程檔！');
  };

  document.getElementById('input-import-file').addEventListener('change', (e) => {
    const file = e.target.files[0]; if (!file) return; const reader = new FileReader();
    reader.onload = async (event) => {
      try {
        const imported = JSON.parse(event.target.result); const plansToImport = (imported && imported.title && !Array.isArray(imported)) ? [imported] : imported;
        if (!Array.isArray(plansToImport)) throw new Error("Invalid format");
        for (let p of plansToImport) {
          const cleanPlan = { title: p.title || "未命名行程", startDate: p.startDate || new Date().toISOString().split('T')[0], days: p.days || 1, accommodations: p.accommodations || [], itinerary: p.itinerary || {}, createdAt: state.isGuest ? Date.now() : serverTimestamp() };
          ['Out', 'Ret'].forEach(dir => { cleanPlan[`flight${dir}Airline`] = p[`flight${dir}Airline`] || ""; cleanPlan[`flight${dir}No`] = p[`flight${dir}No`] || ""; cleanPlan[`flight${dir}DeptLoc`] = p[`flight${dir}DeptLoc`] || ""; cleanPlan[`flight${dir}ArrLoc`] = p[`flight${dir}ArrLoc`] || ""; cleanPlan[`flight${dir}DeptTime`] = p[`flight${dir}DeptTime`] || ""; cleanPlan[`flight${dir}ArrTime`] = p[`flight${dir}ArrTime`] || ""; });
          if(state.isGuest) { cleanPlan.id = Date.now().toString() + Math.random().toString(36).substring(7); state.plans.push(cleanPlan); } 
          else { await addDoc(collection(db, 'artifacts', appId, 'users', state.user.uid, 'plans'), cleanPlan); }
        }
        if(state.isGuest) localStorage.setItem('guest_plans', JSON.stringify(state.plans));
        window.showToast('成功匯入行程！'); window.switchView('plans'); if(state.isGuest) renderPlansList();
      } catch (err) { alert('檔案格式錯誤，請確認這是由本系統匯出的 JSON 行程檔。'); }
      document.getElementById('input-import-file').value = '';
    };
    reader.readAsText(file);
  });

</script>
