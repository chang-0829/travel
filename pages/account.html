<!-- ========================================== -->
<!-- 旅人檔案 (pages/account.html) -->
<!-- ========================================== -->

<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8 animate-fade-in" style="display: none;" id="account-page-content">
   
   <!-- 頁面標題 -->
   <div class="mb-8">
       <h1 class="text-3xl font-bold text-gray-900 tracking-tight">旅人檔案</h1>
       <p class="mt-2 text-sm text-gray-500">管理您的個人資訊、行程紀錄與偏好設定。</p>
   </div>

   <!-- ========================================== -->
   <!-- 狀態 0：載入中畫面 -->
   <!-- ========================================== -->
   <div id="auth-loading" class="flex flex-col items-center justify-center py-16">
       <div class="animate-spin rounded-full h-10 w-10 border-4 border-blue-100 border-t-blue-600 mb-4"></div>
       <p class="text-gray-500 font-medium">正在讀取您的旅人狀態...</p>
   </div>

   <!-- ========================================== -->
   <!-- 狀態 A：未登入畫面 (預設隱藏) -->
   <!-- ========================================== -->
   <div id="unauth-view" class="hidden animate-fade-in">
       <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 text-center sm:p-12">
           <div class="mx-auto w-24 h-24 bg-blue-50 rounded-full flex items-center justify-center mb-6">
               <svg class="w-12 h-12 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                   <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
               </svg>
           </div>
           <h2 class="text-2xl font-bold text-gray-900 mb-3">開啟您的專屬旅程</h2>
           <p class="text-gray-500 mb-8 max-w-md mx-auto">登入旅圖製造所，解鎖無限收藏、跨裝置同步行程，並與好友共同編輯計畫。</p>
           
           <div class="space-y-4 max-w-sm mx-auto">
               <button id="btn-login-google" class="w-full flex items-center justify-center px-4 py-3 border border-gray-300 shadow-sm text-base font-medium rounded-xl text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
                   <svg class="w-5 h-5 mr-3" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                       <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                       <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                       <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                       <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                   </svg>
                   使用 Google 帳號登入
               </button>
           </div>
       </div>
   </div>

   <!-- ========================================== -->
   <!-- 狀態 B：已登入畫面 (預設隱藏) -->
   <!-- ========================================== -->
   <div id="auth-view" class="hidden space-y-6 animate-fade-in">
       
       <!-- 個人資訊卡片 -->
       <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 flex flex-col sm:flex-row items-center sm:items-start gap-6">
           <div class="relative">
               <div class="w-24 h-24 rounded-full overflow-hidden border-4 border-white shadow-md bg-gray-100 flex items-center justify-center shrink-0">
                   <img id="user-avatar" src="" alt="頭像" class="w-full h-full object-cover">
               </div>
           </div>
           
           <div class="flex-1 text-center sm:text-left">
               <h2 id="user-name" class="text-2xl font-bold text-gray-900">載入中...</h2>
               <p id="user-email" class="text-sm text-gray-500 mt-1">讀取中...</p>
               
               <div class="mt-4 flex items-center justify-center sm:justify-start gap-6">
                   <div class="text-center">
                       <span class="block text-2xl font-bold text-blue-600">0</span>
                       <span class="text-xs text-gray-500 font-medium tracking-wide uppercase">我的行程</span>
                   </div>
                   <div class="w-px h-8 bg-gray-200"></div>
                   <div class="text-center">
                       <span class="block text-2xl font-bold text-blue-600">0</span>
                       <span class="text-xs text-gray-500 font-medium tracking-wide uppercase">收藏景點</span>
                   </div>
               </div>
           </div>
       </div>

       <!-- 下方選單列表 -->
       <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
           <ul class="divide-y divide-gray-100">
               <li>
                   <a href="/mytrip" data-link class="flex items-center px-6 py-4 hover:bg-gray-50 transition-colors group">
                       <div class="w-10 h-10 rounded-full bg-blue-50 flex items-center justify-center text-blue-600 group-hover:bg-blue-100 transition-colors shrink-0">
                           <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path></svg>
                       </div>
                       <div class="ml-4 flex-1">
                           <p class="text-sm font-medium text-gray-900">行程工坊</p>
                           <p class="text-xs text-gray-500">查看與編輯您規劃中的旅程</p>
                       </div>
                   </a>
               </li>
               <li>
                   <a href="#" class="flex items-center px-6 py-4 hover:bg-gray-50 transition-colors group">
                       <div class="w-10 h-10 rounded-full bg-orange-50 flex items-center justify-center text-orange-600 group-hover:bg-orange-100 transition-colors shrink-0">
                           <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                       </div>
                       <div class="ml-4 flex-1">
                           <p class="text-sm font-medium text-gray-900">帳號設定</p>
                           <p class="text-xs text-gray-500">密碼、通知偏好與隱私設定</p>
                       </div>
                   </a>
               </li>
           </ul>
       </div>

       <!-- 登出按鈕 -->
       <div class="pt-4">
           <button id="btn-logout" class="w-full flex items-center justify-center px-4 py-3 border border-red-200 text-base font-medium rounded-xl text-red-600 bg-white hover:bg-red-50 focus:outline-none transition-colors shadow-sm">
               <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
               登出帳號
           </button>
       </div>

   </div>

</div>

<!-- ========================================== -->
<!-- Firebase 整合程式碼 -->
<!-- ========================================== -->
<script type="module">
   // 💡 確保引入 type="module" 以避免變數污染
   import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
   import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

   // 💡 SPA 架構下，直接執行初始化邏輯
   const contentDiv = document.getElementById('account-page-content');
   if (contentDiv) contentDiv.style.display = 'block';

   const firebaseConfig = {
       apiKey: "AIzaSyCQF8A3ieML0JP3X8X78NCRuiUETRAiu5E",
       authDomain: "travel-96009.firebaseapp.com",
       projectId: "travel-96009",
       storageBucket: "travel-96009.firebasestorage.app",
       messagingSenderId: "578860064042",
       appId: "1:578860064042:web:b147880df3a01dd8f75253"
   };

   const app = !getApps().length ? initializeApp(firebaseConfig) : getApp();
   const auth = getAuth(app);
   const provider = new GoogleAuthProvider();

   // 綁定 DOM
   const loadingView = document.getElementById('auth-loading');
   const unauthView = document.getElementById('unauth-view');
   const authView = document.getElementById('auth-view');
   const btnLoginGoogle = document.getElementById('btn-login-google');
   const btnLogout = document.getElementById('btn-logout');
   
   const userNameEl = document.getElementById('user-name');
   const userEmailEl = document.getElementById('user-email');
   const userAvatarEl = document.getElementById('user-avatar');

   // 登入狀態監聽
   onAuthStateChanged(auth, (user) => {
       if (loadingView) loadingView.classList.add('hidden');

       if (user) {
           unauthView.classList.add('hidden');
           authView.classList.remove('hidden');
           
           userNameEl.textContent = user.displayName || '旅人';
           userEmailEl.textContent = user.email || '無提供 Email';
           userAvatarEl.src = user.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(user.displayName || 'User')}&background=0D8ABC&color=fff&size=128`;
       } else {
           unauthView.classList.remove('hidden');
           authView.classList.add('hidden');
       }
   });

   // 點擊：Google 登入
   if (btnLoginGoogle) {
       btnLoginGoogle.addEventListener('click', async () => {
           const originalText = btnLoginGoogle.innerHTML;
           btnLoginGoogle.innerHTML = '<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-gray-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> 登入中...';
           btnLoginGoogle.disabled = true;

           try {
               await signInWithPopup(auth, provider);
           } catch (error) {
               console.error("Firebase 登入失敗:", error);
               alert("登入失敗: " + error.message);
               btnLoginGoogle.innerHTML = originalText;
               btnLoginGoogle.disabled = false;
           }
       });
   }

   // 點擊：登出
   if (btnLogout) {
       btnLogout.addEventListener('click', async () => {
           if(confirm('確定要登出嗎？')) {
               authView.classList.add('hidden');
               if (loadingView) loadingView.classList.remove('hidden');
               
               try {
                   await signOut(auth);
               } catch (error) {
                   console.error("Firebase 登出失敗:", error);
                   alert("登出失敗: " + error.message);
               }
           }
       });
   }
</script>
