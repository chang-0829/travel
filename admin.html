<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>趣旅行 - 景點管理後台</title>
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Leaflet CSS (地圖核心) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { primary: '#748CAB', dark: '#3E5C76', light: '#E6EBEF', bg: '#F2F5F8', card: '#FFFFFF', textMain: '#2C3E50', textSub: '#8796A5', accent: '#D5896F' }
          }
        }
      }
    }
  </script>

  <style>
    @font-face { font-family: 'LINE Seed TW'; src: url('./fonts/LINESeedTW_OTF_Rg.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: 'LINE Seed TW'; src: url('./fonts/LINESeedTW_OTF_Bd.woff2') format('woff2'); font-weight: 700; font-style: normal; font-display: swap; }
    body { font-family: 'LINE Seed TW', ui-sans-serif, system-ui, sans-serif; background-color: #F8FAFC; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* 覆寫 Leaflet 樣式 */
    .custom-marker { background: transparent; border: none; }
    .marker-pin { width: 32px; height: 32px; border-radius: 50%; background: #D5896F; border: 3px solid white; box-shadow: 0 4px 10px rgba(213, 137, 111, 0.4); display: flex; align-items: center; justify-content: center; color: white; font-size: 12px; }
  </style>
</head>
<body class="text-brand-textMain antialiased overflow-hidden flex h-screen">

  <!-- ================= 管理員專屬登入遮罩 ================= -->
  <div id="admin-login-overlay" class="fixed inset-0 z-[9999] bg-brand-bg flex items-center justify-center p-4">
    <div class="bg-white rounded-[32px] shadow-2xl border border-brand-light p-8 max-w-sm w-full text-center flex flex-col items-center">
       <div class="w-20 h-20 bg-brand-dark text-white rounded-[24px] flex items-center justify-center text-3xl mb-6 shadow-md shadow-brand-dark/20">
          <i class="fa-solid fa-user-shield"></i>
       </div>
       <h2 class="text-2xl font-extrabold text-brand-dark mb-2">系統管理後台</h2>
       <p class="text-[13px] font-bold text-brand-textSub mb-8">此區域僅限高階管理員信箱存取</p>
       
       <!-- 錯誤提示區 -->
       <p id="login-error-msg" class="hidden text-[13px] text-[#E63946] bg-[#FFE5E5] px-4 py-3 rounded-xl font-bold w-full mb-6 border border-[#E63946]/20"></p>
       
       <button onclick="window.adminLogin()" class="w-full py-4 bg-white border border-brand-light text-brand-dark font-extrabold text-[15px] rounded-[16px] shadow-sm hover:bg-brand-bg active:scale-95 transition-all flex items-center justify-center gap-3">
          <i class="fa-brands fa-google text-[#4285F4] text-xl"></i> Google 帳號授權登入
       </button>
       
       <a href="./discover.html" class="mt-8 text-xs font-bold text-brand-textSub hover:text-brand-primary transition-colors flex items-center gap-1.5">
          <i class="fa-solid fa-arrow-left"></i> 返回前台探索
       </a>
    </div>
  </div>

  <!-- 提示訊息 Toast -->
  <div id="toast" class="fixed top-6 left-1/2 transform -translate-x-1/2 bg-brand-dark text-white px-6 py-3 rounded-full shadow-2xl z-[9000] transition-all duration-300 opacity-0 pointer-events-none -translate-y-4 flex items-center gap-2 font-bold text-sm">
    <i class="fa-solid fa-circle-check text-brand-light"></i> <span id="toast-msg">處理成功</span>
  </div>

  <!-- 左側邊欄 (Sidebar) -->
  <aside class="w-64 bg-white border-r border-brand-light shadow-sm flex flex-col shrink-0 hidden md:flex z-20">
    <div class="h-20 flex items-center px-6 border-b border-brand-light/50 shrink-0">
       <div class="w-10 h-10 rounded-xl bg-brand-dark text-white flex items-center justify-center text-xl mr-3 shadow-sm">
          <i class="fa-solid fa-plane"></i>
       </div>
       <div>
         <div class="text-lg font-extrabold text-brand-dark tracking-tight leading-tight">趣旅行</div>
         <div class="text-[10px] font-bold text-brand-textSub tracking-widest uppercase">Admin Panel</div>
       </div>
    </div>
    
    <div class="flex-1 py-6 px-4 space-y-2 overflow-y-auto">
      <div class="text-xs font-bold text-brand-textSub mb-4 px-2 tracking-widest uppercase">管理選單</div>
      <a href="#" class="flex items-center gap-4 px-4 py-3 rounded-xl bg-brand-primary/10 text-brand-primary font-bold transition-all">
        <i class="fa-solid fa-map-location-dot text-lg w-5 text-center"></i> <span>景點資料庫</span>
      </a>
      <a href="#" class="flex items-center gap-4 px-4 py-3 rounded-xl text-brand-textSub hover:bg-brand-bg hover:text-brand-primary font-bold transition-all opacity-50 cursor-not-allowed">
        <i class="fa-solid fa-users text-lg w-5 text-center"></i> <span>用戶管理</span>
      </a>
    </div>

    <div class="p-4 border-t border-brand-light/50">
      <a href="./discover.html" class="flex items-center justify-center gap-2 w-full py-3 rounded-xl bg-brand-bg text-brand-textMain font-bold hover:bg-brand-light/50 transition-all border border-brand-light mb-2">
        <i class="fa-solid fa-arrow-right-from-bracket rotate-180"></i> 返回前台探索
      </a>
    </div>
  </aside>

  <!-- 主內容區 -->
  <main class="flex-1 flex flex-col relative overflow-hidden bg-[#F8FAFC]">
    
    <!-- 頂部 Header -->
    <header class="h-20 bg-white px-8 shrink-0 flex items-center justify-between border-b border-brand-light shadow-sm z-10">
      <div class="flex items-center gap-4">
        <button class="md:hidden text-brand-dark hover:text-brand-primary text-xl"><i class="fa-solid fa-bars"></i></button>
        <h2 class="text-xl font-extrabold text-brand-dark">公共景點管理</h2>
      </div>
      <div class="flex items-center gap-4">
         <span id="admin-user-name" class="text-sm font-bold text-brand-textSub hidden sm:block">載入中...</span>
         <button onclick="window.adminLogout()" class="w-10 h-10 rounded-full bg-brand-bg border border-brand-light flex items-center justify-center text-brand-primary hover:bg-[#FFE5E5] hover:text-[#E63946] transition-colors shadow-sm" title="登出並返回">
            <i class="fa-solid fa-right-from-bracket"></i>
         </button>
      </div>
    </header>

    <!-- 內容區：資料表格 -->
    <div class="flex-1 overflow-y-auto p-4 md:p-8 relative">
       <div class="bg-white rounded-2xl shadow-sm border border-brand-light flex flex-col h-full max-h-[800px]">
          <!-- 表格 Header 功能區 -->
          <div class="p-6 border-b border-brand-light/50 flex flex-col sm:flex-row sm:items-center justify-between gap-4 shrink-0">
             <div class="relative w-full sm:w-72">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-brand-textSub"></i>
                <input type="text" id="search-input" placeholder="搜尋景點名稱..." class="w-full bg-brand-bg rounded-xl py-2.5 pl-11 pr-4 outline-none focus:ring-2 focus:ring-brand-primary/30 transition-all text-sm font-bold text-brand-dark border border-transparent focus:border-brand-primary/50">
             </div>
             <button onclick="window.openSpotModal()" class="w-full sm:w-auto px-6 py-2.5 bg-brand-primary text-white font-bold rounded-xl shadow-md shadow-brand-primary/30 hover:bg-brand-dark active:scale-95 transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-plus"></i> 新增景點
             </button>
          </div>

          <!-- 表格主體 -->
          <div class="flex-1 overflow-auto hide-scrollbar">
             <table class="w-full text-left border-collapse">
                <thead class="bg-brand-bg/50 sticky top-0 z-10">
                   <tr>
                      <th class="px-6 py-4 text-xs font-bold text-brand-textSub uppercase tracking-wider border-b border-brand-light">類別</th>
                      <th class="px-6 py-4 text-xs font-bold text-brand-textSub uppercase tracking-wider border-b border-brand-light">景點名稱</th>
                      <th class="px-6 py-4 text-xs font-bold text-brand-textSub uppercase tracking-wider border-b border-brand-light">備註 / 地址</th>
                      <th class="px-6 py-4 text-xs font-bold text-brand-textSub uppercase tracking-wider border-b border-brand-light hidden md:table-cell">座標 (Lat, Lng)</th>
                      <th class="px-6 py-4 text-xs font-bold text-brand-textSub uppercase tracking-wider border-b border-brand-light text-right">操作</th>
                   </tr>
                </thead>
                <tbody id="table-body" class="divide-y divide-brand-light/50">
                   <tr><td colspan="5" class="px-6 py-12 text-center text-brand-textSub font-bold"><i class="fa-solid fa-spinner fa-spin mr-2"></i> 驗證權限中...</td></tr>
                </tbody>
             </table>
          </div>
       </div>
    </div>
  </main>

  <!-- ================= 景點編輯/新增 Modal ================= -->
  <div id="spot-modal" class="fixed inset-0 z-[5000] hidden items-center justify-center px-4">
     <div class="absolute inset-0 bg-brand-dark/40 backdrop-blur-sm transition-opacity opacity-0" id="spot-modal-backdrop" onclick="window.closeSpotModal()"></div>
     
     <div class="bg-white w-full max-w-4xl rounded-2xl shadow-2xl relative z-10 flex flex-col max-h-[90vh] transition-transform transform scale-95 opacity-0 overflow-hidden" id="spot-modal-content">
        <!-- Modal Header -->
        <div class="px-6 py-4 border-b border-brand-light/80 flex justify-between items-center bg-brand-bg/30 shrink-0">
           <h3 id="modal-title" class="text-xl font-extrabold text-brand-dark">新增景點</h3>
           <button onclick="window.closeSpotModal()" class="w-8 h-8 rounded-full bg-brand-bg flex items-center justify-center text-brand-textSub hover:text-brand-dark transition-colors"><i class="fa-solid fa-xmark"></i></button>
        </div>
        
        <!-- Modal Body (表單與地圖並排) -->
        <div class="flex-1 overflow-y-auto p-6 flex flex-col md:flex-row gap-6">
           
           <!-- 左側表單 -->
           <div class="w-full md:w-1/2 space-y-4 flex flex-col">
              <input type="hidden" id="form-id">
              
              <div>
                 <label class="block text-xs font-bold text-brand-textSub mb-1.5 pl-1">景點名稱 <span class="text-[#E63946]">*</span></label>
                 <input type="text" id="form-name" placeholder="輸入地標名稱" class="w-full bg-[#F8FAFC] border border-brand-light/80 rounded-xl px-4 py-3 text-sm font-bold text-brand-dark outline-none focus:border-brand-primary/50 focus:bg-white transition-all">
              </div>

              <div>
                 <label class="block text-xs font-bold text-brand-textSub mb-1.5 pl-1">分類 <span class="text-[#E63946]">*</span></label>
                 <select id="form-mode" class="w-full bg-[#F8FAFC] border border-brand-light/80 rounded-xl px-4 py-3 text-sm font-bold text-brand-dark outline-none focus:border-brand-primary/50 focus:bg-white transition-all appearance-none cursor-pointer">
                    <!-- JS 動態填入 -->
                 </select>
              </div>

              <div>
                 <label class="block text-xs font-bold text-brand-textSub mb-1.5 pl-1">備註資訊 / 地址</label>
                 <textarea id="form-sub" placeholder="輸入相關地址或描述" rows="3" class="w-full bg-[#F8FAFC] border border-brand-light/80 rounded-xl px-4 py-3 text-sm font-bold text-brand-dark outline-none focus:border-brand-primary/50 focus:bg-white transition-all resize-none"></textarea>
              </div>

              <div class="grid grid-cols-2 gap-3 mt-auto pt-4">
                 <div>
                    <label class="block text-xs font-bold text-brand-textSub mb-1.5 pl-1">緯度 (Latitude)</label>
                    <input type="number" id="form-lat" step="any" placeholder="自動獲取" class="w-full bg-brand-light/30 border border-brand-light/50 rounded-lg px-3 py-2 text-xs font-mono text-brand-dark outline-none" readonly>
                 </div>
                 <div>
                    <label class="block text-xs font-bold text-brand-textSub mb-1.5 pl-1">經度 (Longitude)</label>
                    <input type="number" id="form-lng" step="any" placeholder="自動獲取" class="w-full bg-brand-light/30 border border-brand-light/50 rounded-lg px-3 py-2 text-xs font-mono text-brand-dark outline-none" readonly>
                 </div>
              </div>
           </div>

           <!-- 右側地圖選點器 -->
           <div class="w-full md:w-1/2 h-[300px] md:h-auto min-h-[300px] bg-brand-bg rounded-xl border border-brand-light overflow-hidden relative flex flex-col">
              <div class="bg-brand-dark text-white text-[11px] font-bold py-1.5 px-3 text-center shrink-0 flex items-center justify-center gap-2">
                 <i class="fa-solid fa-hand-pointer text-[#D5896F]"></i> 點擊地圖快速設定座標
              </div>
              <div id="admin-map" class="flex-1 w-full relative z-0"></div>
           </div>
        </div>

        <!-- Modal Footer -->
        <div class="px-6 py-4 border-t border-brand-light/80 bg-brand-bg/30 flex justify-end gap-3 shrink-0">
           <button onclick="window.closeSpotModal()" class="px-5 py-2.5 bg-white border border-brand-light text-brand-textMain font-bold rounded-xl hover:bg-brand-light/50 transition-colors">取消</button>
           <button onclick="window.saveSpot()" class="px-6 py-2.5 bg-brand-primary text-white font-bold rounded-xl shadow-md shadow-brand-primary/30 hover:bg-brand-dark active:scale-95 transition-all flex items-center gap-2">
              <i class="fa-solid fa-floppy-disk"></i> 儲存景點
           </button>
        </div>
     </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  
  <!-- Firebase / 邏輯 -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
    import { getAuth, signInWithCustomToken, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
    import { getFirestore, collection, onSnapshot, addDoc, doc, updateDoc, deleteDoc } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

    // Firebase Init
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { 
      apiKey: "AIzaSyCQF8A3ieML0JP3X8X78NCRuiUETRAiu5E", 
      authDomain: "travel-96009.firebaseapp.com", 
      projectId: "travel-96009", 
      storageBucket: "travel-96009.firebasestorage.app", 
      messagingSenderId: "578860064042", 
      appId: "1:578860064042:web:b147880df3a01dd8f75253" 
    };
    const app = initializeApp(firebaseConfig); 
    const auth = getAuth(app);
    const db = getFirestore(app); 
    const appId = typeof __app_id !== 'undefined' ? __app_id : "travel-platform-v2";

    // 🔒 授權信箱 (只有此信箱能進入後台)
    const ADMIN_EMAIL = 'a0909921988@gmail.com';

    const LOCATION_MODES = [
      { id: 'spot', label: '景點', icon: 'fa-solid fa-camera' },
      { id: 'food', label: '美食', icon: 'fa-solid fa-utensils' },
      { id: 'shop', label: '購物', icon: 'fa-solid fa-bag-shopping' },
      { id: 'hotel', label: '住宿', icon: 'fa-solid fa-hotel' },
      { id: 'park', label: '樂園', icon: 'fa-solid fa-wand-magic-sparkles' },
      { id: 'car_rental', label: '租車站', icon: 'fa-solid fa-key' },
      { id: 'station', label: '車站', icon: 'fa-solid fa-train' },
      { id: 'airport', label: '機場', icon: 'fa-solid fa-plane-arrival' },
      { id: 'other', label: '其他', icon: 'fa-solid fa-location-dot' }
    ];

    // State
    let adminSpots = [];
    let adminMap = null;
    let pickerMarker = null;
    let isAdmin = false;

    // Toast Function
    window.showToast = function(msg) {
      const el = document.getElementById('toast');
      document.getElementById('toast-msg').innerText = msg;
      el.classList.remove('opacity-0', '-translate-y-4', 'pointer-events-none');
      el.classList.add('opacity-100', 'translate-y-0');
      setTimeout(() => {
        el.classList.remove('opacity-100', 'translate-y-0');
        el.classList.add('opacity-0', '-translate-y-4', 'pointer-events-none');
      }, 3000);
    }

    // 初始化下拉選單
    function initSelect() {
        const select = document.getElementById('form-mode');
        LOCATION_MODES.forEach(mode => {
            select.add(new Option(`${mode.label}`, mode.id));
        });
    }

    // 登入驗證機制
    onAuthStateChanged(auth, user => {
        const nameEl = document.getElementById('admin-user-name');
        const loginOverlay = document.getElementById('admin-login-overlay');
        const errorMsg = document.getElementById('login-error-msg');

        if (user && user.email === ADMIN_EMAIL) {
            // ✅ 通過驗證：是管理員
            isAdmin = true;
            nameEl.innerText = user.displayName || "超級管理員";
            loginOverlay.classList.add('hidden'); // 解除鎖定
            initSelect();
            loadSpots(); // 開始載入資料庫
        } else {
            // ❌ 驗證失敗：非管理員 或 未登入
            isAdmin = false;
            nameEl.innerText = "未授權";
            loginOverlay.classList.remove('hidden'); // 顯示鎖定遮罩
            document.getElementById('table-body').innerHTML = `<tr><td colspan="5" class="px-6 py-12 text-center text-[#E63946] font-bold">拒絕存取：無權限讀取</td></tr>`;
            
            // 如果是用「不合法的 Google 帳號」登入，顯示錯誤提示
            if (user && !user.isAnonymous && user.email !== ADMIN_EMAIL) {
               errorMsg.innerText = `目前帳號 (${user.email}) 無權限進入後台。`;
               errorMsg.classList.remove('hidden');
               // 可選擇將其自動登出，避免卡在該信箱
               signOut(auth);
            } else {
               errorMsg.classList.add('hidden');
            }
        }
    });

    window.adminLogin = function() {
        const provider = new GoogleAuthProvider();
        signInWithPopup(auth, provider).catch(err => {
            window.showToast("登入失敗：" + err.message);
        });
    };

    window.adminLogout = function() {
        signOut(auth).then(() => {
            window.location.href = './discover.html'; // 登出後退回前台
        });
    };

    // 載入資料 (只有驗證通過才會執行)
    function loadSpots() {
      if (!isAdmin) return;
      const qSpots = collection(db, 'artifacts', appId, 'public', 'data', 'spots');
      onSnapshot(qSpots, (snapshot) => {
        adminSpots = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderTable();
      }, err => {
        console.error(err);
        window.showToast("載入資料失敗，請確認權限");
      });
    }

    // 渲染表格
    function renderTable(filter = '') {
      const tbody = document.getElementById('table-body');
      let spots = adminSpots;
      
      if (filter) {
          const kw = filter.toLowerCase();
          spots = spots.filter(s => (s.name || '').toLowerCase().includes(kw));
      }

      if (spots.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-12 text-center text-brand-textSub font-bold"><i class="fa-solid fa-box-open text-2xl mb-2"></i><br>目前沒有資料</td></tr>`;
          return;
      }

      const sorted = [...spots].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

      tbody.innerHTML = sorted.map(spot => {
          const locObj = LOCATION_MODES.find(m => m.id === spot.locMode) || LOCATION_MODES[0];
          const hasCoords = spot.lat && spot.lng;
          const coordsStr = hasCoords ? `${parseFloat(spot.lat).toFixed(4)}, ${parseFloat(spot.lng).toFixed(4)}` : '<span class="text-brand-accent italic">未設定</span>';

          return `
          <tr class="hover:bg-brand-bg/50 transition-colors group">
             <td class="px-6 py-4 whitespace-nowrap">
                <div class="flex items-center gap-2">
                   <div class="w-8 h-8 rounded-full bg-brand-primary/10 text-brand-primary flex items-center justify-center"><i class="${locObj.icon} text-sm"></i></div>
                   <span class="text-sm font-bold text-brand-dark">${locObj.label}</span>
                </div>
             </td>
             <td class="px-6 py-4">
                <div class="text-[15px] font-extrabold text-brand-dark">${spot.name}</div>
             </td>
             <td class="px-6 py-4">
                <div class="text-sm font-medium text-brand-textSub max-w-[200px] truncate">${spot.subtitle || '-'}</div>
             </td>
             <td class="px-6 py-4 hidden md:table-cell">
                <div class="text-xs font-mono text-brand-textSub bg-brand-light/30 inline-block px-2 py-1 rounded">${coordsStr}</div>
             </td>
             <td class="px-6 py-4 text-right whitespace-nowrap">
                <button onclick="window.openSpotModal('${spot.id}')" class="w-8 h-8 rounded-lg bg-brand-bg text-brand-primary hover:bg-brand-primary hover:text-white transition-all shadow-sm mr-1">
                   <i class="fa-solid fa-pen text-xs"></i>
                </button>
                <button onclick="window.deleteSpot('${spot.id}')" class="w-8 h-8 rounded-lg bg-[#FFE5E5] text-[#E63946] hover:bg-[#E63946] hover:text-white transition-all shadow-sm">
                   <i class="fa-solid fa-trash-can text-xs"></i>
                </button>
             </td>
          </tr>
          `;
      }).join('');
    }

    // 搜尋功能
    document.getElementById('search-input').addEventListener('input', (e) => renderTable(e.target.value));

    // ========== 地圖與 Modal 邏輯 ==========
    function initAdminMap() {
        if(adminMap) return;
        const streetLayer = L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
            attribution: '&copy; Google', maxZoom: 20
        });

        adminMap = L.map('admin-map', { 
            zoomControl: false, layers: [streetLayer]
        }).setView([23.5, 121], 7); 
        L.control.zoom({ position: 'topright' }).addTo(adminMap);

        adminMap.on('click', function(e) {
            updatePickerMarker(e.latlng.lat, e.latlng.lng);
        });
    }

    function updatePickerMarker(lat, lng) {
        document.getElementById('form-lat').value = lat;
        document.getElementById('form-lng').value = lng;
        
        if (pickerMarker) {
            pickerMarker.setLatLng([lat, lng]);
        } else {
            const customIcon = L.divIcon({
                className: 'custom-marker',
                html: `<div class="marker-pin"><i class="fa-solid fa-location-dot"></i></div>`,
                iconSize: [32, 32], iconAnchor: [16, 16]
            });
            pickerMarker = L.marker([lat, lng], { icon: customIcon }).addTo(adminMap);
        }
        adminMap.panTo([lat, lng]);
    }

    window.openSpotModal = function(id = null) {
        document.getElementById('form-id').value = id || '';
        document.getElementById('form-name').value = '';
        document.getElementById('form-sub').value = '';
        document.getElementById('form-mode').value = 'spot';
        document.getElementById('form-lat').value = '';
        document.getElementById('form-lng').value = '';
        if(pickerMarker && adminMap) {
            adminMap.removeLayer(pickerMarker);
            pickerMarker = null;
        }

        document.getElementById('modal-title').innerText = id ? '編輯景點' : '新增景點';

        if (id) {
            const spot = adminSpots.find(s => s.id === id);
            if (spot) {
                document.getElementById('form-name').value = spot.name;
                document.getElementById('form-sub').value = spot.subtitle || '';
                document.getElementById('form-mode').value = spot.locMode || 'spot';
                if(spot.lat && spot.lng) {
                    setTimeout(() => updatePickerMarker(spot.lat, spot.lng), 100);
                }
            }
        } else {
             setTimeout(() => { if(adminMap) adminMap.setView([23.5, 121], 7); }, 100);
        }

        const modal = document.getElementById('spot-modal');
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        
        setTimeout(() => {
            document.getElementById('spot-modal-backdrop').classList.remove('opacity-0');
            const content = document.getElementById('spot-modal-content');
            content.classList.remove('scale-95', 'opacity-0');
            content.classList.add('scale-100', 'opacity-100');
            
            if(!adminMap) initAdminMap();
            adminMap.invalidateSize();
        }, 10);
    };

    window.closeSpotModal = function() {
        document.getElementById('spot-modal-backdrop').classList.add('opacity-0');
        const content = document.getElementById('spot-modal-content');
        content.classList.remove('scale-100', 'opacity-100');
        content.classList.add('scale-95', 'opacity-0');
        
        setTimeout(() => {
            const modal = document.getElementById('spot-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }, 300);
    };

    // ========== CRUD 操作 ==========
    window.saveSpot = async function() {
        if (!isAdmin) return; // 二次防呆
        const id = document.getElementById('form-id').value;
        const name = document.getElementById('form-name').value.trim();
        const sub = document.getElementById('form-sub').value.trim();
        const mode = document.getElementById('form-mode').value;
        const lat = parseFloat(document.getElementById('form-lat').value);
        const lng = parseFloat(document.getElementById('form-lng').value);

        if(!name) { window.showToast("景點名稱為必填"); return; }

        const spotData = {
            name: name,
            subtitle: sub,
            locMode: mode,
            lat: isNaN(lat) ? null : lat,
            lng: isNaN(lng) ? null : lng
        };

        try {
            if (id) {
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'spots', id), spotData);
            } else {
                spotData.createdAt = Date.now();
                spotData.creatorId = auth.currentUser ? auth.currentUser.uid : 'admin';
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'spots'), spotData);
            }
            window.closeSpotModal();
            window.showToast("雲端儲存成功");
        } catch(e) {
            console.error(e);
            window.showToast("寫入失敗，請確認 Firebase 權限規則");
        }
    };

    window.deleteSpot = async function(id) {
        if (!isAdmin) return; // 二次防呆
        if(!confirm("確定要刪除此景點嗎？刪除後前台也將無法搜尋到。")) return;

        try {
            await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'spots', id));
            window.showToast("雲端刪除成功");
        } catch(e) {
            console.error(e);
            window.showToast("刪除失敗，請確認 Firebase 權限規則");
        }
    };

    // Start App
    async function startApp() {
        try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            }
        } catch (e) {
            console.log('Auth Init Fallback', e);
        }
        // 資料載入交由 onAuthStateChanged 處理
    }

    startApp();
  </script>
</body>
</html>
