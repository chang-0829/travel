<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>趣旅行 - 景點管理後台</title>
  
  <!-- Leaflet CSS (地圖核心) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { primary: '#748CAB', dark: '#3E5C76', light: '#E6EBEF', bg: '#F2F5F8', card: '#FFFFFF', textMain: '#2C3E50', textSub: '#8796A5', accent: '#D5896F' }
          }
        }
      }
    }
  </script>

  <style>
    /* --- LINE Seed 字體整合 --- */
    @font-face { font-family: 'LINE Seed TW'; src: url('../fonts/LINESeedTW_OTF_Th.woff2') format('woff2'); font-weight: 300; font-style: normal; font-display: swap; }
    @font-face { font-family: 'LINE Seed TW'; src: url('../fonts/LINESeedTW_OTF_Rg.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: 'LINE Seed TW'; src: url('../fonts/LINESeedTW_OTF_Bd.woff2') format('woff2'); font-weight: 700; font-style: normal; font-display: swap; }
    @font-face { font-family: 'LINE Seed W'; src: url('../fonts/LINESeedSans_W_Rg.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: 'LINE Seed W'; src: url('../fonts/LINESeedSans_W_Bd.woff2') format('woff2'); font-weight: 700; font-style: normal; font-display: swap; }

    body { font-family: 'LINE Seed TW', 'LINE Seed W', ui-sans-serif, system-ui, sans-serif; background-color: #F8FAFC; }
    
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* 覆寫 Leaflet 樣式 */
    .custom-marker { background: transparent; border: none; }
    .marker-pin { width: 36px; height: 36px; border-radius: 50%; background: #D5896F; border: 3px solid white; box-shadow: 0 4px 10px rgba(213, 137, 111, 0.4); display: flex; align-items: center; justify-content: center; color: white; }
    
    /* Input & Select Focus 樣式 */
    .form-input {
        width: 100%; background-color: #F8FAFC; border: 1px solid rgba(230, 235, 239, 0.8); border-radius: 0.75rem; padding: 0.75rem 1rem; font-size: 0.875rem; font-weight: 700; color: #3E5C76; outline: none; transition: all 0.2s;
    }
    .form-input:focus {
        border-color: rgba(116, 140, 171, 0.5); background-color: #FFFFFF; box-shadow: 0 0 0 3px rgba(116, 140, 171, 0.1);
    }
  </style>
</head>
<body class="text-brand-textMain antialiased overflow-hidden flex h-screen">

  <!-- ================= 管理員專屬登入遮罩 ================= -->
  <div id="admin-login-overlay" class="fixed inset-0 z-[9999] bg-brand-bg flex items-center justify-center p-4">
    <div class="bg-white rounded-[32px] shadow-2xl border border-brand-light p-8 max-w-sm w-full text-center flex flex-col items-center">
       <div class="w-20 h-20 bg-brand-dark text-white rounded-[24px] flex items-center justify-center mb-6 shadow-md shadow-brand-dark/20">
          <i data-lucide="shield-check" class="w-10 h-10"></i>
       </div>
       <h2 class="text-2xl font-extrabold text-brand-dark mb-2">系統管理後台</h2>
       <p class="text-[13px] font-bold text-brand-textSub mb-8">此區域僅限高階管理員信箱存取</p>
       
       <p id="login-error-msg" class="hidden text-[13px] text-[#E63946] bg-[#FFE5E5] px-4 py-3 rounded-xl font-bold w-full mb-6 border border-[#E63946]/20"></p>
       
       <button onclick="window.adminLogin()" class="w-full py-4 bg-white border border-brand-light text-brand-dark font-extrabold text-[15px] rounded-[16px] shadow-sm hover:bg-brand-bg active:scale-95 transition-all flex items-center justify-center gap-3">
          <svg class="w-5 h-5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          Google 帳號授權登入
       </button>
       
       <a href="./discover.html" class="mt-8 text-xs font-bold text-brand-textSub hover:text-brand-primary transition-colors flex items-center gap-1.5">
          <i data-lucide="arrow-left" class="w-4 h-4"></i> 返回前台探索
       </a>
    </div>
  </div>

  <!-- 提示訊息 Toast -->
  <div id="toast" class="fixed top-6 left-1/2 transform -translate-x-1/2 bg-brand-dark text-white px-6 py-3 rounded-full shadow-2xl z-[9000] transition-all duration-300 opacity-0 pointer-events-none -translate-y-4 flex items-center gap-2 font-bold text-sm">
    <div id="toast-icon-container"></div> <span id="toast-msg">處理成功</span>
  </div>

  <!-- 左側邊欄 (Sidebar) -->
  <aside class="w-64 bg-white border-r border-brand-light shadow-sm flex flex-col shrink-0 hidden md:flex z-20">
    <div class="h-20 flex items-center px-6 border-b border-brand-light/50 shrink-0">
       <div class="w-10 h-10 rounded-xl bg-brand-dark text-white flex items-center justify-center mr-3 shadow-sm">
          <i data-lucide="plane" class="w-5 h-5 -mt-0.5"></i>
       </div>
       <div>
         <div class="text-lg font-extrabold text-brand-dark tracking-tight leading-tight">趣旅行</div>
         <div class="text-[10px] font-bold text-brand-textSub tracking-widest uppercase">Admin Panel</div>
       </div>
    </div>
    
    <div class="flex-1 py-6 px-4 space-y-2 overflow-y-auto">
      <div class="text-xs font-bold text-brand-textSub mb-4 px-2 tracking-widest uppercase">管理選單</div>
      <a href="#" class="flex items-center gap-4 px-4 py-3 rounded-xl bg-brand-primary/10 text-brand-primary font-bold transition-all">
        <i data-lucide="map-pinned" class="w-5 h-5"></i> <span>景點資料庫</span>
      </a>
      <a href="#" class="flex items-center gap-4 px-4 py-3 rounded-xl text-brand-textSub hover:bg-brand-bg hover:text-brand-primary font-bold transition-all opacity-50 cursor-not-allowed">
        <i data-lucide="users" class="w-5 h-5"></i> <span>用戶管理</span>
      </a>
    </div>

    <div class="p-4 border-t border-brand-light/50">
      <a href="./discover.html" class="flex items-center justify-center gap-2 w-full py-3 rounded-xl bg-brand-bg text-brand-textMain font-bold hover:bg-brand-light/50 transition-all border border-brand-light mb-2">
        <i data-lucide="log-out" class="w-4 h-4"></i> 返回前台探索
      </a>
    </div>
  </aside>

  <!-- 主內容區 -->
  <main class="flex-1 flex flex-col relative overflow-hidden bg-[#F8FAFC]">
    
    <!-- 頂部 Header -->
    <header class="h-16 md:h-20 bg-white px-4 md:px-8 shrink-0 flex items-center justify-between border-b border-brand-light shadow-sm z-10">
      <div class="flex items-center gap-4">
        <!-- 手機版漢堡選單 (暫為視覺) -->
        <button class="md:hidden text-brand-dark hover:text-brand-primary"><i data-lucide="menu" class="w-6 h-6"></i></button>
        <h2 class="text-lg md:text-xl font-extrabold text-brand-dark">公共景點管理</h2>
      </div>
      <div class="flex items-center gap-4">
         <span id="admin-user-name" class="text-sm font-bold text-brand-textSub hidden sm:block">載入中...</span>
         <button onclick="window.adminLogout()" class="w-9 h-9 md:w-10 md:h-10 rounded-full bg-brand-bg border border-brand-light flex items-center justify-center text-brand-primary hover:bg-[#FFE5E5] hover:text-[#E63946] transition-colors shadow-sm" title="登出並返回">
            <i data-lucide="log-out" class="w-4 h-4 -ml-0.5"></i>
         </button>
      </div>
    </header>

    <!-- 內容區：資料表格/列表 -->
    <div class="flex-1 overflow-y-auto p-4 md:p-8 relative">
       <div class="bg-white rounded-2xl shadow-sm border border-brand-light flex flex-col h-full md:max-h-[800px]">
          <!-- 表格 Header 功能區 -->
          <div class="p-4 md:p-6 border-b border-brand-light/50 flex flex-col sm:flex-row sm:items-center justify-between gap-4 shrink-0">
             <div class="relative w-full sm:w-72">
                <i data-lucide="search" class="w-4 h-4 absolute left-4 top-1/2 -translate-y-1/2 text-brand-textSub"></i>
                <input type="text" id="search-input" placeholder="搜尋景點名稱..." class="w-full bg-brand-bg rounded-xl py-2.5 pl-11 pr-4 outline-none focus:ring-2 focus:ring-brand-primary/30 transition-all text-sm font-bold text-brand-dark border border-transparent focus:border-brand-primary/50">
             </div>
             <button onclick="window.openSpotModal()" class="w-full sm:w-auto px-6 py-3 md:py-2.5 bg-brand-primary text-white font-bold rounded-xl shadow-md shadow-brand-primary/30 hover:bg-brand-dark active:scale-95 transition-all flex items-center justify-center gap-2">
                <i data-lucide="plus" class="w-5 h-5 md:w-4 md:h-4"></i> 新增景點
             </button>
          </div>

          <!-- 列表主體 (手機版卡片，電腦版表格) -->
          <div class="flex-1 overflow-auto hide-scrollbar bg-[#F8FAFC] md:bg-white p-2 md:p-0">
             <!-- 電腦版表格 (md 以上顯示) -->
             <table class="w-full text-left border-collapse hidden md:table">
                <thead class="bg-brand-bg/50 sticky top-0 z-10">
                   <tr>
                      <th class="px-6 py-4 text-xs font-bold text-brand-textSub uppercase tracking-wider border-b border-brand-light">類別/封面</th>
                      <th class="px-6 py-4 text-xs font-bold text-brand-textSub uppercase tracking-wider border-b border-brand-light">景點名稱</th>
                      <th class="px-6 py-4 text-xs font-bold text-brand-textSub uppercase tracking-wider border-b border-brand-light">地址</th>
                      <th class="px-6 py-4 text-xs font-bold text-brand-textSub uppercase tracking-wider border-b border-brand-light">座標 (Lat, Lng)</th>
                      <th class="px-6 py-4 text-xs font-bold text-brand-textSub uppercase tracking-wider border-b border-brand-light text-right">操作</th>
                   </tr>
                </thead>
                <tbody id="table-body" class="divide-y divide-brand-light/50">
                   <tr><td colspan="5" class="px-6 py-12 text-center text-brand-textSub font-bold"><div class="flex items-center justify-center gap-2"><i data-lucide="loader" class="w-5 h-5 animate-spin"></i> 驗證權限中...</div></td></tr>
                </tbody>
             </table>

             <!-- 手機版卡片列表 (md 以下顯示) -->
             <div id="card-list" class="grid grid-cols-1 gap-3 md:hidden">
                <div class="py-12 text-center text-brand-textSub font-bold flex flex-col items-center justify-center">
                    <i data-lucide="loader" class="w-8 h-8 animate-spin mb-2"></i> 驗證權限中...
                </div>
             </div>
          </div>
       </div>
    </div>
  </main>

  <!-- ================= 滿版景點編輯/新增 Modal (Full Screen) ================= -->
  <div id="spot-modal" class="fixed inset-0 z-[5000] hidden bg-white flex-col transform transition-transform translate-y-full duration-300 opacity-0 overflow-hidden">
     
     <!-- Modal Header -->
     <div class="px-4 md:px-6 h-16 md:h-[72px] border-b border-brand-light/80 flex justify-between items-center bg-white shrink-0 shadow-sm z-20 relative">
        <div class="flex items-center gap-3 md:gap-4">
           <button onclick="window.closeSpotModal()" class="w-10 h-10 rounded-full bg-brand-bg flex items-center justify-center text-brand-textMain hover:bg-brand-light hover:text-brand-dark transition-colors"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
           <h3 id="modal-title" class="text-lg md:text-xl font-extrabold text-brand-dark">新增景點</h3>
        </div>
        <button id="btn-save-spot" onclick="window.saveSpot()" class="px-4 md:px-6 py-2 md:py-2.5 bg-brand-primary text-white font-bold rounded-xl shadow-md shadow-brand-primary/30 hover:bg-brand-dark active:scale-95 disabled:opacity-70 disabled:cursor-not-allowed transition-all flex items-center gap-2 text-sm md:text-base">
           <i data-lucide="save" class="w-4 h-4"></i> <span class="hidden sm:inline">儲存景點資料</span><span class="sm:hidden">儲存</span>
        </button>
     </div>
     
     <!-- Modal Body (左側表單與右側滿版地圖) -->
     <!-- 針對手機版：改成純垂直排版 -->
     <div class="flex-1 overflow-y-auto md:overflow-hidden flex flex-col md:flex-row bg-white relative pb-20 md:pb-0">
        
        <!-- 左側：詳細表單 -->
        <div class="w-full md:w-[450px] lg:w-[500px] flex flex-col md:border-r border-brand-light shrink-0 z-10 bg-white md:h-full">
           <div class="flex-1 overflow-y-visible md:overflow-y-auto hide-scrollbar p-4 md:p-6 space-y-5">
               <input type="hidden" id="form-id">

               <!-- 景點封面照上傳區 -->
               <div>
                  <label class="block text-xs font-bold text-brand-textSub mb-1.5 pl-1">景點封面照 (選填)</label>
                  <div class="relative w-full h-40 md:h-44 bg-[#F8FAFC] border-2 border-dashed border-brand-light/80 rounded-2xl flex flex-col items-center justify-center text-brand-textSub hover:bg-brand-light/30 hover:border-brand-primary/50 transition-all cursor-pointer overflow-hidden group" onclick="document.getElementById('form-image-input').click()">
                     
                     <img id="form-image-preview" src="" class="absolute inset-0 w-full h-full object-cover hidden z-10" />
                     <div id="form-image-overlay" class="absolute inset-0 bg-black/50 text-white flex-col items-center justify-center z-20 hidden opacity-0 group-hover:opacity-100 transition-opacity">
                         <i data-lucide="camera" class="w-8 h-8 mb-2"></i>
                         <span class="text-sm font-bold">點擊更換圖片</span>
                     </div>

                     <div id="form-image-placeholder" class="flex flex-col items-center justify-center relative z-0">
                        <i data-lucide="upload-cloud" class="w-8 h-8 mb-2 text-brand-textSub group-hover:text-brand-primary transition-colors"></i>
                        <span class="text-sm font-bold text-brand-dark group-hover:text-brand-primary transition-colors">點擊上傳圖片</span>
                        <span class="text-[11px] font-bold mt-1 opacity-60">支援 JPG, PNG (建議橫式，最大 5MB)</span>
                     </div>
                     <input type="file" id="form-image-input" accept="image/*" class="hidden" onchange="window.previewImage(event)">
                  </div>
                  <input type="hidden" id="form-existing-image-url">
               </div>

               <div>
                  <label class="block text-xs font-bold text-brand-textSub mb-1.5 pl-1">景點中文名稱 <span class="text-[#E63946]">*</span></label>
                  <input type="text" id="form-name" placeholder="輸入景點/地標中文名稱" class="form-input">
               </div>

               <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 md:gap-3">
                  <div>
                     <label class="block text-xs font-bold text-brand-textSub mb-1.5 pl-1">外文名稱 1 (選填)</label>
                     <input type="text" id="form-foreign1" placeholder="如日文/英文" class="form-input">
                  </div>
                  <div>
                     <label class="block text-xs font-bold text-brand-textSub mb-1.5 pl-1">外文名稱 2 (選填)</label>
                     <input type="text" id="form-foreign2" placeholder="其他外文名稱" class="form-input">
                  </div>
               </div>

               <div>
                  <label class="block text-xs font-bold text-brand-textSub mb-1.5 pl-1">分類 <span class="text-[#E63946]">*</span></label>
                  <select id="form-mode" class="form-input appearance-none cursor-pointer">
                     <!-- JS 動態填入 -->
                  </select>
               </div>

               <!-- 針對手機版的互動：地圖選點按鈕 -->
               <div class="md:hidden border border-brand-light rounded-xl p-4 bg-brand-bg/30">
                    <label class="block text-sm font-bold text-brand-dark mb-2">座標定位 <span class="text-[#E63946]">*</span></label>
                    <p class="text-xs text-brand-textSub mb-3">設定景點在地圖上的精確位置</p>
                    <button type="button" onclick="window.toggleMobileMap()" id="btn-mobile-map" class="w-full py-3 bg-white border border-brand-primary text-brand-primary font-bold rounded-xl flex items-center justify-center gap-2 active:bg-brand-primary/10 transition-colors">
                        <i data-lucide="map-pin" class="w-4 h-4"></i> <span id="mobile-map-btn-text">展開地圖選擇位置</span>
                    </button>
                    <!-- 手機版地圖容器 (預設隱藏) -->
                    <div id="mobile-map-container" class="hidden mt-3 h-[300px] rounded-xl overflow-hidden relative border border-brand-light">
                        <div id="admin-map-mobile" class="w-full h-full"></div>
                    </div>
               </div>

               <div>
                  <label class="block text-xs font-bold text-brand-textSub mb-1.5 pl-1">地址 <span class="text-[#E63946]">*</span></label>
                  <input type="text" id="form-address" placeholder="輸入完整地址" class="form-input">
               </div>

               <div>
                  <label class="block text-xs font-bold text-brand-textSub mb-1.5 pl-1">景點介紹 (選填)</label>
                  <textarea id="form-description" placeholder="輸入景點的詳細介紹或特色..." rows="4" class="form-input resize-none"></textarea>
               </div>

               <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 md:gap-3">
                  <div>
                     <label class="block text-xs font-bold text-brand-textSub mb-1.5 pl-1">網址 (選填)</label>
                     <input type="url" id="form-website" placeholder="https://" class="form-input">
                  </div>
                  <div>
                     <label class="block text-xs font-bold text-brand-textSub mb-1.5 pl-1">電話 (選填)</label>
                     <input type="tel" id="form-phone" placeholder="輸入聯絡電話" class="form-input">
                  </div>
               </div>
           </div>
           
           <!-- 左側底部：座標開放手動輸入 -->
           <div class="p-4 md:p-6 bg-brand-bg/50 border-t border-brand-light shrink-0 z-10 md:block">
               <div class="grid grid-cols-2 gap-3">
                  <div>
                     <label class="block text-[10px] font-bold text-brand-textSub mb-1 pl-1 uppercase tracking-wider">Latitude</label>
                     <input type="number" id="form-lat" step="any" placeholder="例: 25.0339" onchange="window.handleManualCoordChange()" class="w-full bg-white border border-brand-light/50 shadow-sm rounded-lg px-3 py-2 text-xs font-mono text-brand-dark outline-none focus:border-brand-primary/50 transition-all">
                  </div>
                  <div>
                     <label class="block text-[10px] font-bold text-brand-textSub mb-1 pl-1 uppercase tracking-wider">Longitude</label>
                     <input type="number" id="form-lng" step="any" placeholder="例: 121.5644" onchange="window.handleManualCoordChange()" class="w-full bg-white border border-brand-light/50 shadow-sm rounded-lg px-3 py-2 text-xs font-mono text-brand-dark outline-none focus:border-brand-primary/50 transition-all">
                  </div>
               </div>
           </div>
        </div>

        <!-- 右側：滿版地圖選點器 (電腦版顯示) -->
        <div class="hidden md:flex flex-1 h-full bg-brand-light relative flex-col shrink-0 z-0">
           <div class="absolute top-4 left-1/2 transform -translate-x-1/2 bg-white/95 backdrop-blur shadow-lg text-brand-dark text-xs font-bold py-2 px-4 rounded-full flex items-center gap-2 z-[400]">
              <i data-lucide="wand-sparkles" class="w-4 h-4 text-brand-primary"></i> 在地圖上點擊或左下方手動輸入精準座標
           </div>
           <div id="admin-map-desktop" class="flex-1 w-full h-full relative z-0"></div>
        </div>
     </div>
  </div>

  <!-- Lucide JS -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  
  <!-- Firebase / 邏輯 -->
  <script type="module">

    // 💡 引入全站共用分類設定 (已改為 Lucide)
    import { LOCATION_MODES } from '../js/config.js';

    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { 
      apiKey: "AIzaSyCQF8A3ieML0JP3X8X78NCRuiUETRAiu5E",

      projectId: "travel-96009", 
      storageBucket: "travel-96009.firebasestorage.app", 
      messagingSenderId: "578860064042", 
      appId: "1:578860064042:web:b147880df3a01dd8f75253" 
    };
    const app = initializeApp(firebaseConfig); 
    const auth = getAuth(app);
    const db = getFirestore(app); 
    const storage = getStorage(app);
    const appId = typeof __app_id !== 'undefined' ? __app_id : "travel-platform-v2";

    const ADMIN_EMAIL = 'a0909921988@gmail.com';

    let adminSpots = [];
    let adminMapDesktop = null;
    let adminMapMobile = null;
    let pickerMarker = null;
    let isAdmin = false;

    // Toast Function (搭配 Lucide)
    window.showToast = function(msg, isError = false) {
      const el = document.getElementById('toast');
      const iconContainer = document.getElementById('toast-icon-container');
      document.getElementById('toast-msg').innerText = msg;
      
      const iconName = isError ? 'circle-x' : 'circle-check';
      const colorClass = isError ? 'text-[#E63946]' : 'text-brand-light';
      iconContainer.innerHTML = `<i data-lucide="${iconName}" class="w-4 h-4 ${colorClass}"></i>`;
      lucide.createIcons({ root: iconContainer });

      el.classList.remove('opacity-0', '-translate-y-4', 'pointer-events-none');
      el.classList.add('opacity-100', 'translate-y-0');
      setTimeout(() => {
        el.classList.remove('opacity-100', 'translate-y-0');
        el.classList.add('opacity-0', '-translate-y-4', 'pointer-events-none');
      }, 3000);
    }

    // 初始化下拉選單
    function initSelect() {
        const select = document.getElementById('form-mode');
        select.innerHTML = '<option value="" disabled>請選擇分類...</option>';
        LOCATION_MODES.forEach(mode => {
            select.add(new Option(mode.label, mode.id));
        });
    }

    onAuthStateChanged(auth, user => {
        const nameEl = document.getElementById('admin-user-name');
        const loginOverlay = document.getElementById('admin-login-overlay');
        const errorMsg = document.getElementById('login-error-msg');

        if (user && user.email === ADMIN_EMAIL) {
            isAdmin = true;
            nameEl.innerText = user.displayName || "超級管理員";
            loginOverlay.classList.add('hidden');
            initSelect();
            loadSpots();
        } else {
            isAdmin = false;
            nameEl.innerText = "未授權";
            loginOverlay.classList.remove('hidden');
            
            const tbody = document.getElementById('table-body');
            if(tbody) tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-12 text-center text-[#E63946] font-bold"><div class="flex items-center justify-center gap-2"><i data-lucide="shield-alert" class="w-5 h-5"></i>拒絕存取：無權限讀取</div></td></tr>`;
            const cardList = document.getElementById('card-list');
            if(cardList) cardList.innerHTML = `<div class="py-12 text-center text-[#E63946] font-bold flex flex-col items-center justify-center"><i data-lucide="shield-alert" class="w-8 h-8 mb-2"></i>拒絕存取</div>`;
            lucide.createIcons();

            if (user && !user.isAnonymous && user.email !== ADMIN_EMAIL) {
               errorMsg.innerText = `目前帳號 (${user.email}) 無權限進入後台。`;
               errorMsg.classList.remove('hidden');
               signOut(auth);
            } else {
               errorMsg.classList.add('hidden');
            }
        }
    });

    window.adminLogin = function() {
        const provider = new GoogleAuthProvider();
        signInWithPopup(auth, provider).catch(err => { window.showToast("登入失敗：" + err.message, true); });
    };

    window.adminLogout = function() {
        signOut(auth).then(() => { window.location.href = './discover.html'; });
    };

    function loadSpots() {
      if (!isAdmin) return;
      const qSpots = collection(db, 'artifacts', appId, 'public', 'data', 'spots');
      onSnapshot(qSpots, (snapshot) => {
        adminSpots = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderTable();
      }, err => {
        console.error(err); window.showToast("載入資料失敗，請確認權限", true);
      });
    }

    // 💡 雙平台渲染：電腦版表格與手機版卡片
    function renderTable(filter = '') {
      const tbody = document.getElementById('table-body');
      const cardList = document.getElementById('card-list');
      if(!tbody || !cardList) return;

      let spots = adminSpots;
      if (filter) {
          const kw = filter.toLowerCase();
          spots = spots.filter(s => (s.name || '').toLowerCase().includes(kw));
      }

      if (spots.length === 0) {
          const emptyHTML = `<div class="flex flex-col items-center justify-center gap-2 text-brand-textSub"><i data-lucide="package-open" class="w-8 h-8"></i>目前沒有資料</div>`;
          tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-12 text-center font-bold">${emptyHTML}</td></tr>`;
          cardList.innerHTML = `<div class="py-12 text-center font-bold">${emptyHTML}</div>`;
          lucide.createIcons();
          return;
      }

      const sorted = [...spots].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

      let tableHtml = '';
      let cardHtml = '';

      sorted.forEach(spot => {
          const locObj = LOCATION_MODES.find(m => m.id === spot.locMode) || { label: '未知', icon: 'map-pin', color: '#8796A5' };
          const hasCoords = spot.lat && spot.lng;
          const coordsStr = hasCoords ? `${parseFloat(spot.lat).toFixed(4)}, ${parseFloat(spot.lng).toFixed(4)}` : '<span class="text-brand-accent italic">未設定</span>';
          const displayAddress = spot.address || spot.subtitle || '-';
          
          const iconOrImgHtml = spot.imageUrl 
              ? `<img src="${spot.imageUrl}" class="w-10 h-10 md:w-12 md:h-12 rounded-[10px] object-cover border border-brand-light/80 shadow-sm shrink-0" alt="cover" />`
              : `<div class="w-10 h-10 md:w-12 md:h-12 rounded-[10px] bg-brand-bg flex items-center justify-center border border-brand-light shadow-sm shrink-0" style="color: ${locObj.color};"><i data-lucide="${locObj.icon}" class="w-5 h-5"></i></div>`;

          // 電腦版 Table Row
          tableHtml += `
          <tr class="hover:bg-brand-bg/50 transition-colors group">
             <td class="px-6 py-3 whitespace-nowrap">
                <div class="flex items-center gap-3">
                   ${iconOrImgHtml}
                   <span class="text-[13px] font-bold text-white px-2 py-0.5 rounded-md shadow-sm" style="background-color: ${locObj.color}">${locObj.label}</span>
                </div>
             </td>
             <td class="px-6 py-3"><div class="text-[15px] font-extrabold text-brand-dark">${spot.name}</div></td>
             <td class="px-6 py-3"><div class="text-sm font-medium text-brand-textSub max-w-[200px] truncate">${displayAddress}</div></td>
             <td class="px-6 py-3 hidden md:table-cell"><div class="text-[11px] font-mono font-bold text-brand-textSub bg-brand-light/40 inline-block px-2.5 py-1 rounded-md border border-brand-light/50">${coordsStr}</div></td>
             <td class="px-6 py-3 text-right whitespace-nowrap">
                <button onclick="window.openSpotModal('${spot.id}')" class="w-8 h-8 rounded-lg bg-brand-bg text-brand-primary hover:bg-brand-primary hover:text-white transition-all shadow-sm mr-1 inline-flex items-center justify-center"><i data-lucide="pencil" class="w-3.5 h-3.5"></i></button>
                <button onclick="window.deleteSpot('${spot.id}')" class="w-8 h-8 rounded-lg bg-[#FFE5E5] text-[#E63946] hover:bg-[#E63946] hover:text-white transition-all shadow-sm inline-flex items-center justify-center"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
             </td>
          </tr>`;

          // 💡 手機版 Card Item
          cardHtml += `
          <div class="bg-white p-4 rounded-2xl shadow-sm border border-brand-light flex flex-col gap-3">
              <div class="flex gap-3 items-center">
                  ${iconOrImgHtml}
                  <div class="flex-1 min-w-0">
                      <h4 class="font-extrabold text-brand-dark text-base truncate">${spot.name}</h4>
                      <span class="inline-block text-[10px] font-bold text-white px-1.5 py-0.5 rounded shadow-sm mt-0.5" style="background-color: ${locObj.color}">${locObj.label}</span>
                  </div>
              </div>
              <div class="text-xs text-brand-textSub flex items-start gap-1.5 line-clamp-2">
                  <i data-lucide="map-pin" class="w-3.5 h-3.5 mt-0.5 shrink-0"></i> ${displayAddress}
              </div>
              <div class="flex items-center justify-between pt-2 border-t border-brand-light/50">
                  <div class="text-[10px] font-mono text-brand-textSub bg-brand-bg px-2 py-0.5 rounded border border-brand-light">${hasCoords ? '已定位' : '<span class="text-brand-accent">未定位</span>'}</div>
                  <div class="flex gap-2">
                      <button onclick="window.openSpotModal('${spot.id}')" class="px-4 py-1.5 rounded-lg bg-brand-bg text-brand-primary font-bold text-xs flex items-center gap-1 active:scale-95 transition-all"><i data-lucide="pencil" class="w-3 h-3"></i>編輯</button>
                      <button onclick="window.deleteSpot('${spot.id}')" class="px-3 py-1.5 rounded-lg bg-[#FFE5E5] text-[#E63946] font-bold text-xs flex items-center gap-1 active:scale-95 transition-all"><i data-lucide="trash-2" class="w-3 h-3"></i></button>
                  </div>
              </div>
          </div>`;
      });

      tbody.innerHTML = tableHtml;
      cardList.innerHTML = cardHtml;
      lucide.createIcons();
    }

    document.getElementById('search-input').addEventListener('input', (e) => renderTable(e.target.value));

    window.previewImage = function(event) {
        const file = event.target.files[0];
        if (file) {
            if(file.size > 5 * 1024 * 1024) { window.showToast("圖片大小不能超過 5MB", true); document.getElementById('form-image-input').value = ''; return; }
            const preview = document.getElementById('form-image-preview');
            const placeholder = document.getElementById('form-image-placeholder');
            const overlay = document.getElementById('form-image-overlay');
            preview.src = URL.createObjectURL(file);
            preview.classList.remove('hidden'); placeholder.classList.add('hidden');
            overlay.classList.add('flex'); overlay.classList.remove('hidden');
        }
    };

    // ========== 地圖邏輯 ==========
    // 💡 處理雙地圖 (桌機與手機)
    function getActiveMap() {
        return window.innerWidth >= 768 ? adminMapDesktop : adminMapMobile;
    }

    function initAdminMap() {
        const streetLayerConfig = { attribution: '&copy; Google', maxZoom: 20 };
        const tileUrl = 'https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}';

        if(window.innerWidth >= 768) {
            if(!adminMapDesktop) {
                adminMapDesktop = L.map('admin-map-desktop', { zoomControl: false, layers: [L.tileLayer(tileUrl, streetLayerConfig)] }).setView([23.5, 121], 7); 
                L.control.zoom({ position: 'topright' }).addTo(adminMapDesktop);
                adminMapDesktop.on('click', function(e) { updatePickerMarker(e.latlng.lat, e.latlng.lng); });
            }
        } else {
            if(!adminMapMobile) {
                adminMapMobile = L.map('admin-map-mobile', { zoomControl: false, layers: [L.tileLayer(tileUrl, streetLayerConfig)] }).setView([23.5, 121], 7);
                L.control.zoom({ position: 'bottomright' }).addTo(adminMapMobile);
                adminMapMobile.on('click', function(e) { updatePickerMarker(e.latlng.lat, e.latlng.lng); });
            }
        }
    }

    // 手機版展開地圖功能
    window.toggleMobileMap = function() {
        const container = document.getElementById('mobile-map-container');
        const btnText = document.getElementById('mobile-map-btn-text');
        if(container.classList.contains('hidden')) {
            container.classList.remove('hidden');
            btnText.innerText = '收起地圖';
            if(!adminMapMobile) initAdminMap();
            setTimeout(() => { 
                adminMapMobile.invalidateSize(); 
                const lat = document.getElementById('form-lat').value;
                const lng = document.getElementById('form-lng').value;
                if(lat && lng) adminMapMobile.setView([lat, lng], 15);
            }, 100);
        } else {
            container.classList.add('hidden');
            btnText.innerText = '展開地圖選擇位置';
        }
    }

    function updatePickerMarker(lat, lng) {
        document.getElementById('form-lat').value = lat;
        document.getElementById('form-lng').value = lng;
        const currentMap = getActiveMap();
        if(!currentMap) return;

        if (pickerMarker) {
            pickerMarker.setLatLng([lat, lng]);
            // 確保 marker 在目前顯示的地圖上
            if(!currentMap.hasLayer(pickerMarker)) {
                pickerMarker.addTo(currentMap);
            }
        } else {
            const customIcon = L.divIcon({
                className: 'custom-marker',
                html: `<div class="marker-pin"><i data-lucide="map-pin" class="w-4 h-4 text-white"></i></div>`,
                iconSize: [36, 36], iconAnchor: [18, 18]
            });
            pickerMarker = L.marker([lat, lng], { icon: customIcon }).addTo(currentMap);
            setTimeout(() => { if(window.lucide) lucide.createIcons({ root: currentMap.getContainer() }); }, 50);
        }
        currentMap.panTo([lat, lng]);
    }

    window.handleManualCoordChange = function() {
        const lat = parseFloat(document.getElementById('form-lat').value);
        const lng = parseFloat(document.getElementById('form-lng').value);
        const currentMap = getActiveMap();
        
        if (!isNaN(lat) && !isNaN(lng)) {
            if (pickerMarker) {
                pickerMarker.setLatLng([lat, lng]);
                if(currentMap && !currentMap.hasLayer(pickerMarker)) pickerMarker.addTo(currentMap);
            } else {
                if(!currentMap) return;
                const customIcon = L.divIcon({ className: 'custom-marker', html: `<div class="marker-pin"><i data-lucide="map-pin" class="w-4 h-4 text-white"></i></div>`, iconSize: [36, 36], iconAnchor: [18, 18] });
                pickerMarker = L.marker([lat, lng], { icon: customIcon }).addTo(currentMap);
                setTimeout(() => { if(window.lucide) lucide.createIcons({ root: currentMap.getContainer() }); }, 50);
            }
            if(currentMap) { currentMap.panTo([lat, lng]); currentMap.setZoom(16); }
        }
    };

    window.openSpotModal = function(id = null) {
        document.getElementById('form-id').value = id || '';
        document.getElementById('form-name').value = '';
        document.getElementById('form-foreign1').value = '';
        document.getElementById('form-foreign2').value = '';
        document.getElementById('form-mode').value = ''; // Reset select
        document.getElementById('form-address').value = '';
        document.getElementById('form-description').value = '';
        document.getElementById('form-website').value = '';
        document.getElementById('form-phone').value = '';
        document.getElementById('form-lat').value = '';
        document.getElementById('form-lng').value = '';
        
        document.getElementById('form-image-input').value = '';
        document.getElementById('form-existing-image-url').value = '';
        const preview = document.getElementById('form-image-preview');
        const placeholder = document.getElementById('form-image-placeholder');
        const overlay = document.getElementById('form-image-overlay');
        preview.src = ''; preview.classList.add('hidden');
        placeholder.classList.remove('hidden'); overlay.classList.add('hidden'); overlay.classList.remove('flex');
        
        if(pickerMarker) {
            if(adminMapDesktop) adminMapDesktop.removeLayer(pickerMarker);
            if(adminMapMobile) adminMapMobile.removeLayer(pickerMarker);
            pickerMarker = null;
        }

        // 手機版地圖收合重置
        document.getElementById('mobile-map-container').classList.add('hidden');
        document.getElementById('mobile-map-btn-text').innerText = '展開地圖選擇位置';

        document.getElementById('modal-title').innerText = id ? '編輯景點' : '新增景點';

        if (id) {
            const spot = adminSpots.find(s => s.id === id);
            if (spot) {
                document.getElementById('form-name').value = spot.name || '';
                document.getElementById('form-foreign1').value = spot.foreignName1 || '';
                document.getElementById('form-foreign2').value = spot.foreignName2 || '';
                document.getElementById('form-mode').value = spot.locMode || '';
                document.getElementById('form-address').value = spot.address || spot.subtitle || '';
                document.getElementById('form-description').value = spot.description || '';
                document.getElementById('form-website').value = spot.website || '';
                document.getElementById('form-phone').value = spot.phone || '';

                if (spot.imageUrl) {
                    document.getElementById('form-existing-image-url').value = spot.imageUrl;
                    preview.src = spot.imageUrl; preview.classList.remove('hidden');
                    placeholder.classList.add('hidden'); overlay.classList.add('flex'); overlay.classList.remove('hidden');
                }

                if(spot.lat && spot.lng) {
                    setTimeout(() => {
                        updatePickerMarker(spot.lat, spot.lng);
                        const currentMap = getActiveMap();
                        if(currentMap) currentMap.setZoom(15);
                    }, 200);
                }
            }
        } else {
             setTimeout(() => { 
                 const currentMap = getActiveMap();
                 if(currentMap) currentMap.setView([23.5, 121], 7); 
             }, 200);
        }

        const modal = document.getElementById('spot-modal');
        modal.classList.remove('hidden'); modal.classList.add('flex');
        setTimeout(() => {
            modal.classList.remove('translate-y-full', 'opacity-0');
            modal.classList.add('translate-y-0', 'opacity-100');
            initAdminMap();
        }, 10);
    };

    window.closeSpotModal = function() {
        const modal = document.getElementById('spot-modal');
        modal.classList.remove('translate-y-0', 'opacity-100');
        modal.classList.add('translate-y-full', 'opacity-0');
        setTimeout(() => { modal.classList.add('hidden'); modal.classList.remove('flex'); }, 300);
    };

    window.saveSpot = async function() {
        if (!isAdmin) return;
        
        const saveBtn = document.getElementById('btn-save-spot');
        const id = document.getElementById('form-id').value;
        const name = document.getElementById('form-name').value.trim();
        const mode = document.getElementById('form-mode').value;
        const address = document.getElementById('form-address').value.trim();
        const lat = parseFloat(document.getElementById('form-lat').value);
        const lng = parseFloat(document.getElementById('form-lng').value);

        if(!name) { window.showToast("請輸入景點中文名稱", true); return; }
        if(!mode) { window.showToast("請選擇分類", true); return; }
        if(!address) { window.showToast("請輸入地址", true); return; }
        if(isNaN(lat) || isNaN(lng)) { window.showToast("請輸入或點選精確座標", true); return; }

        const fileInput = document.getElementById('form-image-input');
        const file = fileInput.files.length > 0 ? fileInput.files[0] : null;
        let finalImageUrl = document.getElementById('form-existing-image-url').value;

        const originalBtnHTML = saveBtn.innerHTML;
        saveBtn.innerHTML = `<i data-lucide="loader" class="w-4 h-4 animate-spin"></i> <span class="hidden sm:inline">處理中...</span><span class="sm:hidden">處理中</span>`;
        lucide.createIcons({ root: saveBtn });
        saveBtn.disabled = true;

        try {
            if (file) {
                const safeFileName = encodeURIComponent(file.name);
                const storageRef = ref(storage, `artifacts/${appId}/public/data/spots/${Date.now()}_${safeFileName}`);
                const uploadTask = await uploadBytesResumable(storageRef, file);
                finalImageUrl = await getDownloadURL(uploadTask.ref);
            }

            const spotData = {
                name: name,
                foreignName1: document.getElementById('form-foreign1').value.trim(),
                foreignName2: document.getElementById('form-foreign2').value.trim(),
                locMode: mode,
                address: address,
                description: document.getElementById('form-description').value.trim(),
                website: document.getElementById('form-website').value.trim(),
                phone: document.getElementById('form-phone').value.trim(),
                lat: lat,
                lng: lng,
                imageUrl: finalImageUrl || null,
                updatedAt: Date.now()
            };

            if (id) {
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'spots', id), spotData);
                window.showToast("更新成功");
            } else {
                spotData.createdAt = Date.now();
                spotData.creatorId = auth.currentUser ? auth.currentUser.uid : 'admin';
                spotData.favoriteCount = 0;
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'spots'), spotData);
                window.showToast("建立成功");
            }
            window.closeSpotModal();
        } catch(e) {
            console.error(e); window.showToast("儲存失敗，請檢查權限", true);
        } finally {
            saveBtn.innerHTML = originalBtnHTML; saveBtn.disabled = false; lucide.createIcons({ root: saveBtn });
        }
    };

    window.deleteSpot = async function(id) {
        if (!isAdmin) return;
        if(!confirm("確定要刪除此景點嗎？")) return;
        try {
            await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'spots', id));
            window.showToast("刪除成功");
        } catch(e) { console.error(e); window.showToast("刪除失敗", true); }
    };

    async function startApp() {
        try { if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) { await signInWithCustomToken(auth, __initial_auth_token); } } catch (e) {}
        lucide.createIcons();
    }

    startApp();
  </script>
</body>
</html>
