</head>
<body class="text-brand-textMain antialiased overflow-hidden flex h-screen">

  <!-- ================= 管理員專屬登入遮罩 ================= -->

  <!-- ================= 滿版編輯 Modal ================= -->
  <div id="spot-modal" class="fixed inset-0 z-[5000] hidden bg-white flex-col transform transition-transform translate-y-full duration-300 opacity-0 overflow-hidden">
     <div class="px-6 h-[72px] border-b border-brand-light/80 flex justify-between items-center bg-white shrink-0 z-20 relative">
        <div class="flex items-center gap-4">
           <button onclick="window.closeSpotModal()" class="w-10 h-10 rounded-full bg-brand-bg flex items-center justify-center text-brand-textMain hover:bg-brand-light transition-colors"><i class="fa-solid fa-arrow-left"></i></button>
           <h3 id="modal-title" class="text-xl font-extrabold text-brand-dark tracking-tight">新增景點</h3>
        </div>
        <button id="btn-save-spot" onclick="window.saveSpot()" class="px-6 py-2.5 bg-brand-primary text-white font-bold rounded-xl shadow-md hover:bg-brand-dark active:scale-95 transition-all flex items-center gap-2">
           <i class="fa-solid fa-floppy-disk"></i> 儲存景點
        </button>
     </div>
     
     <div class="flex-1 overflow-hidden flex flex-col md:flex-row bg-white relative">
        <!-- 左側表單 -->
        <div class="w-full md:w-[480px] flex flex-col border-b md:border-b-0 md:border-r border-brand-light shrink-0 z-10 bg-white">
           <div class="flex-1 overflow-y-auto hide-scrollbar p-6 space-y-5">
               <input type="hidden" id="form-id">
               
               <!-- 圖片上傳區 -->
               <div class="space-y-2">
                  <label class="block text-xs font-bold text-brand-textSub pl-1">景點封面圖片</label>
                  <div id="image-preview" class="w-full h-40 bg-brand-bg border-2 border-dashed border-brand-light rounded-2xl overflow-hidden flex flex-col items-center justify-center relative group cursor-pointer" onclick="document.getElementById('form-image').click()">
                      <img id="preview-img" src="" class="hidden w-full h-full object-cover">
                      <div id="preview-placeholder" class="flex flex-col items-center text-brand-textSub gap-2 group-hover:text-brand-primary transition-colors">
                          <i class="fa-solid fa-cloud-arrow-up text-3xl"></i>
                          <span class="text-xs font-bold">點擊上傳照片</span>
                      </div>
                      <input type="file" id="form-image" class="hidden" accept="image/*" onchange="window.handleImageSelect(event)">
                  </div>
               </div>

               <div>
                  <label class="block text-xs font-bold text-brand-textSub mb-1.5 pl-1">景點中文名稱 <span class="text-[#E63946]">*</span></label>
                  <input type="text" id="form-name" placeholder="輸入名稱" class="w-full bg-[#F8FAFC] border border-brand-light/80 rounded-xl px-4 py-3 text-sm font-bold text-brand-dark outline-none focus:bg-white transition-all">
               </div>

               <div class="grid grid-cols-2 gap-3">
                  <div>
                     <label class="block text-xs font-bold text-brand-textSub mb-1.5 pl-1">外文 1</label>
                     <input type="text" id="form-foreign1" class="w-full bg-[#F8FAFC] border border-brand-light/80 rounded-xl px-4 py-3 text-sm font-bold text-brand-dark outline-none">
                  </div>
                  <div>
                     <label class="block text-xs font-bold text-brand-textSub mb-1.5 pl-1">外文 2</label>
                     <input type="text" id="form-foreign2" class="w-full bg-[#F8FAFC] border border-brand-light/80 rounded-xl px-4 py-3 text-sm font-bold text-brand-dark outline-none">
                  </div>
               </div>

               <div>
                  <label class="block text-xs font-bold text-brand-textSub mb-1.5 pl-1">分類 <span class="text-[#E63946]">*</span></label>
                  <select id="form-mode" class="w-full bg-[#F8FAFC] border border-brand-light/80 rounded-xl px-4 py-3 text-sm font-bold text-brand-dark outline-none appearance-none cursor-pointer"></select>
               </div>

               <div>
                  <label class="block text-xs font-bold text-brand-textSub mb-1.5 pl-1">地址 <span class="text-[#E63946]">*</span></label>
                  <input type="text" id="form-address" placeholder="輸入詳細地址" class="w-full bg-[#F8FAFC] border border-brand-light/80 rounded-xl px-4 py-3 text-sm font-bold text-brand-dark outline-none focus:bg-white transition-all">
               </div>

               <div>
                  <label class="block text-xs font-bold text-brand-textSub mb-1.5 pl-1">景點介紹</label>
                  <textarea id="form-description" rows="4" class="w-full bg-[#F8FAFC] border border-brand-light/80 rounded-xl px-4 py-3 text-sm font-bold text-brand-dark outline-none resize-none focus:bg-white transition-all"></textarea>
               </div>

               <div class="grid grid-cols-2 gap-3">
                  <div>
                     <label class="block text-xs font-bold text-brand-textSub mb-1.5 pl-1">網址</label>
                     <input type="url" id="form-website" class="w-full bg-[#F8FAFC] border border-brand-light/80 rounded-xl px-4 py-3 text-sm font-bold text-brand-dark outline-none">
                  </div>
                  <div>
                     <label class="block text-xs font-bold text-brand-textSub mb-1.5 pl-1">電話</label>
                     <input type="tel" id="form-phone" class="w-full bg-[#F8FAFC] border border-brand-light/80 rounded-xl px-4 py-3 text-sm font-bold text-brand-dark outline-none">
                  </div>
               </div>
           </div>
           
           <div class="p-6 bg-brand-bg/50 border-t border-brand-light shrink-0">
               <div class="grid grid-cols-2 gap-3">
                  <div>
                     <label class="block text-[10px] font-bold text-brand-textSub mb-1 pl-1 uppercase tracking-wider">Latitude</label>
                     <input type="number" id="form-lat" step="any" onchange="window.handleManualCoordChange()" class="w-full bg-white border border-brand-light/50 rounded-lg px-3 py-2 text-xs font-mono text-brand-dark outline-none">
                  </div>
                  <div>
                     <label class="block text-[10px] font-bold text-brand-textSub mb-1 pl-1 uppercase tracking-wider">Longitude</label>
                     <input type="number" id="form-lng" step="any" onchange="window.handleManualCoordChange()" class="w-full bg-white border border-brand-light/50 rounded-lg px-3 py-2 text-xs font-mono text-brand-dark outline-none">
                  </div>
               </div>
           </div>
        </div>

        <!-- 右側滿版地圖 -->
        <div class="flex-1 h-full bg-brand-light relative z-0">
           <div class="absolute top-4 left-1/2 transform -translate-x-1/2 bg-white shadow-lg text-brand-dark text-xs font-bold py-2 px-4 rounded-full z-[400] border border-brand-light">在地圖上點擊可精確定位</div>
           <div id="admin-map" class="w-full h-full"></div>
        </div>
     </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
    import { getFirestore, collection, onSnapshot, addDoc, doc, updateDoc, deleteDoc } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';
    import { getStorage, ref, uploadBytes, getDownloadURL } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js';

    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { apiKey: "AIzaSyCQF8A3ieML0JP3X8X78NCRuiUETRAiu5E", authDomain: "travel-96009.firebaseapp.com", projectId: "travel-96009", storageBucket: "travel-96009.firebasestorage.app", messagingSenderId: "578860064042", appId: "1:578860064042:web:b147880df3a01dd8f75253" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);
    const appId = typeof __app_id !== 'undefined' ? __app_id : "travel-platform-v2";
    const ADMIN_EMAIL = 'a0909921988@gmail.com';

    let adminSpots = [], adminMap = null, pickerMarker = null, isAdmin = false, selectedFile = null;

    const LOCATION_MODES = [{ id:'spot', label:'景點', icon:'fa-solid fa-camera' },{ id:'food', label:'美食', icon:'fa-solid fa-utensils' },{ id:'shop', label:'購物', icon:'fa-solid fa-bag-shopping' },{ id:'hotel', label:'住宿', icon:'fa-solid fa-hotel' },{ id:'park', label:'樂園', icon:'fa-solid fa-wand-magic-sparkles' },{ id:'car_rental', label:'租車站', icon:'fa-solid fa-key' },{ id:'station', label:'車站', icon:'fa-solid fa-train' },{ id:'airport', label:'機場', icon:'fa-solid fa-plane-arrival' },{ id:'other', label:'其他', icon:'fa-solid fa-location-dot' }];

    window.showToast = (msg) => { const el = document.getElementById('toast'); document.getElementById('toast-msg').innerText = msg; el.classList.remove('opacity-0'); el.classList.add('opacity-100'); setTimeout(() => el.classList.add('opacity-0'), 3000); };

    onAuthStateChanged(auth, user => {
        if (user && user.email === ADMIN_EMAIL) {
            isAdmin = true;
            document.getElementById('admin-user-name').innerText = user.displayName || user.email;
            document.getElementById('admin-login-overlay').classList.add('hidden');
            initSelect(); loadSpots();
        } else {
            isAdmin = false;
            document.getElementById('admin-login-overlay').classList.remove('hidden');
            if (user) signOut(auth);
        }
    });

    function initSelect() { const s = document.getElementById('form-mode'); s.innerHTML = ''; LOCATION_MODES.forEach(m => s.add(new Option(m.label, m.id))); }

    function loadSpots() {
        onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'spots'), s => {
            adminSpots = s.docs.map(d => ({id:d.id, ...d.data()}));
            renderTable();
        });
    }

    function renderTable(f = '') {
        const tbody = document.getElementById('table-body');
        const spots = f ? adminSpots.filter(s => s.name?.includes(f)) : adminSpots;
        tbody.innerHTML = spots.sort((a,b)=>b.createdAt-a.createdAt).map(s => `
          <tr class="hover:bg-brand-bg/30"><td class="px-6 py-4 font-bold text-xs text-brand-primary uppercase">${(LOCATION_MODES.find(m=>m.id===s.locMode)||{}).label}</td><td class="px-6 py-4 font-extrabold">${s.name}</td><td class="px-6 py-4 text-sm text-brand-textSub truncate max-w-[200px]">${s.address||'-'}</td><td class="px-6 py-4 text-xs font-mono">${s.lat?.toFixed(4)}, ${s.lng?.toFixed(4)}</td><td class="px-6 py-4 text-right"><button onclick="window.openSpotModal('${s.id}')" class="w-8 h-8 rounded-lg bg-brand-bg text-brand-primary mr-1"><i class="fa-solid fa-pen"></i></button><button onclick="window.deleteSpot('${s.id}')" class="w-8 h-8 rounded-lg bg-red-50 text-red-500"><i class="fa-solid fa-trash"></i></button></td></tr>
        `).join('');
    }

    document.getElementById('search-input').oninput = e => renderTable(e.target.value);

    // ========== 圖片處理與上傳 ==========
    window.handleImageSelect = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        selectedFile = file;
        const reader = new FileReader();
        reader.onload = (re) => {
            document.getElementById('preview-img').src = re.target.result;
            document.getElementById('preview-img').classList.remove('hidden');
            document.getElementById('preview-placeholder').classList.add('hidden');
        };
        reader.readAsDataURL(file);
    };

    // ========== 儲存邏輯 (完整欄位) ==========
    window.saveSpot = async () => {
        if (!isAdmin) return;
        const id = document.getElementById('form-id').value;
        const name = document.getElementById('form-name').value.trim();
        const lat = parseFloat(document.getElementById('form-lat').value);
        const lng = parseFloat(document.getElementById('form-lng').value);
        if (!name || isNaN(lat)) { window.showToast("名稱與座標為必填"); return; }

        const btn = document.getElementById('btn-save-spot');
        btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 處理中...';

        let imageUrl = document.getElementById('preview-img').src.startsWith('http') ? document.getElementById('preview-img').src : null;

        try {
            if (selectedFile) {
                const storageRef = ref(storage, `artifacts/${appId}/spots/${Date.now()}_${selectedFile.name}`);
                await uploadBytes(storageRef, selectedFile);
                imageUrl = await getDownloadURL(storageRef);
            }

            const data = {
                name, imageUrl, lat, lng,
                foreignName1: document.getElementById('form-foreign1').value.trim(),
                foreignName2: document.getElementById('form-foreign2').value.trim(),
                locMode: document.getElementById('form-mode').value,
                address: document.getElementById('form-address').value.trim(),
                description: document.getElementById('form-description').value.trim(),
                website: document.getElementById('form-website').value.trim(),
                phone: document.getElementById('form-phone').value.trim(),
            };

            if (id) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'spots', id), data);
            else { data.createdAt = Date.now(); await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'spots'), data); }
            
            window.closeSpotModal(); window.showToast("儲存成功");
        } catch (e) { console.error(e); window.showToast("失敗: " + e.message); }
        finally { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> 儲存景點'; }
    };

    // ========== 地圖與其他邏輯 ==========
    window.openSpotModal = (id = null) => {
        document.getElementById('form-id').value = id || '';
        document.getElementById('form-name').value = '';
        document.getElementById('form-foreign1').value = '';
        document.getElementById('form-foreign2').value = '';
        document.getElementById('form-address').value = '';
        document.getElementById('form-description').value = '';
        document.getElementById('form-website').value = '';
        document.getElementById('form-phone').value = '';
        document.getElementById('form-lat').value = '';
        document.getElementById('form-lng').value = '';
        document.getElementById('preview-img').src = '';
        document.getElementById('preview-img').classList.add('hidden');
        document.getElementById('preview-placeholder').classList.remove('hidden');
        selectedFile = null;

        if (id) {
            const s = adminSpots.find(sp => sp.id === id);
            if (s) {
                document.getElementById('form-name').value = s.name;
                document.getElementById('form-foreign1').value = s.foreignName1 || '';
                document.getElementById('form-foreign2').value = s.foreignName2 || '';
                document.getElementById('form-mode').value = s.locMode || 'spot';
                document.getElementById('form-address').value = s.address || '';
                document.getElementById('form-description').value = s.description || '';
                document.getElementById('form-website').value = s.website || '';
                document.getElementById('form-phone').value = s.phone || '';
                document.getElementById('form-lat').value = s.lat || '';
                document.getElementById('form-lng').value = s.lng || '';
                if (s.imageUrl) {
                    document.getElementById('preview-img').src = s.imageUrl;
                    document.getElementById('preview-img').classList.remove('hidden');
                    document.getElementById('preview-placeholder').classList.add('hidden');
                }
                setTimeout(() => updatePickerMarker(s.lat, s.lng), 200);
            }
        }

        const m = document.getElementById('spot-modal');
        m.classList.remove('hidden'); m.classList.add('flex');
        setTimeout(() => { m.classList.remove('translate-y-full', 'opacity-0'); m.classList.add('translate-y-0', 'opacity-100'); if(!adminMap) initAdminMap(); adminMap.invalidateSize(); }, 10);
    };

    window.closeSpotModal = () => { const m = document.getElementById('spot-modal'); m.classList.add('translate-y-full', 'opacity-0'); setTimeout(()=>m.classList.add('hidden'), 300); };

    function initAdminMap() {
        adminMap = L.map('admin-map', { zoomControl: false }).setView([23.5, 121], 7);
        L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', { attribution: '&copy; Google' }).addTo(adminMap);
        adminMap.on('click', e => updatePickerMarker(e.latlng.lat, e.latlng.lng));
    }

    function updatePickerMarker(lat, lng) {
        if (!lat) return;
        document.getElementById('form-lat').value = lat; document.getElementById('form-lng').value = lng;
        if (pickerMarker) pickerMarker.setLatLng([lat, lng]);
        else pickerMarker = L.marker([lat, lng], { icon: L.divIcon({ className:'custom-marker', html:'<div class="marker-pin"><i class="fa-solid fa-location-dot"></i></div>', iconSize:[32,32] }) }).addTo(adminMap);
        adminMap.panTo([lat, lng]);
    }

    window.handleManualCoordChange = () => updatePickerMarker(parseFloat(document.getElementById('form-lat').value), parseFloat(document.getElementById('form-lng').value));
    window.adminLogin = () => signInWithPopup(auth, new GoogleAuthProvider());
    window.adminLogout = () => signOut(auth).then(()=>window.location.reload());
    window.deleteSpot = async (id) => { if(confirm("確刪?")) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'spots', id)); };
  </script>
</body>
</html>
