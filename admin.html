<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>趣旅行 - 景點管理後台</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { brand: { primary: '#748CAB', dark: '#3E5C76', light: '#E6EBEF', bg: '#F2F5F8', card: '#FFFFFF', textMain: '#2C3E50', textSub: '#8796A5', accent: '#D5896F' } } } } }
  </script>
  <style>
    /* --- 多國語言字體整合 (TW -> W -> JP -> KR -> TH) --- */
    @font-face { font-family: 'AppFont'; src: url('./fonts/LINESeedTW_OTF_Th.woff2') format('woff2'), url('./fonts/LINESeedSans_W_Th.woff2') format('woff2'), url('./fonts/LINESeedJP_OTF_Th.woff2') format('woff2'), url('./fonts/LINESeedKR-Th.woff2') format('woff2'), url('./fonts/LINESeedSansTH_W_Th.woff2') format('woff2'); font-weight: 300; }
    @font-face { font-family: 'AppFont'; src: url('./fonts/LINESeedTW_OTF_Rg.woff2') format('woff2'), url('./fonts/LINESeedSans_W_Rg.woff2') format('woff2'), url('./fonts/LINESeedJP_OTF_Rg.woff2') format('woff2'), url('./fonts/LINESeedKR-Rg.woff2') format('woff2'), url('./fonts/LINESeedSansTH_W_Rg.woff2') format('woff2'); font-weight: 400; }
    @font-face { font-family: 'AppFont'; src: url('./fonts/LINESeedTW_OTF_Bd.woff2') format('woff2'), url('./fonts/LINESeedSans_W_Bd.woff2') format('woff2'), url('./fonts/LINESeedJP_OTF_Bd.woff2') format('woff2'), url('./fonts/LINESeedKR-Bd.woff2') format('woff2'), url('./fonts/LINESeedSansTH_W_Bd.woff2') format('woff2'); font-weight: 700; }
    @font-face { font-family: 'AppFont'; src: url('./fonts/LINESeedTW_OTF_Eb.woff2') format('woff2'), url('./fonts/LINESeedSans_W_XBd.woff2') format('woff2'), url('./fonts/LINESeedJP_OTF_Eb.woff2') format('woff2'), url('./fonts/LINESeedSansTH_W_XBd.woff2') format('woff2'); font-weight: 800; }

    body { font-family: 'AppFont', ui-sans-serif, system-ui, sans-serif; background-color: #F8FAFC; }
    .custom-marker { background: transparent; border: none; }
    .marker-pin { width: 32px; height: 32px; border-radius: 50%; background: #D5896F; border: 3px solid white; display: flex; align-items: center; justify-content: center; color: white; }
  </style>
</head>
<body class="text-brand-textMain antialiased overflow-hidden flex h-screen">
  <!-- 管理員登入與列表區邏輯維持，字體已全面更新 -->
  <div id="admin-login-overlay" class="fixed inset-0 z-[9999] bg-brand-bg flex items-center justify-center p-4">
    <div class="bg-white rounded-[32px] shadow-2xl border border-brand-light p-8 max-w-sm w-full text-center flex flex-col items-center">
       <div class="w-20 h-20 bg-brand-dark text-white rounded-[24px] flex items-center justify-center text-3xl mb-6 shadow-md shadow-brand-dark/20"><i class="fa-solid fa-user-shield"></i></div>
       <h2 class="text-2xl font-extrabold text-brand-dark mb-2">系統管理後台</h2>
       <button onclick="window.adminLogin()" class="w-full py-4 bg-white border border-brand-light text-brand-dark font-extrabold text-[15px] rounded-[16px] shadow-sm active:scale-95 transition-all flex items-center justify-center gap-3"><i class="fa-brands fa-google text-[#4285F4] text-xl"></i> Google 授權登入</button>
    </div>
  </div>
  <!-- 景點編輯滿版 Modal -->
  <div id="spot-modal" class="fixed inset-0 z-[5000] hidden bg-white flex-col transform transition-transform translate-y-full duration-300 opacity-0 overflow-hidden">
     <!-- Modal 內容 (包含經緯度手打連動) ... -->
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Firebase 邏輯... -->
</body>
</html>
