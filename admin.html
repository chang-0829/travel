<!DOCTYPE html>
<html lang="zh-TW">
<head>

  <!-- Leaflet CSS (地圖核心) -->

    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { primary: '#748CAB', dark: '#3E5C76', light: '#E6EBEF', bg: '#F2F5F8', card: '#FFFFFF', textMain: '#2C3E50', textSub: '#8796A5', accent: '#D5896F' }
          }
        }
      }
    }
  </script>

  <style>
    @font-face { font-family: 'LINE Seed TW'; src: url('./fonts/LINESeedTW_OTF_Rg.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: 'LINE Seed TW'; src: url('./fonts/LINESeedTW_OTF_Bd.woff2') format('woff2'); font-weight: 700; font-style: normal; font-display: swap; }
    body { font-family: 'LINE Seed TW', ui-sans-serif, system-ui, sans-serif; background-color: #F8FAFC; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* 覆寫 Leaflet 樣式 */
    .custom-marker { background: transparent; border: none; }
    .marker-pin { width: 32px; height: 32px; border-radius: 50%; background: #D5896F; border: 3px solid white; box-shadow: 0 4px 10px rgba(213, 137, 111, 0.4); display: flex; align-items: center; justify-content: center; color: white; font-size: 12px; }
  </style>
</head>
<body class="text-brand-textMain antialiased overflow-hidden flex h-screen">

  <!-- ================= 管理員專屬登入遮罩 ================= -->
  <div id="admin-login-overlay" class="fixed inset-0 z-[9999] bg-brand-bg flex items-center justify-center p-4">
    <div class="bg-white rounded-[32px] shadow-2xl border border-brand-light p-8 max-w-sm w-full text-center flex flex-col items-center">
       <div class="w-20 h-20 bg-brand-dark text-white rounded-[24px] flex items-center justify-center text-3xl mb-6 shadow-md shadow-brand-dark/20">
          <i class="fa-solid fa-user-shield"></i>
       </div>
       <h2 class="text-2xl font-extrabold text-brand-dark mb-2">系統管理後台</h2>
       <p class="text-[13px] font-bold text-brand-textSub mb-8">此區域僅限高階管理員信箱存取</p>
       
       <!-- 錯誤提示區 -->
       <p id="login-error-msg" class="hidden text-[13px] text-[#E63946] bg-[#FFE5E5] px-4 py-3 rounded-xl font-bold w-full mb-6 border border-[#E63946]/20"></p>
       
       <button onclick="window.adminLogin()" class="w-full py-4 bg-white border border-brand-light text-brand-dark font-extrabold text-[15px] rounded-[16px] shadow-sm hover:bg-brand-bg active:scale-95 transition-all flex items-center justify-center gap-3">
          <i class="fa-brands fa-google text-[#4285F4] text-xl"></i> Google 帳號授權登入
       </button>
       
       <a href="./discover.html" class="mt-8 text-xs font-bold text-brand-textSub hover:text-brand-primary transition-colors flex items-center gap-1.5">
          <i class="fa-solid fa-arrow-left"></i> 返回前台探索
       </a>
    </div>
  </div>

  <!-- 提示訊息 Toast -->
  <div id="toast" class="fixed top-6 left-1/2 transform -translate-x-1/2 bg-brand-dark text-white px-6 py-3 rounded-full shadow-2xl z-[9000] transition-all duration-300 opacity-0 pointer-events-none -translate-y-4 flex items-center gap-2 font-bold text-sm">
    <i class="fa-solid fa-circle-check text-brand-light"></i> <span id="toast-msg">處理成功</span>

  <!-- 左側邊欄 (Sidebar) -->
  <aside class="w-64 bg-white border-r border-brand-light shadow-sm flex flex-col shrink-0 hidden md:flex z-20">
    <div class="h-20 flex items-center px-6 border-b border-brand-light/50 shrink-0">
       <div class="w-10 h-10 rounded-xl bg-brand-dark text-white flex items-center justify-center text-xl mr-3 shadow-sm">
          <i class="fa-solid fa-plane"></i>
       </div>
       <div>
         <div class="text-lg font-extrabold text-brand-dark tracking-tight leading-tight">趣旅行</div>
         <div class="text-[10px] font-bold text-brand-textSub tracking-widest uppercase">Admin Panel</div>
       </div>
    </div>
    
    <div class="flex-1 py-6 px-4 space-y-2 overflow-y-auto">
      <div class="text-xs font-bold text-brand-textSub mb-4 px-2 tracking-widest uppercase">管理選單</div>
      <a href="#" class="flex items-center gap-4 px-4 py-3 rounded-xl bg-brand-primary/10 text-brand-primary font-bold transition-all">
        <i class="fa-solid fa-map-location-dot text-lg w-5 text-center"></i> <span>景點資料庫</span>

      <a href="#" class="flex items-center gap-4 px-4 py-3 rounded-xl text-brand-textSub hover:bg-brand-bg hover:text-brand-primary font-bold transition-all opacity-50 cursor-not-allowed">

    <div class="p-4 border-t border-brand-light/50">

  <!-- 主內容區 -->
  <main class="flex-1 flex flex-col relative overflow-hidden bg-[#F8FAFC]">

          <!-- 表格主體 -->

  </main>

  <!-- ================= 滿版景點編輯/新增 Modal (Full Screen) ================= -->
  <div id="spot-modal" class="fixed inset-0 z-[5000] hidden bg-white flex-col transform transition-transform translate-y-full duration-300 opacity-0 overflow-hidden">
     
     <!-- Modal Header -->
     <div class="px-6 h-[72px] border-b border-brand-light/80 flex justify-between items-center bg-white shrink-0 shadow-sm z-20 relative">
        <div class="flex items-center gap-4">
           <button onclick="window.closeSpotModal()" class="w-10 h-10 rounded-full bg-brand-bg flex items-center justify-center text-brand-textMain hover:bg-brand-light hover:text-brand-dark transition-colors"><i class="fa-solid fa-arrow-left"></i></button>
           <h3 id="modal-title" class="text-xl font-extrabold text-brand-dark">新增景點</h3>
        </div>
        <button onclick="window.saveSpot()" class="px-6 py-2.5 bg-brand-primary text-white font-bold rounded-xl shadow-md shadow-brand-primary/30 hover:bg-brand-dark active:scale-95 transition-all flex items-center gap-2">
           <i class="fa-solid fa-floppy-disk"></i> <span class="hidden sm:inline">儲存景點資料</span><span class="sm:hidden">儲存</span>
        </button>
     </div>
     
     <!-- Modal Body (左側表單與右側滿版地圖) -->
     <div class="flex-1 overflow-hidden flex flex-col md:flex-row bg-white relative">
        
        <!-- 左側：詳細表單 (固定寬度或佔 1/3) -->
        <div class="w-full md:w-[450px] lg:w-[500px] flex flex-col border-b md:border-b-0 md:border-r border-brand-light shrink-0 z-10 bg-white">
           <div class="flex-1 overflow-y-auto hide-scrollbar p-6 space-y-5">
               <input type="hidden" id="form-id">
               
               <!-- 從 Google 地圖網址解析 -->
               <div class="bg-brand-bg/50 p-4 rounded-2xl border border-brand-light shadow-sm">
                  <label class="block text-xs font-bold text-brand-textSub mb-1.5 pl-1"><i class="fa-brands fa-google text-[#4285F4] mr-1"></i>從 Google Maps 網址獲取座標</label>
                  <div class="flex gap-2">
                     <input type="url" id="form-gmap-url" placeholder="貼上包含經緯度的完整網址..." class="flex-1 w-full bg-white border border-brand-light/80 rounded-xl px-4 py-2.5 text-sm font-bold text-brand-dark outline-none focus:border-[#4285F4]/50 transition-all">
                     <button type="button" onclick="window.parseGoogleMapsUrl()" class="px-4 py-2.5 bg-[#4285F4] text-white font-bold rounded-xl shadow-md shadow-[#4285F4]/30 hover:bg-blue-600 active:scale-95 transition-all shrink-0">
                        解析
                     </button>
                  </div>
                  <p class="text-[10px] text-brand-textSub mt-1.5 px-1">若為短網址 (maps.app.goo.gl) 請先於瀏覽器開啟，待跳轉後複製完整的網址即可解析。</p>
               </div>

               <div>
                  <label class="block text-xs font-bold text-brand-textSub mb-1.5 pl-1">景點中文名稱 <span class="text-[#E63946]">*</span></label>
                  <input type="text" id="form-name" placeholder="輸入景點/地標中文名稱" class="w-full bg-[#F8FAFC] border border-brand-light/80 rounded-xl px-4 py-3 text-sm font-bold text-brand-dark outline-none focus:border-brand-primary/50 focus:bg-white transition-all">
               </div>

               <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                     <label class="block text-xs font-bold text-brand-textSub mb-1.5 pl-1">外文名稱 1 (選填)</label>
                     <input type="text" id="form-foreign1" placeholder="如日文/英文" class="w-full bg-[#F8FAFC] border border-brand-light/80 rounded-xl px-4 py-3 text-sm font-bold text-brand-dark outline-none focus:border-brand-primary/50 focus:bg-white transition-all">
                  </div>
                  <div>
                     <label class="block text-xs font-bold text-brand-textSub mb-1.5 pl-1">外文名稱 2 (選填)</label>
                     <input type="text" id="form-foreign2" placeholder="其他外文名稱" class="w-full bg-[#F8FAFC] border border-brand-light/80 rounded-xl px-4 py-3 text-sm font-bold text-brand-dark outline-none focus:border-brand-primary/50 focus:bg-white transition-all">
                  </div>
               </div>

               <div>
                  <label class="block text-xs font-bold text-brand-textSub mb-1.5 pl-1">分類 <span class="text-[#E63946]">*</span></label>
                  <select id="form-mode" class="w-full bg-[#F8FAFC] border border-brand-light/80 rounded-xl px-4 py-3 text-sm font-bold text-brand-dark outline-none focus:border-brand-primary/50 focus:bg-white transition-all appearance-none cursor-pointer">
                     <!-- JS 動態填入 -->
                  </select>
               </div>

               <!-- 地址與自動定位功能 -->
               <div>
                  <label class="block text-xs font-bold text-brand-textSub mb-1.5 pl-1">地址 <span class="text-[#E63946]">*</span></label>
                  <div class="flex gap-2">
                     <input type="text" id="form-address" placeholder="輸入完整地址" class="flex-1 w-full bg-[#F8FAFC] border border-brand-light/80 rounded-xl px-4 py-3 text-sm font-bold text-brand-dark outline-none focus:border-brand-primary/50 focus:bg-white transition-all">
                     <button type="button" onclick="window.geocodeAddress()" class="px-4 py-3 bg-brand-bg text-brand-primary border border-brand-light font-bold rounded-xl hover:bg-brand-primary hover:text-white transition-all shadow-sm flex items-center justify-center shrink-0" title="自動將地址轉換為地圖座標">
                        <i class="fa-solid fa-search-location mr-1.5"></i> <span class="text-sm">地址定位</span>
                     </button>
                  </div>
               </div>

               <div>
                  <label class="block text-xs font-bold text-brand-textSub mb-1.5 pl-1">景點介紹 (選填)</label>
                  <textarea id="form-description" placeholder="輸入景點的詳細介紹或特色..." rows="4" class="w-full bg-[#F8FAFC] border border-brand-light/80 rounded-xl px-4 py-3 text-sm font-bold text-brand-dark outline-none focus:border-brand-primary/50 focus:bg-white transition-all resize-none"></textarea>
               </div>

               <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                     <label class="block text-xs font-bold text-brand-textSub mb-1.5 pl-1">網址 (選填)</label>
                     <input type="url" id="form-website" placeholder="https://" class="w-full bg-[#F8FAFC] border border-brand-light/80 rounded-xl px-4 py-3 text-sm font-bold text-brand-dark outline-none focus:border-brand-primary/50 focus:bg-white transition-all">
                  </div>
                  <div>
                     <label class="block text-xs font-bold text-brand-textSub mb-1.5 pl-1">電話 (選填)</label>
                     <input type="tel" id="form-phone" placeholder="輸入聯絡電話" class="w-full bg-[#F8FAFC] border border-brand-light/80 rounded-xl px-4 py-3 text-sm font-bold text-brand-dark outline-none focus:border-brand-primary/50 focus:bg-white transition-all">
                  </div>
               </div>
           </div>
           
           <!-- 左側底部：座標開放手動輸入 -->
           <div class="p-6 bg-brand-bg/50 border-t border-brand-light shrink-0 z-10">
               <div class="grid grid-cols-2 gap-3">
                  <div>
                     <label class="block text-[10px] font-bold text-brand-textSub mb-1 pl-1 uppercase tracking-wider">Latitude</label>
                     <input type="number" id="form-lat" step="any" placeholder="例: 25.0339" onchange="window.handleManualCoordChange()" class="w-full bg-white border border-brand-light/50 shadow-sm rounded-lg px-3 py-2 text-xs font-mono text-brand-dark outline-none focus:border-brand-primary/50 transition-all">
                  </div>
                  <div>
                     <label class="block text-[10px] font-bold text-brand-textSub mb-1 pl-1 uppercase tracking-wider">Longitude</label>
                     <input type="number" id="form-lng" step="any" placeholder="例: 121.5644" onchange="window.handleManualCoordChange()" class="w-full bg-white border border-brand-light/50 shadow-sm rounded-lg px-3 py-2 text-xs font-mono text-brand-dark outline-none focus:border-brand-primary/50 transition-all">
                  </div>
               </div>
           </div>
        </div>

        <!-- 右側：滿版地圖選點器 -->
        <div class="flex-1 h-[400px] md:h-full bg-brand-light relative flex flex-col shrink-0 z-0">
           <div class="absolute top-4 left-1/2 transform -translate-x-1/2 bg-white/95 backdrop-blur shadow-lg text-brand-dark text-xs font-bold py-2 px-4 rounded-full flex items-center gap-2 z-[400]">
              <i class="fa-solid fa-wand-magic-sparkles text-brand-primary"></i> 點擊地圖、解析 Google 網址、地址搜尋或手動輸入
           </div>
           <div id="admin-map" class="flex-1 w-full h-full relative z-0"></div>
        </div>
     </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  
  <!-- Firebase / 邏輯 -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
    import { getAuth, signInWithCustomToken, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
    import { getFirestore, collection, onSnapshot, addDoc, doc, updateDoc, deleteDoc } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

    // Firebase Init
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { 
      apiKey: "AIzaSyCQF8A3ieML0JP3X8X78NCRuiUETRAiu5E", 
      authDomain: "travel-96009.firebaseapp.com", 
      projectId: "travel-96009", 
      storageBucket: "travel-96009.firebasestorage.app", 
      messagingSenderId: "578860064042", 
      appId: "1:578860064042:web:b147880df3a01dd8f75253" 
    };
    const app = initializeApp(firebaseConfig); 
    const auth = getAuth(app);
    const db = getFirestore(app); 
    const appId = typeof __app_id !== 'undefined' ? __app_id : "travel-platform-v2";

    // 🔒 授權信箱
    const ADMIN_EMAIL = 'a0909921988@gmail.com';

    const LOCATION_MODES = [
      { id: 'spot', label: '景點', icon: 'fa-solid fa-camera' },
      { id: 'food', label: '美食', icon: 'fa-solid fa-utensils' },
      { id: 'shop', label: '購物', icon: 'fa-solid fa-bag-shopping' },
      { id: 'hotel', label: '住宿', icon: 'fa-solid fa-hotel' },
      { id: 'park', label: '樂園', icon: 'fa-solid fa-wand-magic-sparkles' },
      { id: 'car_rental', label: '租車站', icon: 'fa-solid fa-key' },
      { id: 'station', label: '車站', icon: 'fa-solid fa-train' },
      { id: 'airport', label: '機場', icon: 'fa-solid fa-plane-arrival' },
      { id: 'other', label: '其他', icon: 'fa-solid fa-location-dot' }
    ];

    // State
    let adminSpots = [];
    let adminMap = null;
    let pickerMarker = null;
    let isAdmin = false;

    // Toast Function
    window.showToast = function(msg) {
      const el = document.getElementById('toast');
      document.getElementById('toast-msg').innerText = msg;
      el.classList.remove('opacity-0', '-translate-y-4', 'pointer-events-none');
      el.classList.add('opacity-100', 'translate-y-0');
      setTimeout(() => {
        el.classList.remove('opacity-100', 'translate-y-0');
        el.classList.add('opacity-0', '-translate-y-4', 'pointer-events-none');
      }, 3000);
    }

    // 初始化下拉選單
    function initSelect() {
        const select = document.getElementById('form-mode');
        select.innerHTML = '';
        LOCATION_MODES.forEach(mode => {
            select.add(new Option(`${mode.label}`, mode.id));
        });
    }

    // 登入驗證機制
    onAuthStateChanged(auth, user => {
        const nameEl = document.getElementById('admin-user-name');
        const loginOverlay = document.getElementById('admin-login-overlay');
        const errorMsg = document.getElementById('login-error-msg');

        if (user && user.email === ADMIN_EMAIL) {
            isAdmin = true;
            nameEl.innerText = user.displayName || "超級管理員";
            loginOverlay.classList.add('hidden');
            initSelect();
            loadSpots();
        } else {
            isAdmin = false;
            nameEl.innerText = "未授權";
            loginOverlay.classList.remove('hidden');
            document.getElementById('table-body').innerHTML = `<tr><td colspan="5" class="px-6 py-12 text-center text-[#E63946] font-bold">拒絕存取：無權限讀取</td></tr>`;
            
            if (user && !user.isAnonymous && user.email !== ADMIN_EMAIL) {
               errorMsg.innerText = `目前帳號 (${user.email}) 無權限進入後台。`;
               errorMsg.classList.remove('hidden');
               signOut(auth);
            } else {
               errorMsg.classList.add('hidden');
            }
        }
    });

    window.adminLogin = function() {
        const provider = new GoogleAuthProvider();
        signInWithPopup(auth, provider).catch(err => {
            window.showToast("登入失敗：" + err.message);
        });
    };

    window.adminLogout = function() {
        signOut(auth).then(() => {
            window.location.href = './discover.html';
        });
    };

    // 載入資料
    function loadSpots() {
      if (!isAdmin) return;
      const qSpots = collection(db, 'artifacts', appId, 'public', 'data', 'spots');
      onSnapshot(qSpots, (snapshot) => {
        adminSpots = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderTable();
      }, err => {
        console.error(err);
        window.showToast("載入資料失敗，請確認權限");
      });
    }

    // 渲染表格
    function renderTable(filter = '') {
      const tbody = document.getElementById('table-body');
      let spots = adminSpots;
      
      if (filter) {
          const kw = filter.toLowerCase();
          spots = spots.filter(s => (s.name || '').toLowerCase().includes(kw));
      }

      if (spots.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-12 text-center text-brand-textSub font-bold"><i class="fa-solid fa-box-open text-2xl mb-2"></i><br>目前沒有資料</td></tr>`;
          return;
      }

      const sorted = [...spots].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

      tbody.innerHTML = sorted.map(spot => {
          const locObj = LOCATION_MODES.find(m => m.id === spot.locMode) || LOCATION_MODES[0];
          const hasCoords = spot.lat && spot.lng;
          const coordsStr = hasCoords ? `${parseFloat(spot.lat).toFixed(4)}, ${parseFloat(spot.lng).toFixed(4)}` : '<span class="text-brand-accent italic">未設定</span>';
          const displayAddress = spot.address || spot.subtitle || '-';

          return `
          <tr class="hover:bg-brand-bg/50 transition-colors group">
             <td class="px-6 py-4 whitespace-nowrap">
                <div class="flex items-center gap-2">
                   <div class="w-8 h-8 rounded-full bg-brand-primary/10 text-brand-primary flex items-center justify-center"><i class="${locObj.icon} text-sm"></i></div>
                   <span class="text-sm font-bold text-brand-dark">${locObj.label}</span>
                </div>
             </td>
             <td class="px-6 py-4">
                <div class="text-[15px] font-extrabold text-brand-dark">${spot.name}</div>
             </td>
             <td class="px-6 py-4">
                <div class="text-sm font-medium text-brand-textSub max-w-[200px] truncate">${displayAddress}</div>
             </td>
             <td class="px-6 py-4 hidden md:table-cell">
                <div class="text-xs font-mono text-brand-textSub bg-brand-light/30 inline-block px-2 py-1 rounded">${coordsStr}</div>
             </td>
             <td class="px-6 py-4 text-right whitespace-nowrap">
                <button onclick="window.openSpotModal('${spot.id}')" class="w-8 h-8 rounded-lg bg-brand-bg text-brand-primary hover:bg-brand-primary hover:text-white transition-all shadow-sm mr-1">
                   <i class="fa-solid fa-pen text-xs"></i>
                </button>
                <button onclick="window.deleteSpot('${spot.id}')" class="w-8 h-8 rounded-lg bg-[#FFE5E5] text-[#E63946] hover:bg-[#E63946] hover:text-white transition-all shadow-sm">
                   <i class="fa-solid fa-trash-can text-xs"></i>
                </button>
             </td>
          </tr>
          `;
      }).join('');
    }

    document.getElementById('search-input').addEventListener('input', (e) => renderTable(e.target.value));

    // ========== 地圖與 Modal 邏輯 ==========
    function initAdminMap() {
        if(adminMap) return;
        const streetLayer = L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
            attribution: '&copy; Google', maxZoom: 20
        });

        adminMap = L.map('admin-map', { 
            zoomControl: false, layers: [streetLayer]
        }).setView([23.5, 121], 7); 
        L.control.zoom({ position: 'topright' }).addTo(adminMap);

        adminMap.on('click', function(e) {
            updatePickerMarker(e.latlng.lat, e.latlng.lng);
        });
    }

    function updatePickerMarker(lat, lng) {
        document.getElementById('form-lat').value = lat;
        document.getElementById('form-lng').value = lng;
        
        if (pickerMarker) {
            pickerMarker.setLatLng([lat, lng]);
        } else {
            const customIcon = L.divIcon({
                className: 'custom-marker',
                html: `<div class="marker-pin"><i class="fa-solid fa-location-dot"></i></div>`,
                iconSize: [32, 32], iconAnchor: [16, 16]
            });
            pickerMarker = L.marker([lat, lng], { icon: customIcon }).addTo(adminMap);
        }
        adminMap.panTo([lat, lng]);
    }

    // ★ 新增功能：手動輸入經緯度連動地圖 ★
    window.handleManualCoordChange = function() {
        const lat = parseFloat(document.getElementById('form-lat').value);
        const lng = parseFloat(document.getElementById('form-lng').value);
        
        if (!isNaN(lat) && !isNaN(lng)) {
            if (pickerMarker) {
                pickerMarker.setLatLng([lat, lng]);
            } else {
                const customIcon = L.divIcon({
                    className: 'custom-marker',
                    html: `<div class="marker-pin"><i class="fa-solid fa-location-dot"></i></div>`,
                    iconSize: [32, 32], iconAnchor: [16, 16]
                });
                pickerMarker = L.marker([lat, lng], { icon: customIcon }).addTo(adminMap);
            }
            if(adminMap) {
                adminMap.panTo([lat, lng]);
                adminMap.setZoom(16);
            }
        }
    };

    // ★ 新增功能：從 Google Maps 網址解析座標 ★
    window.parseGoogleMapsUrl = function() {
        const url = document.getElementById('form-gmap-url').value.trim();
        if (!url) {
            window.showToast("請貼上 Google 地圖網址");
            return;
        }

        let lat, lng;

        // 嘗試解析 @lat,lng (例如：@25.0339639,121.5644722)
        const regexAt = /@(-?\d+\.\d+),(-?\d+\.\d+)/;
        const matchAt = url.match(regexAt);

        if (matchAt) {
            lat = parseFloat(matchAt[1]);
            lng = parseFloat(matchAt[2]);
        } else {
            // 嘗試解析 !3d... !4d... 格式
            const regexBang = /!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/;
            const matchBang = url.match(regexBang);
            if (matchBang) {
                lat = parseFloat(matchBang[1]);
                lng = parseFloat(matchBang[2]);
            }
        }

        if (lat && lng) {
            updatePickerMarker(lat, lng);
            if(adminMap) adminMap.setZoom(16);
            window.showToast("已成功從網址解析出座標！");
        } else {
            window.showToast("無法解析！請確保貼上的是「完整網址」(包含 @緯度,經度)，若為短網址請先用瀏覽器打開。");
        }
    };

    // 自動定位 (Nominatim API)
    window.geocodeAddress = async function() {
        const address = document.getElementById('form-address').value.trim();
        const name = document.getElementById('form-name').value.trim();
        const query = address || name;

        if (!query) {
            window.showToast("請先輸入地址或景點名稱");
            return;
        }

        const btnIcon = document.querySelector('button[onclick="window.geocodeAddress()"] i');
        if(btnIcon) btnIcon.className = 'fa-solid fa-spinner fa-spin mr-1.5';
        window.showToast("搜尋座標中...");

        try {
            const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`);
            const data = await response.json();

            if (data && data.length > 0) {
                const lat = parseFloat(data[0].lat);
                const lng = parseFloat(data[0].lon);

                updatePickerMarker(lat, lng);
                adminMap.setZoom(16);
                window.showToast("自動定位成功！");
            } else {
                window.showToast("找不到精確座標，請嘗試補充城市名稱或手動點擊地圖。");
            }
        } catch (e) {
            console.error(e);
            window.showToast("自動定位失敗");
        } finally {
            if(btnIcon) btnIcon.className = 'fa-solid fa-search-location mr-1.5';
        }
    };

    window.openSpotModal = function(id = null) {
        // 重置表單
        document.getElementById('form-id').value = id || '';
        document.getElementById('form-gmap-url').value = '';
        document.getElementById('form-name').value = '';
        document.getElementById('form-foreign1').value = '';
        document.getElementById('form-foreign2').value = '';
        document.getElementById('form-mode').value = 'spot';
        document.getElementById('form-address').value = '';
        document.getElementById('form-description').value = '';
        document.getElementById('form-website').value = '';
        document.getElementById('form-phone').value = '';
        document.getElementById('form-lat').value = '';
        document.getElementById('form-lng').value = '';
        
        if(pickerMarker && adminMap) {
            adminMap.removeLayer(pickerMarker);
            pickerMarker = null;
        }

        document.getElementById('modal-title').innerText = id ? '編輯景點' : '新增景點';

        if (id) {
            const spot = adminSpots.find(s => s.id === id);
            if (spot) {
                document.getElementById('form-name').value = spot.name || '';
                document.getElementById('form-foreign1').value = spot.foreignName1 || '';
                document.getElementById('form-foreign2').value = spot.foreignName2 || '';
                document.getElementById('form-mode').value = spot.locMode || 'spot';
                document.getElementById('form-address').value = spot.address || spot.subtitle || '';
                document.getElementById('form-description').value = spot.description || '';
                document.getElementById('form-website').value = spot.website || '';
                document.getElementById('form-phone').value = spot.phone || '';

                if(spot.lat && spot.lng) {
                    setTimeout(() => {
                        updatePickerMarker(spot.lat, spot.lng);
                        if(adminMap) adminMap.setZoom(15);
                    }, 200);
                }
            }
        } else {
             setTimeout(() => { if(adminMap) adminMap.setView([23.5, 121], 7); }, 200);
        }

        // 滿版進場動畫 (由下往上滑出)
        const modal = document.getElementById('spot-modal');
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        
        setTimeout(() => {
            modal.classList.remove('translate-y-full', 'opacity-0');
            modal.classList.add('translate-y-0', 'opacity-100');
            
            if(!adminMap) initAdminMap();
            adminMap.invalidateSize();
        }, 10);
    };

    window.closeSpotModal = function() {
        // 退場動畫 (往下縮回)
        const modal = document.getElementById('spot-modal');
        modal.classList.remove('translate-y-0', 'opacity-100');
        modal.classList.add('translate-y-full', 'opacity-0');
        
        setTimeout(() => {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }, 300);
    };

    // ========== CRUD 操作 ==========
    window.saveSpot = async function() {
        if (!isAdmin) return; // 二次防呆
        
        const id = document.getElementById('form-id').value;
        const name = document.getElementById('form-name').value.trim();
        const foreignName1 = document.getElementById('form-foreign1').value.trim();
        const foreignName2 = document.getElementById('form-foreign2').value.trim();
        const mode = document.getElementById('form-mode').value;
        const address = document.getElementById('form-address').value.trim();
        const description = document.getElementById('form-description').value.trim();
        const website = document.getElementById('form-website').value.trim();
        const phone = document.getElementById('form-phone').value.trim();

        const lat = parseFloat(document.getElementById('form-lat').value);
        const lng = parseFloat(document.getElementById('form-lng').value);

        if(!name) { window.showToast("景點中文名稱為必填"); return; }
        if(!address) { window.showToast("地址為必填"); return; }
        if(isNaN(lat) || isNaN(lng)) { window.showToast("請輸入或取得精確地圖座標"); return; }

        const spotData = {
            name: name,
            foreignName1: foreignName1,
            foreignName2: foreignName2,
            locMode: mode,
            address: address,
            description: description,
            website: website,
            phone: phone,
            lat: lat,
            lng: lng
        };

        try {
            if (id) {
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'spots', id), spotData);
            } else {
                spotData.createdAt = Date.now();
                spotData.creatorId = auth.currentUser ? auth.currentUser.uid : 'admin';
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'spots'), spotData);
            }
            window.closeSpotModal();
            window.showToast("雲端儲存成功");
        } catch(e) {
            console.error(e);
            window.showToast("寫入失敗，請確認 Firebase 權限規則");
        }
    };

    window.deleteSpot = async function(id) {
        if (!isAdmin) return; // 二次防呆
        if(!confirm("確定要刪除此景點嗎？刪除後前台也將無法搜尋到。")) return;

        try {
            await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'spots', id));
            window.showToast("雲端刪除成功");
        } catch(e) {
            console.error(e);
            window.showToast("刪除失敗，請確認 Firebase 權限規則");
        }
    };

    // Start App
    async function startApp() {
        try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            }
        } catch (e) {
            console.log('Auth Init Fallback', e);
        }
    }

    startApp();
  </script>
</body>
</html>
