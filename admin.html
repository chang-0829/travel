<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- 確保手機版正確顯示比例 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>景點管理後台</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body { background-color: #F8FAFC; color: #334155; font-family: sans-serif; }
        /* 隱藏捲軸但允許捲動 */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 簡化輸入框樣式 */
        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            border: 1px solid #E2E8F0;
            background-color: #FFFFFF;
            transition: all 0.2s;
        }
        .form-input:focus {
            outline: none;
            border-color: #3B82F6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        
        /* 地圖高度響應式 */
        #map-picker { height: 300px; width: 100%; border-radius: 0.75rem; z-index: 1; }
        @media (min-width: 768px) { #map-picker { height: 400px; } }
    </style>
</head>
<body class="pb-20 md:pb-10">

<!-- 頂部導覽列 -->
<nav class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
        <div class="font-bold text-xl text-[#0F172A] flex items-center gap-2">
            <i class="fa-solid fa-database text-blue-500"></i> 景點資料庫管理
        </div>
        <button id="btn-logout" class="text-sm font-medium text-red-500 hover:bg-red-50 px-3 py-1.5 rounded-lg transition-colors hidden">
            登出
        </button>
    </div>
</nav>

<div class="max-w-5xl mx-auto p-4 md:p-6 mt-2">
    
    <!-- 未登入提示 -->
    <div id="login-warning" class="bg-yellow-50 border border-yellow-200 text-yellow-800 p-4 rounded-xl mb-6 flex items-start gap-3">
        <i class="fa-solid fa-triangle-exclamation mt-0.5 text-yellow-600"></i>
        <div>
            <h3 class="font-bold">尚未登入或權限不足</h3>
            <p class="text-sm mt-1">您目前以訪客身分瀏覽，無法新增資料。請先登入具備管理員權限的帳號。</p>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- 左側：新增表單 -->
        <div class="lg:col-span-1">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 md:p-6">
                <h2 class="text-lg font-bold mb-5 flex items-center gap-2 border-b pb-3">
                    <i class="fa-solid fa-plus-circle text-blue-500"></i> 新增/編輯景點
                </h2>
                
                <form id="spot-form" class="space-y-4">
                    <!-- 隱藏的 ID 欄位 (用於編輯) -->
                    <input type="hidden" id="spot-id">

                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">景點名稱 <span class="text-red-500">*</span></label>
                        <input type="text" id="spot-name" required class="form-input" placeholder="例如：清水寺">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">外文名稱 1</label>
                            <input type="text" id="spot-fn1" class="form-input text-sm" placeholder="日文/英文">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">外文名稱 2</label>
                            <input type="text" id="spot-fn2" class="form-input text-sm" placeholder="羅馬拼音">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">分類 <span class="text-red-500">*</span></label>
                        <!-- 💡 分類選項將由 JavaScript 動態生成 -->
                        <select id="spot-cat" required class="form-input bg-white cursor-pointer">
                            <option value="">載入分類中...</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">圖片網址 (URL)</label>
                        <input type="url" id="spot-img" class="form-input" placeholder="https://...">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">聯絡電話</label>
                        <input type="tel" id="spot-phone" class="form-input" placeholder="02-1234-5678">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">官方網站</label>
                        <input type="url" id="spot-web" class="form-input" placeholder="https://...">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">詳細介紹/備註</label>
                        <textarea id="spot-desc" rows="3" class="form-input" placeholder="營業時間、門票資訊..."></textarea>
                    </div>

                    <div class="border-t pt-4 mt-2">
                        <label class="block text-sm font-semibold text-slate-700 mb-2">座標定位 <span class="text-red-500">*</span></label>
                        <p class="text-xs text-slate-500 mb-2 mb-3"><i class="fa-solid fa-hand-pointer"></i> 請在下方地圖點擊欲標記的位置</p>
                        
                        <!-- 手機版先顯示一個按鈕，點擊後才展開地圖，避免佔用太多畫面 -->
                        <div class="md:hidden mb-3">
                             <button type="button" id="btn-toggle-map" class="w-full py-2 bg-slate-100 text-slate-700 rounded-lg text-sm font-bold border border-slate-200">
                                 展開地圖選點
                             </button>
                        </div>

                        <div id="map-container" class="hidden md:block relative mb-3">
                            <div id="map-picker"></div>
                            <!-- 覆蓋在地圖上的座標顯示 -->
                            <div class="absolute bottom-2 left-2 bg-white/90 backdrop-blur-sm px-3 py-1.5 rounded-md shadow-md text-xs font-mono z-[1000] border border-slate-200">
                                Lat: <span id="display-lat">未選擇</span><br>
                                Lng: <span id="display-lng">未選擇</span>
                            </div>
                        </div>

                        <input type="hidden" id="spot-lat" required>
                        <input type="hidden" id="spot-lng" required>
                        
                        <div class="mt-2">
                            <label class="block text-sm font-semibold text-slate-700 mb-1">顯示地址</label>
                            <input type="text" id="spot-address" class="form-input" placeholder="如果不填，將嘗試從座標自動取得">
                        </div>
                    </div>

                    <div class="flex gap-2 pt-4">
                        <button type="button" onclick="clearForm()" class="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl transition-colors">清除</button>
                        <button type="submit" id="btn-submit" class="flex-[2] py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition-colors shadow-lg shadow-blue-500/30 flex items-center justify-center gap-2">
                            <i class="fa-solid fa-cloud-arrow-up"></i> 儲存景點
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- 右側：資料列表 -->
        <div class="lg:col-span-2 mt-6 lg:mt-0">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-[600px]">
                <div class="p-4 md:p-5 border-b bg-slate-50 flex flex-col md:flex-row justify-between md:items-center gap-3">
                    <h2 class="text-lg font-bold flex items-center gap-2">
                        <i class="fa-solid fa-list text-slate-500"></i> 已建立的景點 (<span id="total-count">0</span>)
                    </h2>
                    <div class="relative">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="text" id="search-list" placeholder="搜尋名稱或分類..." class="pl-9 pr-4 py-2 bg-white border border-slate-200 rounded-lg text-sm w-full md:w-64 focus:outline-none focus:border-blue-500">
                    </div>
                </div>

                <div class="flex-1 overflow-y-auto p-2 md:p-4 bg-slate-50/50">
                    <div id="data-list" class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <!-- 列表由 JS 產生 -->
                        <div class="col-span-full py-10 text-center text-slate-400">
                            <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i>
                            <p>載入資料中...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 吐司提示 -->
<div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-xl z-[9999] transition-all duration-300 opacity-0 translate-y-4 pointer-events-none flex items-center gap-2">
    <i id="toast-icon" class="fa-solid fa-circle-check text-green-400"></i>
    <span id="toast-msg">操作成功</span>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module">
    import { initializeApp, getApps, getApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
    import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
    import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';
    
    // 💡 匯入共用的分類設定
    import { LOCATION_MODES } from './js/config.js';

    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { apiKey: "AIzaSyCQF8A3ieML0JP3X8X78NCRuiUETRAiu5E", authDomain: "travel-96009.firebaseapp.com", projectId: "travel-96009", storageBucket: "travel-96009.firebasestorage.app", messagingSenderId: "578860064042", appId: "1:578860064042:web:b147880df3a01dd8f75253" };
    const app = !getApps().length ? initializeApp(firebaseConfig) : getApp(); 
    const auth = getAuth(app); const db = getFirestore(app); const appId = typeof __app_id !== 'undefined' ? __app_id : "travel-platform-v2";

    let currentUser = null;
    let allSpots = [];
    let mapPicker = null;
    let pickerMarker = null;

    // --- UI 輔助函數 ---
    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        const icon = document.getElementById('toast-icon');
        document.getElementById('toast-msg').innerText = msg;
        
        icon.className = isError ? 'fa-solid fa-circle-xmark text-red-400' : 'fa-solid fa-circle-check text-green-400';
        toast.classList.remove('opacity-0', 'translate-y-4');
        
        setTimeout(() => { toast.classList.add('opacity-0', 'translate-y-4'); }, 3000);
    }

    // 💡 動態產生分類下拉選單
    function renderCategoryOptions() {
        const selectEl = document.getElementById('spot-cat');
        if (!selectEl) return;
        
        let html = '<option value="" disabled selected>請選擇分類...</option>';
        LOCATION_MODES.forEach(mode => {
            // 在 option 裡加上 emoji 或文字標示，幫助辨識
            html += `<option value="${mode.id}">${mode.label}</option>`;
        });
        selectEl.innerHTML = html;
    }

    // --- 權限檢查 ---
    onAuthStateChanged(auth, (user) => {
        currentUser = user;
        const warning = document.getElementById('login-warning');
        const btnLogout = document.getElementById('btn-logout');
        
        // 簡單判斷：必須登入且不能是訪客
        const isGuest = localStorage.getItem('isGuest') === 'true';
        
        if (user && !isGuest) {
            warning.classList.add('hidden');
            btnLogout.classList.remove('hidden');
            initAdmin();
        } else {
            warning.classList.remove('hidden');
            btnLogout.classList.add('hidden');
            // 鎖定表單
            document.querySelectorAll('input, select, textarea, button[type="submit"]').forEach(el => el.disabled = true);
        }
    });

    document.getElementById('btn-logout').addEventListener('click', () => {
        signOut(auth).then(() => { window.location.href = 'index.html'; });
    });

    // --- 初始化管理員功能 ---
    function initAdmin() {
        renderCategoryOptions();
        initMapPicker();
        loadAllSpots();
        
        // 綁定表單提交
        document.getElementById('spot-form').addEventListener('submit', handleSaveSpot);
        
        // 綁定搜尋
        document.getElementById('search-list').addEventListener('input', (e) => renderList(e.target.value));

        // 手機版地圖展開按鈕
        const btnToggleMap = document.getElementById('btn-toggle-map');
        if(btnToggleMap) {
            btnToggleMap.addEventListener('click', () => {
                const container = document.getElementById('map-container');
                container.classList.remove('hidden');
                btnToggleMap.classList.add('hidden');
                if(mapPicker) setTimeout(() => mapPicker.invalidateSize(), 100);
            });
        }
    }

    // --- 地圖選點功能 ---
    function initMapPicker() {
        if (mapPicker) return;
        
        const mapEl = document.getElementById('map-picker');
        if (!mapEl) return;

        const streetLayer = L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', { maxZoom: 20 });
        mapPicker = L.map('map-picker', { layers: [streetLayer] }).setView([23.5, 121], 7); // 預設看台灣
        
        // 點擊地圖設定標記
        mapPicker.on('click', function(e) {
            setMapMarker(e.latlng.lat, e.latlng.lng);
            // 嘗試反查地址 (簡單使用 OpenStreetMap Nominatim，請注意使用限制)
            reverseGeocode(e.latlng.lat, e.latlng.lng);
        });

        // 定位到目前位置
        mapPicker.locate({setView: false, maxZoom: 16});
        mapPicker.on('locationfound', function(e) {
            // 如果表單還沒有座標，才自動飛過去
            if(!document.getElementById('spot-lat').value) {
                mapPicker.setView(e.latlng, 14);
            }
        });
    }

    function setMapMarker(lat, lng) {
        if (!mapPicker) return;
        
        if (pickerMarker) {
            pickerMarker.setLatLng([lat, lng]);
        } else {
            const icon = L.divIcon({
                className: 'custom',
                html: `<div class="w-6 h-6 bg-red-500 rounded-full border-2 border-white shadow-lg flex items-center justify-center text-white"><i class="fa-solid fa-thumbtack text-xs"></i></div>`,
                iconSize: [24, 24], iconAnchor: [12, 24]
            });
            pickerMarker = L.marker([lat, lng], {icon: icon}).addTo(mapPicker);
        }
        
        // 更新隱藏欄位與顯示
        document.getElementById('spot-lat').value = lat;
        document.getElementById('spot-lng').value = lng;
        document.getElementById('display-lat').innerText = lat.toFixed(5);
        document.getElementById('display-lng').innerText = lng.toFixed(5);
    }

    // 簡易逆地理編碼 (取得地址)
    async function reverseGeocode(lat, lng) {
        const addressInput = document.getElementById('spot-address');
        // 如果已經手動輸入了，就不覆蓋
        if(addressInput.value.trim() !== '') return;
        
        addressInput.placeholder = '取得地址中...';
        try {
            const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`);
            const data = await res.json();
            if(data && data.display_name) {
                // 稍微整理一下地址字串 (移除國家等冗長資訊)
                let addr = data.display_name.split(',').slice(0, 4).join(',');
                addressInput.value = addr;
            } else {
                addressInput.placeholder = '無法自動取得地址';
            }
        } catch(e) {
            addressInput.placeholder = '取得地址失敗';
        }
    }

    // --- 資料操作 ---
    async function handleSaveSpot(e) {
        e.preventDefault();
        
        const lat = document.getElementById('spot-lat').value;
        const lng = document.getElementById('spot-lng').value;
        
        if (!lat || !lng) {
            showToast("請在地圖上點擊選擇座標", true);
            return;
        }

        const btn = document.getElementById('btn-submit');
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 儲存中...';
        btn.disabled = true;

        try {
            const idInput = document.getElementById('spot-id').value;
            // 產生隨機 ID 或使用編輯的 ID
            const docId = idInput || 'spot_' + Date.now() + Math.floor(Math.random()*1000);
            
            const spotData = {
                name: document.getElementById('spot-name').value.trim(),
                foreignName1: document.getElementById('spot-fn1').value.trim(),
                foreignName2: document.getElementById('spot-fn2').value.trim(),
                locMode: document.getElementById('spot-cat').value,
                imageUrl: document.getElementById('spot-img').value.trim(),
                phone: document.getElementById('spot-phone').value.trim(),
                website: document.getElementById('spot-web').value.trim(),
                description: document.getElementById('spot-desc').value.trim(),
                address: document.getElementById('spot-address').value.trim(),
                lat: parseFloat(lat),
                lng: parseFloat(lng),
                // 如果是新增，加入建立時間；如果是編輯，保留原有 favoriteCount
                updatedAt: Date.now()
            };

            if(!idInput) {
                spotData.createdAt = Date.now();
                spotData.favoriteCount = 0;
            }

            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'spots', docId);
            await setDoc(docRef, spotData, { merge: true });
            
            showToast(idInput ? "景點更新成功！" : "景點建立成功！");
            window.clearForm(); // 清空表單準備輸入下一個

        } catch (error) {
            console.error(error);
            showToast("儲存失敗：" + error.message, true);
        } finally {
            btn.innerHTML = originalText;
            btn.disabled = false;
        }
    }

    function loadAllSpots() {
        const spotsRef = collection(db, 'artifacts', appId, 'public', 'data', 'spots');
        onSnapshot(spotsRef, (snapshot) => {
            allSpots = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            document.getElementById('total-count').innerText = allSpots.length;
            renderList();
        }, (error) => {
            console.error("載入列表失敗", error);
            document.getElementById('data-list').innerHTML = `<div class="col-span-full text-red-500 text-center">載入資料權限不足或發生錯誤</div>`;
        });
    }

    function renderList(keyword = '') {
        const container = document.getElementById('data-list');
        
        let filteredSpots = allSpots;
        if (keyword) {
            const kw = keyword.toLowerCase();
            filteredSpots = filteredSpots.filter(s => 
                (s.name && s.name.toLowerCase().includes(kw)) || 
                (s.locMode && s.locMode.toLowerCase().includes(kw))
            );
        }

        // 依更新時間排序 (新的在上面)
        filteredSpots.sort((a, b) => (b.updatedAt || b.createdAt || 0) - (a.updatedAt || a.createdAt || 0));

        if (filteredSpots.length === 0) {
            container.innerHTML = `<div class="col-span-full py-8 text-center text-slate-400">沒有找到符合的景點</div>`;
            return;
        }

        let html = '';
        filteredSpots.forEach(spot => {
            // 💡 使用 config.js 中的設定來顯示分類標籤與顏色
            const locObj = LOCATION_MODES.find(m => m.id === spot.locMode) || { label: spot.locMode, color: '#64748b' };
            const img = spot.imageUrl ? `<div class="w-16 h-16 rounded-lg bg-cover bg-center shrink-0 border border-slate-100" style="background-image: url('${spot.imageUrl}')"></div>` : `<div class="w-16 h-16 rounded-lg bg-slate-100 flex items-center justify-center shrink-0 text-slate-300 border border-slate-200"><i class="fa-solid fa-image"></i></div>`;
            
            html += `
            <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm flex gap-3 group hover:border-blue-300 transition-colors">
                ${img}
                <div class="flex-1 min-w-0 flex flex-col justify-center">
                    <div class="flex justify-between items-start">
                        <h4 class="font-bold text-slate-800 truncate pr-2">${spot.name}</h4>
                        <span class="text-[10px] px-2 py-0.5 rounded text-white font-bold whitespace-nowrap" style="background-color: ${locObj.color}">${locObj.label}</span>
                    </div>
                    <p class="text-xs text-slate-500 truncate mt-1">${spot.address || '無地址'}</p>
                    <div class="flex justify-between items-center mt-2">
                        <span class="text-xs text-slate-400"><i class="fa-regular fa-heart"></i> ${spot.favoriteCount || 0}</span>
                        <div class="flex gap-1 opacity-100 md:opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onclick="window.editSpot('${spot.id}')" class="w-7 h-7 rounded bg-blue-50 text-blue-600 hover:bg-blue-100 flex items-center justify-center transition-colors" title="編輯"><i class="fa-solid fa-pen text-xs"></i></button>
                            <button onclick="window.deleteSpot('${spot.id}', '${spot.name}')" class="w-7 h-7 rounded bg-red-50 text-red-600 hover:bg-red-100 flex items-center justify-center transition-colors" title="刪除"><i class="fa-solid fa-trash text-xs"></i></button>
                        </div>
                    </div>
                </div>
            </div>`;
        });
        container.innerHTML = html;
    }

    // --- 編輯與刪除 ---
    window.editSpot = function(id) {
        const spot = allSpots.find(s => s.id === id);
        if (!spot) return;

        document.getElementById('spot-id').value = spot.id;
        document.getElementById('spot-name').value = spot.name || '';
        document.getElementById('spot-fn1').value = spot.foreignName1 || '';
        document.getElementById('spot-fn2').value = spot.foreignName2 || '';
        document.getElementById('spot-cat').value = spot.locMode || '';
        document.getElementById('spot-img').value = spot.imageUrl || '';
        document.getElementById('spot-phone').value = spot.phone || '';
        document.getElementById('spot-web').value = spot.website || '';
        document.getElementById('spot-desc').value = spot.description || '';
        document.getElementById('spot-address').value = spot.address || '';
        
        // 手機版展開地圖
        const btnToggleMap = document.getElementById('btn-toggle-map');
        if(btnToggleMap && !btnToggleMap.classList.contains('hidden')) {
            btnToggleMap.click();
        }

        if (spot.lat && spot.lng && mapPicker) {
            setMapMarker(spot.lat, spot.lng);
            mapPicker.setView([spot.lat, spot.lng], 16);
        }

        // 滾動到表單頂部
        window.scrollTo({ top: 0, behavior: 'smooth' });
        showToast(`正在編輯：${spot.name}`);
        
        // 變更按鈕文字
        document.getElementById('btn-submit').innerHTML = '<i class="fa-solid fa-check"></i> 儲存修改';
        document.getElementById('btn-submit').classList.replace('bg-blue-600', 'bg-emerald-600');
        document.getElementById('btn-submit').classList.replace('hover:bg-blue-700', 'hover:bg-emerald-700');
    };

    window.deleteSpot = async function(id, name) {
        if (!confirm(`確定要永久刪除「${name}」嗎？\n此操作無法復原。`)) return;

        try {
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'spots', id);
            await deleteDoc(docRef);
            showToast(`已刪除 ${name}`);
            
            // 如果正在編輯該筆，清空表單
            if(document.getElementById('spot-id').value === id) {
                window.clearForm();
            }
        } catch (error) {
            console.error(error);
            showToast("刪除失敗", true);
        }
    };

    window.clearForm = function() {
        document.getElementById('spot-form').reset();
        document.getElementById('spot-id').value = '';
        document.getElementById('spot-lat').value = '';
        document.getElementById('spot-lng').value = '';
        document.getElementById('display-lat').innerText = '未選擇';
        document.getElementById('display-lng').innerText = '未選擇';
        
        if (pickerMarker && mapPicker) {
            mapPicker.removeLayer(pickerMarker);
            pickerMarker = null;
        }

        // 恢復按鈕狀態
        const btn = document.getElementById('btn-submit');
        btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> 儲存景點';
        btn.classList.replace('bg-emerald-600', 'bg-blue-600');
        btn.classList.replace('hover:bg-emerald-700', 'hover:bg-blue-700');
    };

</script>
</body>
</html>
