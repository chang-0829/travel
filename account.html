<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>趣旅行 - 會員中心</title>
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              primary: '#748CAB',
              dark: '#3E5C76',
              light: '#E6EBEF',
              bg: '#F2F5F8',
              card: '#FFFFFF',
              textMain: '#2C3E50',
              textSub: '#8796A5',
              accent: '#D5896F'
            }
          }
        }
      }
    }
  </script>

  <style>
    /* --- LINE Seed TW 字體整合 --- */
    @font-face { font-family: 'LINE Seed TW'; src: url('./fonts/LINESeedTW_OTF_Th.woff2') format('woff2'); font-weight: 300; font-style: normal; font-display: swap; }
    @font-face { font-family: 'LINE Seed TW'; src: url('./fonts/LINESeedTW_OTF_Rg.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: 'LINE Seed TW'; src: url('./fonts/LINESeedTW_OTF_Bd.woff2') format('woff2'); font-weight: 700; font-style: normal; font-display: swap; }

    body { font-family: 'LINE Seed TW', ui-sans-serif, system-ui, sans-serif; background-color: #F2F5F8; }

    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    .pb-safe { padding-bottom: max(12px, env(safe-area-inset-bottom)); }
    .pt-safe { padding-top: max(16px, env(safe-area-inset-top)); }
  </style>
</head>
<body class="bg-brand-bg text-brand-textMain antialiased overflow-hidden">

  <!-- 提示訊息 -->
  <div id="toast" class="fixed top-safe left-1/2 transform -translate-x-1/2 bg-brand-textMain text-white px-6 py-3 rounded-full shadow-2xl z-[100] transition-all duration-300 opacity-0 pointer-events-none -translate-y-4 flex items-center gap-2 font-bold text-sm mt-2">
    <i class="fa-solid fa-circle-check text-brand-primary"></i> <span id="toast-msg">成功！</span>
  </div>

  <div class="max-w-md mx-auto h-[100dvh] bg-brand-bg shadow-xl relative flex flex-col">

    <!-- 標準 Header -->
    <header class="bg-brand-bg pt-safe pb-4 px-6 shrink-0 flex justify-between items-end border-b border-brand-light z-10 transition-all">
      <div>
        <p class="text-sm font-bold text-brand-primary mb-1 uppercase tracking-widest mt-2">Account</p>
        <h1 class="text-3xl font-extrabold text-brand-dark tracking-tight">會員中心</h1>
      </div>
    </header>

    <!-- 主內容區：會員 Profile -->
    <div id="view-profile" class="flex-1 overflow-y-auto px-6 hide-scrollbar flex flex-col items-center pt-8 pb-6 bg-brand-bg">
      
      <!-- 未登入畫面 -->
      <div id="profile-unauth" class="w-full flex flex-col items-center mt-6 transition-opacity duration-300">
        <div class="w-20 h-20 bg-brand-primary rounded-3xl flex items-center justify-center mb-6 shadow-md shadow-brand-primary/20">
          <i class="fa-solid fa-compass text-white text-4xl"></i>
        </div>
        <h2 class="text-2xl font-bold text-brand-dark mb-2">登入或試用</h2>
        <p class="text-brand-textSub mb-8 text-sm text-center">登入可與社群共享探索景點<br>或使用本機試用模式體驗功能</p>
        <div class="w-full space-y-3">
          <button id="btn-login-google" class="w-full bg-white border border-brand-light text-brand-textMain font-bold py-4 rounded-[20px] shadow-sm hover:bg-brand-bg active:scale-[0.98] transition-all flex items-center justify-center gap-3">
            <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            Google 帳號登入
          </button>
          <button id="btn-login-guest" class="w-full bg-brand-primary text-white font-bold py-4 rounded-[20px] shadow-sm shadow-brand-primary/20 hover:bg-brand-dark active:scale-[0.98] transition-all flex items-center justify-center gap-3">
            <i class="fa-solid fa-user-astronaut text-lg"></i>
            先逛逛 (本機暫存模式)
          </button>
        </div>
      </div>

      <!-- 已登入畫面 -->
      <div id="profile-auth" class="hidden w-full flex flex-col items-center mt-6 transition-opacity duration-300">
        <div class="w-24 h-24 bg-white border-4 border-brand-light rounded-full flex items-center justify-center mb-4 text-brand-primary text-4xl shadow-md overflow-hidden relative">
          <img id="profile-pic" src="" alt="avatar" class="hidden w-full h-full object-cover">
          <i id="profile-icon" class="fa-solid fa-user"></i>
        </div>
        <h2 id="profile-name" class="text-2xl font-bold text-brand-dark mb-1">User</h2>
        <p id="profile-email" class="text-sm font-bold text-brand-textSub mb-8">email@example.com</p>
        
        <!-- 提供一個快速按鈕返回行程或首頁 -->
        <a href="./mytrip.html" class="w-full bg-white text-brand-dark font-bold text-[16px] py-4 rounded-[20px] shadow-sm border border-brand-light mb-3 hover:bg-brand-light/50 active:scale-[0.98] transition-all flex justify-center items-center gap-2">
          <i class="fa-solid fa-suitcase-rolling text-brand-primary"></i> 前往我的行程
        </a>

        <button id="btn-logout" class="w-full bg-[#FFE5E5] text-[#E63946] font-bold text-[16px] py-4 rounded-[20px] shadow-sm hover:bg-[#FFD1D1] active:scale-[0.98] transition-all flex justify-center items-center gap-2">
          <i class="fa-solid fa-right-from-bracket"></i> 登出 / 離開
        </button>
      </div>

    </div>

    <!-- 底部導覽列 -->
    <nav class="bg-white border-t border-brand-light shrink-0 z-40 pb-safe shadow-[0_-4px_20px_rgba(0,0,0,0.02)]">
      <div class="flex justify-around items-center h-[65px]">
        <a href="./index.html" class="flex flex-col items-center justify-center w-full h-full text-brand-textSub hover:text-brand-primary transition-colors">
          <i class="fa-solid fa-house mb-1 text-[18px]"></i>
          <span class="text-[10px] font-bold">首頁</span>
        </a>
        <a href="./discover.html" class="flex flex-col items-center justify-center w-full h-full text-brand-textSub hover:text-brand-primary transition-colors">
          <i class="fa-solid fa-earth-americas mb-1 text-[18px]"></i>
          <span class="text-[10px] font-bold">探索</span>
        </a>
        <a href="./mytrip.html" class="flex flex-col items-center justify-center w-full h-full text-brand-textSub hover:text-brand-primary transition-colors">
          <i class="fa-solid fa-suitcase-rolling mb-1 text-[18px]"></i>
          <span class="text-[10px] font-bold">行程</span>
        </a>
        <!-- 會員頁面 Active 狀態 -->
        <a href="./account.html" class="flex flex-col items-center justify-center w-full h-full text-brand-primary transition-colors">
          <i class="fa-solid fa-user mb-1 text-[18px]"></i>
          <span class="text-[10px] font-bold">會員</span>
        </a>
      </div>
    </nav>

  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
    import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';

    // Firebase Init
    const firebaseConfig = { 
      apiKey: "AIzaSyCQF8A3ieML0JP3X8X78NCRuiUETRAiu5E", 
      authDomain: "travel-96009.firebaseapp.com", 
      projectId: "travel-96009", 
      storageBucket: "travel-96009.firebasestorage.app", 
      messagingSenderId: "578860064042", 
      appId: "1:578860064042:web:b147880df3a01dd8f75253" 
    };
    const app = initializeApp(firebaseConfig); 
    const auth = getAuth(app);

    // Toast 顯示邏輯
    window.showToast = function(msg) {
      const el = document.getElementById('toast');
      document.getElementById('toast-msg').innerText = msg;
      el.classList.remove('opacity-0', '-translate-y-4', 'pointer-events-none');
      el.classList.add('opacity-100', 'translate-y-0');
      setTimeout(() => {
        el.classList.remove('opacity-100', 'translate-y-0');
        el.classList.add('opacity-0', '-translate-y-4', 'pointer-events-none');
      }, 3000);
    }

    // 更新 UI 畫面
    function updateUI(user) {
        const isGuest = localStorage.getItem('isGuest') === 'true';

        if (user || isGuest) {
            document.getElementById('profile-unauth').classList.add('hidden');
            document.getElementById('profile-auth').classList.remove('hidden');
            
            if (isGuest) {
                document.getElementById('profile-name').innerText = '訪客模式';
                document.getElementById('profile-email').innerText = '僅儲存於此瀏覽器，不會同步至雲端';
                document.getElementById('profile-pic').classList.add('hidden');
                document.getElementById('profile-icon').classList.remove('hidden');
            } else {
                document.getElementById('profile-name').innerText = user.displayName || '旅行者';
                document.getElementById('profile-email').innerText = user.email || '';
                if(user.photoURL) {
                    document.getElementById('profile-pic').src = user.photoURL;
                    document.getElementById('profile-pic').classList.remove('hidden');
                    document.getElementById('profile-icon').classList.add('hidden');
                } else {
                    document.getElementById('profile-pic').classList.add('hidden');
                    document.getElementById('profile-icon').classList.remove('hidden');
                }
            }
        } else {
            document.getElementById('profile-unauth').classList.remove('hidden');
            document.getElementById('profile-auth').classList.add('hidden');
        }
    }

    // 監聽登入狀態
    onAuthStateChanged(auth, updateUI);

    // 訪客登入
    document.getElementById('btn-login-guest').addEventListener('click', () => {
        localStorage.setItem('isGuest', 'true');
        showToast("已進入免登入試用模式");
        updateUI();
        // 延遲跳轉回首頁，讓使用者看到 Toast
        setTimeout(() => { window.location.href = './index.html'; }, 800);
    });

    // 登出或離開試用模式
    document.getElementById('btn-logout').addEventListener('click', () => {
        const isGuest = localStorage.getItem('isGuest') === 'true';
        if (isGuest) {
            localStorage.setItem('isGuest', 'false');
            showToast("已離開試用模式");
            updateUI();
        } else {
            signOut(auth).then(() => { 
                showToast("已登出帳號"); 
            }).catch(err => {
                showToast("登出發生錯誤");
            });
        }
    });

    // Google 登入
    document.getElementById('btn-login-google').addEventListener('click', () => {
        // 如果目前是訪客模式，先清除訪客狀態
        localStorage.setItem('isGuest', 'false');
        
        signInWithPopup(auth, new GoogleAuthProvider()).then(() => {
            showToast("登入成功");
        }).catch(err => {
            showToast("登入失敗：" + err.message);
        });
    });
  </script>
</body>
</html>
