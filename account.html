<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>趣旅行 - 會員</title>
  <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)">
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  <script>tailwind.config={theme:{extend:{colors:{brand:{primary:'#748CAB',dark:'#3E5C76',light:'#E6EBEF',bg:'#F2F5F8',card:'#FFFFFF',textMain:'#2C3E50',textSub:'#8796A5'}}}}}</script>
  <style>
    body { font-family: ui-sans-serif, system-ui, sans-serif; background-color: #F2F5F8; }
    .pb-safe { padding-bottom: max(12px, env(safe-area-inset-bottom)); }
    .pt-safe { padding-top: max(16px, env(safe-area-inset-top)); }
  </style>
</head>
<body class="text-brand-textMain antialiased overflow-hidden">
  <div class="max-w-md mx-auto h-[100dvh] bg-brand-bg shadow-xl relative flex flex-col">
    <!-- Header -->
    <header class="bg-brand-bg pt-safe pb-4 px-6 shrink-0 flex justify-between items-end border-b border-brand-light z-10">
      <div>
        <p class="text-sm font-bold text-brand-primary mb-1 uppercase tracking-widest mt-2">Account</p>
        <h1 class="text-3xl font-extrabold text-brand-dark tracking-tight">會員中心</h1>
      </div>
    </header>

    <!-- View: Profile -->
    <div id="view-profile" class="flex-1 overflow-y-auto px-6 hide-scrollbar flex flex-col items-center pt-12 pb-6">
      
      <!-- 未登入畫面 -->
      <div id="profile-unauth" class="w-full flex flex-col items-center mt-6">
        <div class="w-20 h-20 bg-brand-primary rounded-3xl flex items-center justify-center mb-6 shadow-md shadow-brand-primary/20">
          <i class="fa-solid fa-compass text-white text-4xl"></i>
        </div>
        <h2 class="text-2xl font-bold text-brand-dark mb-2">登入或試用</h2>
        <div class="w-full space-y-3 mt-8">
          <button id="btn-login-google" class="w-full bg-white border-2 border-brand-light text-brand-textMain font-bold py-4 rounded-[20px] shadow-sm flex items-center justify-center gap-3">
            <i class="fa-brands fa-google text-[#4285F4]"></i> Google 帳號登入
          </button>
          <button onclick="handleGuestLogin()" class="w-full bg-brand-primary text-white font-bold py-4 rounded-[20px] shadow-sm flex items-center justify-center gap-3">
            <i class="fa-solid fa-user-astronaut"></i> 先逛逛 (本機暫存模式)
          </button>
        </div>
      </div>

      <!-- 已登入畫面 -->
      <div id="profile-auth" class="hidden w-full flex flex-col items-center mt-6">
        <div class="w-24 h-24 bg-white border-4 border-brand-light rounded-full flex items-center justify-center mb-4 text-brand-primary text-4xl shadow-md overflow-hidden relative">
          <img id="profile-pic" src="" alt="avatar" class="hidden w-full h-full object-cover">
          <i id="profile-icon" class="fa-solid fa-user"></i>
        </div>
        <h2 id="profile-name" class="text-2xl font-bold text-brand-dark mb-1">User</h2>
        <p id="profile-email" class="text-sm font-bold text-brand-textSub mb-8">email@example.com</p>
        <button onclick="handleSignOut()" class="w-full bg-[#FFE5E5] text-[#E63946] font-bold text-lg py-4 rounded-[20px] shadow-sm flex justify-center items-center gap-2 mt-auto">
          <i class="fa-solid fa-right-from-bracket"></i> 登出 / 離開
        </button>
      </div>

    </div>

    <!-- 底部導覽列 -->
    <nav class="bg-white border-t border-brand-light shrink-0 z-40 pb-safe shadow-[0_-4px_20px_rgba(0,0,0,0.02)]">
      <div class="flex justify-around items-center h-[65px]">
        <a href="./index.html" class="flex flex-col items-center justify-center w-full h-full text-brand-textSub hover:text-brand-primary transition-colors">
          <i class="fa-solid fa-house mb-1 text-[18px]"></i><span class="text-[10px] font-bold">首頁</span>
        </a>
        <a href="./discover.html" class="flex flex-col items-center justify-center w-full h-full text-brand-textSub hover:text-brand-primary transition-colors">
          <i class="fa-solid fa-earth-americas mb-1 text-[18px]"></i><span class="text-[10px] font-bold">探索</span>
        </a>
        <a href="./mytrip.html" class="flex flex-col items-center justify-center w-full h-full text-brand-textSub hover:text-brand-primary transition-colors">
          <i class="fa-solid fa-suitcase-rolling mb-1 text-[18px]"></i><span class="text-[10px] font-bold">行程</span>
        </a>
        <a href="./account.html" class="flex flex-col items-center justify-center w-full h-full text-brand-primary transition-colors">
          <i class="fa-solid fa-user mb-1 text-[18px]"></i><span class="text-[10px] font-bold">會員</span>
        </a>
      </div>
    </nav>
  </div>

  <script type="module">
    import { initializeApp } from '[https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js](https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js)';
    import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } from '[https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js](https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js)';

    const firebaseConfig = { apiKey: "AIza...", authDomain: "...", projectId: "...", storageBucket: "...", messagingSenderId: "...", appId: "..." };
    const app = initializeApp(firebaseConfig); const auth = getAuth(app);

    const isGuest = localStorage.getItem('isGuest') === 'true';

    function updateUI(user) {
        if (user || isGuest) {
            document.getElementById('profile-unauth').classList.add('hidden');
            document.getElementById('profile-auth').classList.remove('hidden');
            
            if (isGuest) {
                document.getElementById('profile-name').innerText = '訪客模式';
                document.getElementById('profile-email').innerText = '僅儲存於此瀏覽器，不會同步至雲端';
            } else {
                document.getElementById('profile-name').innerText = user.displayName || '旅行者';
                document.getElementById('profile-email').innerText = user.email || '';
                if(user.photoURL) {
                    document.getElementById('profile-pic').src = user.photoURL;
                    document.getElementById('profile-pic').classList.remove('hidden');
                    document.getElementById('profile-icon').classList.add('hidden');
                }
            }
        } else {
            document.getElementById('profile-unauth').classList.remove('hidden');
            document.getElementById('profile-auth').classList.add('hidden');
        }
    }

    onAuthStateChanged(auth, updateUI);

    window.handleGuestLogin = () => {
        localStorage.setItem('isGuest', 'true');
        alert("已進入免登入試用模式");
        window.location.href = './index.html';
    };

    window.handleSignOut = () => {
        if (isGuest) {
            localStorage.setItem('isGuest', 'false');
            alert("已離開試用模式");
            window.location.reload();
        } else {
            signOut(auth).then(() => { alert("已登出帳號"); window.location.reload(); });
        }
    };

    document.getElementById('btn-login-google').onclick = () => {
        signInWithPopup(auth, new GoogleAuthProvider()).catch(err => alert("登入失敗：" + err.message));
    };
  </script>
</body>
</html>
