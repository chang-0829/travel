<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>趣．旅行 - 您的個人行程雲端平台</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              primary: '#748CAB', /* 莫蘭迪藍 */
              dark: '#3E5C76',
              light: '#E6EBEF',
              bg: '#F2F5F8', /* 強化對比的底色 */
              card: '#FFFFFF',
              textMain: '#2C3E50',
              textSub: '#5D6D7E', /* 加深副標題顏色 */
              accent: '#D5896F' /* 莫蘭迪橘 */
            }
          },
          fontFamily: {
            sans: ['"LINE Seed TW"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    /* --- LINE Seed TW 字體整合 --- */
    @font-face { font-family: 'LINE Seed TW'; src: url('./fonts/LINESeedTW_OTF_Th.woff2') format('woff2'); font-weight: 300; font-style: normal; font-display: swap; }
    @font-face { font-family: 'LINE Seed TW'; src: url('./fonts/LINESeedTW_OTF_Rg.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: 'LINE Seed TW'; src: url('./fonts/LINESeedTW_OTF_Bd.woff2') format('woff2'); font-weight: 700; font-style: normal; font-display: swap; }

    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    .bottom-sheet { transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); }
    .bottom-sheet.open { transform: translateY(0); opacity: 1; }
    .bottom-sheet.closed { transform: translateY(100%); opacity: 0; }
    
    .view-transition { transition: opacity 0.3s ease; }
    
    /* 專業排版專用 */
    .sidebar-active { background-color: #FFFFFF; color: #748CAB; border-right: 4px solid #748CAB; font-weight: 700; box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
    .active-mode { border-color: #748CAB !important; background-color: #F0F9FF !important; color: #748CAB; font-weight: bold; }
    
    /* 輸入框視覺強化 */
    .input-flat { background-color: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 12px; padding: 12px 16px; width: 100%; outline: none; transition: all 0.2s; }
    .input-flat:focus { border-color: #748CAB; background-color: #FFFFFF; }

    @media (min-width: 768px) {
      .desktop-grid { display: grid; grid-template-columns: 300px 1fr 380px; height: 100vh; }
      #bottom-nav { display: none; }
      #sheet-form { 
        bottom: auto; top: 50%; left: 50%; 
        transform: translate(-50%, -45%) scale(0.98); 
        width: 600px; border-radius: 32px; 
      }
      #sheet-form.open { transform: translate(-50%, -50%) scale(1); }
    }
  </style>
</head>
<body class="bg-brand-bg text-brand-textMain font-sans antialiased overflow-hidden">

  <div id="app" class="w-full h-[100dvh] flex flex-col relative">
    
    <!-- Toast -->
    <div id="toast" class="fixed top-8 left-1/2 -translate-x-1/2 z-[100] bg-brand-dark text-white px-6 py-3 rounded-full opacity-0 pointer-events-none transition-all duration-300 text-sm font-medium flex items-center gap-2 border border-slate-600 shadow-xl">
      <i class="fa-solid fa-circle-check text-brand-primary"></i> <span id="toast-msg"></span>
    </div>

    <!-- VIEW: 登入頁 -->
    <div id="view-login" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-brand-bg px-6 view-transition">
      <div id="login-card" class="w-full max-w-[420px] bg-white rounded-[40px] p-12 border border-slate-200 flex flex-col items-center shadow-sm">
        <div class="w-20 h-20 bg-brand-primary rounded-3xl flex items-center justify-center mb-8">
          <i class="fa-solid fa-compass text-white text-3xl"></i>
        </div>
        <h1 class="text-3xl font-bold text-brand-dark mb-3 tracking-tighter">趣．旅行</h1>
        <p class="text-brand-textSub mb-12 text-center text-sm font-light opacity-90 tracking-tight">記錄您的所有精彩旅程</p>
        <button id="btn-login-google" class="w-full bg-white border border-slate-200 text-brand-textMain font-bold py-4 rounded-2xl flex items-center justify-center gap-4 hover:bg-slate-50 active:scale-[0.98] transition-all">
          <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Google 快速登入
        </button>
      </div>
    </div>

    <!-- 主內容區塊 (支援全寬) -->
    <div id="app-inner" class="flex-1 w-full flex flex-col overflow-hidden bg-white">
      
      <!-- VIEW: 我的計畫列表 (首頁) -->
      <div id="view-plans" class="hidden flex-1 flex flex-col overflow-hidden">
        <header class="pt-16 pb-8 px-10 shrink-0 flex justify-between items-center max-w-7xl mx-auto w-full">
          <div>
            <h1 class="text-4xl font-bold text-brand-dark tracking-tighter">我的計畫</h1>
            <p class="text-xs text-brand-textSub mt-1 font-bold uppercase tracking-widest opacity-60">Travel List</p>
          </div>
          <button onclick="openFormModal('new-plan')" class="bg-brand-primary text-white w-14 h-14 rounded-2xl flex items-center justify-center active:scale-90 transition-all shadow-md shadow-brand-primary/20 hover:bg-brand-dark">
            <i class="fa-solid fa-plus text-2xl"></i>
          </button>
        </header>
        <div class="flex-1 overflow-y-auto bg-brand-bg pt-10 px-10 pb-32 hide-scrollbar">
          <div id="plans-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8 max-w-7xl mx-auto"></div>
        </div>
      </div>

      <!-- VIEW: 行程編輯器 (專業佈局) -->
      <div id="view-editor" class="hidden flex-1 flex flex-col overflow-hidden bg-white relative">
        <div class="desktop-grid flex-1 flex flex-col md:grid">
          
          <!-- 左側欄：控制台 -->
          <aside class="hidden md:flex flex-col bg-slate-50 border-r border-slate-200 overflow-y-auto hide-scrollbar shrink-0">
            <div class="p-8 border-b border-slate-200 bg-white">
              <button onclick="switchView('plans')" class="text-slate-500 hover:text-brand-primary transition-colors flex items-center gap-2 text-sm font-bold mb-6 group">
                <i class="fa-solid fa-chevron-left text-xs transition-transform group-hover:-translate-x-1"></i> 返回計畫列表
              </button>
              <h2 id="side-plan-title" class="font-bold text-2xl text-brand-dark leading-tight uppercase tracking-tighter mb-2"></h2>
              <p id="side-plan-date" class="text-[10px] text-brand-primary font-bold uppercase tracking-[2px]"></p>
            </div>
            <div id="side-days-tabs" class="flex-1 py-4"></div>
            <div class="p-6 border-t border-slate-200 bg-white space-y-3">
               <button onclick="openFormModal('plan-info')" class="w-full py-3.5 rounded-xl bg-slate-100 text-slate-700 text-xs font-bold hover:bg-slate-200 transition-all flex items-center justify-center gap-2 border border-slate-200 shadow-sm">
                 <i class="fa-solid fa-gear"></i> 行程詳細設定
               </button>
            </div>
          </aside>

          <!-- 中間欄：時間軸 -->
          <main class="flex-1 flex flex-col bg-white overflow-hidden relative">
            <!-- 手機版 Header -->
            <header class="md:hidden bg-white pt-10 pb-4 px-6 shrink-0 border-b border-slate-100 flex items-center justify-between">
              <button onclick="switchView('plans')" class="text-brand-textMain"><i class="fa-solid fa-arrow-left text-xl"></i></button>
              <h2 id="mobile-plan-title" class="font-bold text-brand-textMain truncate px-4"></h2>
              <button onclick="openFormModal('plan-info')" class="text-brand-textSub"><i class="fa-solid fa-sliders text-lg"></i></button>
            </header>
            <div class="md:hidden bg-white px-6 py-4 shrink-0 border-b border-slate-50 overflow-x-auto hide-scrollbar">
              <div id="mobile-days-tabs" class="flex gap-3"></div>
            </div>

            <!-- 時間軸內容 -->
            <div class="flex-1 overflow-y-auto px-6 py-10 hide-scrollbar">
               <div id="timeline-container" class="max-w-2xl mx-auto w-full"></div>
            </div>

            <!-- 懸浮按鈕 -->
            <div class="absolute bottom-28 md:bottom-10 right-6 flex flex-col gap-3 z-20">
              <button onclick="openFormModal('location')" class="flex items-center justify-center gap-2 bg-brand-dark text-white font-bold h-14 px-6 rounded-2xl border border-brand-dark hover:bg-black transition-all shadow-lg">
                <i class="fa-solid fa-location-dot"></i> <span class="text-sm font-light">新增地點</span>
              </button>
              <button onclick="openFormModal('transport')" class="flex items-center justify-center gap-2 bg-brand-primary text-white font-bold h-14 px-6 rounded-2xl border border-brand-primary hover:bg-brand-dark transition-all shadow-lg">
                <i class="fa-solid fa-train-tram"></i> <span class="text-sm font-light">新增交通</span>
              </button>
            </div>
          </main>

          <!-- 右側欄：資訊與地圖 -->
          <aside class="hidden md:flex flex-col bg-brand-bg border-l border-slate-100 relative">
             <div class="absolute inset-0 flex flex-col items-center justify-center p-10 text-center text-slate-400 font-light">
                <i class="fa-solid fa-map-location-dot text-6xl mb-6 opacity-10"></i>
                <p class="text-xs tracking-widest uppercase opacity-40">Map View Placeholder</p>
                <div class="mt-8 w-full h-72 border-2 border-dashed border-slate-200 rounded-[40px] flex items-center justify-center text-[10px] uppercase tracking-[4px] text-slate-300">功能開發中</div>
             </div>
          </aside>
        </div>
      </div>

      <!-- VIEW: 個人設定 -->
      <div id="view-profile" class="hidden flex-1 flex flex-col items-center justify-center px-8 bg-brand-bg">
         <div class="w-24 h-24 bg-white rounded-[32px] mb-6 overflow-hidden border border-slate-200 shadow-sm shrink-0">
           <img id="user-photo" src="https://ui-avatars.com/api/?name=User" class="w-full h-full object-cover">
         </div>
         <h2 id="user-name" class="text-2xl font-bold text-brand-textMain mb-1 tracking-tighter"></h2>
         <p id="user-email" class="text-xs text-brand-textSub font-light mb-12 tracking-wide"></p>
         
         <div class="w-full max-w-sm space-y-4">
           <div class="bg-white p-8 rounded-[32px] border border-slate-200 space-y-5 shadow-sm">
             <label class="block text-[11px] font-bold text-brand-textSub uppercase tracking-[2px] border-b border-slate-100 pb-2">備份管理</label>
             <div class="flex gap-4">
               <button onclick="handleExport()" class="flex-1 py-4 bg-slate-100 text-brand-dark font-bold text-sm rounded-2xl hover:bg-slate-200 transition-all flex items-center justify-center gap-2 border border-slate-200"><i class="fa-solid fa-file-export text-brand-primary"></i> 匯出</button>
               <button onclick="document.getElementById('input-import-file').click()" class="flex-1 py-4 bg-slate-100 text-brand-dark font-bold text-sm rounded-2xl hover:bg-slate-200 transition-all flex items-center justify-center gap-2 border border-slate-200"><i class="fa-solid fa-file-import text-brand-primary"></i> 匯入</button>
               <input type="file" id="input-import-file" accept=".json" class="hidden" onchange="handleImport(event)">
             </div>
           </div>
           <button onclick="signOut(getAuth())" class="w-full py-5 bg-white text-red-500 font-bold rounded-3xl border border-red-100 hover:bg-red-50 transition-all flex items-center justify-center gap-3">登出帳號</button>
         </div>
      </div>

      <!-- 手機版 Bottom Nav -->
      <nav id="bottom-nav" class="fixed bottom-0 inset-x-0 bg-white/95 backdrop-blur-md border-t border-slate-100 h-20 shrink-0 flex items-center justify-around px-8 z-[40]">
        <button class="nav-item flex flex-col items-center gap-1 group relative active" data-view="plans"><i class="fa-solid fa-calendar-check text-xl text-brand-textSub group-[.active]:text-brand-primary transition-all"></i><span class="text-[10px] font-bold text-brand-textSub group-[.active]:text-brand-primary uppercase tracking-tighter">計畫</span></button>
        <button class="nav-item flex flex-col items-center gap-1 group relative" data-view="profile"><i class="fa-solid fa-user-gear text-xl text-brand-textSub group-[.active]:text-brand-primary transition-all"></i><span class="text-[10px] font-bold text-brand-textSub group-[.active]:text-brand-primary uppercase tracking-tighter">設定</span></button>
      </nav>
    </div>
  </div>

  <!-- 彈窗系統 (還原 image_c55f43.png) -->
  <div id="modal-overlay" class="hidden fixed inset-0 z-[60] bg-slate-900/40 backdrop-blur-[2px] transition-opacity" onclick="closeSheet()"></div>
  <div id="sheet-form" class="bottom-sheet closed fixed inset-x-0 bottom-0 z-[61] bg-white rounded-t-[40px] max-h-[90vh] flex flex-col mx-auto overflow-hidden border border-slate-200 shadow-2xl">
     <div id="sheet-header" class="px-10 py-7 border-b border-slate-100 flex justify-between items-center shrink-0 bg-white">
        <h3 id="sheet-title" class="text-2xl font-bold text-brand-dark tracking-tight">建立行程</h3>
        <button onclick="closeSheet()" class="text-slate-300 hover:text-brand-primary transition-colors active:scale-90"><i class="fa-solid fa-circle-xmark text-3xl"></i></button>
     </div>
     <div id="sheet-content" class="p-10 overflow-y-auto hide-scrollbar"></div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
    import { getFirestore, doc, collection, onSnapshot, query, addDoc, deleteDoc, updateDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    const firebaseConfig = { apiKey: "AIzaSyCQF8A3ieML0JP3X8X78NCRuiUETRAiu5E", authDomain: "travel-96009.firebaseapp.com", projectId: "travel-96009", storageBucket: "travel-96009.firebasestorage.app", messagingSenderId: "578860064042", appId: "1:578860064042:web:b147880df3a01dd8f75253" };
    const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app); const appId = "travel-platform-v1";

    const TRANSPORT_MODES = [ { id: 'flight', label: '航班', icon: 'fa-solid fa-plane' }, { id: 'train', label: '電車', icon: 'fa-solid fa-train' }, { id: 'bus', label: '公車', icon: 'fa-solid fa-bus' }, { id: 'car', label: '開車', icon: 'fa-solid fa-car' }, { id: 'walk', label: '步行', icon: 'fa-solid fa-person-walking' } ];
    const LOCATION_MODES = [ { id: 'spot', label: '景點', icon: 'fa-solid fa-location-dot' }, { id: 'hotel', label: '住宿', icon: 'fa-solid fa-hotel' }, { id: 'food', label: '美食', icon: 'fa-solid fa-utensils' }, { id: 'shop', label: '購物', icon: 'fa-solid fa-bag-shopping' } ];

    let state = { user: null, plans: [], currentPlanId: null, activeDay: 1, editingId: null, currency: 'JPY' };

    onAuthStateChanged(auth, (user) => {
      state.user = user;
      if (user) {
        document.getElementById('view-login').classList.add('opacity-0', 'pointer-events-none');
        setTimeout(() => document.getElementById('view-login').classList.add('hidden'), 300);
        document.getElementById('user-name').innerText = user.displayName;
        document.getElementById('user-email').innerText = user.email;
        if (user.photoURL) document.getElementById('user-photo').src = user.photoURL;
        switchView('plans'); listenToPlans();
      } else {
        closeSheet(); document.getElementById('view-login').classList.remove('hidden', 'opacity-0', 'pointer-events-none');
        switchView('login');
      }
    });

    function listenToPlans() {
      if (!state.user) return;
      const q = collection(db, 'artifacts', appId, 'users', state.user.uid, 'plans');
      onSnapshot(q, (snapshot) => {
        state.plans = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderPlansList();
        if (state.currentPlanId) {
          const activePlan = state.plans.find(p => p.id === state.currentPlanId);
          if (activePlan) renderEditor(activePlan);
        }
      });
    }

    window.switchView = (v) => {
      ['plans', 'editor', 'profile'].forEach(id => document.getElementById(`view-${id}`)?.classList.add('hidden'));
      const target = document.getElementById(`view-${v}`);
      if (target) target.classList.remove('hidden');
      document.querySelectorAll('.nav-item').forEach(item => item.classList.toggle('active', item.dataset.view === v));
    };

    function renderPlansList() {
      const container = document.getElementById('plans-list');
      if (state.plans.length === 0) { container.innerHTML = `<div class="col-span-full py-32 text-center text-slate-400 font-light"><i class="fa-solid fa-map-location-dot text-7xl mb-8 opacity-10"></i><p class="text-lg">您的旅程即將展開，<br>點擊上方 + 開始規劃吧！</p></div>`; return; }
      container.innerHTML = state.plans.sort((a, b) => b.createdAt - a.createdAt).map(plan => `
        <div onclick="openPlan('${plan.id}')" class="bg-white rounded-[36px] overflow-hidden border border-slate-200 shadow-sm flex h-36 active:scale-[0.98] transition-all cursor-pointer hover:border-brand-primary group">
          <div class="w-32 bg-slate-50 flex items-center justify-center text-brand-primary text-4xl opacity-20 shrink-0 group-hover:bg-brand-light group-hover:opacity-60 transition-all"><i class="fa-solid fa-plane-up"></i></div>
          <div class="flex-1 p-8 flex flex-col justify-center overflow-hidden">
            <h3 class="font-bold text-brand-textMain text-xl truncate tracking-tight uppercase">${plan.title}</h3>
            <p class="text-[11px] text-brand-primary font-bold uppercase tracking-[2px] opacity-80 mt-1">${plan.startDate} · ${plan.days} DAYS</p>
          </div>
          <div class="px-8 flex items-center text-slate-200 group-hover:text-brand-primary transition-colors"><i class="fa-solid fa-angle-right"></i></div>
        </div>
      `).join('');
    }

    window.openPlan = (id) => { state.currentPlanId = id; state.activeDay = 1; renderEditor(state.plans.find(p=>p.id===id)); switchView('editor'); };

    function renderEditor(plan) {
      document.getElementById('mobile-plan-title').innerText = plan.title;
      document.getElementById('side-plan-title').innerText = plan.title;
      document.getElementById('side-plan-date').innerText = `${plan.startDate} · ${plan.days} DAYS`;
      
      document.getElementById('side-days-tabs').innerHTML = Array.from({length: plan.days}, (_, i) => `
        <button onclick="state.activeDay = ${i+1}; renderEditor(state.plans.find(p=>p.id==='${plan.id}'))" 
          class="w-full text-left px-10 py-6 transition-all text-sm font-light ${state.activeDay === i+1 ? 'sidebar-active' : 'text-slate-500 hover:bg-white/60'}">
          <div class="flex justify-between items-center"><span>Day ${i+1}</span><i class="fa-solid fa-chevron-right text-[10px] opacity-30"></i></div>
        </button>`).join('');
      
      document.getElementById('mobile-days-tabs').innerHTML = Array.from({length: plan.days}, (_, i) => `
        <button onclick="state.activeDay = ${i+1}; renderEditor(state.plans.find(p=>p.id==='${plan.id}'))" 
          class="shrink-0 px-6 py-3 rounded-2xl font-bold text-[11px] uppercase tracking-[2px] transition-all border ${state.activeDay === i+1 ? 'bg-brand-primary text-white border-brand-primary shadow-md shadow-brand-primary/20' : 'bg-white text-brand-textSub border-slate-200'}">Day ${i+1}</button>`).join('');

      const container = document.getElementById('timeline-container');
      const items = (plan.itinerary && plan.itinerary[state.activeDay]) || [];
      if (items.length === 0) { container.innerHTML = `<div class="py-32 text-center text-slate-300 font-light uppercase tracking-widest opacity-60"><i class="fa-solid fa-route text-5xl mb-6 opacity-10"></i><p>尚未規劃行程</p></div>`; return; }

      let html = '<div class="relative pb-12">';
      items.sort((a, b) => a.timeStart.localeCompare(b.timeStart)).forEach((item, index, arr) => {
        const isFirst = index === 0; const isLast = index === arr.length - 1;
        let lineHtml = (arr.length > 1) ? `<div class="absolute ${isFirst ? 'top-[28px] bottom-0' : (isLast ? 'top-0 h-[28px]' : 'top-0 bottom-0')} w-[3px] bg-brand-primary left-[90px] opacity-10"></div>` : '';
        const symbol = item.currency === 'TWD' ? '$' : '¥';
        const costStr = item.cost ? `<p class="text-[11px] font-bold text-slate-400 mt-2 uppercase tracking-tight bg-slate-50 w-fit px-2 py-0.5 rounded">Budget: ${symbol}${item.cost}</p>` : '';

        if (item.type === 'location') {
          html += `<div class="relative flex group py-8 cursor-pointer hover:bg-slate-50/50 rounded-[24px] px-2 transition-all -mx-2" onclick="openFormModal('location', '${item.id}')">
            <div class="w-[80px] shrink-0 text-right pr-6 pt-1 flex flex-col font-bold font-mono text-brand-textMain text-sm leading-tight tracking-tighter opacity-90">
              <span class="text-base">${item.timeStart}</span>${item.timeEnd ? `<span class="opacity-30 text-[12px] mt-1">${item.timeEnd}</span>` : ''}
            </div>
            <div class="w-6 shrink-0 flex flex-col items-center relative self-stretch">${lineHtml}<div class="${item.isThrough ? 'w-5 h-5 border-[3px]' : 'w-4 h-4 border-[3px]'} rounded-full border-brand-primary bg-white z-10 mt-[8px] flex items-center justify-center">${item.isThrough ? '<i class="fa-solid fa-angles-down text-[8px]"></i>' : ''}</div></div>
            <div class="flex-1 pl-8">
              <h4 class="font-bold text-brand-textMain text-xl tracking-tight uppercase">${item.name}</h4>
              ${item.subtitle ? `<p class="text-sm font-light text-brand-textSub mt-2 opacity-90 leading-relaxed">${item.subtitle}</p>` : ''}
              ${costStr}
              ${item.isThrough ? '<span class="inline-block mt-3 text-[9px] font-bold uppercase text-white bg-brand-primary px-2.5 py-1 rounded-full tracking-widest">Through Station</span>' : ''}
            </div>
          </div>`;
        } else {
          let showStart = true; let showEnd = true; const prev = arr[index - 1]; const next = arr[index + 1];
          if (prev && item.timeStart === (prev.timeEnd || prev.timeStart)) showStart = false; if (next && item.timeEnd && item.timeEnd === next.timeStart) showEnd = false;
          const modeObj = TRANSPORT_MODES.find(m => m.id === item.mode) || TRANSPORT_MODES[1];
          html += `<div class="relative flex group items-stretch cursor-pointer py-4" onclick="openFormModal('transport', '${item.id}')">
            <div class="w-[80px] shrink-0 text-right pr-6 py-8 flex flex-col justify-between items-end font-bold font-mono text-brand-textMain text-sm opacity-90">
              <span class="${showStart ? 'text-base' : 'opacity-0'}">${item.timeStart}</span>
              <span class="text-[10px] font-bold text-brand-primary/50 uppercase tracking-widest">${item.duration || ''}</span>
              <span class="${showEnd ? 'text-base' : 'opacity-0'}">${item.timeEnd || ''}</span>
            </div>
            <div class="w-6 shrink-0 flex flex-col items-center relative self-stretch">${lineHtml}</div>
            <div class="flex-1 pl-8 py-4">
              <div class="bg-slate-50 p-6 rounded-[32px] border border-slate-100 flex items-center justify-between group-hover:border-brand-primary group-hover:bg-white group-hover:shadow-sm transition-all">
                <div class="flex items-center gap-5">
                  <div class="w-12 h-12 rounded-2xl bg-white border border-slate-200 flex items-center justify-center text-brand-accent shadow-sm shrink-0"><i class="${modeObj.icon} text-lg"></i></div>
                  <div>
                    <p class="text-[10px] font-bold uppercase tracking-[3px] text-brand-accent opacity-80 mb-1">${item.operator || ''} ${item.vehicleNo || ''}</p>
                    <h4 class="font-bold text-brand-textMain text-lg uppercase tracking-tight leading-tight">${item.name}</h4>
                    ${costStr}
                  </div>
                </div>
              </div>
            </div>
          </div>`;
        }
      });
      container.innerHTML = html + '</div>';
    }

    window.openFormModal = (type, itemId = null) => {
      state.editingId = itemId;
      const plan = state.plans.find(p => p.id === state.currentPlanId);
      const content = document.getElementById('sheet-content');
      const headerTitle = document.getElementById('sheet-title');
      let item = itemId ? plan.itinerary[state.activeDay].find(i => i.id === itemId) : null;
      
      document.getElementById('modal-overlay').classList.remove('hidden');
      document.getElementById('sheet-form').classList.remove('closed');
      document.getElementById('sheet-form').classList.add('open');

      if (type === 'new-plan') {
        headerTitle.innerText = "建立新行程";
        content.innerHTML = `<div class="space-y-8">
          <div><label class="text-[11px] font-bold text-slate-500 block mb-2 uppercase tracking-[3px]">行程名稱 <span class="text-red-400">*</span></label><input id="f-title" type="text" placeholder="例：2026 夏日關西自由行" class="input-flat font-bold text-xl"></div>
          <div class="flex gap-6"><div class="flex-1"><label class="text-[11px] font-bold text-slate-500 block mb-2 uppercase tracking-[3px]">開始日期</label><input id="f-start-date" type="date" class="input-flat font-bold"></div><div class="flex-1"><label class="text-[11px] font-bold text-slate-500 block mb-2 uppercase tracking-[3px]">結束日期</label><input id="f-end-date" type="date" class="input-flat font-bold"></div></div>
          <div><label class="text-[11px] font-bold text-slate-500 block mb-2 uppercase tracking-[3px]">預設住宿飯店</label><input id="f-acc" type="text" placeholder="例：新宿格拉斯麗飯店" class="input-flat font-bold"></div>
          <div class="flex gap-4 pt-6"><button onclick="closeSheet()" class="flex-1 py-5 border-2 border-slate-100 rounded-2xl font-bold text-slate-400 hover:bg-slate-50 transition-all">取消</button><button onclick="createNewPlan()" class="flex-1 py-5 bg-brand-primary text-white rounded-2xl font-bold shadow-lg shadow-brand-primary/20 active:scale-95 transition-all">建立旅程</button></div></div>`;
      } else if (type === 'plan-info') {
        headerTitle.innerText = "行程資訊設定";
        content.innerHTML = `<div class="space-y-8">
          <div><label class="text-[11px] font-bold text-slate-500 block mb-2 uppercase tracking-[3px]">名稱</label><input id="f-title" type="text" value="${plan.title}" class="input-flat font-bold text-xl"></div>
          <div class="flex gap-6"><div class="flex-1"><label class="text-[11px] font-bold text-slate-500 block mb-2 uppercase tracking-[3px]">日期</label><input id="f-date" type="date" value="${plan.startDate}" class="input-flat font-bold"></div><div class="w-32"><label class="text-[11px] font-bold text-slate-500 block mb-2 uppercase tracking-[3px]">天數</label><input id="f-days" type="number" value="${plan.days}" class="input-flat font-bold text-center"></div></div>
          <div><label class="text-[11px] font-bold text-slate-500 block mb-2 uppercase tracking-[3px]">預設住宿飯店</label><input id="f-acc" type="text" value="${plan.accommodation || ''}" class="input-flat font-bold"></div>
          <div class="pt-6 space-y-4">
            <button onclick="updatePlanInfo()" class="w-full py-5 bg-brand-primary text-white rounded-2xl font-bold shadow-lg active:scale-95 transition-all">儲存計畫變更</button>
            <button onclick="deletePlan()" class="w-full py-4 bg-red-50 text-red-500 font-bold rounded-2xl border border-red-100 hover:bg-red-100 transition-all text-xs uppercase tracking-[3px]">刪除整個行程計畫</button>
          </div></div>`;
      } else {
        const isLoc = type === 'location';
        headerTitle.innerText = item ? '編輯行程項目' : (isLoc ? '新增景點地點' : '新增交通工具');
        let quickFills = '';
        if (isLoc && plan.accommodation) quickFills = `<button onclick="fillField('f-name','${plan.accommodation}', 'hotel')" class="px-4 py-2 bg-slate-100 text-brand-dark rounded-xl text-[10px] font-bold uppercase tracking-[2px] border border-slate-200 hover:bg-brand-light hover:border-brand-primary transition-all shadow-sm"><i class="fa-solid fa-hotel mr-2 text-brand-primary"></i> 帶入預設飯店</button>`;

        content.innerHTML = `<div class="space-y-8">
          <div class="flex gap-4 overflow-x-auto hide-scrollbar shrink-0 pb-1">${quickFills}</div>
          <div class="flex gap-6">
            <div class="flex-1"><label class="text-[11px] font-bold text-slate-500 uppercase block mb-2 tracking-[3px]">開始時間 <span class="text-brand-primary">*</span></label><input id="f-start" type="time" value="${item?.timeStart || '08:00'}" class="input-flat text-2xl font-mono font-bold"></div>
            <div class="flex-1"><label class="text-[11px] font-bold text-slate-500 uppercase block mb-2 tracking-[3px]">結束時間</label><input id="f-end" type="time" value="${item?.timeEnd || ''}" class="input-flat text-2xl font-mono font-bold"></div>
          </div>
          ${isLoc ? `
            <div><label class="text-[11px] font-bold text-slate-500 uppercase block mb-3 tracking-[3px]">地點類型</label><div class="grid grid-cols-4 gap-4">${LOCATION_MODES.map(m => `<button onclick="selectMode(this)" data-mode="${m.id}" class="mode-btn h-16 rounded-2xl border-2 border-slate-100 bg-slate-50 flex items-center justify-center transition-all ${item?.locMode === m.id ? 'active-mode' : (isLoc && m.id==='spot' && !item ? 'active-mode' : '')}"><i class="${m.icon} text-xl"></i></button>`).join('')}</div></div>
            <div><label class="text-[11px] font-bold text-slate-500 block mb-2 uppercase tracking-[3px]">地點名稱</label><input id="f-name" type="text" placeholder="輸入景點、餐廳或飯店名稱..." value="${item?.name || ''}" class="input-flat font-bold text-lg"></div>
            <div><label class="text-[11px] font-bold text-slate-500 block mb-2 uppercase tracking-[3px]">行程備註</label><textarea id="f-sub" placeholder="門票資訊、必吃推薦、提醒事項..." class="input-flat font-normal text-sm h-28 resize-none leading-relaxed">${item?.subtitle || ''}</textarea></div>
            <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200"><label class="flex items-center gap-4 text-sm font-bold text-brand-dark cursor-pointer"><input type="checkbox" id="f-through" ${item?.isThrough ? 'checked' : ''} class="w-6 h-6 accent-brand-primary rounded-lg border-2"> 設為「直通站點」(免下車/不下車)</label></div>
          ` : `
            <div><label class="text-[11px] font-bold text-slate-500 uppercase block mb-3 tracking-[3px]">交通工具</label><div class="grid grid-cols-5 gap-3">${TRANSPORT_MODES.map(m => `<button onclick="selectMode(this)" data-mode="${m.id}" class="mode-btn h-14 rounded-xl border-2 border-slate-100 bg-slate-50 flex items-center justify-center transition-all ${item?.mode === m.id ? 'active-mode' : (!isLoc && m.id==='train' && !item ? 'active-mode' : '')}"><i class="${m.icon} text-lg"></i></button>`).join('')}</div></div>
            <div class="flex gap-4"><div class="flex-1"><label class="text-[11px] font-bold text-slate-500 block mb-2 uppercase tracking-[3px]">業者名稱</label><input id="f-op" type="text" placeholder="例：JR 西日本" value="${item?.operator || ''}" class="input-flat font-bold"></div><div class="flex-1"><label class="text-[11px] font-bold text-slate-500 block mb-2 uppercase tracking-[3px]">班次/車次</label><input id="f-veh" type="text" placeholder="例：Haruka 23" value="${item?.vehicleNo || ''}" class="input-flat font-bold"></div></div>
            <div><label class="text-[11px] font-bold text-slate-500 block mb-2 uppercase tracking-[3px]">路線或目的地</label><input id="f-name" type="text" placeholder="例：關西空港 → 天王寺" value="${item?.name || ''}" class="input-flat font-bold text-lg"></div>
            <div class="flex gap-4"><div class="flex-1"><label class="text-[11px] font-bold text-slate-500 block mb-2 uppercase tracking-[3px]">耗時</label><input id="f-dur" type="text" placeholder="35 分" value="${item?.duration || ''}" class="input-flat font-bold"></div><div class="flex-1"><label class="text-[11px] font-bold text-slate-500 block mb-2 uppercase tracking-[3px]">站數</label><input id="f-extra" type="text" placeholder="2 站" value="${item?.extraInfo || ''}" class="input-flat font-bold"></div></div>
          `}
          <div class="bg-slate-100 p-8 rounded-[32px] border border-slate-200 shadow-inner"><div class="flex justify-between items-center mb-4"><label class="text-[11px] font-bold text-slate-500 uppercase tracking-[3px]">費用統計</label><div class="flex gap-3 bg-white p-1.5 rounded-xl border border-slate-200"><button onclick="state.currency='JPY';document.getElementById('curr-sym').innerText='¥';this.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('text-brand-primary'));this.classList.add('text-brand-primary')" class="px-4 py-1 text-[11px] font-bold text-slate-500 ${state.currency==='JPY'?'text-brand-primary':''}">JPY</button><button onclick="state.currency='TWD';document.getElementById('curr-sym').innerText='$';this.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('text-brand-primary'));this.classList.add('text-brand-primary')" class="px-4 py-1 text-[11px] font-bold text-slate-500 ${state.currency==='TWD'?'text-brand-primary':''}">TWD</button></div></div><div class="flex items-center gap-4"><span id="curr-sym" class="text-3xl font-bold text-brand-dark">${state.currency==='TWD'?'$':'¥'}</span><input id="f-cost" type="number" placeholder="0" value="${item?.cost || ''}" class="w-full bg-transparent border-b-2 border-slate-300 outline-none font-bold text-3xl text-brand-dark focus:border-brand-primary pb-2 transition-all"></div></div>
          <div class="pt-4 space-y-4">
            <button onclick="saveItem('${type}')" class="w-full bg-brand-primary text-white py-6 rounded-3xl font-bold text-xl shadow-lg active:scale-[0.98] transition-all">儲存並同步雲端</button>
            ${itemId ? `<button onclick="deleteItem()" class="w-full py-3 text-red-500 font-bold text-xs uppercase opacity-70 hover:opacity-100 transition-all tracking-[4px]">移除此項目</button>` : ''}
          </div></div>`;
      }
    };

    window.fillField = (id, val, mode = null) => { document.getElementById(id).value = val; if(mode) { const btn = document.querySelector(`[data-mode="${mode}"]`); if(btn) selectMode(btn); } };
    window.createNewPlan = async () => {
      const title = document.getElementById('f-title').value;
      const startD = document.getElementById('f-start-date').value;
      const endD = document.getElementById('f-end-date').value;
      if (!title || !startD || !endD) return showToast("請完整填寫行程資訊");
      const diff = Math.ceil(Math.abs(new Date(endD) - new Date(startD)) / (1000 * 60 * 60 * 24)) + 1;
      const docRef = await addDoc(collection(db, 'artifacts', appId, 'users', state.user.uid, 'plans'), { title, days: diff, startDate: startD, accommodation: document.getElementById('f-acc').value, itinerary: {}, createdAt: serverTimestamp() });
      closeSheet(); openPlan(docRef.id);
    };

    window.selectMode = (btn) => { btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active-mode')); btn.classList.add('active-mode'); };
    window.closeSheet = () => { document.getElementById('modal-overlay').classList.add('hidden'); document.getElementById('sheet-form').classList.remove('open'); document.getElementById('sheet-form').classList.add('closed'); };
    
    window.saveItem = async (type) => {
      const plan = state.plans.find(p => p.id === state.currentPlanId);
      const itinerary = plan.itinerary || {};
      if (!itinerary[state.activeDay]) itinerary[state.activeDay] = [];
      const activeMode = document.querySelector('.active-mode')?.dataset.mode;
      const data = { id: state.editingId || Date.now().toString(), type, timeStart: document.getElementById('f-start').value, timeEnd: document.getElementById('f-end').value, cost: document.getElementById('f-cost').value, currency: state.currency };
      if (type === 'location') { data.locMode = activeMode || 'spot'; data.name = document.getElementById('f-name').value; data.subtitle = document.getElementById('f-sub').value; data.isThrough = document.getElementById('f-through').checked; } 
      else { data.mode = activeMode || 'train'; data.operator = document.getElementById('f-op').value; data.vehicleNo = document.getElementById('f-veh').value; data.name = document.getElementById('f-name').value; data.duration = document.getElementById('f-dur').value; data.extraInfo = document.getElementById('f-extra').value; }
      if (state.editingId) { const idx = itinerary[state.activeDay].findIndex(i => i.id === state.editingId); itinerary[state.activeDay][idx] = data; } 
      else { itinerary[state.activeDay].push(data); }
      await updateDoc(doc(db, 'artifacts', appId, 'users', state.user.uid, 'plans', state.currentPlanId), { itinerary });
      closeSheet(); showToast("雲端同步成功");
    };

    window.deleteItem = async () => {
      if (!confirm("確定刪除此項目？")) return;
      const plan = state.plans.find(p => p.id === state.currentPlanId);
      plan.itinerary[state.activeDay] = plan.itinerary[state.activeDay].filter(i => i.id !== state.editingId);
      await updateDoc(doc(db, 'artifacts', appId, 'users', state.user.uid, 'plans', state.currentPlanId), { itinerary: plan.itinerary });
      closeSheet();
    };

    window.updatePlanInfo = async () => { await updateDoc(doc(db, 'artifacts', appId, 'users', state.user.uid, 'plans', state.currentPlanId), { title: document.getElementById('f-title').value, startDate: document.getElementById('f-date').value, days: parseInt(document.getElementById('f-days').value), accommodation: document.getElementById('f-acc').value }); closeSheet(); };
    window.deletePlan = async () => { if (confirm("確定刪除整個行程？雲端資料將無法復原。")) { await deleteDoc(doc(db, 'artifacts', appId, 'users', state.user.uid, 'plans', state.currentPlanId)); state.currentPlanId = null; switchView('plans'); closeSheet(); } };

    window.handleExport = () => {
      const dataStr = JSON.stringify(state.plans, null, 2);
      const blob = new Blob([dataStr], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = `趣旅行_備份.json`; a.click();
      URL.revokeObjectURL(url); showToast('匯出備份成功');
    };

    window.handleImport = (e) => {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = async (event) => {
        try {
          const imported = JSON.parse(event.target.result);
          const plansToImport = (imported && imported.title && !Array.isArray(imported)) ? [imported] : imported;
          if (!Array.isArray(plansToImport)) throw new Error("Invalid");
          for (let p of plansToImport) {
            const cleanPlan = { title: p.title || "未命名行程", startDate: p.startDate || new Date().toISOString().split('T')[0], days: p.days || 1, accommodation: p.accommodation || "", itinerary: p.itinerary || {}, createdAt: serverTimestamp() };
            await addDoc(collection(db, 'artifacts', appId, 'users', state.user.uid, 'plans'), cleanPlan);
          }
          showToast('成功匯入舊版行程');
        } catch (err) { alert('匯入失敗，請確認檔案格式。'); }
      };
      reader.readAsText(file);
    };

    document.getElementById('btn-login-google').onclick = () => signInWithPopup(auth, new GoogleAuthProvider());
    document.querySelectorAll('.nav-item').forEach(btn => btn.onclick = () => switchView(btn.dataset.view));

    function showToast(msg) { const el = document.getElementById('toast'); document.getElementById('toast-msg').innerText = msg; el.classList.remove('opacity-0'); el.classList.add('opacity-100'); setTimeout(() => { el.classList.remove('opacity-100'); el.classList.add('opacity-0'); }, 2500); }

  </script>
</body>
</html>
