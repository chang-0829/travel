<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>趣．旅行 - 您的個人行程雲端平台</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              primary: '#0EA5E9', /* 活力天藍 */
              dark: '#0369A1',
              light: '#F0F9FF',
              bg: '#F8FAFC',
              card: '#FFFFFF',
              textMain: '#0F172A',
              textSub: '#64748B',
              accent: '#F59E0B'
            }
          },
          fontFamily: {
            sans: ['"LINE Seed TW"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    /* --- LINE Seed TW 字體整合 --- */
    @font-face { font-family: 'LINE Seed TW'; src: url('./fonts/LINESeedTW_OTF_Th.woff2') format('woff2'); font-weight: 300; font-style: normal; font-display: swap; }
    @font-face { font-family: 'LINE Seed TW'; src: url('./fonts/LINESeedTW_OTF_Rg.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: 'LINE Seed TW'; src: url('./fonts/LINESeedTW_OTF_Bd.woff2') format('woff2'); font-weight: 700; font-style: normal; font-display: swap; }

    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .bottom-sheet { transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); }
    .bottom-sheet.open { transform: translateY(0); opacity: 1; }
    .bottom-sheet.closed { transform: translateY(100%); opacity: 0; }
    .view-transition { transition: opacity 0.3s ease; }
    
    /* 專業排版專用 */
    .sidebar-active { background-color: #F0F9FF; color: #0EA5E9; border-right: 3px solid #0EA5E9; }
    
    @media (min-width: 768px) {
      .desktop-grid { display: grid; grid-template-columns: 280px 1fr 350px; height: 100vh; }
      #bottom-nav { display: none; }
      #sheet-form { 
        bottom: auto; top: 50%; left: 50%; 
        transform: translate(-50%, -40%) scale(0.95); 
        width: 600px; border-radius: 32px; 
      }
      #sheet-form.open { transform: translate(-50%, -50%) scale(1); }
    }
  </style>
</head>
<body class="bg-white text-brand-textMain font-sans antialiased overflow-hidden">

  <!-- APP 容器 -->
  <div id="app" class="w-full h-[100dvh] flex flex-col relative">
    
    <!-- Toast -->
    <div id="toast" class="fixed top-8 left-1/2 -translate-x-1/2 z-[100] bg-brand-textMain text-white px-6 py-3 rounded-full opacity-0 pointer-events-none transition-all duration-300 text-sm font-light flex items-center gap-2 border border-slate-700">
      <i class="fa-solid fa-circle-check text-brand-primary"></i> <span id="toast-msg"></span>
    </div>

    <!-- VIEW: 登入頁 -->
    <div id="view-login" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-brand-bg px-6 view-transition">
      <div id="login-card" class="w-full max-w-[420px] bg-white rounded-[40px] p-12 border border-slate-100 flex flex-col items-center">
        <div class="w-20 h-20 bg-brand-primary rounded-3xl flex items-center justify-center mb-8">
          <i class="fa-solid fa-compass text-white text-3xl"></i>
        </div>
        <h1 class="text-3xl font-bold text-brand-dark mb-3 tracking-tighter">趣．旅行</h1>
        <p class="text-brand-textSub mb-12 text-center text-sm font-light opacity-70">記錄您的所有精彩旅程</p>
        <button id="btn-login-google" class="w-full bg-white border border-slate-200 text-brand-textMain font-bold py-4 rounded-2xl flex items-center justify-center gap-4 hover:bg-slate-50 active:scale-[0.98] transition-all">
          <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Google 快速登入
        </button>
      </div>
    </div>

    <!-- 主內容區塊 -->
    <div id="app-inner" class="flex-1 w-full flex flex-col overflow-hidden bg-white">
      
      <!-- VIEW: 我的行程 (首頁) -->
      <div id="view-plans" class="hidden flex-1 flex flex-col overflow-hidden">
        <header class="pt-12 pb-6 px-8 shrink-0 flex justify-between items-center max-w-7xl mx-auto w-full">
          <h1 class="text-3xl font-bold text-brand-dark tracking-tighter">我的計畫</h1>
          <button id="btn-new-plan" class="bg-brand-primary text-white w-12 h-12 rounded-2xl flex items-center justify-center active:scale-90 transition-all">
            <i class="fa-solid fa-plus text-xl"></i>
          </button>
        </header>
        <div class="flex-1 overflow-y-auto bg-brand-bg pt-8 px-8 pb-28 hide-scrollbar">
          <div id="plans-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8 max-w-7xl mx-auto"></div>
        </div>
      </div>

      <!-- VIEW: 行程詳情 / 專業三欄編輯器 -->
      <div id="view-editor" class="hidden flex-1 flex flex-col overflow-hidden bg-white relative">
        <div class="desktop-grid flex-1 flex flex-col md:grid">
          
          <!-- 左側欄：行程概覽與天數 -->
          <aside class="hidden md:flex flex-col bg-white border-r border-slate-100 overflow-y-auto hide-scrollbar">
            <div class="p-8 border-b border-slate-50">
              <button onclick="switchView('plans')" class="text-slate-400 hover:text-brand-primary transition-colors flex items-center gap-2 text-sm font-light mb-6">
                <i class="fa-solid fa-chevron-left"></i> 返回列表
              </button>
              <h2 id="side-plan-title" class="font-bold text-2xl text-brand-dark leading-tight uppercase tracking-tighter mb-2"></h2>
              <p id="side-plan-date" class="text-[10px] text-brand-primary font-bold uppercase tracking-[2px]"></p>
            </div>
            <div id="side-days-tabs" class="flex-1 py-4">
              <!-- JS 注入垂直分頁 -->
            </div>
            <div class="p-6 border-t border-slate-50">
               <button id="btn-edit-plan-info-side" class="w-full py-3 rounded-xl border border-slate-100 text-slate-400 text-xs font-light hover:bg-slate-50 transition-all flex items-center justify-center gap-2">
                 <i class="fa-solid fa-gear"></i> 行程設定
               </button>
            </div>
          </aside>

          <!-- 中間欄：核心時間軸 -->
          <main class="flex-1 flex flex-col bg-white overflow-hidden">
            <!-- 手機版頂部欄 (電腦版隱藏) -->
            <header class="md:hidden bg-white pt-10 pb-4 px-6 shrink-0 border-b border-slate-100 flex items-center justify-between">
              <button onclick="switchView('plans')" class="text-brand-textMain"><i class="fa-solid fa-arrow-left text-xl"></i></button>
              <h2 id="mobile-plan-title" class="font-bold text-brand-textMain truncate px-4"></h2>
              <button id="btn-edit-plan-info-mob" class="text-brand-textSub"><i class="fa-solid fa-sliders text-lg"></i></button>
            </header>
            
            <!-- 手機版天數切換 (電腦版隱藏) -->
            <div class="md:hidden bg-white px-6 py-4 shrink-0 border-b border-slate-50 overflow-x-auto hide-scrollbar">
              <div id="mobile-days-tabs" class="flex gap-3"></div>
            </div>

            <!-- 時間軸容器 -->
            <div class="flex-1 overflow-y-auto px-6 py-10 hide-scrollbar relative">
               <div id="timeline-container" class="max-w-2xl mx-auto w-full"></div>
            </div>

            <!-- 懸浮動作按鈕 -->
            <div class="absolute bottom-28 md:bottom-10 right-6 flex flex-col gap-3 z-20">
              <button id="btn-add-location" class="flex items-center justify-center gap-2 bg-brand-textMain text-white font-bold h-14 px-6 rounded-2xl border border-brand-textMain hover:bg-black transition-all">
                <i class="fa-solid fa-location-dot"></i> <span class="text-sm font-light">地點</span>
              </button>
              <button id="btn-add-transport" class="flex items-center justify-center gap-2 bg-brand-primary text-white font-bold h-14 px-6 rounded-2xl border border-brand-primary hover:bg-brand-dark transition-all">
                <i class="fa-solid fa-train-tram"></i> <span class="text-sm font-light">交通</span>
              </button>
            </div>
          </main>

          <!-- 右側欄：地圖/資訊預覽 (電腦版限定) -->
          <aside class="hidden md:flex flex-col bg-brand-bg border-l border-slate-100 relative">
             <div class="absolute inset-0 flex flex-col items-center justify-center p-10 text-center text-slate-300">
                <i class="fa-solid fa-map-location-dot text-6xl mb-4 opacity-20"></i>
                <p class="text-sm font-light">地圖預覽功能開發中</p>
                <div class="mt-8 w-full h-64 border border-dashed border-slate-200 rounded-3xl flex items-center justify-center text-[10px] uppercase tracking-widest">Map Area</div>
             </div>
          </aside>
        </div>
      </div>

      <!-- VIEW: 個人中心 -->
      <div id="view-profile" class="hidden flex-1 flex flex-col items-center justify-center px-8 bg-brand-bg">
         <div class="w-24 h-24 bg-white rounded-[32px] mb-6 overflow-hidden border border-slate-200 shadow-sm"><img id="user-photo" src="https://ui-avatars.com/api/?name=User" class="w-full h-full object-cover"></div>
         <h2 id="user-name" class="text-2xl font-bold text-brand-textMain mb-1 tracking-tighter"></h2>
         <p id="user-email" class="text-xs text-brand-textSub font-light mb-12 tracking-wide"></p>
         <button id="btn-logout" class="w-full max-w-xs py-4 bg-white text-red-500 font-bold rounded-2xl border border-red-100 hover:bg-red-50 transition-all flex items-center justify-center gap-3">登出帳號</button>
      </div>

      <!-- 底部分頁導覽 (僅手機版顯示) -->
      <nav id="bottom-nav" class="fixed bottom-0 inset-x-0 bg-white/95 backdrop-blur-md border-t border-slate-100 h-20 shrink-0 flex items-center justify-around px-8 z-[40]">
        <button class="nav-item flex flex-col items-center gap-1 group relative active" data-view="plans">
          <i class="fa-solid fa-calendar-check text-xl text-brand-textSub group-[.active]:text-brand-primary transition-all"></i>
          <span class="text-[10px] font-bold text-brand-textSub group-[.active]:text-brand-primary uppercase tracking-tighter">行程列表</span>
        </button>
        <button class="nav-item flex flex-col items-center gap-1 group relative" data-view="profile">
          <i class="fa-solid fa-user-gear text-xl text-brand-textSub group-[.active]:text-brand-primary transition-all"></i>
          <span class="text-[10px] font-bold text-brand-textSub group-[.active]:text-brand-primary uppercase tracking-tighter">設定</span>
        </button>
      </nav>
    </div>
  </div>

  <!-- 遮罩與彈窗 -->
  <div id="modal-overlay" class="hidden fixed inset-0 z-[60] bg-slate-900/20 backdrop-blur-[2px] transition-opacity"></div>
  <div id="sheet-form" class="bottom-sheet closed fixed inset-x-0 bottom-0 z-[61] bg-white rounded-t-[40px] max-h-[90vh] flex flex-col mx-auto overflow-hidden border border-slate-100">
     <div id="sheet-header" class="px-8 py-6 border-b border-slate-50 flex justify-between items-center shrink-0">
        <h3 id="sheet-title" class="text-xl font-bold text-brand-dark tracking-tight">建立新行程</h3>
        <button onclick="closeSheet()" class="text-slate-300 hover:text-brand-primary transition-colors"><i class="fa-solid fa-circle-xmark text-2xl"></i></button>
     </div>
     <div id="sheet-content" class="p-8 md:p-10 overflow-y-auto hide-scrollbar"></div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
    import { getFirestore, doc, collection, onSnapshot, query, addDoc, deleteDoc, updateDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    const firebaseConfig = { apiKey: "AIzaSyCQF8A3ieML0JP3X8X78NCRuiUETRAiu5E", authDomain: "travel-96009.firebaseapp.com", projectId: "travel-96009", storageBucket: "travel-96009.firebasestorage.app", messagingSenderId: "578860064042", appId: "1:578860064042:web:b147880df3a01dd8f75253" };
    const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app); const appId = "travel-platform-v1";

    const TRANSPORT_MODES = [ { id: 'train', label: '電車', icon: 'fa-solid fa-train' }, { id: 'bus', label: '公車', icon: 'fa-solid fa-bus' }, { id: 'car', label: '開車', icon: 'fa-solid fa-car' }, { id: 'walk', label: '步行', icon: 'fa-solid fa-person-walking' }, { id: 'plane', label: '飛機', icon: 'fa-solid fa-plane' } ];
    const LOCATION_MODES = [ { id: 'spot', label: '景點', icon: 'fa-solid fa-location-dot' }, { id: 'hotel', label: '住宿', icon: 'fa-solid fa-hotel' }, { id: 'food', label: '美食', icon: 'fa-solid fa-utensils' }, { id: 'shop', label: '購物', icon: 'fa-solid fa-bag-shopping' }, { id: 'airport', label: '機場', icon: 'fa-solid fa-plane-arrival' } ];

    let state = { user: null, plans: [], currentPlanId: null, activeDay: 1 };

    onAuthStateChanged(auth, (user) => {
      state.user = user;
      if (user) {
        document.getElementById('view-login').classList.add('opacity-0', 'pointer-events-none');
        setTimeout(() => document.getElementById('view-login').classList.add('hidden'), 300);
        document.getElementById('user-name').innerText = user.displayName;
        document.getElementById('user-email').innerText = user.email;
        if (user.photoURL) document.getElementById('user-photo').src = user.photoURL;
        switchView('plans'); listenToPlans();
      } else {
        closeSheet(); document.getElementById('view-login').classList.remove('hidden', 'opacity-0', 'pointer-events-none');
        switchView('login');
      }
    });

    function listenToPlans() {
      if (!state.user) return;
      const q = collection(db, 'artifacts', appId, 'users', state.user.uid, 'plans');
      onSnapshot(q, (snapshot) => {
        state.plans = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderPlansList();
        if (state.currentPlanId) {
          const activePlan = state.plans.find(p => p.id === state.currentPlanId);
          if (activePlan) renderEditor(activePlan);
        }
      });
    }

    window.switchView = (v) => {
      ['plans', 'editor', 'profile'].forEach(id => document.getElementById(`view-${id}`)?.classList.add('hidden'));
      const target = document.getElementById(`view-${v}`);
      if (target) target.classList.remove('hidden');
      document.querySelectorAll('.nav-item').forEach(item => item.classList.toggle('active', item.dataset.view === v));
    };

    function renderPlansList() {
      const container = document.getElementById('plans-list');
      if (state.plans.length === 0) { container.innerHTML = `<div class="col-span-full py-24 text-center text-slate-300 font-light"><i class="fa-solid fa-map-location-dot text-6xl mb-6 opacity-20"></i><p>暫時沒有行程</p></div>`; return; }
      container.innerHTML = state.plans.sort((a, b) => b.createdAt - a.createdAt).map(plan => `
        <div onclick="openPlan('${plan.id}')" class="bg-white rounded-[32px] overflow-hidden border border-slate-100 flex h-32 active:scale-[0.98] transition-all cursor-pointer hover:border-brand-primary">
          <div class="w-28 bg-brand-light flex items-center justify-center text-brand-primary text-3xl opacity-30"><i class="fa-solid fa-plane-up"></i></div>
          <div class="flex-1 p-6 flex flex-col justify-center overflow-hidden">
            <h3 class="font-bold text-brand-textMain text-lg truncate tracking-tight uppercase">${plan.title}</h3>
            <p class="text-[10px] text-brand-primary font-bold uppercase tracking-[2px] opacity-80">${plan.startDate} · ${plan.days} DAYS</p>
          </div>
        </div>
      `).join('');
    }

    window.openPlan = (id) => { state.currentPlanId = id; state.activeDay = 1; renderEditor(state.plans.find(p=>p.id===id)); switchView('editor'); };

    function renderEditor(plan) {
      document.getElementById('mobile-plan-title').innerText = plan.title;
      document.getElementById('side-plan-title').innerText = plan.title;
      document.getElementById('side-plan-date').innerText = `${plan.startDate} · ${plan.days} DAYS`;
      
      const tabHTML = Array.from({length: plan.days}, (_, i) => `
        <button onclick="state.activeDay = ${i+1}; renderEditor(state.plans.find(p=>p.id===state.currentPlanId))" 
          class="w-full text-left px-8 py-5 transition-all text-sm font-light ${state.activeDay === i+1 ? 'sidebar-active font-bold' : 'text-slate-400 hover:bg-slate-50'}">
          <div class="flex justify-between items-center">
            <span>Day ${i+1}</span>
            <i class="fa-solid fa-chevron-right text-[10px] opacity-20"></i>
          </div>
        </button>`).join('');
      document.getElementById('side-days-tabs').innerHTML = tabHTML;
      
      document.getElementById('mobile-days-tabs').innerHTML = Array.from({length: plan.days}, (_, i) => `
        <button onclick="state.activeDay = ${i+1}; renderEditor(state.plans.find(p=>p.id===state.currentPlanId))" 
          class="shrink-0 px-6 py-2.5 rounded-2xl font-bold text-[11px] uppercase tracking-[2px] transition-all border ${state.activeDay === i+1 ? 'bg-brand-primary text-white border-brand-primary' : 'bg-slate-50 text-brand-textSub border-slate-100'}">Day ${i+1}</button>`).join('');

      const container = document.getElementById('timeline-container');
      const items = (plan.itinerary && plan.itinerary[state.activeDay]) || [];
      if (items.length === 0) { container.innerHTML = `<div class="py-24 text-center text-slate-200 font-light"><p class="font-bold uppercase tracking-widest">No plans yet</p></div>`; return; }

      let html = '<div class="relative pb-12">';
      items.sort((a, b) => a.timeStart.localeCompare(b.timeStart)).forEach((item, index, arr) => {
        const isFirst = index === 0; const isLast = index === arr.length - 1;
        let lineHtml = (arr.length > 1) ? `<div class="absolute ${isFirst ? 'top-[26px] bottom-0' : (isLast ? 'top-0 h-[26px]' : 'top-0 bottom-0')} w-[2px] bg-brand-primary left-[90px] opacity-10"></div>` : '';
        
        if (item.type === 'location') {
          html += `<div class="relative flex group py-6 cursor-pointer" onclick="editItem('${item.id}', 'location')">
            <div class="w-[80px] shrink-0 text-right pr-6 pt-1 flex flex-col font-bold font-mono text-brand-textMain text-sm leading-tight tracking-tighter opacity-80">
              <span>${item.timeStart}</span>
              ${item.timeEnd ? `<span class="opacity-20 text-[11px]">${item.timeEnd}</span>` : ''}
            </div>
            <div class="w-6 shrink-0 flex flex-col items-center relative self-stretch">${lineHtml}<div class="w-3.5 h-3.5 rounded-full border-2 border-brand-primary bg-white z-10 mt-[6px]"></div></div>
            <div class="flex-1 pl-6">
              <h4 class="font-bold text-brand-textMain text-lg tracking-tight uppercase">${item.name}</h4>
              ${item.subtitle ? `<p class="text-xs font-light text-brand-textSub mt-1 opacity-70">${item.subtitle}</p>` : ''}
            </div>
          </div>`;
        } else {
          const modeObj = TRANSPORT_MODES.find(m => m.id === item.mode) || TRANSPORT_MODES[0];
          html += `<div class="relative flex group items-stretch cursor-pointer py-2" onclick="editItem('${item.id}', 'transport')">
            <div class="w-[80px] shrink-0 text-right pr-6 py-6 flex flex-col justify-between items-end font-bold font-mono text-brand-textMain text-sm opacity-80">
              <span>${item.timeStart}</span>
              <span class="text-[10px] font-light text-brand-textSub opacity-40 uppercase tracking-widest">${item.duration || ''}</span>
              <span>${item.timeEnd || ''}</span>
            </div>
            <div class="w-6 shrink-0 flex flex-col items-center relative self-stretch">${lineHtml}</div>
            <div class="flex-1 pl-6 py-4">
              <div class="bg-slate-50 p-5 rounded-2xl border border-slate-100 flex items-center justify-between group-hover:border-brand-primary transition-all">
                <div class="flex items-center gap-4">
                  <div class="w-10 h-10 rounded-xl bg-white border border-slate-100 flex items-center justify-center text-brand-primary shadow-sm"><i class="${modeObj.icon}"></i></div>
                  <div>
                    <p class="text-[10px] font-bold uppercase tracking-[2px] text-brand-primary opacity-60">${item.operator || ''} ${item.vehicleNo || ''}</p>
                    <h4 class="font-bold text-brand-textMain uppercase tracking-tight">${item.name}</h4>
                  </div>
                </div>
              </div>
            </div>
          </div>`;
        }
      });
      container.innerHTML = html + '</div>';
    }

    window.openSheet = (type, itemId = null) => {
      const plan = state.plans.find(p => p.id === state.currentPlanId);
      const content = document.getElementById('sheet-content');
      const headerTitle = document.getElementById('sheet-title');
      let item = itemId ? plan.itinerary[state.activeDay].find(i => i.id === itemId) : null;
      document.getElementById('modal-overlay').classList.remove('hidden');
      document.getElementById('sheet-form').classList.remove('closed');
      document.getElementById('sheet-form').classList.add('open');

      if (type === 'new-plan') {
        headerTitle.innerText = "建立新行程";
        content.innerHTML = `
          <div class="space-y-6">
            <div><label class="text-[11px] font-light text-slate-400 block mb-2 uppercase tracking-[2px]">行程名稱</label><input id="f-title" type="text" placeholder="例：東京、橫濱 五日遊" class="w-full bg-slate-50 border border-slate-100 p-4 rounded-xl outline-none font-bold focus:border-brand-primary transition-all"></div>
            <div class="flex gap-4">
              <div class="flex-1"><label class="text-[11px] font-light text-slate-400 block mb-2 uppercase tracking-[2px]">開始日期</label><input id="f-start-date" type="date" class="w-full bg-slate-50 border border-slate-100 p-4 rounded-xl outline-none font-bold"></div>
              <div class="flex-1"><label class="text-[11px] font-light text-slate-400 block mb-2 uppercase tracking-[2px]">結束日期</label><input id="f-end-date" type="date" class="w-full bg-slate-50 border border-slate-100 p-4 rounded-xl outline-none font-bold"></div>
            </div>
            <div class="flex gap-4 pt-6"><button onclick="closeSheet()" class="flex-1 py-4 border border-slate-100 rounded-xl font-light text-slate-400 hover:bg-slate-50 transition-all">取消</button><button onclick="createNewPlan()" class="flex-1 py-4 bg-brand-primary text-white rounded-xl font-bold active:scale-[0.98] transition-all">建立行程</button></div>
          </div>`;
      } else {
        const isLoc = type === 'location';
        headerTitle.innerText = item ? '編輯項目' : (isLoc ? '新增地點' : '新增交通');
        content.innerHTML = `<div class="space-y-6"><div class="flex gap-4">
          <div class="flex-1"><label class="text-[10px] font-light text-slate-400 uppercase tracking-[2px] block mb-2">起始</label><input id="f-start" type="time" value="${item?.timeStart || '08:00'}" class="w-full bg-slate-50 border border-slate-100 p-4 rounded-xl outline-none font-bold text-xl font-mono"></div>
          <div class="flex-1"><label class="text-[10px] font-light text-slate-400 uppercase tracking-[2px] block mb-2">到達</label><input id="f-end" type="time" value="${item?.timeEnd || ''}" class="w-full bg-slate-50 border border-slate-100 p-4 rounded-xl outline-none font-bold text-xl font-mono"></div>
        </div>
        ${isLoc ? `<div class="grid grid-cols-5 gap-3">${LOCATION_MODES.map(m => `<button onclick="selectMode(this)" data-mode="${m.id}" class="mode-btn h-14 rounded-2xl border border-slate-200 flex items-center justify-center transition-all ${item?.locMode === m.id ? 'active-mode' : (isLoc && m.id==='spot' && !item ? 'active-mode' : '')}"><i class="${m.icon} text-lg"></i></button>`).join('')}</div><input id="f-name" type="text" placeholder="名稱" value="${item?.name || ''}" class="w-full bg-slate-50 border border-slate-100 p-5 rounded-2xl outline-none font-bold text-lg"><textarea id="f-sub" placeholder="備註..." class="w-full bg-slate-50 border border-slate-100 p-5 rounded-2xl outline-none text-sm font-light h-24">${item?.subtitle || ''}</textarea>` : `<div class="grid grid-cols-5 gap-3">${TRANSPORT_MODES.map(m => `<button onclick="selectMode(this)" data-mode="${m.id}" class="mode-btn h-14 rounded-2xl border border-slate-200 flex items-center justify-center transition-all ${item?.mode === m.id ? 'active-mode' : (!isLoc && m.id==='train' && !item ? 'active-mode' : '')}"><i class="${m.icon} text-lg"></i></button>`).join('')}</div><div class="flex gap-3"><input id="f-op" type="text" placeholder="業者" value="${item?.operator || ''}" class="flex-1 bg-slate-50 border border-slate-100 p-4 rounded-xl outline-none font-bold text-sm"><input id="f-veh" type="text" placeholder="班次" value="${item?.vehicleNo || ''}" class="flex-1 bg-slate-50 border border-slate-100 p-4 rounded-xl outline-none font-bold text-sm"></div><input id="f-name" type="text" placeholder="目的地或路線" value="${item?.name || ''}" class="w-full bg-slate-50 border border-slate-100 p-5 rounded-2xl outline-none font-bold text-lg"><div class="flex gap-3"><input id="f-dur" type="text" placeholder="耗時" value="${item?.duration || ''}" class="flex-1 bg-slate-50 border border-slate-100 p-4 rounded-xl outline-none font-bold text-sm"><input id="f-extra" type="text" placeholder="站數" value="${item?.extraInfo || ''}" class="flex-1 bg-slate-50 border border-slate-100 p-4 rounded-xl outline-none font-bold text-sm"></div>`}
        <button onclick="saveItem('${itemId}', '${type}')" class="w-full ${isLoc ? 'bg-brand-textMain' : 'bg-brand-primary'} text-white py-5 rounded-[24px] font-bold text-lg mt-4 active:scale-[0.98] transition-all">儲存項目</button>
        ${itemId ? `<button onclick="deleteItem('${itemId}')" class="w-full py-4 text-red-500 font-light text-xs tracking-[2px] uppercase opacity-40 hover:opacity-100 transition-opacity">刪除項目</button>` : ''}</div>`;
      }
    };

    window.createNewPlan = async () => {
      const title = document.getElementById('f-title').value;
      const startD = document.getElementById('f-start-date').value;
      const endD = document.getElementById('f-end-date').value;
      if (!title || !startD || !endD) return showToast("請填寫完整資訊");
      const diff = Math.ceil(Math.abs(new Date(endD) - new Date(startD)) / (1000 * 60 * 60 * 24)) + 1;
      const docRef = await addDoc(collection(db, 'artifacts', appId, 'users', state.user.uid, 'plans'), { title, days: diff, startDate: startD, itinerary: {}, createdAt: serverTimestamp() });
      closeSheet(); openPlan(docRef.id);
    };

    window.selectMode = (btn) => { btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active-mode')); btn.classList.add('active-mode'); };
    window.closeSheet = () => { document.getElementById('modal-overlay').classList.add('hidden'); document.getElementById('sheet-form').classList.remove('open'); document.getElementById('sheet-form').classList.add('closed'); };
    window.saveItem = async (itemId, type) => { const plan = state.plans.find(p => p.id === state.currentPlanId); const itinerary = plan.itinerary || {}; if (!itinerary[state.activeDay]) itinerary[state.activeDay] = []; const activeMode = document.querySelector('.active-mode')?.dataset.mode; const data = { id: itemId || Date.now().toString(), type, timeStart: document.getElementById('f-start').value, timeEnd: document.getElementById('f-end').value, name: document.getElementById('f-name').value }; if (type === 'location') { data.locMode = activeMode || 'spot'; data.subtitle = document.getElementById('f-sub').value; } else { data.mode = activeMode || 'train'; data.operator = document.getElementById('f-op').value; data.vehicleNo = document.getElementById('f-veh').value; data.duration = document.getElementById('f-dur').value; data.extraInfo = document.getElementById('f-extra').value; } if (itemId) { const idx = itinerary[state.activeDay].findIndex(i => i.id === itemId); itinerary[state.activeDay][idx] = data; } else { itinerary[state.activeDay].push(data); } await updateDoc(doc(db, 'artifacts', appId, 'users', state.user.uid, 'plans', state.currentPlanId), { itinerary }); closeSheet(); showToast("同步成功"); };
    window.deleteItem = async (itemId) => { const plan = state.plans.find(p => p.id === state.currentPlanId); plan.itinerary[state.activeDay] = plan.itinerary[state.activeDay].filter(i => i.id !== itemId); await updateDoc(doc(db, 'artifacts', appId, 'users', state.user.uid, 'plans', state.currentPlanId), { itinerary: plan.itinerary }); closeSheet(); };
    window.editItem = (id, type) => openSheet(type, id);

    document.getElementById('btn-login-google').onclick = () => signInWithPopup(auth, new GoogleAuthProvider());
    document.getElementById('btn-logout').onclick = () => signOut(auth);
    document.querySelectorAll('.nav-item').forEach(btn => btn.onclick = () => switchView(btn.dataset.view));
    document.getElementById('btn-add-location').onclick = () => openSheet('location');
    document.getElementById('btn-add-transport').onclick = () => openSheet('transport');
    document.getElementById('btn-new-plan').onclick = () => openSheet('new-plan');
    document.getElementById('modal-overlay').onclick = closeSheet;

    function showToast(msg) { const el = document.getElementById('toast'); document.getElementById('toast-msg').innerText = msg; el.classList.remove('opacity-0', 'pointer-events-none'); el.classList.add('opacity-100'); setTimeout(() => el.classList.add('opacity-0', 'pointer-events-none'), 2500); }

    const style = document.createElement('style');
    style.innerHTML = `.active-mode { border-color: #0EA5E9 !important; background-color: #F0F9FF !important; color: #0EA5E9; font-weight: bold; } .nav-item.active i { color: #0EA5E9 !important; }`;
    document.head.appendChild(style);

  </script>
</body>
</html>
