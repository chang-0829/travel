<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>趣．旅行 - 您的個人行程雲端平台</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              primary: '#0EA5E9', /* 活力天藍 */
              dark: '#0369A1',
              light: '#F0F9FF',
              bg: '#F8FAFC',
              card: '#FFFFFF',
              textMain: '#0F172A',
              textSub: '#64748B',
              accent: '#F59E0B' /* 陽光橙 */
            }
          },
          boxShadow: {
            'soft': '0 4px 20px -2px rgba(14, 165, 233, 0.1)',
            'card': '0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05)',
            'btn': '0 10px 15px -3px rgba(14, 165, 233, 0.3)'
          }
        }
      }
    }
  </script>

  <style>
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .bottom-sheet { transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); }
    .bottom-sheet.open { transform: translateY(0); }
    .bottom-sheet.closed { transform: translateY(100%); }
    .view-transition { transition: opacity 0.3s ease; }
    .timeline-line { width: 3px; }
    
    /* Login Background */
    .login-bg {
      background: linear-gradient(135deg, #F0F9FF 0%, #E0F2FE 100%);
    }

    /* Floating Animation */
    @keyframes bounce-subtle {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .animate-bounce-subtle { animation: bounce-subtle 3s ease-in-out infinite; }

    /* Desktop Layout Adjustment */
    @media (min-width: 768px) {
      #app-inner { max-width: 1024px; margin: 0 auto; }
      #bottom-nav { width: 420px; left: 50% !important; transform: translateX(-50%); border-radius: 24px 24px 0 0; }
      #login-card { max-width: 400px; }
    }
  </style>
</head>
<body class="bg-brand-bg text-brand-textMain font-sans antialiased overflow-hidden">

  <!-- APP 容器 -->
  <div id="app" class="w-full h-[100dvh] flex flex-col relative">
    
    <!-- Toast -->
    <div id="toast" class="fixed top-8 left-1/2 -translate-x-1/2 z-[100] bg-brand-textMain text-white px-6 py-3 rounded-full shadow-2xl opacity-0 pointer-events-none transition-all duration-300 text-sm font-bold flex items-center gap-2">
      <i class="fa-solid fa-circle-check text-brand-primary"></i> <span id="toast-msg"></span>
    </div>

    <!-- VIEW: 登入頁 (New Layout) -->
    <div id="view-login" class="absolute inset-0 z-50 flex flex-col items-center justify-center login-bg px-6 view-transition">
      <div id="login-card" class="w-full bg-white rounded-[48px] p-10 shadow-card flex flex-col items-center transition-all">
        <div class="w-20 h-20 bg-brand-primary rounded-3xl flex items-center justify-center mb-6 shadow-btn animate-bounce-subtle">
          <i class="fa-solid fa-compass text-white text-3xl"></i>
        </div>
        
        <h1 class="text-3xl font-black text-brand-dark mb-2 tracking-tighter">趣．旅行</h1>
        <p class="text-brand-textSub mb-12 text-center text-sm font-bold opacity-60">個人旅行計畫 · 雲端同步</p>
        
        <button id="btn-login-google" class="w-full bg-white border border-gray-100 text-brand-textMain font-bold py-4 rounded-2xl flex items-center justify-center gap-4 shadow-sm hover:bg-gray-50 active:scale-[0.98] transition-all">
          <!-- Google SVG Logo -->
          <svg class="w-5 h-5" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Google 快速登入
        </button>

        <div class="mt-16 flex flex-col items-center gap-2">
          <div class="flex items-center gap-2 px-3 py-1 bg-brand-light rounded-full">
            <div class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></div>
            <span class="text-[9px] font-black text-brand-dark uppercase tracking-widest">System Online</span>
          </div>
          <p class="text-[10px] text-brand-textSub font-bold opacity-40">© 趣．旅行 行程管理平台</p>
        </div>
      </div>
    </div>

    <!-- 主內容區塊 -->
    <div id="app-inner" class="flex-1 w-full flex flex-col overflow-hidden bg-white">
      
      <!-- VIEW: 我的行程 -->
      <div id="view-plans" class="hidden flex-1 flex flex-col overflow-hidden">
        <header class="pt-12 pb-6 px-8 shrink-0 flex justify-between items-center">
          <h1 class="text-3xl font-black text-brand-textMain tracking-tighter">我的計畫</h1>
          <button id="btn-new-plan" class="bg-brand-primary text-white w-12 h-12 rounded-2xl flex items-center justify-center shadow-btn active:scale-90 transition-all">
            <i class="fa-solid fa-plus text-xl"></i>
          </button>
        </header>
        <div id="plans-list" class="flex-1 overflow-y-auto px-6 pb-28 hide-scrollbar grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 auto-rows-min">
          <!-- 行程卡片 -->
        </div>
      </div>

      <!-- VIEW: 行程詳情 / 編輯器 -->
      <div id="view-editor" class="hidden flex-1 flex flex-col overflow-hidden bg-white relative">
        <header class="bg-white pt-12 pb-4 px-6 shrink-0 border-b border-gray-50 flex items-center justify-between z-10">
          <button onclick="switchView('plans')" class="w-10 h-10 flex items-center justify-start text-brand-textMain hover:scale-110 transition-all">
            <i class="fa-solid fa-arrow-left text-xl"></i>
          </button>
          <div class="text-center flex-1">
            <h2 id="current-plan-title" class="font-black text-brand-textMain truncate px-4">載入中...</h2>
            <p id="current-plan-date" class="text-[10px] text-brand-primary font-black uppercase tracking-widest"></p>
          </div>
          <button id="btn-edit-plan-info" class="w-10 h-10 flex items-center justify-end text-brand-textSub">
            <i class="fa-solid fa-sliders text-lg"></i>
          </button>
        </header>

        <div class="bg-white px-6 py-4 shrink-0 border-b border-gray-50 overflow-x-auto hide-scrollbar">
          <div id="days-tabs" class="flex gap-3 snap-x"></div>
        </div>

        <div id="timeline-container" class="flex-1 overflow-y-auto px-4 pb-32 pt-6 relative bg-white md:px-16 lg:px-32">
          <!-- 時間軸內容 -->
        </div>

        <div class="absolute bottom-28 inset-x-0 px-6 flex justify-end gap-3 z-20 pointer-events-none md:bottom-12">
          <button id="btn-add-location" class="pointer-events-auto flex items-center justify-center gap-2 bg-brand-textMain text-white font-bold h-14 px-6 rounded-2xl shadow-xl active:scale-95 transition-all">
            <i class="fa-solid fa-location-dot"></i> <span class="text-sm">地點</span>
          </button>
          <button id="btn-add-transport" class="pointer-events-auto flex items-center justify-center gap-2 bg-brand-primary text-white font-bold h-14 px-6 rounded-2xl shadow-xl active:scale-95 transition-all">
            <i class="fa-solid fa-train-tram"></i> <span class="text-sm">交通</span>
          </button>
        </div>
      </div>

      <!-- VIEW: 個人中心 -->
      <div id="view-profile" class="hidden flex-1 flex flex-col items-center justify-center px-8 bg-brand-bg">
         <div class="w-24 h-24 bg-white rounded-[32px] mb-6 overflow-hidden border-4 border-white shadow-soft">
           <img id="user-photo" src="https://ui-avatars.com/api/?name=User" class="w-full h-full object-cover">
         </div>
         <h2 id="user-name" class="text-2xl font-black text-brand-textMain mb-1">旅行者</h2>
         <p id="user-email" class="text-xs text-brand-textSub font-bold mb-12 tracking-wide opacity-60"></p>
         <button id="btn-logout" class="w-full max-w-xs py-4 bg-white text-red-500 font-bold rounded-2xl shadow-soft hover:bg-red-50 transition-all flex items-center justify-center gap-3 border border-red-50">
           <i class="fa-solid fa-right-from-bracket"></i> 登出帳號
         </button>
      </div>

      <!-- 底部分頁導覽 -->
      <nav id="bottom-nav" class="hidden absolute bottom-0 inset-x-0 bg-white/95 backdrop-blur-md border-t border-gray-100 h-20 shrink-0 flex items-center justify-around px-8 z-[40] shadow-[0_-10px_30px_rgba(0,0,0,0.02)]">
        <button class="nav-item flex flex-col items-center gap-1 group relative active" data-view="plans">
          <i class="fa-solid fa-calendar-check text-xl text-brand-textSub group-[.active]:text-brand-primary transition-all"></i>
          <span class="text-[10px] font-black text-brand-textSub group-[.active]:text-brand-primary uppercase tracking-tighter">行程列表</span>
        </button>
        <button class="nav-item flex flex-col items-center gap-1 group relative" data-view="profile">
          <i class="fa-solid fa-user-gear text-xl text-brand-textSub group-[.active]:text-brand-primary transition-all"></i>
          <span class="text-[10px] font-black text-brand-textSub group-[.active]:text-brand-primary uppercase tracking-tighter">設定</span>
        </button>
      </nav>
    </div>

  </div> <!-- End App -->

  <!-- Modal Overlay -->
  <div id="modal-overlay" class="hidden fixed inset-0 z-[60] bg-brand-textMain/20 backdrop-blur-[2px] transition-opacity"></div>
  
  <!-- Sheet Form -->
  <div id="sheet-form" class="bottom-sheet closed fixed inset-x-0 bottom-0 z-[61] bg-white rounded-t-[40px] max-h-[90vh] flex flex-col shadow-2xl max-w-md mx-auto overflow-hidden">
     <div class="w-12 h-1 bg-gray-200 rounded-full mx-auto mt-4 mb-2 shrink-0"></div>
     <div id="sheet-content" class="p-8 pt-4 overflow-y-auto hide-scrollbar">
       <!-- Content Injected via JS -->
     </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
    import { getFirestore, doc, collection, onSnapshot, query, addDoc, deleteDoc, updateDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    // --------------------------------------------------
    // ✅ Firebase Config
    // --------------------------------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyCQF8A3ieML0JP3X8X78NCRuiUETRAiu5E",
      authDomain: "travel-96009.firebaseapp.com",
      projectId: "travel-96009",
      storageBucket: "travel-96009.firebasestorage.app",
      messagingSenderId: "578860064042",
      appId: "1:578860064042:web:b147880df3a01dd8f75253"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = "travel-platform-v1";

    const TRANSPORT_MODES = [
      { id: 'train', label: '電車', icon: 'fa-solid fa-train' },
      { id: 'bus', label: '公車', icon: 'fa-solid fa-bus' },
      { id: 'car', label: '開車', icon: 'fa-solid fa-car' },
      { id: 'walk', label: '步行', icon: 'fa-solid fa-person-walking' },
      { id: 'plane', label: '飛機', icon: 'fa-solid fa-plane' }
    ];

    const LOCATION_MODES = [
      { id: 'spot', label: '景點', icon: 'fa-solid fa-location-dot' },
      { id: 'hotel', label: '住宿', icon: 'fa-solid fa-hotel' },
      { id: 'food', label: '美食', icon: 'fa-solid fa-utensils' },
      { id: 'shop', label: '購物', icon: 'fa-solid fa-bag-shopping' },
      { id: 'airport', label: '機場', icon: 'fa-solid fa-plane-arrival' }
    ];

    let state = {
      user: null,
      plans: [],
      currentPlanId: null,
      activeDay: 1
    };

    // --------------------------------------------------
    // Auth Logic
    // --------------------------------------------------
    onAuthStateChanged(auth, (user) => {
      state.user = user;
      if (user) {
        document.getElementById('view-login').classList.add('opacity-0', 'pointer-events-none');
        setTimeout(() => document.getElementById('view-login').classList.add('hidden'), 300);
        document.getElementById('bottom-nav').classList.remove('hidden');
        
        document.getElementById('user-name').innerText = user.displayName;
        document.getElementById('user-email').innerText = user.email;
        if (user.photoURL) document.getElementById('user-photo').src = user.photoURL;

        switchView('plans');
        listenToPlans();
      } else {
        document.getElementById('view-login').classList.remove('hidden', 'opacity-0', 'pointer-events-none');
        document.getElementById('bottom-nav').classList.add('hidden');
        switchView('login');
      }
    });

    function listenToPlans() {
      if (!state.user) return;
      const q = collection(db, 'artifacts', appId, 'users', state.user.uid, 'plans');
      onSnapshot(q, (snapshot) => {
        state.plans = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderPlansList();
        if (state.currentPlanId) {
          const activePlan = state.plans.find(p => p.id === state.currentPlanId);
          if (activePlan) renderEditor(activePlan);
        }
      });
    }

    // --------------------------------------------------
    // View Management
    // --------------------------------------------------
    window.switchView = function(viewId) {
      ['plans', 'editor', 'profile'].forEach(v => {
        const el = document.getElementById(`view-${v}`);
        if (el) el.classList.add('hidden');
      });
      const target = document.getElementById(`view-${viewId}`);
      if (target) target.classList.remove('hidden');

      document.querySelectorAll('.nav-item').forEach(item => {
        item.classList.toggle('active', item.dataset.view === viewId);
      });
    };

    function renderPlansList() {
      const container = document.getElementById('plans-list');
      if (state.plans.length === 0) {
        container.innerHTML = `<div class="col-span-full py-24 text-center text-brand-textSub opacity-30"><i class="fa-solid fa-map-location-dot text-6xl mb-6"></i><p class="font-bold">暫時沒有任何行程，開始規劃您的「趣．旅行」吧！</p></div>`;
        return;
      }
      container.innerHTML = state.plans.sort((a, b) => b.createdAt - a.createdAt).map(plan => `
        <div onclick="openPlan('${plan.id}')" class="bg-white rounded-[32px] overflow-hidden shadow-soft border border-gray-100 flex h-32 active:scale-[0.98] transition-all cursor-pointer hover:border-brand-primary/20">
          <div class="w-28 bg-brand-light flex items-center justify-center text-brand-primary">
            <i class="fa-solid fa-plane-up text-3xl opacity-40"></i>
          </div>
          <div class="flex-1 p-6 flex flex-col justify-center overflow-hidden">
            <h3 class="font-black text-brand-textMain text-lg truncate tracking-tight">${plan.title}</h3>
            <p class="text-[10px] text-brand-primary mt-1 font-black uppercase tracking-widest opacity-80">${plan.startDate} · ${plan.days} DAYS</p>
          </div>
          <div class="px-6 flex items-center text-gray-200"><i class="fa-solid fa-angle-right"></i></div>
        </div>
      `).join('');
    }

    window.openPlan = function(id) {
      state.currentPlanId = id;
      state.activeDay = 1;
      const plan = state.plans.find(p => p.id === id);
      renderEditor(plan);
      switchView('editor');
    };

    function renderEditor(plan) {
      document.getElementById('current-plan-title').innerText = plan.title;
      document.getElementById('current-plan-date').innerText = `${plan.startDate} · ${plan.days} DAYS`;
      
      const tabs = document.getElementById('days-tabs');
      let tabsHtml = '';
      for (let i = 1; i <= plan.days; i++) {
        const active = state.activeDay === i;
        tabsHtml += `<button onclick="state.activeDay = ${i}; openPlan('${plan.id}')" class="snap-start shrink-0 px-6 py-2.5 rounded-2xl font-black text-[11px] uppercase tracking-widest transition-all border ${active ? 'bg-brand-primary text-white border-brand-primary shadow-btn' : 'bg-brand-light/40 text-brand-textSub border-transparent'}">Day ${i}</button>`;
      }
      tabs.innerHTML = tabsHtml;

      const timeline = document.getElementById('timeline-container');
      const items = (plan.itinerary && plan.itinerary[state.activeDay]) || [];
      
      if (items.length === 0) {
        timeline.innerHTML = `<div class="py-24 text-center text-brand-textSub opacity-20"><i class="fa-solid fa-route text-5xl mb-6"></i><p class="font-bold uppercase tracking-widest">Empty Schedule</p></div>`;
        return;
      }

      let html = '<div class="relative pl-2 pr-2 pb-12">';
      items.sort((a, b) => a.timeStart.localeCompare(b.timeStart)).forEach((item, index, arr) => {
        const isFirst = index === 0; const isLast = index === arr.length - 1;
        let lineHtml = (arr.length > 1) ? `<div class="absolute ${isFirst ? 'top-[26px] bottom-0' : (isLast ? 'top-0 h-[26px]' : 'top-0 bottom-0')} timeline-line bg-brand-primary z-0 opacity-10"></div>` : '';

        if (item.type === 'location') {
          const locObj = LOCATION_MODES.find(m => m.id === item.locMode) || LOCATION_MODES[0];
          html += `
            <div class="relative flex group py-5 cursor-pointer" onclick="editItem('${item.id}', 'location')">
              <div class="w-[76px] shrink-0 text-right pr-5 pt-[2px] flex flex-col font-black font-mono text-brand-textMain text-[15px] leading-tight tracking-tighter opacity-80">
                <span>${item.timeStart}</span>
                ${item.timeEnd ? `<span class="opacity-20 text-[12px]">${item.timeEnd}</span>` : ''}
              </div>
              <div class="w-6 shrink-0 flex flex-col items-center relative self-stretch">
                ${lineHtml}
                <div class="${item.isThrough ? 'w-4 h-4 border-2' : 'w-3.5 h-3.5 border-[3px]'} rounded-full border-brand-primary bg-white z-10 mt-[2px] shadow-sm"></div>
              </div>
              <div class="flex-1 pl-5">
                <div class="flex items-center gap-2">
                   <h4 class="font-black text-brand-textMain text-lg tracking-tight">${item.name}</h4>
                   ${item.isThrough ? '<span class="text-[9px] font-black uppercase text-white bg-brand-primary px-2 py-0.5 rounded tracking-widest">Through</span>' : ''}
                </div>
                ${item.subtitle ? `<p class="text-xs font-bold text-brand-textSub mt-1.5 leading-relaxed opacity-60">${item.subtitle}</p>` : ''}
              </div>
            </div>`;
        } else {
          let showStart = true; let showEnd = true;
          const prev = arr[index - 1]; const next = arr[index + 1];
          if (prev && item.timeStart === (prev.timeEnd || prev.timeStart)) showStart = false;
          if (next && item.timeEnd && item.timeEnd === next.timeStart) showEnd = false;

          const modeObj = TRANSPORT_MODES.find(m => m.id === item.mode) || TRANSPORT_MODES[0];
          html += `
            <div class="relative flex group items-stretch cursor-pointer" onclick="editItem('${item.id}', 'transport')">
              <div class="w-[76px] shrink-0 text-right pr-5 py-7 flex flex-col justify-between items-end font-black font-mono text-brand-textMain text-[15px] tracking-tighter opacity-80">
                <span class="${showStart ? '' : 'opacity-0'}">${item.timeStart}</span>
                <div class="flex flex-col items-end my-2">
                   <span class="text-[11px] font-black text-brand-textSub uppercase tracking-widest opacity-40">${item.duration || ''}</span>
                   ${item.extraInfo ? `<span class="text-[10px] font-black text-brand-primary flex items-center mt-1 tracking-widest uppercase">${item.extraInfo}<i class="fa-solid fa-caret-down ml-1 text-[8px] opacity-50"></i></span>` : ''}
                </div>
                <span class="${showEnd ? '' : 'opacity-0'}">${item.timeEnd || ''}</span>
              </div>
              <div class="w-6 shrink-0 flex flex-col items-center relative self-stretch">
                ${lineHtml}
              </div>
              <div class="flex-1 pl-5 py-7">
                 <div class="flex items-center gap-2 mb-2">
                   <div class="w-8 h-8 rounded-xl bg-brand-light text-brand-primary flex items-center justify-center shrink-0">
                     <i class="${modeObj.icon} text-sm"></i>
                   </div>
                   <span class="text-[11px] font-black uppercase tracking-widest text-brand-primary">${item.operator || ''} ${item.vehicleNo || ''}</span>
                 </div>
                 <h4 class="font-black text-brand-textMain text-lg ml-[40px] tracking-tight">${item.name || ''} ${item.direction ? `(${item.direction})` : ''}</h4>
              </div>
            </div>`;
        }
      });
      html += '</div>';
      timeline.innerHTML = html;
    }

    // --------------------------------------------------
    // Modal Functions
    // --------------------------------------------------
    window.openSheet = function(type, itemId = null) {
      const plan = state.plans.find(p => p.id === state.currentPlanId);
      const content = document.getElementById('sheet-content');
      let item = itemId ? plan.itinerary[state.activeDay].find(i => i.id === itemId) : null;
      
      document.getElementById('modal-overlay').classList.remove('hidden');
      document.getElementById('sheet-form').classList.remove('closed');
      document.getElementById('sheet-form').classList.add('open');

      if (type === 'plan-info') {
        content.innerHTML = `
          <h3 class="text-2xl font-black mb-8 text-brand-textMain tracking-tight text-center">行程細節</h3>
          <div class="space-y-6">
            <div><label class="text-[10px] font-black text-brand-textSub block mb-2 uppercase tracking-[2px]">行程名稱</label><input id="f-title" type="text" value="${plan.title}" class="w-full bg-brand-bg p-4 rounded-2xl outline-none font-black text-lg"></div>
            <div class="flex gap-4">
              <div class="flex-1"><label class="text-[10px] font-black text-brand-textSub block mb-2 uppercase tracking-[2px]">出發日期</label><input id="f-date" type="date" value="${plan.startDate}" class="w-full bg-brand-bg p-4 rounded-2xl outline-none font-mono font-bold"></div>
              <div class="w-28"><label class="text-[10px] font-black text-brand-textSub block mb-2 uppercase tracking-[2px]">天數</label><input id="f-days" type="number" value="${plan.days}" class="w-full bg-brand-bg p-4 rounded-2xl outline-none font-black text-center"></div>
            </div>
            <button onclick="updatePlanInfo()" class="w-full bg-brand-primary text-white py-5 rounded-[24px] font-black text-lg shadow-btn mt-6 active:scale-[0.98]">儲存設定</button>
            <button onclick="deletePlan()" class="w-full py-4 text-red-500 font-bold opacity-40 hover:opacity-100 text-xs tracking-widest uppercase mt-2">刪除行程</button>
          </div>
        `;
      } else {
        const isLoc = type === 'location';
        content.innerHTML = `
          <h3 class="text-2xl font-black mb-8 text-brand-textMain tracking-tight text-center">${item ? '編輯' : '新增'}${isLoc ? '地點' : '交通'}</h3>
          <div class="space-y-6">
            <div class="flex gap-4">
              <div class="flex-1"><label class="text-[10px] font-black text-brand-textSub uppercase tracking-[2px] mb-2 block">起始時間</label><input id="f-start" type="time" value="${item?.timeStart || '08:00'}" class="w-full bg-brand-bg p-4 rounded-2xl outline-none font-black text-xl font-mono"></div>
              <div class="flex-1"><label class="text-[10px] font-black text-brand-textSub uppercase tracking-[2px] mb-2 block">到達時間</label><input id="f-end" type="time" value="${item?.timeEnd || ''}" class="w-full bg-brand-bg p-4 rounded-2xl outline-none font-black text-xl font-mono"></div>
            </div>
            
            ${isLoc ? `
              <div class="grid grid-cols-5 gap-3">
                ${LOCATION_MODES.map(m => `<button onclick="selectMode(this)" data-mode="${m.id}" class="mode-btn h-14 rounded-2xl border border-gray-100 flex items-center justify-center transition-all ${item?.locMode === m.id ? 'active-mode' : (isLoc && m.id==='spot' && !item ? 'active-mode' : '')}"><i class="${m.icon} text-lg"></i></button>`).join('')}
              </div>
              <input id="f-name" type="text" placeholder="的地點名稱" value="${item?.name || ''}" class="w-full bg-brand-bg p-5 rounded-2xl outline-none font-black text-lg">
              <textarea id="f-sub" placeholder="備註、交通攻略..." class="w-full bg-brand-bg p-5 rounded-2xl outline-none text-sm font-bold h-24">${item?.subtitle || ''}</textarea>
              <label class="flex items-center gap-4 text-sm font-black text-brand-textMain cursor-pointer bg-brand-bg p-4 rounded-2xl"><input type="checkbox" id="f-through" ${item?.isThrough ? 'checked' : ''} class="w-6 h-6 accent-brand-primary"> 直通不換車站點</label>
            ` : `
              <div class="grid grid-cols-5 gap-3">
                ${TRANSPORT_MODES.map(m => `<button onclick="selectMode(this)" data-mode="${m.id}" class="mode-btn h-14 rounded-2xl border border-gray-100 flex items-center justify-center transition-all ${item?.mode === m.id ? 'active-mode' : (!isLoc && m.id==='train' && !item ? 'active-mode' : '')}"><i class="${m.icon} text-lg"></i></button>`).join('')}
              </div>
              <div class="flex gap-3">
                <input id="f-op" type="text" placeholder="交通業者" value="${item?.operator || ''}" class="flex-1 bg-brand-bg p-4 rounded-xl outline-none font-black text-sm">
                <input id="f-veh" type="text" placeholder="車次/班次" value="${item?.vehicleNo || ''}" class="flex-1 bg-brand-bg p-4 rounded-xl outline-none font-black text-sm">
              </div>
              <input id="f-name" type="text" placeholder="的地點或路線" value="${item?.name || ''}" class="w-full bg-brand-bg p-5 rounded-2xl outline-none font-black text-lg">
              <div class="flex gap-3">
                <input id="f-dur" type="text" placeholder="交通時長" value="${item?.duration || ''}" class="flex-1 bg-brand-bg p-4 rounded-xl outline-none font-black text-sm">
                <input id="f-extra" type="text" placeholder="站數" value="${item?.extraInfo || ''}" class="flex-1 bg-brand-bg p-4 rounded-xl outline-none font-black text-sm">
              </div>
            `}
            <button onclick="saveItem('${itemId}', '${type}')" class="w-full ${isLoc ? 'bg-brand-textMain' : 'bg-brand-primary'} text-white py-5 rounded-[24px] font-black text-lg shadow-btn mt-6 active:scale-95 transition-all">同步儲存計畫</button>
            ${itemId ? `<button onclick="deleteItem('${itemId}')" class="w-full py-4 text-red-500 font-bold opacity-30 text-xs tracking-[2px] uppercase mt-2">刪除項目</button>` : ''}
          </div>
        `;
      }
    };

    window.selectMode = (btn) => {
      btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active-mode'));
      btn.classList.add('active-mode');
    };

    window.closeSheet = () => {
      document.getElementById('modal-overlay').classList.add('hidden');
      document.getElementById('sheet-form').classList.remove('open');
      document.getElementById('sheet-form').classList.add('closed');
    };

    window.saveItem = async (itemId, type) => {
      const plan = state.plans.find(p => p.id === state.currentPlanId);
      const itinerary = plan.itinerary || {};
      if (!itinerary[state.activeDay]) itinerary[state.activeDay] = [];

      const activeMode = document.querySelector('.active-mode')?.dataset.mode;
      const data = {
        id: itemId || Date.now().toString(),
        type: type,
        timeStart: document.getElementById('f-start').value,
        timeEnd: document.getElementById('f-end').value,
        name: document.getElementById('f-name').value,
      };

      if (type === 'location') {
        data.locMode = activeMode || 'spot';
        data.subtitle = document.getElementById('f-sub').value;
        data.isThrough = document.getElementById('f-through').checked;
      } else {
        data.mode = activeMode || 'train';
        data.operator = document.getElementById('f-op').value;
        data.vehicleNo = document.getElementById('f-veh').value;
        data.duration = document.getElementById('f-dur').value;
        data.extraInfo = document.getElementById('f-extra').value;
      }

      if (itemId) {
        const idx = itinerary[state.activeDay].findIndex(i => i.id === itemId);
        itinerary[state.activeDay][idx] = data;
      } else {
        itinerary[state.activeDay].push(data);
      }

      await updateDoc(doc(db, 'artifacts', appId, 'users', state.user.uid, 'plans', state.currentPlanId), { itinerary });
      closeSheet();
      showToast("雲端同步成功");
    };

    window.updatePlanInfo = async () => {
      const title = document.getElementById('f-title').value;
      const startDate = document.getElementById('f-date').value;
      const days = parseInt(document.getElementById('f-days').value);
      await updateDoc(doc(db, 'artifacts', appId, 'users', state.user.uid, 'plans', state.currentPlanId), { title, startDate, days });
      closeSheet();
    };

    window.deletePlan = async () => {
      if (confirm("確定要刪除整個行程嗎？雲端資料將無法復原。")) {
        await deleteDoc(doc(db, 'artifacts', appId, 'users', state.user.uid, 'plans', state.currentPlanId));
        state.currentPlanId = null;
        switchView('plans');
        closeSheet();
      }
    };

    window.deleteItem = async (itemId) => {
      const plan = state.plans.find(p => p.id === state.currentPlanId);
      plan.itinerary[state.activeDay] = plan.itinerary[state.activeDay].filter(i => i.id !== itemId);
      await updateDoc(doc(db, 'artifacts', appId, 'users', state.user.uid, 'plans', state.currentPlanId), { itinerary: plan.itinerary });
      closeSheet();
    };

    window.editItem = (id, type) => openSheet(type, id);

    // --------------------------------------------------
    // Event Handlers
    // --------------------------------------------------
    document.getElementById('btn-login-google').onclick = () => signInWithPopup(auth, new GoogleAuthProvider());
    document.getElementById('btn-logout').onclick = () => signOut(auth);
    document.querySelectorAll('.nav-item').forEach(btn => btn.onclick = () => switchView(btn.dataset.view));
    document.getElementById('btn-add-location').onclick = () => openSheet('location');
    document.getElementById('btn-add-transport').onclick = () => openSheet('transport');
    document.getElementById('btn-edit-plan-info').onclick = () => openSheet('plan-info');
    document.getElementById('modal-overlay').onclick = closeSheet;

    document.getElementById('btn-new-plan').onclick = async () => {
      const title = prompt("請為您的新計畫命名", "夏季小旅行");
      if (title) {
        const docRef = await addDoc(collection(db, 'artifacts', appId, 'users', state.user.uid, 'plans'), {
          title: title,
          days: 3,
          startDate: new Date().toISOString().split('T')[0],
          itinerary: {},
          createdAt: Date.now()
        });
        openPlan(docRef.id);
      }
    };

    function showToast(msg) {
      const el = document.getElementById('toast');
      document.getElementById('toast-msg').innerText = msg;
      el.classList.remove('opacity-0', 'pointer-events-none');
      el.classList.add('opacity-100');
      setTimeout(() => el.classList.add('opacity-0', 'pointer-events-none'), 2500);
    }

    const style = document.createElement('style');
    style.innerHTML = `
      .active-mode { border-color: #0EA5E9 !important; background-color: #F0F9FF !important; color: #0EA5E9; transform: scale(1.05); }
      .nav-item.active i { color: #0EA5E9 !important; }
      #bottom-nav .nav-item.active::after { content: ''; position: absolute; bottom: 8px; width: 3px; height: 3px; border-radius: 50%; background: #0EA5E9; }
    `;
    document.head.appendChild(style);

  </script>
</body>
</html>
