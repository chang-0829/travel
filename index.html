<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>旅遊行程規劃</title>
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              primary: '#748CAB',
              dark: '#3E5C76',
              light: '#E6EBEF',
              bg: '#F2F5F8',
              card: '#FFFFFF',
              textMain: '#2C3E50',
              textSub: '#8796A5',
              accent: '#D5896F' /* 交通專屬跳色 (莫蘭迪赤陶色) */
            }
          }
        }
      }
    }
  </script>

  <style>
    /* --- LINE Seed TW 字體整合 --- */
    @font-face { font-family: 'LINE Seed TW'; src: url('./fonts/LINESeedTW_OTF_Th.woff2') format('woff2'); font-weight: 300; font-style: normal; font-display: swap; }
    @font-face { font-family: 'LINE Seed TW'; src: url('./fonts/LINESeedTW_OTF_Rg.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: 'LINE Seed TW'; src: url('./fonts/LINESeedTW_OTF_Bd.woff2') format('woff2'); font-weight: 700; font-style: normal; font-display: swap; }

    body { font-family: 'LINE Seed TW', ui-sans-serif, system-ui, sans-serif; }

    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    input[type="time"]::-webkit-calendar-picker-indicator { cursor: pointer; opacity: 0.6; }
    .bottom-sheet { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .bottom-sheet.open { transform: translateY(0); }
    .bottom-sheet.closed { transform: translateY(100%); }
    .overlay { transition: opacity 0.3s ease; }
    .overlay.open { opacity: 1; pointer-events: auto; }
    .overlay.closed { opacity: 0; pointer-events: none; }
    input, textarea { font-size: 16px !important; }
    textarea { resize: none; overflow: hidden; }
    .timeline-line { width: 4px; }
    
    /* 隱藏原生 checkbox 並美化 */
    .custom-checkbox input:checked + div { background-color: #748CAB; border-color: #748CAB; }
    .custom-checkbox input:checked + div i { opacity: 1; }
  </style>
</head>
<body class="bg-brand-bg text-brand-textMain antialiased overflow-hidden">

  <!-- 全域提示訊息 (Toast) -->
  <div id="toast" class="fixed top-4 left-1/2 transform -translate-x-1/2 bg-brand-textMain text-white px-6 py-3 rounded-full shadow-2xl z-[100] transition-all duration-300 opacity-0 pointer-events-none -translate-y-4 flex items-center gap-2 font-bold text-sm">
    <i class="fa-solid fa-circle-check text-brand-primary"></i> <span id="toast-msg">成功！</span>
  </div>

  <!-- APP 容器 (原汁原味單欄) -->
  <div id="app" class="max-w-md mx-auto h-[100dvh] bg-brand-bg shadow-xl relative flex flex-col">
    
    <!-- VIEW: 登入頁 -->
    <div id="view-login" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-brand-bg px-8 transition-opacity duration-300">
      <div class="w-full bg-brand-card p-10 rounded-[32px] shadow-lg border border-brand-light flex flex-col items-center">
        <div class="w-20 h-20 bg-brand-primary rounded-3xl flex items-center justify-center mb-6 shadow-md shadow-brand-primary/20">
          <i class="fa-solid fa-compass text-white text-4xl"></i>
        </div>
        <h1 class="text-3xl font-extrabold text-brand-dark mb-2 tracking-tight">趣．旅行</h1>
        <p class="text-brand-textSub mb-10 text-sm font-bold tracking-widest uppercase">My Trip Cloud</p>
        <button id="btn-login-google" class="w-full bg-white border-2 border-brand-light text-brand-textMain font-bold py-4 rounded-[20px] shadow-sm hover:bg-brand-bg active:scale-[0.98] transition-all flex items-center justify-center gap-3">
          <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Google 帳號登入
        </button>
      </div>
    </div>

    <!-- 共用 HEADER -->
    <header id="main-header" class="hidden bg-brand-bg pt-12 pb-4 px-6 shrink-0 flex justify-between items-end border-b border-brand-light z-10">
      <div>
        <p id="header-subtitle" class="text-sm font-bold text-brand-primary mb-1 uppercase tracking-widest">My Trip</p>
        <h1 id="header-title" class="text-3xl font-extrabold text-brand-dark tracking-tight">載入中...</h1>
      </div>
      <button id="btn-header-action" class="w-10 h-10 flex items-center justify-center bg-brand-card border border-brand-light shadow-sm rounded-full text-brand-textSub hover:text-brand-primary active:scale-95 transition-all">
        <i class="fa-solid fa-gear text-lg"></i>
      </button>
    </header>

    <!-- VIEW: 首頁 / 計畫列表 -->
    <div id="view-plans" class="hidden flex-1 overflow-y-auto px-6 pb-12 hide-scrollbar">
      <div id="plans-list" class="space-y-4 mt-6"></div>
      <button onclick="createNewPlanInit()" class="w-full mt-6 py-4 border-2 border-dashed border-brand-primary text-brand-primary font-bold rounded-[20px] hover:bg-brand-light transition-all flex justify-center items-center gap-2">
        <i class="fa-solid fa-plus"></i> 建立新行程
      </button>
    </div>

    <!-- VIEW: SETUP -->
    <div id="view-setup" class="hidden flex-1 overflow-y-auto px-6 pb-12 hide-scrollbar">
      <form id="form-setup" class="space-y-6 mt-6">
        <div class="space-y-4">
          <div class="bg-brand-card p-4 rounded-[20px] border border-brand-light shadow-sm">
            <label class="block text-xs font-bold text-brand-textSub mb-2 uppercase tracking-wider">行程名稱 <span class="text-brand-primary">*</span></label>
            <input type="text" id="setup-title" placeholder="例：東京五日遊" required
              class="w-full text-xl font-bold text-brand-textMain outline-none bg-transparent placeholder-brand-textSub/50">
          </div>
          <div class="flex gap-3">
            <div class="bg-brand-card p-4 rounded-[20px] border border-brand-light shadow-sm flex-1">
              <label class="block text-xs font-bold text-brand-textSub mb-2 uppercase tracking-wider">出發日期</label>
              <input type="date" id="setup-start-date" class="w-full text-base font-bold text-brand-textMain outline-none bg-transparent">
            </div>
            <div class="bg-brand-card p-4 rounded-[20px] border border-brand-light shadow-sm w-24">
              <label class="block text-xs font-bold text-brand-textSub mb-2 uppercase tracking-wider">天數</label>
              <input type="number" id="setup-days" min="1" max="30" value="3" required
                class="w-full text-lg font-bold text-brand-textMain outline-none bg-transparent text-center">
            </div>
          </div>
        </div>

        <div class="mt-8 mb-2 flex items-center gap-2 text-brand-dark font-bold border-b border-brand-light pb-2">
          <i class="fa-solid fa-bolt text-brand-primary"></i> 預設參數 (可於編輯時快速帶入)
        </div>
        
        <div class="space-y-4">
          <div class="bg-brand-card p-4 rounded-[20px] border border-brand-light shadow-sm">
            <label class="block text-xs font-bold text-brand-textSub mb-1 uppercase tracking-wider"><i class="fa-solid fa-hotel mr-1"></i>住宿地點</label>
            <input type="text" id="setup-accommodation" placeholder="例：新宿格拉斯麗飯店" class="w-full text-base font-bold text-brand-textMain outline-none bg-transparent placeholder-brand-textSub/50">
          </div>
          <div class="flex gap-3">
            <div class="bg-brand-card p-4 rounded-[20px] border border-brand-light shadow-sm flex-1">
              <label class="block text-xs font-bold text-brand-textSub mb-1 uppercase tracking-wider"><i class="fa-solid fa-plane-departure mr-1"></i>出發機場</label>
              <input type="text" id="setup-airport-dept" placeholder="例：桃園(TPE)" class="w-full text-base font-bold text-brand-textMain outline-none bg-transparent placeholder-brand-textSub/50">
            </div>
            <div class="bg-brand-card p-4 rounded-[20px] border border-brand-light shadow-sm flex-1">
              <label class="block text-xs font-bold text-brand-textSub mb-1 uppercase tracking-wider"><i class="fa-solid fa-plane-arrival mr-1"></i>抵達機場</label>
              <input type="text" id="setup-airport-arr" placeholder="例：關西(KIX)" class="w-full text-base font-bold text-brand-textMain outline-none bg-transparent placeholder-brand-textSub/50">
            </div>
          </div>
          <div class="flex gap-3">
            <div class="bg-brand-card p-4 rounded-[20px] border border-brand-light shadow-sm flex-1">
              <label class="block text-xs font-bold text-brand-textSub mb-1 uppercase tracking-wider"><i class="fa-solid fa-ticket mr-1"></i>去程航班</label>
              <input type="text" id="setup-flight-out" placeholder="例：CX564" class="w-full text-base font-bold text-brand-textMain outline-none bg-transparent placeholder-brand-textSub/50">
            </div>
            <div class="bg-brand-card p-4 rounded-[20px] border border-brand-light shadow-sm flex-1">
              <label class="block text-xs font-bold text-brand-textSub mb-1 uppercase tracking-wider"><i class="fa-solid fa-ticket mr-1"></i>回程航班</label>
              <input type="text" id="setup-flight-ret" placeholder="例：CX565" class="w-full text-base font-bold text-brand-textMain outline-none bg-transparent placeholder-brand-textSub/50">
            </div>
          </div>
        </div>
        <button type="submit" class="w-full bg-brand-primary text-brand-card font-bold text-lg py-4 rounded-[20px] shadow-lg shadow-brand-primary/20 hover:bg-brand-dark active:scale-[0.98] transition-all mt-8 flex justify-center items-center gap-2">
          <i class="fa-solid fa-cloud-arrow-up text-xl"></i> 儲存並同步雲端
        </button>
        
        <button type="button" id="btn-delete-plan" class="hidden w-full bg-[#FFE5E5] text-[#E63946] font-bold text-lg py-4 rounded-[20px] shadow-sm hover:bg-[#FFD1D1] active:scale-[0.98] transition-all mt-4 flex justify-center items-center gap-2">
          <i class="fa-solid fa-trash-can"></i> 刪除此行程計畫
        </button>
      </form>

      <!-- 匯入 / 匯出 區塊 -->
      <div class="mt-8 mb-8 border-t border-brand-light pt-6">
        <label class="block text-xs font-bold text-brand-textSub mb-3 uppercase tracking-wider">資料備份與分享</label>
        <div class="flex gap-3">
          <button id="btn-export" type="button" class="flex-1 bg-brand-card border border-brand-light text-brand-dark font-bold py-3 rounded-[16px] shadow-sm hover:bg-brand-light/50 active:scale-95 transition-all flex items-center justify-center gap-2">
            <i class="fa-solid fa-file-export text-brand-primary"></i> 匯出行程
          </button>
          <button id="btn-import" type="button" class="flex-1 bg-brand-card border border-brand-light text-brand-dark font-bold py-3 rounded-[16px] shadow-sm hover:bg-brand-light/50 active:scale-95 transition-all flex items-center justify-center gap-2">
            <i class="fa-solid fa-file-import text-brand-primary"></i> 匯入行程
          </button>
          <input type="file" id="input-import-file" accept=".json" class="hidden">
        </div>
        <p class="text-[10px] text-brand-textSub mt-3 leading-relaxed">提示：您可以匯出 JSON 檔備份，或傳送給同行旅伴，對方在此點擊「匯入行程」即可無縫讀取！</p>
      </div>
    </div>

    <!-- VIEW: ITINERARY -->
    <div id="view-itinerary" class="hidden flex-1 flex flex-col h-full overflow-hidden bg-brand-card relative">
      <div class="px-6 py-3 shrink-0 border-b border-brand-light bg-brand-bg z-10">
        <div id="days-tabs" class="flex overflow-x-auto gap-3 snap-x hide-scrollbar pb-1"></div>
      </div>
      <div id="timeline-container" class="flex-1 overflow-y-auto px-2 pb-32 pt-6 relative bg-brand-card mx-2 mt-2 border border-transparent">
      </div>
      <div class="absolute bottom-6 inset-x-0 px-6 flex justify-end gap-3 z-20 pointer-events-none">
        <button id="btn-add-location" class="pointer-events-auto flex items-center justify-center gap-2 bg-brand-dark text-brand-card font-bold h-14 px-6 rounded-full shadow-lg shadow-brand-dark/20 hover:bg-brand-textMain active:scale-95 transition-all">
          <i class="fa-solid fa-location-dot"></i> <span class="text-sm">地點</span>
        </button>
        <button id="btn-add-transport" class="pointer-events-auto flex items-center justify-center gap-2 bg-brand-accent text-brand-card font-bold h-14 px-6 rounded-full shadow-lg shadow-brand-accent/30 hover:bg-brand-textMain active:scale-95 transition-all">
          <i class="fa-solid fa-train-tram"></i> <span class="text-sm">交通</span>
        </button>
      </div>
    </div>

  </div> <!-- End App -->

  <!-- ================= MODALS ================= -->
  <div id="modal-overlay" class="overlay closed fixed inset-0 z-[50] bg-brand-textMain/40 backdrop-blur-[2px]"></div>

  <div id="sheet-form" class="bottom-sheet closed fixed inset-x-0 bottom-0 z-[51] flex flex-col justify-end pointer-events-none">
    <div class="pointer-events-auto relative bg-brand-card w-full max-w-md mx-auto rounded-t-[32px] shadow-2xl flex flex-col max-h-[90vh]">
      <div class="w-12 h-1.5 bg-brand-light rounded-full mx-auto mt-4 mb-2"></div>
      <div class="px-6 py-4 flex justify-between items-center shrink-0">
        <h3 id="form-modal-title" class="text-xl font-bold text-brand-dark">新增項目</h3>
        <button class="btn-close-modal w-8 h-8 flex items-center justify-center bg-brand-bg rounded-full text-brand-textSub hover:text-brand-textMain transition-colors">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>
      
      <div class="px-6 pb-8 overflow-y-auto hide-scrollbar space-y-4">
        
        <!-- 共用時間 -->
        <div class="bg-brand-bg p-4 rounded-[16px] border border-brand-light">
          <label id="label-time" class="block text-xs font-bold text-brand-textSub mb-2 uppercase tracking-wider">時間 <span class="text-brand-primary">*</span></label>
          <div class="flex items-center gap-3">
            <input type="time" id="input-time-start" required class="flex-1 text-xl font-bold text-brand-textMain outline-none bg-transparent">
            <span class="text-brand-textSub font-bold">-</span>
            <input type="time" id="input-time-end" class="flex-1 text-xl font-bold text-brand-textMain outline-none bg-transparent">
          </div>
          <p id="hint-time" class="text-[10px] text-brand-textSub mt-2"></p>
        </div>

        <div id="quick-fill-container" class="hidden flex gap-2 overflow-x-auto hide-scrollbar"></div>

        <!-- 地點專屬：地點 Icon 分類 -->
        <div id="group-location-mode" class="hidden bg-brand-bg p-4 rounded-[16px] border border-brand-light">
          <label class="block text-xs font-bold text-brand-textSub mb-3 uppercase tracking-wider">地點類型</label>
          <div id="location-modes-grid" class="grid grid-cols-4 gap-2"></div>
        </div>

        <!-- 交通專屬：交通工具選擇 -->
        <div id="group-transport-mode" class="hidden bg-brand-bg p-4 rounded-[16px] border border-brand-light">
          <label class="block text-xs font-bold text-brand-textSub mb-3 uppercase tracking-wider">交通工具</label>
          <div id="transport-modes-grid" class="grid grid-cols-4 gap-2"></div>
        </div>
        
        <div id="group-transport-fields" class="space-y-4 hidden">
          <div class="flex gap-3">
            <div class="bg-brand-bg p-4 rounded-[16px] border border-brand-light flex-1">
              <label class="block text-xs font-bold text-brand-textSub mb-1 uppercase tracking-wider">業者名稱 <span class="text-brand-accent">*</span></label>
              <input type="text" id="input-operator" placeholder="例：國泰航空" class="w-full text-base font-bold text-brand-textMain outline-none bg-transparent placeholder-brand-textSub/60">
            </div>
            <div class="bg-brand-bg p-4 rounded-[16px] border border-brand-light flex-1">
              <label class="block text-xs font-bold text-brand-textSub mb-1 uppercase tracking-wider">車次/班次</label>
              <input type="text" id="input-vehicle-no" placeholder="例：CX564" class="w-full text-base font-bold text-brand-textMain outline-none bg-transparent placeholder-brand-textSub/60">
            </div>
          </div>

          <div class="bg-brand-bg p-4 rounded-[16px] border border-brand-light">
            <label class="block text-xs font-bold text-brand-textSub mb-1 uppercase tracking-wider">路線名稱 <span class="text-brand-accent">*</span></label>
            <input type="text" id="input-route-name" placeholder="例：台北(TPE)－關西(KIX)" class="w-full text-base font-bold text-brand-textMain outline-none bg-transparent placeholder-brand-textSub/60">
          </div>
          <div class="bg-brand-bg p-4 rounded-[16px] border border-brand-light">
            <label class="block text-xs font-bold text-brand-textSub mb-1 uppercase tracking-wider">方向 (選填)</label>
            <input type="text" id="input-direction" placeholder="例：往南海難波" class="w-full text-base font-bold text-brand-textMain outline-none bg-transparent placeholder-brand-textSub/60">
          </div>
          
          <div class="flex gap-3">
            <div class="bg-brand-bg p-4 rounded-[16px] border border-brand-light flex-1">
              <label class="block text-xs font-bold text-brand-textSub mb-1 uppercase tracking-wider">花費時間</label>
              <input type="text" id="input-duration" placeholder="例：1小時4分" class="w-full text-base font-bold text-brand-textMain outline-none bg-transparent placeholder-brand-textSub/60">
            </div>
            <div class="bg-brand-bg p-4 rounded-[16px] border border-brand-light flex-1">
              <label class="block text-xs font-bold text-brand-textSub mb-1 uppercase tracking-wider">經過站數</label>
              <input type="text" id="input-extraInfo" placeholder="例：9站" class="w-full text-base font-bold text-brand-textMain outline-none bg-transparent placeholder-brand-textSub/60">
            </div>
          </div>
        </div>

        <!-- 地點專屬：文字輸入 -->
        <div id="group-location-fields" class="space-y-4">
          <div class="bg-brand-bg p-4 rounded-[16px] border border-brand-light">
            <label class="block text-xs font-bold text-brand-textSub mb-1 uppercase tracking-wider">地點名稱 <span class="text-brand-primary">*</span></label>
            <textarea id="input-loc-name" placeholder="例：成田空港" rows="1" oninput="this.style.height = '';this.style.height = this.scrollHeight + 'px'" class="w-full text-lg font-bold text-brand-textMain outline-none bg-transparent placeholder-brand-textSub/60 resize-none"></textarea>
          </div>
          
          <div class="bg-brand-bg p-4 rounded-[16px] border border-brand-light">
            <label class="block text-xs font-bold text-brand-textSub mb-1 uppercase tracking-wider">備註</label>
            <textarea id="input-loc-subtitle" placeholder="例：記得帶票..." rows="2" oninput="this.style.height = '';this.style.height = this.scrollHeight + 'px'" class="w-full text-base font-bold text-brand-textMain outline-none bg-transparent placeholder-brand-textSub/60 resize-none"></textarea>
          </div>

          <div class="bg-brand-bg p-4 rounded-[16px] border border-brand-light">
            <label class="custom-checkbox flex items-center gap-3 cursor-pointer w-fit">
              <input type="checkbox" id="input-loc-through" class="hidden">
              <div class="w-5 h-5 rounded border-2 border-brand-textSub flex items-center justify-center transition-colors">
                <i class="fa-solid fa-check text-white text-[11px] opacity-0 transition-opacity"></i>
              </div>
              <span class="text-sm font-bold text-brand-dark">設為直通 / 免換乘站 (不下車)</span>
            </label>
            <p class="text-[10px] text-brand-textSub mt-1.5 ml-8 leading-relaxed">勾選後，此地點會顯示為直通引導，代表您繼續搭乘同一班車但路線或車次改變。</p>
          </div>
        </div>

        <!-- 共用：費用與幣別 -->
        <div class="bg-brand-bg p-4 rounded-[16px] border border-brand-light">
          <div class="flex justify-between items-center mb-3">
            <label class="block text-xs font-bold text-brand-textSub uppercase tracking-wider">花費金額 (選填)</label>
            <div class="flex bg-brand-light/50 p-1 rounded-lg w-fit">
              <button type="button" class="curr-btn px-3 py-1 rounded text-xs font-bold bg-white shadow-sm text-brand-dark transition-all" data-val="JPY">¥ 日幣</button>
              <button type="button" class="curr-btn px-3 py-1 rounded text-xs font-bold text-brand-textSub transition-all" data-val="TWD">$ 台幣</button>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <span id="display-curr-symbol" class="text-lg font-bold text-brand-textSub">¥</span>
            <input type="number" id="input-cost" placeholder="例：970" class="w-full text-xl font-bold text-brand-textMain outline-none bg-transparent placeholder-brand-textSub/50">
          </div>
        </div>
        
        <button id="btn-save-item" class="w-full bg-brand-primary text-brand-card font-bold text-lg py-4 rounded-[20px] shadow-lg shadow-brand-primary/20 mt-6 active:scale-95 transition-all">
          儲存至雲端
        </button>
      </div>
    </div>
  </div>

  <div id="sheet-options" class="bottom-sheet closed fixed inset-x-0 bottom-0 z-[52] flex flex-col justify-end pointer-events-none">
    <div class="pointer-events-auto relative bg-brand-card w-full max-w-md mx-auto rounded-t-[32px] shadow-2xl flex flex-col">
      <div class="w-12 h-1.5 bg-brand-light rounded-full mx-auto mt-4 mb-2"></div>
      <div class="px-6 py-4 flex justify-between items-center shrink-0 border-b border-brand-light/50">
        <h3 class="text-xl font-bold text-brand-dark">選項</h3>
        <button class="btn-close-modal w-8 h-8 flex items-center justify-center bg-brand-bg rounded-full text-brand-textSub hover:text-brand-textMain transition-colors">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>
      <div class="px-6 py-6 space-y-3">
        <button id="btn-option-edit" class="w-full bg-brand-bg text-brand-dark font-bold text-lg py-4 rounded-[16px] flex justify-center items-center gap-2 hover:bg-brand-light transition-colors">
          <i class="fa-solid fa-pen"></i> 編輯此項目
        </button>
        <button id="btn-option-delete" class="w-full bg-[#FFE5E5] text-[#E63946] font-bold text-lg py-4 rounded-[16px] flex justify-center items-center gap-2 hover:bg-[#FFD1D1] transition-colors">
          <i class="fa-solid fa-trash-can"></i> 刪除此項目
        </button>
      </div>
    </div>
  </div>

  <div id="modal-delete" class="overlay closed fixed inset-0 z-[60] flex items-center justify-center px-6">
    <div class="absolute inset-0 bg-brand-textMain/60 backdrop-blur-sm btn-close-modal"></div>
    <div class="relative bg-brand-card border border-brand-light rounded-[24px] p-8 w-full max-w-sm shadow-2xl transition-transform transform scale-95 opacity-0" id="delete-dialog-content">
      <div class="w-16 h-16 bg-[#FFE5E5] rounded-full flex items-center justify-center mx-auto mb-4">
        <i class="fa-solid fa-trash-can text-2xl text-[#E63946]"></i>
      </div>
      <h3 class="text-xl font-bold text-brand-textMain text-center mb-2">確認刪除</h3>
      <p class="text-brand-textSub text-center mb-8 text-sm">刪除後將無法還原，確定要繼續嗎？</p>
      <div class="flex gap-4">
        <button id="btn-cancel-delete" class="btn-close-modal flex-1 py-3.5 bg-brand-bg text-brand-dark font-bold rounded-[16px] hover:bg-brand-light transition-colors">取消</button>
        <button id="btn-confirm-delete" class="flex-1 py-3.5 bg-[#E63946] text-brand-card font-bold rounded-[16px] shadow-lg shadow-[#E63946]/20 active:scale-95 transition-all">確認刪除</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
    import { getFirestore, doc, collection, onSnapshot, addDoc, deleteDoc, updateDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    // === Firebase Config ===
    const firebaseConfig = { apiKey: "AIzaSyCQF8A3ieML0JP3X8X78NCRuiUETRAiu5E", authDomain: "travel-96009.firebaseapp.com", projectId: "travel-96009", storageBucket: "travel-96009.firebasestorage.app", messagingSenderId: "578860064042", appId: "1:578860064042:web:b147880df3a01dd8f75253" };
    const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app); const appId = "travel-platform-v1";

    const TRANSPORT_MODES = [
      { id: 'flight', label: '航班', icon: 'fa-solid fa-plane' },
      { id: 'train', label: '電車', icon: 'fa-solid fa-train' },
      { id: 'bus', label: '公車', icon: 'fa-solid fa-bus' },
      { id: 'car', label: '開車', icon: 'fa-solid fa-car' },
      { id: 'taxi', label: '計程車', icon: 'fa-solid fa-taxi' },
      { id: 'charter', label: '包車', icon: 'fa-solid fa-van-shuttle' },
      { id: 'ship', label: '船隻', icon: 'fa-solid fa-ship' },
      { id: 'walk', label: '步行', icon: 'fa-solid fa-person-walking' }
    ];

    const LOCATION_MODES = [
      { id: 'spot', label: '景點', icon: 'fa-solid fa-location-dot' },
      { id: 'hotel', label: '住宿', icon: 'fa-solid fa-hotel' },
      { id: 'food', label: '美食', icon: 'fa-solid fa-utensils' },
      { id: 'shop', label: '購物', icon: 'fa-solid fa-bag-shopping' },
      { id: 'airport', label: '機場', icon: 'fa-solid fa-plane-arrival' },
      { id: 'activity', label: '活動', icon: 'fa-solid fa-ticket' }
    ];

    let state = {
      user: null, plans: [], currentPlanId: null, activeDay: 1, modalMode: null, itemType: 'location', editingId: null,
      formData: { timeStart: '', timeEnd: '', name: '', subtitle: '', mode: 'train', locMode: 'spot', operator: '', vehicleNo: '', direction: '', duration: '', extraInfo: '', cost: '', currency: 'JPY', isThrough: false },
      tripData: { title: '', startDate: '', days: 3, accommodation: '', airportDept: '', airportArr: '', flightOut: '', flightRet: '', itinerary: {} }
    };

    function init() {
      setupEventListeners();
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      document.getElementById('toast-msg').innerText = msg;
      el.classList.remove('opacity-0', '-translate-y-4', 'pointer-events-none');
      el.classList.add('opacity-100', 'translate-y-0');
      setTimeout(() => {
        el.classList.remove('opacity-100', 'translate-y-0');
        el.classList.add('opacity-0', '-translate-y-4', 'pointer-events-none');
      }, 3000);
    }

    // --- Firebase Auth & Sync ---
    onAuthStateChanged(auth, (user) => {
      state.user = user;
      if (user) {
        document.getElementById('view-login').classList.add('hidden');
        switchView('plans'); 
        listenToPlans();
      } else {
        closeAllModals();
        document.getElementById('view-login').classList.remove('hidden');
        switchView('login');
      }
    });

    function listenToPlans() {
      if (!state.user) return;
      const q = collection(db, 'artifacts', appId, 'users', state.user.uid, 'plans');
      onSnapshot(q, (snapshot) => {
        state.plans = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderPlansList();
        if (state.currentPlanId) {
          const activePlan = state.plans.find(p => p.id === state.currentPlanId);
          if (activePlan) {
            state.tripData = activePlan;
            if (document.getElementById('view-itinerary').classList.contains('hidden') === false) {
               renderItinerary();
            }
          } else {
            switchView('plans');
          }
        }
      });
    }

    // --- View Switching ---
    window.switchView = function(v) {
      ['login', 'plans', 'setup', 'itinerary'].forEach(id => {
        const el = document.getElementById(`view-${id}`);
        if (el) el.classList.add('hidden');
      });
      document.getElementById(`view-${v}`)?.classList.remove('hidden');
      
      const header = document.getElementById('main-header');
      const title = document.getElementById('header-title');
      const sub = document.getElementById('header-subtitle');
      const btnAction = document.getElementById('btn-header-action');

      if (v === 'login') {
        header.classList.add('hidden');
      } else if (v === 'plans') {
        header.classList.remove('hidden');
        sub.innerText = state.user?.displayName ? `Hi, ${state.user.displayName}` : 'Welcome';
        title.innerText = '我的計畫';
        btnAction.innerHTML = '<i class="fa-solid fa-right-from-bracket"></i>';
        btnAction.onclick = () => signOut(auth);
      } else if (v === 'setup') {
        header.classList.remove('hidden');
        sub.innerText = 'My Trip';
        title.innerText = state.currentPlanId ? '行程設定' : '建立新行程';
        btnAction.innerHTML = '<i class="fa-solid fa-xmark text-xl"></i>';
        btnAction.onclick = () => switchView(state.currentPlanId ? 'itinerary' : 'plans');
      } else if (v === 'itinerary') {
        header.classList.remove('hidden');
        sub.innerText = 'My Trip';
        title.innerText = state.tripData.title || '行程表';
        btnAction.innerHTML = '<i class="fa-solid fa-gear"></i>';
        btnAction.onclick = () => openSetup(state.currentPlanId);
      }
    };

    function renderPlansList() {
      const container = document.getElementById('plans-list');
      if (state.plans.length === 0) { 
        container.innerHTML = `<div class="py-24 text-center text-brand-textSub opacity-50"><i class="fa-solid fa-map-location-dot text-6xl mb-6"></i><p class="font-bold">尚無任何行程</p></div>`; 
        return; 
      }
      container.innerHTML = state.plans.sort((a, b) => b.createdAt - a.createdAt).map(plan => `
        <div onclick="openPlan('${plan.id}')" class="bg-brand-card rounded-[24px] p-6 border border-brand-light shadow-sm flex items-center justify-between active:scale-[0.98] transition-all cursor-pointer">
          <div>
            <h3 class="font-bold text-brand-textMain text-lg truncate mb-1 uppercase">${plan.title}</h3>
            <p class="text-xs text-brand-textSub font-bold tracking-widest">${plan.startDate} · ${plan.days} DAYS</p>
          </div>
          <div class="w-10 h-10 rounded-full bg-brand-bg flex items-center justify-center text-brand-primary">
            <i class="fa-solid fa-chevron-right"></i>
          </div>
        </div>
      `).join('');
    }

    window.openPlan = (id) => { 
      state.currentPlanId = id; 
      state.activeDay = 1; 
      state.tripData = state.plans.find(p => p.id === id) || state.tripData;
      renderItinerary(); 
      switchView('itinerary'); 
    };

    window.createNewPlanInit = () => {
      openSetup(null);
    };

    window.openSetup = (id = null) => {
      state.currentPlanId = id;
      if (id) {
        const plan = state.plans.find(p => p.id === id);
        state.tripData = { ...plan };
        document.getElementById('btn-delete-plan').classList.remove('hidden');
      } else {
        state.tripData = { title: '', startDate: '', days: 3, accommodation: '', airportDept: '', airportArr: '', flightOut: '', flightRet: '', itinerary: {} };
        document.getElementById('btn-delete-plan').classList.add('hidden');
      }
      
      document.getElementById('setup-title').value = state.tripData.title || ''; 
      document.getElementById('setup-start-date').value = state.tripData.startDate || '';
      document.getElementById('setup-days').value = state.tripData.days || 3; 
      document.getElementById('setup-accommodation').value = state.tripData.accommodation || '';
      document.getElementById('setup-airport-dept').value = state.tripData.airportDept || ''; 
      document.getElementById('setup-airport-arr').value = state.tripData.airportArr || '';
      document.getElementById('setup-flight-out').value = state.tripData.flightOut || ''; 
      document.getElementById('setup-flight-ret').value = state.tripData.flightRet || '';
      
      switchView('setup');
    };

    window.deletePlan = async () => {
      if(confirm("確定要刪除整個行程嗎？雲端資料將無法復原。")) {
        await deleteDoc(doc(db, 'artifacts', appId, 'users', state.user.uid, 'plans', state.currentPlanId));
        state.currentPlanId = null;
        switchView('plans');
      }
    };

    // --- Itinerary View ---
    function renderItinerary() {
      document.getElementById('header-title').innerText = state.tripData.title;
      renderDaysTabs();
      renderTimeline();
    }

    function getDayDateString(dayIndex) {
      if (!state.tripData.startDate) return `Day ${dayIndex}`;
      const date = new Date(state.tripData.startDate);
      date.setDate(date.getDate() + dayIndex - 1);
      return `${date.getMonth() + 1}/${date.getDate()}`;
    }

    function renderDaysTabs() {
      const tabs = document.getElementById('days-tabs');
      tabs.innerHTML = '';
      for (let i = 1; i <= state.tripData.days; i++) {
        const isActive = state.activeDay === i;
        const btn = document.createElement('button');
        btn.className = `snap-start shrink-0 px-5 py-2.5 rounded-full font-bold transition-all duration-200 border ${
          isActive ? 'bg-brand-primary text-brand-card border-brand-primary shadow-md shadow-brand-primary/20' : 'bg-brand-card text-brand-textSub border-brand-light hover:bg-brand-light/50'}`;
        btn.innerHTML = `<div class="flex items-center gap-2"><span class="text-xs opacity-80">Day ${i}</span><span class="text-sm">${getDayDateString(i)}</span></div>`;
        btn.onclick = () => { state.activeDay = i; renderDaysTabs(); renderTimeline(); };
        tabs.appendChild(btn);
      }
    }

    function renderTimeDisplay(start, end, showStart = true, showEnd = true) {
      let html = `<div class="flex flex-col items-end gap-1 mt-[2px]">`;
      if (start) html += `<span class="text-[15px] font-bold font-mono text-brand-dark tracking-tight leading-none ${showStart ? '' : 'opacity-0'}">${start}</span>`;
      if (end) html += `<span class="text-[15px] font-bold font-mono text-brand-dark tracking-tight leading-none ${showEnd ? '' : 'opacity-0'}">${end}</span>`;
      html += `</div>`; return html;
    }

    function renderCost(cost, curr) {
      if (!cost) return '';
      const symbol = curr === 'TWD' ? '$' : '¥';
      return `<div class="text-[14px] font-medium text-brand-textSub mt-1.5">費用：${symbol}${cost}</div>`;
    }

    function renderTimeline() {
      const container = document.getElementById('timeline-container');
      const items = state.tripData.itinerary[state.activeDay] || [];
      container.innerHTML = '';

      if (items.length === 0) {
        container.innerHTML = `<div class="flex flex-col items-center justify-center h-48 mt-12 text-brand-textSub"><div class="w-16 h-16 bg-brand-bg border border-brand-light rounded-full flex items-center justify-center mb-4 shadow-sm"><i class="fa-solid fa-calendar-day text-2xl text-brand-primary"></i></div><p class="font-bold">這一天尚未安排行程</p></div>`;
        return;
      }

      let html = '<div class="relative pl-1 pr-1 pt-4 pb-12">';
      items.sort((a, b) => a.timeStart.localeCompare(b.timeStart)).forEach((item, index) => {
        const isLast = index === items.length - 1; const isFirst = index === 0; const isOnly = items.length === 1;
        const costHtml = renderCost(item.cost, item.currency);

        let lineHtml = '';
        if (!isOnly) {
            if (isFirst) lineHtml = `<div class="absolute top-[26px] bottom-0 timeline-line bg-brand-primary z-0"></div>`;
            else if (isLast) lineHtml = `<div class="absolute top-0 h-[26px] timeline-line bg-brand-primary z-0"></div>`;
            else lineHtml = `<div class="absolute top-0 bottom-0 timeline-line bg-brand-primary z-0"></div>`;
        }

        if (item.type === 'location') {
          const nameHtml = item.name.replace(/\n/g, '<br>');
          const subHtml = item.subtitle ? item.subtitle.replace(/\n/g, '<br>') : '';
          const timeHtml = renderTimeDisplay(item.timeStart, item.timeEnd, true, true);
          const locObj = LOCATION_MODES.find(m => m.id === item.locMode) || LOCATION_MODES[0];
          const nodeDot = item.isThrough
            ? `<div class="w-4 h-4 rounded-full bg-brand-bg border-2 border-brand-primary z-10 mt-[20px] shadow-sm flex items-center justify-center"><i class="fa-solid fa-angles-down text-[8px] text-brand-primary"></i></div>`
            : `<div class="w-3.5 h-3.5 rounded-full border-[3px] border-brand-primary bg-brand-card z-10 mt-[20px] shadow-sm"></div>`;

          html += `
            <div class="relative flex group cursor-pointer" onclick="openOptions('${item.id}')">
              <div class="w-[68px] shrink-0 text-right pr-3 pt-[20px]">${timeHtml}</div>
              <div class="w-6 shrink-0 flex flex-col items-center relative self-stretch">${lineHtml}${nodeDot}</div>
              <div class="flex-1 pt-[16px] pb-6 pl-2 relative pr-8">
                <div class="flex items-start gap-2">
                   <div class="text-[17px] font-extrabold text-brand-textMain leading-snug break-words">
                     <i class="${locObj.icon} text-brand-primary mr-1.5 opacity-80"></i>${nameHtml}
                   </div>
                </div>
                ${item.isThrough ? `<div class="mt-1"><span class="text-[10px] font-bold text-white bg-brand-primary/80 px-1.5 py-0.5 rounded">免下車</span></div>` : ''}
                ${subHtml ? `<div class="text-[14px] font-medium text-brand-textMain mt-1.5 leading-relaxed">${subHtml}</div>` : ''}
                ${costHtml}
                <button class="absolute right-0 top-3 w-8 h-8 flex items-center justify-center text-brand-textSub hover:text-brand-dark rounded-full transition-colors"><i class="fa-solid fa-ellipsis-vertical text-lg"></i></button>
              </div>
            </div>`;
        } else {
          let showStart = true; let showEnd = true;
          const prevItem = items[index - 1]; const nextItem = items[index + 1];
          if (prevItem && item.timeStart === (prevItem.timeEnd || prevItem.timeStart)) showStart = false;
          if (nextItem && item.timeEnd && item.timeEnd === nextItem.timeStart) showEnd = false;

          let timeColHtml = `
             <div class="w-[68px] shrink-0 text-right pr-3 py-[20px] flex flex-col justify-between items-end">
                <span class="text-[15px] font-bold font-mono text-brand-dark leading-none tracking-tight ${showStart ? '' : 'opacity-0'}">${item.timeStart}</span>
                <div class="flex flex-col items-end my-2 gap-1 w-[48px]">
                   ${item.duration ? `<span class="text-[13px] font-medium text-brand-textSub leading-tight text-right w-full whitespace-pre-wrap break-words">${item.duration.replace(/\\n/g, '<br>')}</span>` : ''}
                   ${item.extraInfo ? `<span class="text-[12px] font-bold text-brand-accent leading-none flex items-center justify-end mt-1">${item.extraInfo}<i class="fa-solid fa-caret-down text-[10px] ml-1"></i></span>` : ''}
                </div>
                <span class="text-[15px] font-bold font-mono text-brand-dark leading-none tracking-tight ${showEnd ? '' : 'opacity-0'}">${item.timeEnd || '&nbsp;'}</span>
             </div>`;

          const modeObj = TRANSPORT_MODES.find(m => m.id === item.mode) || TRANSPORT_MODES[1];
          const opStr = item.operator || '';
          const vehStr = item.vehicleNo || '';
          const routeStr = item.name ? item.name.replace(/\n/g, '<br>') : '';
          const dirStr = item.direction ? `（${item.direction}）` : '';
          const titleLine = `${opStr} ${vehStr}`.trim();

          html += `
            <div class="relative flex items-stretch group cursor-pointer" onclick="openOptions('${item.id}')">
              ${timeColHtml}
              <div class="w-6 shrink-0 flex flex-col items-center relative self-stretch">${lineHtml}</div>
              <div class="flex-1 pl-2 pr-0 py-[20px] relative">
                 <div class="pl-1 relative pb-2">
                   <div class="flex items-center gap-2 mb-1 pr-6">
                     <div class="w-[24px] h-[24px] rounded bg-brand-accent/15 text-brand-accent flex items-center justify-center shrink-0">
                       <i class="${modeObj.icon} text-[13px]"></i>
                     </div>
                     ${titleLine ? `<span class="text-[15px] font-bold text-brand-accent leading-tight">${titleLine}</span>` : ''}
                   </div>
                   ${routeStr ? `<div class="text-[15px] font-extrabold text-brand-textMain leading-snug pr-6 ml-[32px]">${routeStr}${dirStr}</div>` : ''}
                   <div class="ml-[32px]">${costHtml}</div>
                 </div>
                 <button class="absolute right-1 top-4 w-8 h-8 flex items-center justify-center text-brand-textSub hover:text-brand-dark rounded-full"><i class="fa-solid fa-ellipsis-vertical"></i></button>
              </div>
            </div>`;
        }
      });
      html += '</div>'; container.innerHTML = html;
    }

    window.openFormModal = function(type, itemId = null) {
      state.itemType = type;
      state.editingId = itemId;
      
      const plan = state.tripData;
      
      if (type === 'location') {
         document.getElementById('group-location-mode').classList.remove('hidden');
         document.getElementById('group-location-fields').classList.remove('hidden');
         document.getElementById('group-transport-mode').classList.add('hidden');
         document.getElementById('group-transport-fields').classList.add('hidden');
         document.getElementById('form-modal-title').innerText = itemId ? '編輯地點' : '新增地點';
         renderLocationModes();
      } else {
         document.getElementById('group-location-mode').classList.add('hidden');
         document.getElementById('group-location-fields').classList.add('hidden');
         document.getElementById('group-transport-mode').classList.remove('hidden');
         document.getElementById('group-transport-fields').classList.remove('hidden');
         document.getElementById('form-modal-title').innerText = itemId ? '編輯交通' : '新增交通';
         renderTransportModes();
      }
      
      if (itemId) {
         const item = plan.itinerary[state.activeDay].find(i => i.id === itemId);
         state.formData = { ...item };
      } else {
         state.formData = { 
           timeStart: '08:00', timeEnd: '', name: '', subtitle: '', 
           mode: 'train', locMode: 'spot', operator: '', vehicleNo: '', 
           direction: '', duration: '', extraInfo: '', cost: '', currency: 'JPY', isThrough: false 
         };
      }
      
      document.getElementById('input-time-start').value = state.formData.timeStart || '';
      document.getElementById('input-time-end').value = state.formData.timeEnd || '';
      document.getElementById('input-cost').value = state.formData.cost || '';
      
      if (type === 'location') {
         document.getElementById('input-loc-name').value = state.formData.name || '';
         document.getElementById('input-loc-subtitle').value = state.formData.subtitle || '';
         document.getElementById('input-loc-through').checked = !!state.formData.isThrough;
      } else {
         document.getElementById('input-operator').value = state.formData.operator || '';
         document.getElementById('input-vehicle-no').value = state.formData.vehicleNo || '';
         document.getElementById('input-route-name').value = state.formData.name || '';
         document.getElementById('input-direction').value = state.formData.direction || '';
         document.getElementById('input-duration').value = state.formData.duration || '';
         document.getElementById('input-extraInfo').value = state.formData.extraInfo || '';
      }
      
      selectCurrency(state.formData.currency || 'JPY');
      renderQuickFills(type, plan);
      
      setTimeout(() => {
        document.getElementById('input-loc-name').style.height = ''; document.getElementById('input-loc-name').style.height = document.getElementById('input-loc-name').scrollHeight + 'px';
        document.getElementById('input-loc-subtitle').style.height = ''; document.getElementById('input-loc-subtitle').style.height = document.getElementById('input-loc-subtitle').scrollHeight + 'px';
      }, 10);
      
      document.getElementById('modal-overlay').classList.remove('closed');
      document.getElementById('modal-overlay').classList.add('open');
      document.getElementById('sheet-form').classList.remove('closed');
      document.getElementById('sheet-form').classList.add('open');
    }

    function renderTransportModes() {
      document.getElementById('transport-modes-grid').innerHTML = TRANSPORT_MODES.map(mode => `
        <button type="button" onclick="selectTransportMode('${mode.id}')"
          class="mode-btn py-3 rounded-[12px] flex flex-col items-center gap-1.5 transition-all border ${
            state.formData.mode === mode.id ? 'bg-brand-accent text-brand-card border-brand-accent shadow-sm' : 'bg-brand-card text-brand-textSub border-brand-light hover:bg-brand-light/50'
          }"><i class="${mode.icon} text-lg"></i><span class="text-xs font-bold">${mode.label}</span></button>
      `).join('');
    }

    function renderLocationModes() {
      document.getElementById('location-modes-grid').innerHTML = LOCATION_MODES.map(mode => `
        <button type="button" onclick="selectLocationMode('${mode.id}')"
          class="mode-btn py-3 rounded-[12px] flex flex-col items-center gap-1.5 transition-all border ${
            state.formData.locMode === mode.id ? 'bg-brand-primary text-brand-card border-brand-primary shadow-sm' : 'bg-brand-card text-brand-textSub border-brand-light hover:bg-brand-light/50'
          }"><i class="${mode.icon} text-lg"></i><span class="text-xs font-bold">${mode.label}</span></button>
      `).join('');
    }

    function renderQuickFills(type, plan) {
      const container = document.getElementById('quick-fill-container');
      container.innerHTML = ''; container.classList.add('hidden');
      const chips = [];
      
      if (type === 'location') {
        if (plan.accommodation) chips.push({ label: '住宿', icon: 'fa-hotel', name: plan.accommodation, mode: 'hotel' });
        if (plan.airportDept) chips.push({ label: '出發機場', icon: 'fa-plane-departure', name: plan.airportDept, mode: 'airport' });
        if (plan.airportArr) chips.push({ label: '抵達機場', icon: 'fa-plane-arrival', name: plan.airportArr, mode: 'airport' });
      } else {
        if (plan.flightOut) chips.push({ label: '去程航班', icon: 'fa-ticket', veh: plan.flightOut, route: plan.airportDept + '－' + plan.airportArr, mode: 'flight' });
        if (plan.flightRet) chips.push({ label: '回程航班', icon: 'fa-ticket', veh: plan.flightRet, route: plan.airportArr + '－' + plan.airportDept, mode: 'flight' });
      }

      if (chips.length > 0) {
        container.classList.remove('hidden');
        chips.forEach(chip => {
          const btn = document.createElement('button'); btn.type = 'button';
          const btnColorClass = type === 'transport' ? 'border-brand-accent/30 text-brand-accent hover:bg-brand-accent hover:text-white' : 'border-brand-primary/30 text-brand-primary hover:bg-brand-primary hover:text-white';
          btn.className = `shrink-0 bg-brand-bg border px-3.5 py-1.5 rounded-full text-xs font-bold transition-colors flex items-center gap-1.5 shadow-sm active:scale-95 ${btnColorClass}`;
          btn.innerHTML = `<i class="fa-solid ${chip.icon}"></i> 帶入${chip.label}`;
          btn.onclick = () => {
            if (type === 'location') {
              document.getElementById('input-loc-name').value = chip.name;
              document.getElementById('input-loc-name').style.height = ''; document.getElementById('input-loc-name').style.height = document.getElementById('input-loc-name').scrollHeight + 'px';
              if (chip.mode) { state.formData.locMode = chip.mode; renderLocationModes(); }
            } else {
              document.getElementById('input-vehicle-no').value = chip.veh;
              if(!document.getElementById('input-route-name').value && chip.route !== '－') document.getElementById('input-route-name').value = chip.route;
              if (chip.mode) { state.formData.mode = chip.mode; renderTransportModes(); }
            }
          };
          container.appendChild(btn);
        });
      }
    }

    window.selectCurrency = function(val) {
      state.formData.currency = val;
      document.getElementById('display-curr-symbol').innerText = val === 'TWD' ? '$' : '¥';
      document.querySelectorAll('.curr-btn').forEach(btn => {
        if (btn.dataset.val === val) {
          btn.classList.add('bg-white', 'shadow-sm', 'text-brand-dark'); btn.classList.remove('text-brand-textSub', 'bg-transparent');
        } else {
          btn.classList.remove('bg-white', 'shadow-sm', 'text-brand-dark'); btn.classList.add('text-brand-textSub', 'bg-transparent');
        }
      });
    };

    window.openOptions = function(id) {
      state.editingId = id;
      document.getElementById('modal-overlay').classList.remove('closed'); document.getElementById('modal-overlay').classList.add('open');
      document.getElementById('sheet-options').classList.remove('closed'); document.getElementById('sheet-options').classList.add('open');
    };

    window.selectTransportMode = function(id) { state.formData.mode = id; renderTransportModes(); };
    window.selectLocationMode = function(id) { state.formData.locMode = id; renderLocationModes(); };

    window.closeAllModals = function() {
      document.getElementById('modal-overlay').classList.remove('open'); document.getElementById('modal-overlay').classList.add('closed');
      document.getElementById('sheet-form').classList.remove('open'); document.getElementById('sheet-form').classList.add('closed');
      document.getElementById('sheet-options').classList.remove('open'); document.getElementById('sheet-options').classList.add('closed');
      document.getElementById('modal-delete').classList.remove('open'); document.getElementById('modal-delete').classList.add('closed');
      document.getElementById('delete-dialog-content').classList.add('scale-95', 'opacity-0'); document.getElementById('delete-dialog-content').classList.remove('scale-100', 'opacity-100');
    }

    window.handleExport = () => {
      const dataStr = JSON.stringify(state.plans, null, 2);
      const blob = new Blob([dataStr], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = `趣旅行_備份.json`; a.click();
      URL.revokeObjectURL(url); showToast('已匯出 JSON 行程檔！');
    };

    window.handleImport = (e) => {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = async (event) => {
        try {
          const imported = JSON.parse(event.target.result);
          const plansToImport = (imported && imported.title && !Array.isArray(imported)) ? [imported] : imported;
          if (!Array.isArray(plansToImport)) throw new Error("Invalid format");
          
          for (let p of plansToImport) {
            const cleanPlan = { 
              title: p.title || "未命名行程", startDate: p.startDate || new Date().toISOString().split('T')[0], days: p.days || 1, 
              accommodation: p.accommodation || "", airportDept: p.airportDept || "", airportArr: p.airportArr || "", flightOut: p.flightOut || "", flightRet: p.flightRet || "",
              itinerary: p.itinerary || {}, createdAt: serverTimestamp() 
            };
            await addDoc(collection(db, 'artifacts', appId, 'users', state.user.uid, 'plans'), cleanPlan);
          }
          showToast('成功匯入行程！'); switchView('plans');
        } catch (err) { alert('檔案格式錯誤，請確認這是由本系統匯出的 JSON 行程檔。'); }
        document.getElementById('input-import-file').value = '';
      };
      reader.readAsText(file);
    };

    function setupEventListeners() {
      
      document.getElementById('form-setup').addEventListener('submit', async (e) => {
        e.preventDefault();
        const planData = {
          title: document.getElementById('setup-title').value, startDate: document.getElementById('setup-start-date').value, days: parseInt(document.getElementById('setup-days').value) || 1,
          accommodation: document.getElementById('setup-accommodation').value, airportDept: document.getElementById('setup-airport-dept').value, airportArr: document.getElementById('setup-airport-arr').value,
          flightOut: document.getElementById('setup-flight-out').value, flightRet: document.getElementById('setup-flight-ret').value
        };
        
        if (state.currentPlanId) {
          await updateDoc(doc(db, 'artifacts', appId, 'users', state.user.uid, 'plans', state.currentPlanId), planData);
          showToast("已儲存設定"); switchView('itinerary');
        } else {
          planData.itinerary = {}; planData.createdAt = serverTimestamp();
          const docRef = await addDoc(collection(db, 'artifacts', appId, 'users', state.user.uid, 'plans'), planData);
          openPlan(docRef.id); showToast("已建立新行程");
        }
      });

      document.getElementById('btn-login-google').onclick = () => {
         signInWithPopup(auth, new GoogleAuthProvider()).catch(err => {
            console.error(err);
            showToast("登入失敗：" + err.message);
            if (err.code === 'auth/network-request-failed') {
               alert("網路錯誤或請勿在 file:// 本機端直接開啟，請上傳至伺服器或使用 localhost 測試。");
            }
         });
      };
      
      document.getElementById('btn-export').addEventListener('click', handleExport);
      document.getElementById('btn-import').addEventListener('click', () => document.getElementById('input-import-file').click());
      document.getElementById('input-import-file').addEventListener('change', handleImport);

      document.querySelectorAll('.btn-close-modal').forEach(btn => btn.addEventListener('click', closeAllModals));
      document.getElementById('modal-overlay').addEventListener('click', closeAllModals);

      document.getElementById('btn-save-item').addEventListener('click', async () => {
        const plan = state.tripData;
        if (!plan.itinerary[state.activeDay]) plan.itinerary[state.activeDay] = [];
        
        const type = state.itemType;
        const data = { 
          id: state.editingId || Date.now().toString(), type: type, 
          timeStart: document.getElementById('input-time-start').value, timeEnd: document.getElementById('input-time-end').value, 
          cost: document.getElementById('input-cost').value, currency: state.formData.currency 
        };
        
        if (type === 'location') { 
          data.locMode = state.formData.locMode; data.name = document.getElementById('input-loc-name').value; 
          data.subtitle = document.getElementById('input-loc-subtitle').value; data.isThrough = document.getElementById('input-loc-through').checked; 
        } else { 
          data.mode = state.formData.mode; data.operator = document.getElementById('input-operator').value; 
          data.vehicleNo = document.getElementById('input-vehicle-no').value; data.name = document.getElementById('input-route-name').value; 
          data.direction = document.getElementById('input-direction').value; data.duration = document.getElementById('input-duration').value; 
          data.extraInfo = document.getElementById('input-extraInfo').value; 
        }
        
        if (state.editingId) { 
          const idx = plan.itinerary[state.activeDay].findIndex(i => i.id === state.editingId); 
          plan.itinerary[state.activeDay][idx] = data; 
        } else { 
          plan.itinerary[state.activeDay].push(data); 
        }
        
        await updateDoc(doc(db, 'artifacts', appId, 'users', state.user.uid, 'plans', state.currentPlanId), { itinerary: plan.itinerary });
        closeAllModals(); showToast("已同步至雲端！");
      });

      document.getElementById('btn-option-edit').addEventListener('click', () => {
        closeAllModals();
        setTimeout(() => {
          const item = state.tripData.itinerary[state.activeDay].find(i => i.id === state.editingId);
          if (item) openFormModal(item.type, item.id);
        }, 300);
      });

      document.getElementById('btn-option-delete').addEventListener('click', () => {
        closeAllModals(); setTimeout(() => {
          document.getElementById('modal-overlay').classList.remove('closed'); document.getElementById('modal-overlay').classList.add('open');
          document.getElementById('modal-delete').classList.remove('closed'); document.getElementById('modal-delete').classList.add('open');
          document.getElementById('delete-dialog-content').classList.remove('scale-95', 'opacity-0'); document.getElementById('delete-dialog-content').classList.add('scale-100', 'opacity-100');
        }, 300);
      });

      document.getElementById('btn-confirm-delete').addEventListener('click', async () => {
        state.tripData.itinerary[state.activeDay] = state.tripData.itinerary[state.activeDay].filter(i => i.id !== state.editingId);
        await updateDoc(doc(db, 'artifacts', appId, 'users', state.user.uid, 'plans', state.currentPlanId), { itinerary: state.tripData.itinerary });
        closeAllModals(); showToast("已刪除項目");
      });
    }

    init();
  </script>
</body>
</html>
