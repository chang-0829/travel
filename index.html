<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>旅圖製造所</title>
    
    <!-- === 全域依賴資源 (只會載入這一次) === -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 地圖資源 (提前載入，換頁不閃爍) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <!-- === 您的精密排版 CSS (完全保留) === -->
    <style>
        html, body {
            overflow-x: hidden;
            width: 100%;
        }
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f9fafb;
        }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        .pb-nav-safe { padding-bottom: calc(4rem + env(safe-area-inset-bottom)); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        #desktop-sidebar { 
            width: 4.5rem; 
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease; 
            overflow-x: hidden;
            white-space: nowrap; 
        }
        #desktop-sidebar:hover { 
            width: 16rem; 
            box-shadow: 4px 0 24px -5px rgba(0,0,0,0.08);
        }

        #main-content { 
            margin-left: 4.5rem; 
            transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        @media (max-width: 767px) {
            #main-content { margin-left: 0; }
        }
        
        .nav-item { 
            display: flex; align-items: center; height: 3.5rem; margin-left: 0.5rem; margin-right: 0.5rem; padding-left: 0.5rem; position: relative;
        }
        .icon-wrapper {
            width: 2.5rem; height: 2.5rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .sidebar-text { 
            margin-left: 0.75rem; opacity: 0; transform: translateX(-10px); transition: opacity 0.3s ease, transform 0.3s ease; font-weight: 500;
        }
        #desktop-sidebar:hover .sidebar-text { 
            opacity: 1; transform: translateX(0); transition-delay: 0.05s; 
        }
        .logo-container { 
            display: flex; align-items: center; padding-left: 1rem; height: 4.5rem; 
        }
    </style>
</head>
<body class="text-gray-800">

    <!-- ========================================== -->
    <!-- 共用導覽列容器 (會由 JS 自動載入 components/navbar.html) -->
    <!-- ========================================== -->
    <div id="navbar-container"></div>

    <!-- ========================================== -->
    <!-- 動態內容渲染區塊 (會由 JS 自動載入各頁面內容) -->
    <!-- ========================================== -->
    <main id="main-content" class="pb-nav-safe md:pb-0 min-h-screen relative">
        
        <!-- 全域過場載入動畫 -->
        <div id="loader" class="hidden absolute inset-0 bg-[#f9fafb] z-40 flex items-center justify-center">
            <div class="animate-spin rounded-full h-10 w-10 border-4 border-blue-200 border-t-blue-600"></div>
        </div>
        
        <!-- 各頁面 (如 home.html, discover.html) 的內容會被塞進這裡 -->
        <div id="app-content" class="w-full h-full"></div>
    </main>

    <!-- ========================================== -->
    <!-- 引入 SPA 核心腳本 -->
    <!-- ========================================== -->
    <script type="module" src="/js/app.js"></script>

</body>
</html>
