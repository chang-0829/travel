<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>去趣旅行 - 我的個人行程平台</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              primary: '#748CAB',
              dark: '#3E5C76',
              light: '#E6EBEF',
              bg: '#F8FAFC',
              card: '#FFFFFF',
              textMain: '#1E293B',
              textSub: '#64748B',
              accent: '#D5896F'
            }
          }
        }
      }
    }
  </script>

  <style>
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .bottom-sheet { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .bottom-sheet.open { transform: translateY(0); }
    .bottom-sheet.closed { transform: translateY(100%); }
    .view-transition { transition: opacity 0.2s ease-in-out; }
    .timeline-line { width: 4px; }
    
    /* 桌面版寬度適配 */
    @media (min-width: 768px) {
      #app-inner { max-width: 1000px; margin: 0 auto; }
      #bottom-nav { width: 450px; left: 50% !important; transform: translateX(-50%); border-radius: 30px 30px 0 0; }
    }
  </style>
</head>
<body class="bg-brand-bg text-brand-textMain font-sans antialiased overflow-hidden">

  <!-- APP 容器 -->
  <div id="app" class="w-full h-[100dvh] bg-brand-bg flex flex-col relative">
    
    <!-- Toast -->
    <div id="toast" class="fixed top-10 left-1/2 -translate-x-1/2 z-[100] bg-brand-dark text-white px-6 py-3 rounded-full shadow-2xl opacity-0 pointer-events-none transition-all duration-300 text-sm font-bold"></div>

    <!-- VIEW: 登入頁 (僅 Google) -->
    <div id="view-login" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-white px-10 view-transition">
      <div class="w-24 h-24 bg-brand-primary rounded-[30px] flex items-center justify-center mb-6 shadow-2xl shadow-brand-primary/40 animate-bounce">
        <i class="fa-solid fa-map-location-dot text-white text-4xl"></i>
      </div>
      <h1 class="text-3xl font-black text-brand-dark mb-2 tracking-tight">去趣旅行</h1>
      <p class="text-brand-textSub mb-12 text-center leading-relaxed font-medium">個人行程雲端同步中心</p>
      
      <button id="btn-login-google" class="w-full max-w-xs bg-white border border-gray-200 text-gray-700 font-bold py-4 rounded-2xl flex items-center justify-center gap-4 shadow-sm active:scale-95 transition-all hover:bg-gray-50">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" class="w-6 h-6"> 使用 Google 帳號登入
      </button>
      <p class="mt-8 text-[11px] text-brand-textSub opacity-50">正式版環境：所有資料皆受到加密保護</p>
    </div>

    <!-- 主內容區塊 (限制電腦版寬度) -->
    <div id="app-inner" class="flex-1 w-full flex flex-col overflow-hidden bg-white shadow-sm">
      
      <!-- VIEW: 我的行程 (首頁) -->
      <div id="view-plans" class="hidden flex-1 flex flex-col overflow-hidden">
        <header class="pt-12 pb-6 px-6 shrink-0 flex justify-between items-center">
          <h1 class="text-2xl font-black text-brand-dark">我的行程</h1>
          <button id="btn-new-plan" class="bg-brand-primary text-white px-5 py-2.5 rounded-full flex items-center gap-2 shadow-lg active:scale-90 transition-all font-bold text-sm">
            <i class="fa-solid fa-plus"></i> 新增計畫
          </button>
        </header>
        <div id="plans-list" class="flex-1 overflow-y-auto px-6 pb-24 hide-scrollbar grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 auto-rows-min">
          <!-- 行程卡片將在此渲染 -->
        </div>
      </div>

      <!-- VIEW: 行程詳情 / 編輯器 -->
      <div id="view-editor" class="hidden flex-1 flex flex-col overflow-hidden bg-white relative">
        <header class="bg-white pt-10 pb-4 px-6 shrink-0 border-b border-gray-50 flex items-center justify-between z-10">
          <button onclick="switchView('plans')" class="w-10 h-10 flex items-center justify-start text-brand-dark hover:scale-110 transition-all">
            <i class="fa-solid fa-chevron-left text-xl"></i>
          </button>
          <div class="text-center flex-1">
            <h2 id="current-plan-title" class="font-bold text-brand-dark truncate px-4">載入中...</h2>
            <p id="current-plan-date" class="text-[10px] text-brand-textSub font-mono"></p>
          </div>
          <button id="btn-edit-plan-info" class="w-10 h-10 flex items-center justify-end text-brand-textSub hover:text-brand-primary">
            <i class="fa-solid fa-gear text-lg"></i>
          </button>
        </header>

        <div class="bg-white px-6 py-3 shrink-0 border-b border-gray-50 overflow-x-auto hide-scrollbar">
          <div id="days-tabs" class="flex gap-3 snap-x"></div>
        </div>

        <div id="timeline-container" class="flex-1 overflow-y-auto px-4 pb-32 pt-4 relative bg-white md:px-20 lg:px-40">
          <!-- 專業時間軸內容 -->
        </div>

        <div class="absolute bottom-24 inset-x-0 px-6 flex justify-end gap-3 z-20 pointer-events-none md:bottom-10">
          <button id="btn-add-location" class="pointer-events-auto flex items-center justify-center gap-2 bg-brand-dark text-white font-bold h-12 px-6 rounded-full shadow-lg active:scale-95 transition-all">
            <i class="fa-solid fa-location-dot"></i> <span class="text-sm">地點</span>
          </button>
          <button id="btn-add-transport" class="pointer-events-auto flex items-center justify-center gap-2 bg-brand-accent text-white font-bold h-12 px-6 rounded-full shadow-lg active:scale-95 transition-all">
            <i class="fa-solid fa-train-tram"></i> <span class="text-sm">交通</span>
          </button>
        </div>
      </div>

      <!-- VIEW: 個人中心 -->
      <div id="view-profile" class="hidden flex-1 flex flex-col items-center justify-center px-6 bg-brand-bg">
         <div class="w-24 h-24 bg-white rounded-full mb-4 overflow-hidden border-4 border-brand-primary shadow-xl">
           <img id="user-photo" src="https://ui-avatars.com/api/?name=User" class="w-full h-full object-cover">
         </div>
         <h2 id="user-name" class="text-xl font-bold text-brand-dark mb-1">旅行者</h2>
         <p id="user-email" class="text-xs text-brand-textSub mb-8"></p>
         <button id="btn-logout" class="w-full max-w-xs py-4 bg-white text-red-500 font-bold rounded-2xl shadow-sm hover:bg-red-50 transition-all flex items-center justify-center gap-2 border border-red-100">
           <i class="fa-solid fa-power-off"></i> 登出帳號
         </button>
      </div>

      <!-- 底部分頁導覽 -->
      <nav id="bottom-nav" class="hidden absolute bottom-0 inset-x-0 bg-white/90 backdrop-blur-md border-t border-gray-100 h-20 shrink-0 flex items-center justify-around px-10 z-[40] shadow-[0_-10px_30px_rgba(0,0,0,0.05)]">
        <button class="nav-item flex flex-col items-center gap-1 group relative active" data-view="plans">
          <i class="fa-solid fa-calendar-days text-xl text-brand-textSub group-[.active]:text-brand-primary transition-all"></i>
          <span class="text-[10px] font-bold text-brand-textSub group-[.active]:text-brand-primary">我的行程</span>
        </button>
        <button class="nav-item flex flex-col items-center gap-1 group relative" data-view="profile">
          <i class="fa-solid fa-circle-user text-xl text-brand-textSub group-[.active]:text-brand-primary transition-all"></i>
          <span class="text-[10px] font-bold text-brand-textSub group-[.active]:text-brand-primary">個人設定</span>
        </button>
      </nav>
    </div>

  </div> <!-- End App -->

  <!-- Modal Overlay -->
  <div id="modal-overlay" class="hidden fixed inset-0 z-[60] bg-black/40 backdrop-blur-sm transition-opacity"></div>
  
  <!-- Sheet Form -->
  <div id="sheet-form" class="bottom-sheet closed fixed inset-x-0 bottom-0 z-[61] bg-white rounded-t-[32px] max-h-[90vh] flex flex-col shadow-2xl max-w-md mx-auto">
     <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mt-4 mb-2 shrink-0"></div>
     <div id="sheet-content" class="p-6 overflow-y-auto hide-scrollbar">
       <!-- JS 動態生成表單 -->
     </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
    import { getFirestore, doc, collection, onSnapshot, query, addDoc, deleteDoc, updateDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    // --------------------------------------------------
    // ✅ 已填入您的 Firebase 設定
    // --------------------------------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyCQF8A3ieML0JP3X8X78NCRuiUETRAiu5E",
      authDomain: "travel-96009.firebaseapp.com",
      projectId: "travel-96009",
      storageBucket: "travel-96009.firebasestorage.app",
      messagingSenderId: "578860064042",
      appId: "1:578860064042:web:b147880df3a01dd8f75253"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = "travel-platform-v1";

    const TRANSPORT_MODES = [
      { id: 'train', label: '電車', icon: 'fa-solid fa-train' },
      { id: 'bus', label: '公車', icon: 'fa-solid fa-bus' },
      { id: 'car', label: '開車', icon: 'fa-solid fa-car' },
      { id: 'walk', label: '步行', icon: 'fa-solid fa-person-walking' },
      { id: 'plane', label: '飛機', icon: 'fa-solid fa-plane' }
    ];

    const LOCATION_MODES = [
      { id: 'spot', label: '景點', icon: 'fa-solid fa-location-dot' },
      { id: 'hotel', label: '住宿', icon: 'fa-solid fa-hotel' },
      { id: 'food', label: '美食', icon: 'fa-solid fa-utensils' },
      { id: 'shop', label: '購物', icon: 'fa-solid fa-bag-shopping' },
      { id: 'airport', label: '機場', icon: 'fa-solid fa-plane-arrival' }
    ];

    let state = {
      user: null,
      plans: [],
      currentPlanId: null,
      activeDay: 1
    };

    // --------------------------------------------------
    // Auth 核心
    // --------------------------------------------------
    onAuthStateChanged(auth, (user) => {
      state.user = user;
      if (user) {
        document.getElementById('view-login').classList.add('opacity-0', 'pointer-events-none');
        setTimeout(() => document.getElementById('view-login').classList.add('hidden'), 300);
        document.getElementById('bottom-nav').classList.remove('hidden');
        
        // 個人資訊渲染
        document.getElementById('user-name').innerText = user.displayName;
        document.getElementById('user-email').innerText = user.email;
        if (user.photoURL) document.getElementById('user-photo').src = user.photoURL;

        switchView('plans');
        listenToPlans();
      } else {
        document.getElementById('view-login').classList.remove('hidden', 'opacity-0', 'pointer-events-none');
        document.getElementById('bottom-nav').classList.add('hidden');
      }
    });

    function listenToPlans() {
      if (!state.user) return;
      const q = collection(db, 'artifacts', appId, 'users', state.user.uid, 'plans');
      onSnapshot(q, (snapshot) => {
        state.plans = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderPlansList();
        if (state.currentPlanId) {
          const activePlan = state.plans.find(p => p.id === state.currentPlanId);
          if (activePlan) renderEditor(activePlan);
        }
      });
    }

    // --------------------------------------------------
    // 介面渲染
    // --------------------------------------------------
    window.switchView = function(viewId) {
      ['plans', 'editor', 'profile'].forEach(v => {
        const el = document.getElementById(`view-${v}`);
        if (el) el.classList.add('hidden');
      });
      const target = document.getElementById(`view-${viewId}`);
      if (target) target.classList.remove('hidden');

      document.querySelectorAll('.nav-item').forEach(item => {
        item.classList.toggle('active', item.dataset.view === viewId);
      });
    };

    function renderPlansList() {
      const container = document.getElementById('plans-list');
      if (state.plans.length === 0) {
        container.innerHTML = `<div class="col-span-full py-20 text-center text-brand-textSub opacity-40"><i class="fa-solid fa-map-location-dot text-5xl mb-4"></i><p>您目前還沒有建立任何行程</p></div>`;
        return;
      }
      container.innerHTML = state.plans.sort((a, b) => b.createdAt - a.createdAt).map(plan => `
        <div onclick="openPlan('${plan.id}')" class="bg-white rounded-[28px] overflow-hidden shadow-sm border border-gray-100 flex h-32 active:scale-95 transition-all cursor-pointer hover:shadow-lg">
          <div class="w-28 bg-brand-light flex items-center justify-center text-brand-primary">
            <i class="fa-solid fa-suitcase text-3xl opacity-50"></i>
          </div>
          <div class="flex-1 p-5 flex flex-col justify-center overflow-hidden">
            <h3 class="font-black text-brand-dark text-lg truncate">${plan.title}</h3>
            <p class="text-[11px] text-brand-textSub mt-1 font-mono">${plan.startDate} · ${plan.days} 天</p>
          </div>
          <div class="px-5 flex items-center text-gray-200"><i class="fa-solid fa-angle-right"></i></div>
        </div>
      `).join('');
    }

    window.openPlan = function(id) {
      state.currentPlanId = id;
      state.activeDay = 1;
      const plan = state.plans.find(p => p.id === id);
      renderEditor(plan);
      switchView('editor');
    };

    function renderEditor(plan) {
      document.getElementById('current-plan-title').innerText = plan.title;
      document.getElementById('current-plan-date').innerText = `${plan.startDate} (${plan.days} 天)`;
      
      // 天數頁籤
      const tabs = document.getElementById('days-tabs');
      let tabsHtml = '';
      for (let i = 1; i <= plan.days; i++) {
        const active = state.activeDay === i;
        tabsHtml += `<button onclick="state.activeDay = ${i}; openPlan('${plan.id}')" class="snap-start shrink-0 px-6 py-2.5 rounded-full font-bold transition-all text-sm border ${active ? 'bg-brand-primary text-white border-brand-primary shadow-md' : 'bg-white text-brand-textSub border-gray-200'}">Day ${i}</button>`;
      }
      tabs.innerHTML = tabsHtml;

      // 時間軸
      const timeline = document.getElementById('timeline-container');
      const items = (plan.itinerary && plan.itinerary[state.activeDay]) || [];
      
      if (items.length === 0) {
        timeline.innerHTML = `<div class="py-20 text-center text-brand-textSub opacity-30"><i class="fa-solid fa-route text-5xl mb-4"></i><p>這天還沒有安排行程</p></div>`;
        return;
      }

      let html = '<div class="relative pl-2 pr-2 pb-12">';
      items.sort((a, b) => a.timeStart.localeCompare(b.timeStart)).forEach((item, index, arr) => {
        const isFirst = index === 0; const isLast = index === arr.length - 1;
        let lineHtml = (arr.length > 1) ? `<div class="absolute ${isFirst ? 'top-[26px] bottom-0' : (isLast ? 'top-0 h-[26px]' : 'top-0 bottom-0')} timeline-line bg-brand-primary z-0 opacity-20"></div>` : '';

        if (item.type === 'location') {
          const locObj = LOCATION_MODES.find(m => m.id === item.locMode) || LOCATION_MODES[0];
          html += `
            <div class="relative flex group py-4 cursor-pointer" onclick="editItem('${item.id}', 'location')">
              <div class="w-[72px] shrink-0 text-right pr-4 pt-[2px] flex flex-col font-bold font-mono text-brand-dark text-[15px] leading-tight gap-1">
                <span>${item.timeStart}</span>
                ${item.timeEnd ? `<span class="opacity-30">${item.timeEnd}</span>` : ''}
              </div>
              <div class="w-6 shrink-0 flex flex-col items-center relative self-stretch">
                ${lineHtml}
                <div class="${item.isThrough ? 'w-4 h-4 border-2' : 'w-3.5 h-3.5 border-[3px]'} rounded-full border-brand-primary bg-white z-10 mt-[2px] shadow-sm flex items-center justify-center">
                  ${item.isThrough ? '<i class="fa-solid fa-angles-down text-[8px] text-brand-primary"></i>' : ''}
                </div>
              </div>
              <div class="flex-1 pl-4">
                <div class="flex items-center gap-2">
                   <i class="${locObj.icon} text-brand-primary text-xs opacity-50"></i>
                   <h4 class="font-black text-brand-textMain text-lg">${item.name}</h4>
                   ${item.isThrough ? '<span class="text-[9px] font-bold text-white bg-brand-primary px-1.5 py-0.5 rounded">直通站</span>' : ''}
                </div>
                ${item.subtitle ? `<p class="text-sm text-brand-textSub mt-1.5 leading-relaxed">${item.subtitle}</p>` : ''}
              </div>
            </div>`;
        } else {
          // 交通去重複邏輯
          let showStart = true; let showEnd = true;
          const prev = arr[index - 1]; const next = arr[index + 1];
          if (prev && item.timeStart === (prev.timeEnd || prev.timeStart)) showStart = false;
          if (next && item.timeEnd && item.timeEnd === next.timeStart) showEnd = false;

          const modeObj = TRANSPORT_MODES.find(m => m.id === item.mode) || TRANSPORT_MODES[0];
          html += `
            <div class="relative flex group items-stretch cursor-pointer" onclick="editItem('${item.id}', 'transport')">
              <div class="w-[72px] shrink-0 text-right pr-4 py-6 flex flex-col justify-between items-end font-bold font-mono text-brand-dark text-[15px]">
                <span class="${showStart ? '' : 'opacity-0'}">${item.timeStart}</span>
                <div class="flex flex-col items-end my-2">
                   <span class="text-[12px] font-bold text-brand-textSub leading-tight">${item.duration || ''}</span>
                   ${item.extraInfo ? `<span class="text-[11px] font-bold text-brand-accent flex items-center mt-1">${item.extraInfo}<i class="fa-solid fa-caret-down ml-1 text-[8px]"></i></span>` : ''}
                </div>
                <span class="${showEnd ? '' : 'opacity-0'}">${item.timeEnd || ''}</span>
              </div>
              <div class="w-6 shrink-0 flex flex-col items-center relative self-stretch">
                ${lineHtml}
              </div>
              <div class="flex-1 pl-4 py-6">
                 <div class="flex items-center gap-2 mb-2">
                   <div class="w-7 h-7 rounded-lg bg-brand-accent/10 text-brand-accent flex items-center justify-center shrink-0">
                     <i class="${modeObj.icon} text-sm"></i>
                   </div>
                   <span class="text-sm font-black text-brand-accent">${item.operator || ''} ${item.vehicleNo || ''}</span>
                 </div>
                 <h4 class="font-bold text-brand-textMain text-[17px] ml-[36px]">${item.name || ''} ${item.direction ? `(${item.direction})` : ''}</h4>
              </div>
            </div>`;
        }
      });
      html += '</div>';
      timeline.innerHTML = html;
    }

    // --------------------------------------------------
    // 表單處理
    // --------------------------------------------------
    window.openSheet = function(type, itemId = null) {
      const plan = state.plans.find(p => p.id === state.currentPlanId);
      const content = document.getElementById('sheet-content');
      let item = itemId ? plan.itinerary[state.activeDay].find(i => i.id === itemId) : null;
      
      document.getElementById('modal-overlay').classList.remove('hidden');
      document.getElementById('sheet-form').classList.remove('closed');
      document.getElementById('sheet-form').classList.add('open');

      if (type === 'plan-info') {
        content.innerHTML = `
          <h3 class="text-xl font-bold mb-6">行程設定</h3>
          <div class="space-y-4">
            <div><label class="text-[10px] font-bold text-brand-textSub block mb-1">行程名稱</label><input id="f-title" type="text" value="${plan.title}" class="w-full bg-brand-bg p-4 rounded-2xl outline-none font-black text-lg"></div>
            <div class="flex gap-3">
              <div class="flex-1"><label class="text-[10px] font-bold text-brand-textSub block mb-1">出發日期</label><input id="f-date" type="date" value="${plan.startDate}" class="w-full bg-brand-bg p-4 rounded-2xl outline-none font-mono font-bold"></div>
              <div class="w-24"><label class="text-[10px] font-bold text-brand-textSub block mb-1">天數</label><input id="f-days" type="number" value="${plan.days}" class="w-full bg-brand-bg p-4 rounded-2xl outline-none font-bold text-center"></div>
            </div>
            <button onclick="updatePlanInfo()" class="w-full bg-brand-primary text-white py-4 rounded-2xl font-bold shadow-lg mt-4">儲存設定</button>
            <button onclick="deletePlan()" class="w-full py-4 text-red-500 font-bold opacity-40 hover:opacity-100 transition-opacity">刪除整個行程</button>
          </div>
        `;
      } else {
        const isLoc = type === 'location';
        content.innerHTML = `
          <h3 class="text-xl font-bold mb-6">${item ? '編輯' : '新增'}${isLoc ? '地點' : '交通'}</h3>
          <div class="space-y-4">
            <div class="flex gap-3">
              <div class="flex-1"><label class="text-[10px] font-bold text-brand-textSub">開始時間</label><input id="f-start" type="time" value="${item?.timeStart || '08:00'}" class="w-full bg-brand-bg p-3 rounded-xl outline-none font-bold text-lg font-mono"></div>
              <div class="flex-1"><label class="text-[10px] font-bold text-brand-textSub">結束時間</label><input id="f-end" type="time" value="${item?.timeEnd || ''}" class="w-full bg-brand-bg p-3 rounded-xl outline-none font-bold text-lg font-mono"></div>
            </div>
            ${isLoc ? `
              <div class="grid grid-cols-5 gap-2">
                ${LOCATION_MODES.map(m => `<button onclick="selectMode(this)" data-mode="${m.id}" class="mode-btn p-3 rounded-xl border border-gray-100 flex flex-col items-center gap-1 ${item?.locMode === m.id ? 'active-mode' : (isLoc && m.id==='spot' && !item ? 'active-mode' : '')}"><i class="${m.icon}"></i></button>`).join('')}
              </div>
              <input id="f-name" type="text" placeholder="的地點名稱" value="${item?.name || ''}" class="w-full bg-brand-bg p-4 rounded-xl outline-none font-bold">
              <textarea id="f-sub" placeholder="備註..." class="w-full bg-brand-bg p-4 rounded-xl outline-none text-sm h-20">${item?.subtitle || ''}</textarea>
              <label class="flex items-center gap-3 text-sm font-bold text-brand-dark cursor-pointer"><input type="checkbox" id="f-through" ${item?.isThrough ? 'checked' : ''} class="w-5 h-5 accent-brand-primary"> 直通站 (免換乘/不下車)</label>
            ` : `
              <div class="grid grid-cols-5 gap-2">
                ${TRANSPORT_MODES.map(m => `<button onclick="selectMode(this)" data-mode="${m.id}" class="mode-btn p-3 rounded-xl border border-gray-100 flex flex-col items-center gap-1 ${item?.mode === m.id ? 'active-mode' : (!isLoc && m.id==='train' && !item ? 'active-mode' : '')}"><i class="${m.icon}"></i></button>`).join('')}
              </div>
              <div class="flex gap-2">
                <input id="f-op" type="text" placeholder="業者 (JR)" value="${item?.operator || ''}" class="flex-1 bg-brand-bg p-4 rounded-xl outline-none font-bold text-sm">
                <input id="f-veh" type="text" placeholder="班次/車次" value="${item?.vehicleNo || ''}" class="flex-1 bg-brand-bg p-4 rounded-xl outline-none font-bold text-sm">
              </div>
              <input id="f-name" type="text" placeholder="路線與方向" value="${item?.name || ''}" class="w-full bg-brand-bg p-4 rounded-xl outline-none font-bold">
              <div class="flex gap-2">
                <input id="f-dur" type="text" placeholder="幾小時幾分" value="${item?.duration || ''}" class="flex-1 bg-brand-bg p-4 rounded-xl outline-none text-sm font-bold">
                <input id="f-extra" type="text" placeholder="站數" value="${item?.extraInfo || ''}" class="flex-1 bg-brand-bg p-4 rounded-xl outline-none text-sm font-bold">
              </div>
            `}
            <button onclick="saveItem('${itemId}', '${type}')" class="w-full ${isLoc ? 'bg-brand-primary' : 'bg-brand-accent'} text-white py-4 rounded-2xl font-bold shadow-lg mt-4 active:scale-95 transition-all">儲存並同步雲端</button>
            ${itemId ? `<button onclick="deleteItem('${itemId}')" class="w-full py-2 text-red-400 text-xs font-bold mt-2">刪除此項目</button>` : ''}
          </div>
        `;
      }
    };

    window.selectMode = (btn) => {
      btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active-mode'));
      btn.classList.add('active-mode');
    };

    window.closeSheet = () => {
      document.getElementById('modal-overlay').classList.add('hidden');
      document.getElementById('sheet-form').classList.remove('open');
      document.getElementById('sheet-form').classList.add('closed');
    };

    window.saveItem = async (itemId, type) => {
      const plan = state.plans.find(p => p.id === state.currentPlanId);
      const itinerary = plan.itinerary || {};
      if (!itinerary[state.activeDay]) itinerary[state.activeDay] = [];

      const activeMode = document.querySelector('.active-mode')?.dataset.mode;
      const data = {
        id: itemId || Date.now().toString(),
        type: type,
        timeStart: document.getElementById('f-start').value,
        timeEnd: document.getElementById('f-end').value,
        name: document.getElementById('f-name').value,
      };

      if (type === 'location') {
        data.locMode = activeMode || 'spot';
        data.subtitle = document.getElementById('f-sub').value;
        data.isThrough = document.getElementById('f-through').checked;
      } else {
        data.mode = activeMode || 'train';
        data.operator = document.getElementById('f-op').value;
        data.vehicleNo = document.getElementById('f-veh').value;
        data.duration = document.getElementById('f-dur').value;
        data.extraInfo = document.getElementById('f-extra').value;
      }

      if (itemId) {
        const idx = itinerary[state.activeDay].findIndex(i => i.id === itemId);
        itinerary[state.activeDay][idx] = data;
      } else {
        itinerary[state.activeDay].push(data);
      }

      await updateDoc(doc(db, 'artifacts', appId, 'users', state.user.uid, 'plans', state.currentPlanId), { itinerary });
      closeSheet();
      showToast("雲端同步成功");
    };

    window.updatePlanInfo = async () => {
      const title = document.getElementById('f-title').value;
      const startDate = document.getElementById('f-date').value;
      const days = parseInt(document.getElementById('f-days').value);
      await updateDoc(doc(db, 'artifacts', appId, 'users', state.user.uid, 'plans', state.currentPlanId), { title, startDate, days });
      closeSheet();
    };

    window.deletePlan = async () => {
      if (confirm("確定要刪除整個行程嗎？雲端資料將無法復原。")) {
        await deleteDoc(doc(db, 'artifacts', appId, 'users', state.user.uid, 'plans', state.currentPlanId));
        state.currentPlanId = null;
        switchView('plans');
        closeSheet();
      }
    };

    window.deleteItem = async (itemId) => {
      const plan = state.plans.find(p => p.id === state.currentPlanId);
      plan.itinerary[state.activeDay] = plan.itinerary[state.activeDay].filter(i => i.id !== itemId);
      await updateDoc(doc(db, 'artifacts', appId, 'users', state.user.uid, 'plans', state.currentPlanId), { itinerary: plan.itinerary });
      closeSheet();
    };

    window.editItem = (id, type) => openSheet(type, id);

    // --------------------------------------------------
    // 事件
    // --------------------------------------------------
    document.getElementById('btn-login-google').onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(err => alert("登入失敗：" + err.message));
    document.getElementById('btn-logout').onclick = () => signOut(auth);
    document.querySelectorAll('.nav-item').forEach(btn => btn.onclick = () => switchView(btn.dataset.view));
    document.getElementById('btn-add-location').onclick = () => openSheet('location');
    document.getElementById('btn-add-transport').onclick = () => openSheet('transport');
    document.getElementById('btn-edit-plan-info').onclick = () => openSheet('plan-info');
    document.getElementById('modal-overlay').onclick = closeSheet;

    document.getElementById('btn-new-plan').onclick = async () => {
      const title = prompt("請輸入行程名稱", "我的新計畫");
      if (title) {
        const docRef = await addDoc(collection(db, 'artifacts', appId, 'users', state.user.uid, 'plans'), {
          title: title,
          days: 3,
          startDate: new Date().toISOString().split('T')[0],
          itinerary: {},
          createdAt: Date.now()
        });
        openPlan(docRef.id);
      }
    };

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.innerText = msg;
      el.classList.remove('opacity-0', 'pointer-events-none');
      el.classList.add('opacity-100');
      setTimeout(() => el.classList.add('opacity-0', 'pointer-events-none'), 2500);
    }

    // 樣式修正
    const style = document.createElement('style');
    style.innerHTML = `
      .active-mode { border-color: #748CAB !important; background-color: #F1F5F9 !important; color: #748CAB; transform: scale(1.1); font-weight: bold; }
      .nav-item.active i { color: #748CAB !important; transform: translateY(-3px); }
    `;
    document.head.appendChild(style);

  </script>
</body>
</html>
