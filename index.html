<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>旅圖製造所</title>
    <!-- 使用 Tailwind CSS 加速排版 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        html, body {
            overflow-x: hidden; /* 徹底杜絕手機版左右亂晃與白邊的問題 */
            width: 100%;
        }
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f9fafb; /* 淺灰色背景 */
        }
        /* iOS 底部安全區處理 */
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        .pb-nav-safe { padding-bottom: calc(4rem + env(safe-area-inset-bottom)); }
        
        /* 隱藏滾動條但保持可滾動 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* ==== 電腦版選單：懸停滑出 (極致絲滑無跳動版) ==== */
        #desktop-sidebar { 
            width: 4.5rem; /* 收合寬度 72px */
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease; 
            overflow-x: hidden;
            white-space: nowrap; /* 確保文字不換行 */
        }
        
        /* 滑鼠靠近時自動展開 */
        #desktop-sidebar:hover { 
            width: 16rem; /* 展開至 256px */
            box-shadow: 4px 0 24px -5px rgba(0,0,0,0.08);
        }

        /* 主內容固定左邊距，讓側邊欄是「優雅覆蓋」而不是「粗暴推擠」 */
        #main-content { 
            margin-left: 4.5rem; 
            transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        @media (max-width: 767px) {
            #main-content { margin-left: 0; }
        }
        
        /* === 精密佈局：運用數學完美置中，收合時為正方形 === */
        
        /* 1. 固定高度與外距，打造完美 56x56 正方形 */
        .nav-item { 
            display: flex;
            align-items: center;
            height: 3.5rem; /* 56px */
            margin-left: 0.5rem; /* 左外距 8px */
            margin-right: 0.5rem; /* 右外距 8px */
            padding-left: 0.5rem; /* 左內距 8px，用來完美置中 40px 的圖示 */
            position: relative;
        }

        /* 2. 圖示容器固定 40px。 (8px內距 + 40px圖示 + 8px剩餘空間 = 56px正方形) -> 視覺上完美置中！ */
        .icon-wrapper {
            width: 2.5rem; 
            height: 2.5rem; 
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* 3. 文字漸變與滑動出場 */
        .sidebar-text { 
            margin-left: 0.75rem;
            opacity: 0;
            transform: translateX(-10px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            font-weight: 500;
        }
        #desktop-sidebar:hover .sidebar-text { 
            opacity: 1;
            transform: translateX(0);
            transition-delay: 0.05s; /* 微延遲讓滑出感更好 */
        }

        /* Logo 區塊 */
        .logo-container { 
            display: flex; 
            align-items: center; 
            padding-left: 1rem; /* 16px，剛好對齊選單的 (8px margin + 8px padding) */
            height: 4.5rem; 
        }
    </style>
</head>
<body class="text-gray-800">

    <!-- ========================================== -->
    <!-- [電腦版] 側邊導覽列 (大螢幕顯示，小螢幕隱藏) -->
    <!-- ========================================== -->
    <aside id="desktop-sidebar" class="hidden md:flex flex-col h-screen fixed top-0 left-0 bg-white border-r border-gray-200 z-50">
        
        <!-- Logo 頂部區塊 -->
        <div class="shrink-0 border-b border-gray-100 flex flex-col justify-center min-h-[4.5rem]">
            <a href="#home" class="logo-container overflow-hidden">
                <div class="icon-wrapper text-blue-600">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </div>
                <span class="text-xl font-bold text-gray-800 tracking-wider sidebar-text">旅圖製造所</span>
            </a>
        </div>

        <!-- 導覽選單主體 (加上 no-scrollbar 隱藏醜醜的拖曳桿) -->
        <nav class="flex-1 overflow-y-auto no-scrollbar py-4 space-y-1">
            <a href="#home" data-route="home" class="nav-link nav-item text-gray-600 rounded-xl hover:bg-gray-50 hover:text-blue-600 group">
                <div class="icon-wrapper">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                </div>
                <span class="sidebar-text">首頁</span>
            </a>
            
            <a href="#discover" data-route="discover" class="nav-link nav-item text-gray-600 rounded-xl hover:bg-gray-50 hover:text-blue-600 group">
                <div class="icon-wrapper">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
                <span class="sidebar-text">尋覓世界</span>
            </a>

            <a href="#mytrip" data-route="mytrip" class="nav-link nav-item text-gray-600 rounded-xl hover:bg-gray-50 hover:text-blue-600 group">
                <div class="icon-wrapper">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path></svg>
                </div>
                <span class="sidebar-text">行程工坊</span>
            </a>

            <div class="border-b border-gray-100 my-2 mx-2"></div>

            <a href="#account" data-route="account" class="nav-link nav-item text-gray-600 rounded-xl hover:bg-gray-50 hover:text-blue-600 group">
                <div class="icon-wrapper">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                </div>
                <span class="sidebar-text">旅人檔案</span>
            </a>
        </nav>

        <div class="py-3 border-t border-gray-100 shrink-0">
            <a href="#admin" data-route="admin" class="nav-link nav-item text-gray-500 hover:text-gray-800 rounded-xl hover:bg-gray-50 transition-colors group">
                <div class="icon-wrapper">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                </div>
                <span class="sidebar-text text-sm">後台管理</span>
            </a>
        </div>
    </aside>

    <!-- ========================================== -->
    <!-- [手機版] 底部導覽列 (使用 Grid 解決跑版與橫向捲軸) -->
    <!-- ========================================== -->
    <nav class="md:hidden fixed bottom-0 inset-x-0 bg-white border-t border-gray-200 z-[99] pb-safe shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
        <div class="grid grid-cols-4 h-[4rem]">
            <a href="#home" data-route="home" class="nav-link flex flex-col items-center justify-center text-gray-500 hover:text-blue-600 transition-colors">
                <svg class="w-6 h-6 mb-1 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                <span class="text-[10px] font-medium tracking-wide">首頁</span>
            </a>
            
            <a href="#discover" data-route="discover" class="nav-link flex flex-col items-center justify-center text-gray-500 hover:text-blue-600 transition-colors">
                <svg class="w-6 h-6 mb-1 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <span class="text-[10px] font-medium tracking-wide">尋覓世界</span>
            </a>

            <a href="#mytrip" data-route="mytrip" class="nav-link flex flex-col items-center justify-center text-gray-500 hover:text-blue-600 transition-colors">
                <svg class="w-6 h-6 mb-1 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path></svg>
                <span class="text-[10px] font-medium tracking-wide">行程工坊</span>
            </a>

            <a href="#account" data-route="account" class="nav-link flex flex-col items-center justify-center text-gray-500 hover:text-blue-600 transition-colors">
                <svg class="w-6 h-6 mb-1 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                <span class="text-[10px] font-medium tracking-wide">旅人檔案</span>
            </a>
        </div>
    </nav>

    <!-- ========================================== -->
    <!-- 動態內容渲染區塊 -->
    <!-- ========================================== -->
    <main id="main-content" class="pb-nav-safe md:pb-0 min-h-screen relative">
        <div id="loader" class="hidden absolute inset-0 bg-gray-50 z-40 flex items-center justify-center">
            <div class="animate-spin rounded-full h-10 w-10 border-4 border-blue-200 border-t-blue-600"></div>
        </div>
        
        <div id="app-content" class="w-full h-full"></div>
    </main>

    <!-- ========================================== -->
    <!-- 路由腳本 (核心功能維持原樣) -->
    <!-- ========================================== -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const contentDiv = document.getElementById('app-content');
            const loader = document.getElementById('loader');

            async function handleRoute() {
                let route = window.location.hash.substring(1) || 'home';
                updateActiveMenu(route);
                loader.classList.remove('hidden');

                try {
                    let fileToFetch = route + '.html';
                    if(route === 'home') fileToFetch = 'index2.html'; 

                    const response = await fetch(fileToFetch);
                    
                    if (response.ok) {
                        const htmlText = await response.text();
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(htmlText, 'text/html');
                        
                        contentDiv.innerHTML = doc.body.innerHTML;
                        executeScripts(contentDiv);
                        window.scrollTo(0, 0);
                    } else {
                        contentDiv.innerHTML = `
                            <div class="flex flex-col items-center justify-center h-[80vh]">
                                <h1 class="text-6xl font-bold text-gray-300 mb-4">404</h1>
                                <p class="text-xl text-gray-600 mb-6">哎呀！找不到您要的頁面</p>
                                <a href="#home" class="px-6 py-2 bg-blue-600 text-white rounded-lg shadow hover:bg-blue-700">返回首頁</a>
                            </div>`;
                    }
                } catch (error) {
                    console.error("載入頁面失敗:", error);
                    contentDiv.innerHTML = `
                        <div class="p-8 text-center mt-10">
                            <h2 class="text-2xl font-bold text-red-500 mb-2">載入發生錯誤</h2>
                            <p class="text-gray-500">請確認您是否在伺服器環境（如 Live Server）下執行。</p>
                        </div>`;
                } finally {
                    loader.classList.add('hidden');
                }
            }

            function updateActiveMenu(currentRoute) {
                const links = document.querySelectorAll('.nav-link');
                links.forEach(link => {
                    const routeName = link.getAttribute('data-route');
                    
                    if (link.closest('aside')) { 
                        link.classList.remove('bg-blue-50', 'text-blue-700');
                        link.classList.add('text-gray-600');
                    } else { 
                        link.classList.remove('text-blue-600');
                        link.classList.add('text-gray-500');
                        link.querySelector('svg').classList.remove('text-blue-600');
                    }

                    if (routeName === currentRoute) {
                        if (link.closest('aside')) { 
                            link.classList.remove('text-gray-600');
                            link.classList.add('bg-blue-50', 'text-blue-700', 'font-semibold');
                        } else { 
                            link.classList.remove('text-gray-500');
                            link.classList.add('text-blue-600');
                            link.querySelector('svg').classList.add('text-blue-600');
                        }
                    }
                });
            }

            function executeScripts(element) {
                const scripts = element.querySelectorAll('script');
                scripts.forEach(oldScript => {
                    const newScript = document.createElement('script');
                    Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                    if (oldScript.innerHTML) {
                        newScript.innerHTML = oldScript.innerHTML;
                    }
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });
            }

            window.addEventListener('hashchange', handleRoute);
            handleRoute();
        });
    </script>
</body>
</html>
