<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>趣旅行 - 首頁</title>
  <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)">
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { brand: { primary: '#748CAB', dark: '#3E5C76', light: '#E6EBEF', bg: '#F2F5F8', card: '#FFFFFF', textMain: '#2C3E50', textSub: '#8796A5', accent: '#D5896F' } } } } }
  </script>
  <style>
    body { font-family: ui-sans-serif, system-ui, sans-serif; background-color: #F2F5F8; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .pb-safe { padding-bottom: max(12px, env(safe-area-inset-bottom)); }
    .pt-safe { padding-top: max(16px, env(safe-area-inset-top)); }
  </style>
</head>
<body class="text-brand-textMain antialiased overflow-hidden">
  <div class="max-w-md mx-auto h-[100dvh] bg-brand-bg shadow-xl relative flex flex-col">
    <!-- Header -->
    <header class="bg-brand-bg pt-safe pb-4 px-6 shrink-0 flex justify-between items-end border-b border-brand-light z-10">
      <div>
        <p class="text-sm font-bold text-brand-primary mb-1 uppercase tracking-widest mt-2">Explore & Plan</p>
        <h1 class="text-3xl font-extrabold text-brand-dark tracking-tight">趣旅行</h1>
      </div>
      <button onclick="alert('目前沒有新通知')" class="w-10 h-10 flex items-center justify-center bg-white border border-brand-light shadow-sm rounded-full text-brand-textSub hover:text-brand-primary active:scale-95 transition-all">
        <i class="fa-solid fa-bell text-lg"></i>
      </button>
    </header>

    <!-- View: Home -->
    <div class="flex-1 overflow-y-auto px-6 pb-6 hide-scrollbar relative pt-6">
       <div class="bg-brand-primary text-white rounded-[24px] p-6 shadow-md mb-6 relative overflow-hidden">
          <div class="absolute -right-6 -top-6 w-32 h-32 bg-white opacity-10 rounded-full blur-xl"></div>
          <div class="absolute -left-10 -bottom-10 w-40 h-40 bg-[#3E5C76] opacity-30 rounded-full blur-xl"></div>
          <h2 class="text-2xl font-extrabold mb-1 relative z-10" id="welcome-msg">早安，旅行者！</h2>
          <p class="text-white/80 font-bold text-[13px] relative z-10">探索新景點，規劃下一趟完美旅程</p>
       </div>
       
       <div class="grid grid-cols-2 gap-4 mb-8">
          <a href="./discover.html" class="bg-white p-5 rounded-[24px] shadow-sm border border-brand-light flex flex-col items-center justify-center gap-3 hover:shadow-md active:scale-[0.98] transition-all">
             <div class="w-14 h-14 rounded-full bg-[#E9C46A]/20 text-[#D4A33B] flex items-center justify-center text-2xl"><i class="fa-solid fa-earth-americas"></i></div>
             <span class="font-extrabold text-brand-dark">探索景點</span>
          </a>
          <a href="./mytrip.html" class="bg-white p-5 rounded-[24px] shadow-sm border border-brand-light flex flex-col items-center justify-center gap-3 hover:shadow-md active:scale-[0.98] transition-all">
             <div class="w-14 h-14 rounded-full bg-brand-primary/10 text-brand-primary flex items-center justify-center text-2xl"><i class="fa-solid fa-suitcase-rolling"></i></div>
             <span class="font-extrabold text-brand-dark">我的行程</span>
          </a>
       </div>
       
       <div>
         <div class="flex justify-between items-center mb-4">
           <h3 class="text-[15px] font-extrabold text-brand-dark">近期熱門探索</h3>
           <a href="./discover.html" class="text-[12px] font-bold text-brand-primary">查看全部</a>
         </div>
         <div id="home-trending-spots" class="flex overflow-x-auto gap-4 hide-scrollbar snap-x pb-4">
            <!-- 推薦景點動態載入 -->
         </div>
       </div>
    </div>

    <!-- 底部導覽列 -->
    <nav class="bg-white border-t border-brand-light shrink-0 z-40 pb-safe shadow-[0_-4px_20px_rgba(0,0,0,0.02)]">
      <div class="flex justify-around items-center h-[65px]">
        <a href="./index.html" class="flex flex-col items-center justify-center w-full h-full text-brand-primary transition-colors">
          <i class="fa-solid fa-house mb-1 text-[18px]"></i><span class="text-[10px] font-bold">首頁</span>
        </a>
        <a href="./discover.html" class="flex flex-col items-center justify-center w-full h-full text-brand-textSub hover:text-brand-primary transition-colors">
          <i class="fa-solid fa-earth-americas mb-1 text-[18px]"></i><span class="text-[10px] font-bold">探索</span>
        </a>
        <a href="./mytrip.html" class="flex flex-col items-center justify-center w-full h-full text-brand-textSub hover:text-brand-primary transition-colors">
          <i class="fa-solid fa-suitcase-rolling mb-1 text-[18px]"></i><span class="text-[10px] font-bold">行程</span>
        </a>
        <a href="./account.html" class="flex flex-col items-center justify-center w-full h-full text-brand-textSub hover:text-brand-primary transition-colors">
          <i class="fa-solid fa-user mb-1 text-[18px]"></i><span class="text-[10px] font-bold">會員</span>
        </a>
      </div>
    </nav>
  </div>

  <script type="module">
    import { initializeApp } from '[https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js](https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js)';
    import { getAuth, onAuthStateChanged } from '[https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js](https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js)';
    import { getFirestore, collection, onSnapshot } from '[https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js](https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js)';

    // 請替換為你的 Firebase Config
    const firebaseConfig = { apiKey: "AIzaSyCQ...", authDomain: "...", projectId: "...", storageBucket: "...", messagingSenderId: "...", appId: "..." };
    const app = initializeApp(firebaseConfig); 
    const auth = getAuth(app); const db = getFirestore(app); const appId = "travel-platform-v2";

    const isGuest = localStorage.getItem('isGuest') === 'true';

    onAuthStateChanged(auth, (user) => {
      if (user && !isGuest) {
        document.getElementById('welcome-msg').innerText = `早安，${user.displayName || '旅行者'}！`;
      }
    });

    // 載入公共景點
    if (isGuest) {
      const localSpots = localStorage.getItem('guest_spots');
      if (localSpots) renderTrending(JSON.parse(localSpots));
    } else {
      onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'spots'), (snapshot) => {
        const spots = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderTrending(spots);
      });
    }

    function renderTrending(spots) {
      const container = document.getElementById('home-trending-spots');
      if (!spots || spots.length === 0) return;
      const shuffled = [...spots].sort(() => 0.5 - Math.random()).slice(0, 4);
      container.innerHTML = shuffled.map(spot => `
        <a href="./discover.html" class="snap-start shrink-0 w-40 bg-white rounded-[20px] p-4 border border-brand-light shadow-sm flex flex-col justify-between block">
          <div class="w-10 h-10 rounded-full bg-brand-primary/10 text-brand-primary flex items-center justify-center mb-3">
            <i class="fa-solid fa-camera"></i>
          </div>
          <div>
            <h4 class="font-extrabold text-[14px] text-brand-dark leading-snug line-clamp-2">${spot.name}</h4>
            <p class="text-[11px] font-bold text-brand-textSub mt-1 line-clamp-1">${spot.subtitle || '景點'}</p>
          </div>
        </a>
      `).join('');
    }
  </script>
</body>
</html>
