<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>趣．旅行 - 您的個人行程雲端平台</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              primary: '#748CAB', /* 莫蘭迪藍 */
              dark: '#3E5C76',
              light: '#E6EBEF',
              bg: '#F2F5F8',
              card: '#FFFFFF',
              textMain: '#2C3E50',
              textSub: '#5D6D7E',
              accent: '#D5896F' /* 莫蘭迪橘 */
            }
          },
          fontFamily: {
            sans: ['"LINE Seed TW"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    /* --- LINE Seed TW 字體整合 --- */
    @font-face { font-family: 'LINE Seed TW'; src: url('./fonts/LINESeedTW_OTF_Th.woff2') format('woff2'); font-weight: 300; font-style: normal; font-display: swap; }
    @font-face { font-family: 'LINE Seed TW'; src: url('./fonts/LINESeedTW_OTF_Rg.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: 'LINE Seed TW'; src: url('./fonts/LINESeedTW_OTF_Bd.woff2') format('woff2'); font-weight: 700; font-style: normal; font-display: swap; }

    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .bottom-sheet { transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); }
    .bottom-sheet.open { transform: translateY(0); }
    .bottom-sheet.closed { transform: translateY(100%); }
    .view-transition { transition: opacity 0.3s ease; }
    .timeline-line { width: 3px; }
    
    /* 輸入框視覺強化 */
    .input-flat { background-color: #F1F5F9; border: 1px solid #E2E8F0; border-radius: 16px; padding: 14px 18px; width: 100%; outline: none; transition: all 0.2s; font-weight: 700; }
    .input-flat:focus { border-color: #748CAB; background-color: #FFFFFF; }
    
    .active-mode { border-color: #748CAB !important; background-color: #F0F9FF !important; color: #748CAB; font-weight: bold; }
    
    @media (min-width: 768px) {
      body { background-color: #F1F5F9; }
      #app { border-left: 1px solid #E2E8F0; border-right: 1px solid #E2E8F0; }
    }
  </style>
</head>
<body class="bg-brand-bg text-brand-textMain font-sans antialiased overflow-hidden">

  <!-- APP 容器 (復刻舊版單欄佈局) -->
  <div id="app" class="max-w-md mx-auto h-[100dvh] bg-white relative flex flex-col shadow-2xl">
    
    <!-- Toast -->
    <div id="toast" class="fixed top-8 left-1/2 -translate-x-1/2 z-[100] bg-brand-dark text-white px-6 py-3 rounded-full opacity-0 pointer-events-none transition-all duration-300 text-sm font-medium flex items-center gap-2 border border-slate-600">
      <i class="fa-solid fa-circle-check text-brand-primary"></i> <span id="toast-msg"></span>
    </div>

    <!-- VIEW: 登入頁 -->
    <div id="view-login" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-brand-bg px-10 view-transition">
      <div class="w-20 h-20 bg-brand-primary rounded-3xl flex items-center justify-center mb-8">
        <i class="fa-solid fa-compass text-white text-3xl"></i>
      </div>
      <h1 class="text-3xl font-bold text-brand-dark mb-3 tracking-tighter">趣．旅行</h1>
      <p class="text-brand-textSub mb-12 text-center text-sm font-light opacity-90 tracking-tight">記錄您的所有精彩旅程</p>
      <button id="btn-login-google" class="w-full bg-white border border-slate-200 text-brand-textMain font-bold py-4 rounded-2xl flex items-center justify-center gap-4 hover:bg-slate-50 active:scale-[0.98] transition-all">
        <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Google 帳號登入
      </button>
    </div>

    <!-- HEADER -->
    <header class="bg-white pt-14 pb-6 px-8 shrink-0 flex justify-between items-end border-b border-slate-100 z-10">
      <div>
        <p id="header-subtitle" class="text-xs font-bold text-brand-primary mb-1 uppercase tracking-widest">My Plans</p>
        <h1 id="header-title" class="text-3xl font-bold text-brand-dark tracking-tighter uppercase">我的計畫</h1>
      </div>
      <button id="btn-header-action" class="w-12 h-12 flex items-center justify-center bg-slate-50 border border-slate-100 rounded-full text-slate-400 hover:text-brand-primary active:scale-95 transition-all">
        <i class="fa-solid fa-gear text-xl"></i>
      </button>
    </header>

    <!-- VIEW: 計畫清單 (入口) -->
    <div id="view-plans" class="hidden flex-1 overflow-y-auto bg-slate-50 pt-6 px-6 pb-24 hide-scrollbar">
      <div id="plans-list" class="space-y-6"></div>
      <button onclick="openFormModal('new-plan')" class="w-full mt-4 py-5 border-2 border-dashed border-slate-300 rounded-[32px] text-slate-400 font-bold hover:border-brand-primary hover:text-brand-primary transition-all flex items-center justify-center gap-3 bg-white/50">
        <i class="fa-solid fa-plus-circle text-xl"></i> 建立新行程
      </button>
    </div>

    <!-- VIEW: 行程表 (復刻舊版) -->
    <div id="view-itinerary" class="hidden flex-1 flex flex-col overflow-hidden bg-white">
      <div class="px-6 py-4 shrink-0 border-b border-slate-100 bg-slate-50">
        <div id="days-tabs" class="flex overflow-x-auto gap-3 snap-x hide-scrollbar"></div>
      </div>
      <div class="flex-1 overflow-y-auto px-4 pb-32 pt-6 relative bg-white hide-scrollbar">
        <div id="timeline-container"></div>
      </div>
      <!-- 底部動作按鈕 (經典復刻) -->
      <div class="absolute bottom-8 inset-x-0 px-8 flex justify-end gap-3 z-20 pointer-events-none">
        <button onclick="openFormModal('location')" class="pointer-events-auto flex items-center justify-center gap-2 bg-brand-dark text-white font-bold h-14 px-6 rounded-full shadow-lg shadow-brand-dark/20 hover:bg-black active:scale-95 transition-all">
          <i class="fa-solid fa-location-dot"></i> <span class="text-sm font-light">地點</span>
        </button>
        <button onclick="openFormModal('transport')" class="pointer-events-auto flex items-center justify-center gap-2 bg-brand-primary text-white font-bold h-14 px-6 rounded-full shadow-lg shadow-brand-primary/30 hover:bg-brand-dark active:scale-95 transition-all">
          <i class="fa-solid fa-train-tram"></i> <span class="text-sm font-light">交通</span>
        </button>
      </div>
    </div>

    <!-- VIEW: 設定頁 -->
    <div id="view-settings" class="hidden flex-1 flex flex-col items-center justify-center px-10 bg-slate-50 overflow-y-auto hide-scrollbar">
       <div class="w-24 h-24 bg-white rounded-[32px] mb-6 overflow-hidden border border-slate-200 shadow-sm shrink-0">
         <img id="user-photo" src="https://ui-avatars.com/api/?name=User" class="w-full h-full object-cover">
       </div>
       <h2 id="user-name" class="text-2xl font-bold text-brand-dark mb-1 tracking-tighter"></h2>
       <p id="user-email" class="text-xs text-brand-textSub font-light mb-12 tracking-wide"></p>
       
       <div class="w-full space-y-4">
         <div class="bg-white p-8 rounded-[32px] border border-slate-200 space-y-5 shadow-sm">
           <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-[2px] border-b border-slate-50 pb-2">資料與備份</label>
           <div class="flex gap-4">
             <button onclick="handleExport()" class="flex-1 py-4 bg-slate-50 text-slate-700 font-bold text-sm rounded-2xl border border-slate-200 hover:bg-slate-100 transition-all flex items-center justify-center gap-2"><i class="fa-solid fa-file-export text-brand-primary"></i> 匯出</button>
             <button onclick="document.getElementById('input-import-file').click()" class="flex-1 py-4 bg-slate-50 text-slate-700 font-bold text-sm rounded-2xl hover:bg-slate-100 transition-all flex items-center justify-center gap-2 border border-slate-200"><i class="fa-solid fa-file-import text-brand-primary"></i> 匯入</button>
             <input type="file" id="input-import-file" accept=".json" class="hidden" onchange="handleImport(event)">
           </div>
         </div>
         <button onclick="signOut(getAuth())" class="w-full py-5 bg-white text-red-500 font-bold rounded-[32px] border border-red-100 hover:bg-red-50 transition-all shadow-sm">登出帳號</button>
       </div>
       <button onclick="switchView('plans')" class="mt-8 text-slate-400 font-bold text-sm flex items-center gap-2 hover:text-brand-primary transition-all"><i class="fa-solid fa-arrow-left text-xs"></i> 返回計畫列表</button>
    </div>

  </div> <!-- End App -->

  <!-- 遮罩與專業彈窗 -->
  <div id="modal-overlay" class="hidden fixed inset-0 z-[60] bg-slate-900/40 backdrop-blur-[2px] transition-opacity" onclick="closeSheet()"></div>
  <div id="sheet-form" class="bottom-sheet closed fixed inset-x-0 bottom-0 z-[61] bg-white rounded-t-[40px] max-h-[90vh] flex flex-col max-w-md mx-auto overflow-hidden border-t border-slate-200 shadow-2xl">
     <div id="sheet-header" class="px-10 py-7 border-b border-slate-50 flex justify-between items-center shrink-0 bg-white">
        <h3 id="sheet-title" class="text-xl font-bold text-brand-dark tracking-tight">編輯內容</h3>
        <button onclick="closeSheet()" class="text-slate-300 hover:text-brand-primary transition-colors active:scale-90"><i class="fa-solid fa-circle-xmark text-3xl"></i></button>
     </div>
     <div id="sheet-content" class="p-10 overflow-y-auto hide-scrollbar font-light"></div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
    import { getFirestore, doc, collection, onSnapshot, query, addDoc, deleteDoc, updateDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    const firebaseConfig = { apiKey: "AIzaSyCQF8A3ieML0JP3X8X78NCRuiUETRAiu5E", authDomain: "travel-96009.firebaseapp.com", projectId: "travel-96009", storageBucket: "travel-96009.firebasestorage.app", messagingSenderId: "578860064042", appId: "1:578860064042:web:b147880df3a01dd8f75253" };
    const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app); const appId = "travel-platform-v1";

    const TRANSPORT_MODES = [ { id: 'flight', label: '航班', icon: 'fa-solid fa-plane' }, { id: 'train', label: '電車', icon: 'fa-solid fa-train' }, { id: 'bus', label: '公車', icon: 'fa-solid fa-bus' }, { id: 'car', label: '開車', icon: 'fa-solid fa-car' }, { id: 'walk', label: '步行', icon: 'fa-solid fa-person-walking' } ];
    const LOCATION_MODES = [ { id: 'spot', label: '景點', icon: 'fa-solid fa-location-dot' }, { id: 'hotel', label: '住宿', icon: 'fa-solid fa-hotel' }, { id: 'food', label: '美食', icon: 'fa-solid fa-utensils' }, { id: 'shop', label: '購物', icon: 'fa-solid fa-bag-shopping' } ];

    let state = { user: null, plans: [], currentPlanId: null, activeDay: 1, editingId: null, currency: 'JPY' };

    onAuthStateChanged(auth, (user) => {
      state.user = user;
      if (user) {
        document.getElementById('view-login').classList.add('opacity-0', 'pointer-events-none');
        setTimeout(() => document.getElementById('view-login').classList.add('hidden'), 300);
        document.getElementById('user-name').innerText = user.displayName;
        document.getElementById('user-email').innerText = user.email;
        if (user.photoURL) document.getElementById('user-photo').src = user.photoURL;
        switchView('plans'); listenToPlans();
      } else {
        closeSheet(); document.getElementById('view-login').classList.remove('hidden', 'opacity-0', 'pointer-events-none');
        switchView('login');
      }
    });

    function listenToPlans() {
      if (!state.user) return;
      const q = collection(db, 'artifacts', appId, 'users', state.user.uid, 'plans');
      onSnapshot(q, (snapshot) => {
        state.plans = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderPlansList();
        if (state.currentPlanId) {
          const activePlan = state.plans.find(p => p.id === state.currentPlanId);
          if (activePlan) renderEditor(activePlan);
        }
      });
    }

    window.switchView = (v) => {
      ['plans', 'itinerary', 'settings'].forEach(id => document.getElementById(`view-${id}`)?.classList.add('hidden'));
      const target = document.getElementById(`view-${v}`);
      if (target) target.classList.remove('hidden');
      
      const headerTitle = document.getElementById('header-title');
      const headerAction = document.getElementById('btn-header-action');
      if (v === 'plans') { 
        headerTitle.innerText = "我的計畫"; headerAction.innerHTML = '<i class="fa-solid fa-user-gear"></i>'; 
        headerAction.onclick = () => switchView('settings');
      } else if (v === 'itinerary') {
        const plan = state.plans.find(p => p.id === state.currentPlanId);
        headerTitle.innerText = plan?.title || "行程表"; headerAction.innerHTML = '<i class="fa-solid fa-chevron-left"></i>';
        headerAction.onclick = () => switchView('plans');
      } else if (v === 'settings') {
        headerTitle.innerText = "個人設定"; headerAction.innerHTML = '<i class="fa-solid fa-house"></i>';
        headerAction.onclick = () => switchView('plans');
      }
    };

    function renderPlansList() {
      const container = document.getElementById('plans-list');
      if (state.plans.length === 0) { container.innerHTML = `<div class="py-20 text-center text-slate-400 font-light opacity-60"><i class="fa-solid fa-route text-6xl mb-6"></i><p>目前暫無計畫</p></div>`; return; }
      container.innerHTML = state.plans.sort((a, b) => b.createdAt - a.createdAt).map(plan => `
        <div onclick="openPlan('${plan.id}')" class="bg-white rounded-[32px] overflow-hidden border border-slate-200 flex h-32 active:scale-[0.98] transition-all cursor-pointer shadow-sm hover:border-brand-primary group">
          <div class="w-28 bg-slate-50 flex items-center justify-center text-brand-primary text-3xl opacity-30 group-hover:bg-brand-light transition-all"><i class="fa-solid fa-plane-up"></i></div>
          <div class="flex-1 p-6 flex flex-col justify-center overflow-hidden">
            <h3 class="font-bold text-brand-textMain text-lg truncate uppercase tracking-tight">${plan.title}</h3>
            <p class="text-[10px] text-brand-primary font-bold uppercase tracking-[2px] opacity-80 mt-1">${plan.startDate} · ${plan.days} DAYS</p>
          </div>
          <button onclick="event.stopPropagation(); state.currentPlanId='${plan.id}'; openFormModal('plan-info')" class="px-6 text-slate-300 hover:text-brand-primary"><i class="fa-solid fa-gear"></i></button>
        </div>
      `).join('');
    }

    window.openPlan = (id) => { state.currentPlanId = id; state.activeDay = 1; renderEditor(state.plans.find(p=>p.id===id)); switchView('itinerary'); };

    function renderEditor(plan) {
      document.getElementById('days-tabs').innerHTML = Array.from({length: plan.days}, (_, i) => `
        <button onclick="state.activeDay = ${i+1}; renderEditor(state.plans.find(p=>p.id==='${plan.id}'))" 
          class="shrink-0 px-6 py-3 rounded-full font-bold text-[11px] uppercase tracking-[2px] transition-all border ${state.activeDay === i+1 ? 'bg-brand-primary text-white border-brand-primary shadow-md' : 'bg-white text-brand-textSub border-slate-200'}">Day ${i+1}</button>`).join('');

      const container = document.getElementById('timeline-container');
      const items = (plan.itinerary && plan.itinerary[state.activeDay]) || [];
      if (items.length === 0) { container.innerHTML = `<div class="py-24 text-center text-slate-300 font-light uppercase tracking-widest opacity-60"><i class="fa-solid fa-map-location text-5xl mb-6 opacity-10"></i><p>尚未規劃行程</p></div>`; return; }

      let html = '<div class="relative pb-12">';
      items.sort((a, b) => a.timeStart.localeCompare(b.timeStart)).forEach((item, index, arr) => {
        const isFirst = index === 0; const isLast = index === arr.length - 1;
        let lineHtml = (arr.length > 1) ? `<div class="absolute ${isFirst ? 'top-[26px] bottom-0' : (isLast ? 'top-0 h-[26px]' : 'top-0 bottom-0')} w-[3px] bg-brand-primary left-[70px] opacity-10"></div>` : '';
        const symbol = item.currency === 'TWD' ? '$' : '¥';
        const costStr = item.cost ? `<p class="text-[11px] font-bold text-slate-400 mt-2 uppercase tracking-tight">Cost: ${symbol}${item.cost}</p>` : '';

        if (item.type === 'location') {
          html += `<div class="relative flex group py-6 cursor-pointer hover:bg-slate-50/50 rounded-3xl transition-all" onclick="openFormModal('location', '${item.id}')">
            <div class="w-[60px] shrink-0 text-right pr-4 pt-1 flex flex-col font-bold font-mono text-brand-dark text-sm opacity-90">
              <span>${item.timeStart}</span>${item.timeEnd ? `<span class="opacity-20 text-[11px]">${item.timeEnd}</span>` : ''}
            </div>
            <div class="w-6 shrink-0 flex flex-col items-center relative self-stretch">${lineHtml}<div class="${item.isThrough ? 'w-5 h-5 border-[3px]' : 'w-4 h-4 border-[3px]'} rounded-full border-brand-primary bg-white z-10 mt-[6px] flex items-center justify-center">${item.isThrough ? '<i class="fa-solid fa-angles-down text-[7px] text-brand-primary"></i>' : ''}</div></div>
            <div class="flex-1 pl-6">
              <h4 class="font-bold text-brand-textMain text-lg tracking-tight uppercase">${item.name}</h4>
              ${item.subtitle ? `<p class="text-xs font-light text-brand-textSub mt-1 opacity-80 leading-relaxed">${item.subtitle}</p>` : ''}
              ${costStr}
            </div>
          </div>`;
        } else {
          let showStart = true; let showEnd = true; const prev = arr[index - 1]; const next = arr[index + 1];
          if (prev && item.timeStart === (prev.timeEnd || prev.timeStart)) showStart = false; if (next && item.timeEnd && item.timeEnd === next.timeStart) showEnd = false;
          const modeObj = TRANSPORT_MODES.find(m => m.id === item.mode) || TRANSPORT_MODES[1];
          html += `<div class="relative flex group items-stretch cursor-pointer py-2" onclick="openFormModal('transport', '${item.id}')">
            <div class="w-[60px] shrink-0 text-right pr-4 py-6 flex flex-col justify-between items-end font-bold font-mono text-brand-dark text-sm opacity-90">
              <span class="${showStart ? '' : 'opacity-0'}">${item.timeStart}</span><span class="text-[9px] font-bold text-brand-primary opacity-40 uppercase tracking-widest">${item.duration || ''}</span><span class="${showEnd ? '' : 'opacity-0'}">${item.timeEnd || ''}</span>
            </div>
            <div class="w-6 shrink-0 flex flex-col items-center relative self-stretch">${lineHtml}</div>
            <div class="flex-1 pl-6 py-2">
              <div class="bg-slate-100/50 p-5 rounded-[28px] border border-slate-200 flex items-center justify-between group-hover:border-brand-primary group-hover:bg-white group-hover:shadow-sm transition-all">
                <div class="flex items-center gap-4">
                  <div class="w-10 h-10 rounded-xl bg-white border border-slate-200 flex items-center justify-center text-brand-accent shadow-sm shrink-0"><i class="${modeObj.icon}"></i></div>
                  <div><p class="text-[10px] font-bold uppercase tracking-[2px] text-brand-accent opacity-70">${item.operator || ''} ${item.vehicleNo || ''}</p><h4 class="font-bold text-brand-textMain uppercase tracking-tight">${item.name}</h4>${costStr}</div>
                </div>
              </div>
            </div>
          </div>`;
        }
      });
      container.innerHTML = html + '</div>';
    }

    window.openFormModal = (type, itemId = null) => {
      state.editingId = itemId;
      const plan = state.plans.find(p => p.id === state.currentPlanId);
      const content = document.getElementById('sheet-content');
      const headerTitle = document.getElementById('sheet-title');
      let item = itemId ? plan.itinerary[state.activeDay].find(i => i.id === itemId) : null;
      
      document.getElementById('modal-overlay').classList.remove('hidden');
      document.getElementById('sheet-form').classList.remove('closed');
      document.getElementById('sheet-form').classList.add('open');

      if (type === 'new-plan') {
        headerTitle.innerText = "建立新計畫";
        content.innerHTML = `<div class="space-y-6">
          <div><label class="text-[11px] font-bold text-slate-500 block mb-2 uppercase tracking-[2px]">名稱</label><input id="f-title" type="text" placeholder="例：2026大阪自由行" class="input-flat font-bold text-lg"></div>
          <div class="flex gap-4"><div class="flex-1"><label class="text-[11px] font-bold text-slate-500 block mb-2 uppercase tracking-[2px]">開始日期</label><input id="f-start-date" type="date" class="input-flat font-bold"></div><div class="flex-1"><label class="text-[11px] font-bold text-slate-500 block mb-2 uppercase tracking-[2px]">結束日期</label><input id="f-end-date" type="date" class="input-flat font-bold"></div></div>
          <div><label class="text-[11px] font-bold text-slate-500 block mb-2 uppercase tracking-[2px]">預設飯店 (快速帶入)</label><input id="f-acc" type="text" placeholder="例：新宿飯店" class="input-flat font-bold"></div>
          <div class="flex gap-4 pt-4"><button onclick="closeSheet()" class="flex-1 py-4 border-2 border-slate-100 rounded-2xl font-bold text-slate-400">取消</button><button onclick="createNewPlan()" class="flex-1 py-4 bg-brand-primary text-white rounded-2xl font-bold shadow-lg shadow-brand-primary/20">建立計畫</button></div></div>`;
      } else if (type === 'plan-info') {
        headerTitle.innerText = "計畫設定";
        content.innerHTML = `<div class="space-y-6">
          <div><label class="text-[11px] font-bold text-slate-500 block mb-2 uppercase tracking-[2px]">名稱</label><input id="f-title" type="text" value="${plan.title}" class="input-flat font-bold text-lg"></div>
          <div class="flex gap-4"><div class="flex-1"><label class="text-[11px] font-bold text-slate-500 block mb-2 uppercase tracking-[2px]">日期</label><input id="f-date" type="date" value="${plan.startDate}" class="input-flat font-bold"></div><div class="w-28"><label class="text-[11px] font-bold text-slate-500 block mb-2 uppercase tracking-[2px]">天數</label><input id="f-days" type="number" value="${plan.days}" class="input-flat font-bold text-center"></div></div>
          <div><label class="text-[11px] font-bold text-slate-500 block mb-2 uppercase tracking-[2px]">預設飯店</label><input id="f-acc" type="text" value="${plan.accommodation || ''}" class="input-flat font-bold"></div>
          <div class="pt-6 space-y-4">
            <button onclick="updatePlanInfo()" class="w-full py-5 bg-brand-primary text-white rounded-2xl font-bold shadow-lg">儲存設定變更</button>
            <button onclick="deletePlan()" class="w-full py-3 text-red-500 font-bold text-xs uppercase opacity-70 tracking-widest hover:opacity-100">刪除整個行程</button>
          </div></div>`;
      } else {
        const isLoc = type === 'location';
        headerTitle.innerText = item ? '編輯行程' : (isLoc ? '新增地點' : '新增交通');
        let quickFills = '';
        if (isLoc && plan.accommodation) quickFills = `<button onclick="fillField('f-name','${plan.accommodation}', 'hotel')" class="px-3.5 py-2 bg-brand-light text-brand-dark rounded-xl text-[10px] font-bold uppercase tracking-[2px] border border-slate-200"><i class="fa-solid fa-hotel mr-2"></i> 帶入飯店</button>`;

        content.innerHTML = `<div class="space-y-6">
          <div class="flex gap-3 overflow-x-auto hide-scrollbar">${quickFills}</div>
          <div class="flex gap-4">
            <div class="flex-1"><label class="text-[11px] font-bold text-slate-500 uppercase block mb-2 tracking-[2px]">開始時間</label><input id="f-start" type="time" value="${item?.timeStart || '08:00'}" class="input-flat font-bold text-xl font-mono"></div>
            <div class="flex-1"><label class="text-[11px] font-bold text-slate-500 uppercase block mb-2 tracking-[2px]">結束時間</label><input id="f-end" type="time" value="${item?.timeEnd || ''}" class="input-flat font-bold text-xl font-mono"></div>
          </div>
          ${isLoc ? `<div class="grid grid-cols-4 gap-3">${LOCATION_MODES.map(m => `<button onclick="selectMode(this)" data-mode="${m.id}" class="mode-btn h-14 rounded-2xl border border-slate-200 flex items-center justify-center transition-all ${item?.locMode === m.id ? 'active-mode' : (isLoc && m.id==='spot' && !item ? 'active-mode' : '')}"><i class="${m.icon}"></i></button>`).join('')}</div><input id="f-name" type="text" placeholder="輸入名稱" value="${item?.name || ''}" class="input-flat font-bold text-lg"><textarea id="f-sub" placeholder="備註..." class="input-flat font-normal text-sm h-24">${item?.subtitle || ''}</textarea><label class="flex items-center gap-4 text-sm font-bold text-brand-dark cursor-pointer p-2"><input type="checkbox" id="f-through" ${item?.isThrough ? 'checked' : ''} class="w-6 h-6 accent-brand-primary"> 直通站點 (不下車)</label>` : 
          `<div class="grid grid-cols-5 gap-3">${TRANSPORT_MODES.map(m => `<button onclick="selectMode(this)" data-mode="${m.id}" class="mode-btn h-12 rounded-xl border border-slate-200 flex items-center justify-center transition-all ${item?.mode === m.id ? 'active-mode' : (!isLoc && m.id==='train' && !item ? 'active-mode' : '')}"><i class="${m.icon} text-lg"></i></button>`).join('')}</div><div class="flex gap-3"><input id="f-op" type="text" placeholder="業者" value="${item?.operator || ''}" class="flex-1 input-flat font-bold text-sm"><input id="f-veh" type="text" placeholder="班次" value="${item?.vehicleNo || ''}" class="flex-1 input-flat font-bold text-sm"></div><input id="f-name" type="text" placeholder="目的地" value="${item?.name || ''}" class="input-flat font-bold text-lg"><div class="flex gap-3"><input id="f-dur" type="text" placeholder="耗時" value="${item?.duration || ''}" class="flex-1 input-flat font-bold text-sm"><input id="f-extra" type="text" placeholder="站數" value="${item?.extraInfo || ''}" class="flex-1 input-flat font-bold text-sm"></div>`}
          <div class="bg-slate-100 p-6 rounded-[32px] border border-slate-200 shadow-inner"><div class="flex justify-between items-center mb-4"><label class="text-[10px] font-bold text-slate-500 uppercase tracking-[3px]">費用</label><div class="flex gap-2 bg-white p-1 rounded-lg border border-slate-100"><button onclick="state.currency='JPY';document.getElementById('curr-sym').innerText='¥'" class="px-3 py-0.5 text-[10px] font-bold">JPY</button><button onclick="state.currency='TWD';document.getElementById('curr-sym').innerText='$'" class="px-3 py-0.5 text-[10px] font-bold">TWD</button></div></div><div class="flex items-center gap-4"><span id="curr-sym" class="text-2xl font-bold text-brand-dark">${state.currency==='TWD'?'$':'¥'}</span><input id="f-cost" type="number" value="${item?.cost || ''}" class="w-full bg-transparent border-b border-slate-300 outline-none font-bold text-2xl text-brand-dark"></div></div>
          <button onclick="saveItem('${type}')" class="w-full bg-brand-primary text-white py-5 rounded-3xl font-bold text-lg mt-4 shadow-lg active:scale-95 transition-all">儲存並同步</button>${itemId ? `<button onclick="deleteItem()" class="w-full py-4 text-red-500 font-bold text-xs uppercase opacity-70 hover:opacity-100 transition-all tracking-[4px]">移除項目</button>` : ''}</div>`;
      }
    };

    window.fillField = (id, val, mode = null) => { document.getElementById(id).value = val; if(mode) { const btn = document.querySelector(`[data-mode="${mode}"]`); if(btn) selectMode(btn); } };
    window.createNewPlan = async () => {
      const title = document.getElementById('f-title').value;
      const startD = document.getElementById('f-start-date').value;
      const endD = document.getElementById('f-end-date').value;
      if (!title || !startD || !endD) return showToast("請完整填寫計畫資訊");
      const diff = Math.ceil(Math.abs(new Date(endD) - new Date(startD)) / (1000 * 60 * 60 * 24)) + 1;
      const docRef = await addDoc(collection(db, 'artifacts', appId, 'users', state.user.uid, 'plans'), { title, days: diff, startDate: startD, accommodation: document.getElementById('f-acc').value, itinerary: {}, createdAt: serverTimestamp() });
      closeSheet(); openPlan(docRef.id);
    };

    window.selectMode = (btn) => { btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active-mode')); btn.classList.add('active-mode'); };
    window.closeSheet = () => { document.getElementById('modal-overlay').classList.add('hidden'); document.getElementById('sheet-form').classList.remove('open'); document.getElementById('sheet-form').classList.add('closed'); };
    
    window.saveItem = async (type) => {
      const plan = state.plans.find(p => p.id === state.currentPlanId);
      const itinerary = plan.itinerary || {};
      if (!itinerary[state.activeDay]) itinerary[state.activeDay] = [];
      const activeMode = document.querySelector('.active-mode')?.dataset.mode;
      const data = { id: state.editingId || Date.now().toString(), type, timeStart: document.getElementById('f-start').value, timeEnd: document.getElementById('f-end').value, cost: document.getElementById('f-cost').value, currency: state.currency };
      if (type === 'location') { data.locMode = activeMode || 'spot'; data.name = document.getElementById('f-name').value; data.subtitle = document.getElementById('f-sub').value; data.isThrough = document.getElementById('f-through').checked; } 
      else { data.mode = activeMode || 'train'; data.operator = document.getElementById('f-op').value; data.vehicleNo = document.getElementById('f-veh').value; data.name = document.getElementById('f-name').value; data.duration = document.getElementById('f-dur').value; data.extraInfo = document.getElementById('f-extra').value; }
      if (state.editingId) { const idx = itinerary[state.activeDay].findIndex(i => i.id === state.editingId); itinerary[state.activeDay][idx] = data; } 
      else { itinerary[state.activeDay].push(data); }
      await updateDoc(doc(db, 'artifacts', appId, 'users', state.user.uid, 'plans', state.currentPlanId), { itinerary });
      closeSheet(); showToast("雲端同步成功");
    };

    window.deleteItem = async () => {
      if (!confirm("確定刪除此項目？")) return;
      const plan = state.plans.find(p => p.id === state.currentPlanId);
      plan.itinerary[state.activeDay] = plan.itinerary[state.activeDay].filter(i => i.id !== state.editingId);
      await updateDoc(doc(db, 'artifacts', appId, 'users', state.user.uid, 'plans', state.currentPlanId), { itinerary: plan.itinerary });
      closeSheet();
    };

    window.updatePlanInfo = async () => { await updateDoc(doc(db, 'artifacts', appId, 'users', state.user.uid, 'plans', state.currentPlanId), { title: document.getElementById('f-title').value, startDate: document.getElementById('f-date').value, days: parseInt(document.getElementById('f-days').value), accommodation: document.getElementById('f-acc').value }); closeSheet(); };
    window.deletePlan = async () => { if (confirm("確定要刪除整個行程嗎？雲端資料將無法復原。")) { await deleteDoc(doc(db, 'artifacts', appId, 'users', state.user.uid, 'plans', state.currentPlanId)); state.currentPlanId = null; switchView('plans'); closeSheet(); } };

    window.handleExport = () => {
      const dataStr = JSON.stringify(state.plans, null, 2);
      const blob = new Blob([dataStr], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = `趣旅行_備份.json`; a.click();
      URL.revokeObjectURL(url); showToast('備份匯出成功');
    };

    window.handleImport = (e) => {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = async (event) => {
        try {
          const imported = JSON.parse(event.target.result);
          const plansToImport = (imported && imported.title && !Array.isArray(imported)) ? [imported] : imported;
          for (let p of plansToImport) {
            const cleanPlan = { title: p.title || "未命名行程", startDate: p.startDate || new Date().toISOString().split('T')[0], days: p.days || 1, accommodation: p.accommodation || "", itinerary: p.itinerary || {}, createdAt: serverTimestamp() };
            await addDoc(collection(db, 'artifacts', appId, 'users', state.user.uid, 'plans'), cleanPlan);
          }
          showToast('行程已匯入成功');
        } catch (err) { alert('匯入失敗'); }
      };
      reader.readAsText(file);
    };

    document.getElementById('btn-login-google').onclick = () => signInWithPopup(auth, new GoogleAuthProvider());
    document.querySelectorAll('.nav-item').forEach(btn => btn.onclick = () => switchView(btn.dataset.view));

    function showToast(msg) { const el = document.getElementById('toast'); document.getElementById('toast-msg').innerText = msg; el.classList.remove('opacity-0'); el.classList.add('opacity-100'); setTimeout(() => { el.classList.remove('opacity-100'); el.classList.add('opacity-0'); }, 2500); }

  </script>
</body>
</html>
