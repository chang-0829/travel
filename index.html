<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>旅遊行程規劃</title>
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              primary: '#748CAB',
              dark: '#3E5C76',
              light: '#E6EBEF',
              bg: '#F2F5F8',
              card: '#FFFFFF',
              textMain: '#2C3E50',
              textSub: '#8796A5',
              accent: '#D5896F' /* 交通專屬跳色 */
            }
          }
        }
      }
    }
  </script>

  <style>
    /* --- LINE Seed TW 字體整合 --- */
    @font-face { font-family: 'LINE Seed TW'; src: url('./fonts/LINESeedTW_OTF_Th.woff2') format('woff2'); font-weight: 300; font-style: normal; font-display: swap; }
    @font-face { font-family: 'LINE Seed TW'; src: url('./fonts/LINESeedTW_OTF_Rg.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: 'LINE Seed TW'; src: url('./fonts/LINESeedTW_OTF_Bd.woff2') format('woff2'); font-weight: 700; font-style: normal; font-display: swap; }

    body { font-family: 'LINE Seed TW', ui-sans-serif, system-ui, sans-serif; }

    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    input[type="time"]::-webkit-calendar-picker-indicator { cursor: pointer; opacity: 0.6; }
    input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    
    .bottom-sheet { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .bottom-sheet.open { transform: translateY(0); }
    .bottom-sheet.closed { transform: translateY(100%); }
    .overlay { transition: opacity 0.3s ease; }
    .overlay.open { opacity: 1; pointer-events: auto; }
    .overlay.closed { opacity: 0; pointer-events: none; }
    input, textarea { font-size: 16px !important; }
    textarea { resize: none; overflow: hidden; }
    .timeline-line { width: 4px; }
    
    .pb-safe { padding-bottom: max(12px, env(safe-area-inset-bottom)); }
    .pt-safe { padding-top: max(16px, env(safe-area-inset-top)); }

    /* 表單區塊的極簡輸入框設計 */
    .flat-input {
        width: 100%;
        background-color: #F1F5F9; /* 極淺灰底 */
        border: 1px solid #E2E8F0;
        border-radius: 12px;
        padding: 12px 16px;
        font-size: 15px;
        font-weight: 700;
        color: #2C3E50;
        outline: none;
        transition: all 0.2s;
    }
    .flat-input::placeholder { color: #94A3B8; font-weight: 500; }
    .flat-input:focus { border-color: #748CAB; background-color: #FFFFFF; box-shadow: 0 0 0 2px rgba(116, 140, 171, 0.1); }
    .flat-label { display: block; font-size: 12px; font-weight: 700; color: #64748B; margin-bottom: 6px; padding-left: 4px; }
  </style>
</head>
<body class="bg-brand-bg text-brand-textMain antialiased overflow-hidden">

  <!-- 全域提示訊息 (Toast) -->
  <div id="toast" class="fixed top-safe left-1/2 transform -translate-x-1/2 bg-brand-textMain text-white px-6 py-3 rounded-full shadow-2xl z-[100] transition-all duration-300 opacity-0 pointer-events-none -translate-y-4 flex items-center gap-2 font-bold text-sm mt-2">
    <i class="fa-solid fa-circle-check text-brand-primary"></i> <span id="toast-msg">成功！</span>
  </div>

  <!-- APP 容器 -->
  <div id="app" class="max-w-md mx-auto h-[100dvh] bg-brand-bg shadow-xl relative flex flex-col">

    <!-- 共用 HEADER -->
    <header id="header-standard" class="hidden bg-brand-bg pt-safe pb-4 px-6 shrink-0 flex justify-between items-end border-b border-brand-light z-10">
      <div>
        <p id="header-subtitle" class="text-sm font-bold text-brand-primary mb-1 uppercase tracking-widest mt-2">My Trip</p>
        <h1 id="header-title" class="text-3xl font-extrabold text-brand-dark tracking-tight">載入中...</h1>
      </div>
      <button id="btn-header-action" class="w-10 h-10 flex items-center justify-center bg-white border border-brand-light shadow-sm rounded-full text-brand-textSub hover:text-brand-primary active:scale-95 transition-all">
        <i class="fa-solid fa-gear text-lg"></i>
      </button>
    </header>

    <!-- 行程專屬 HEADER -->
    <header id="header-itinerary" class="hidden bg-brand-bg pt-safe pb-2 px-4 shrink-0 flex justify-between items-center border-b border-brand-light z-10">
      <button id="btn-itinerary-back" class="w-10 h-10 mt-2 flex items-center justify-center text-brand-dark hover:text-brand-primary transition-colors">
        <i class="fa-solid fa-chevron-left text-xl"></i>
      </button>
      <div class="flex-1 mt-2 flex flex-col items-center justify-center text-center px-1 truncate">
        <h1 id="header-itinerary-title" class="text-[16px] font-extrabold text-brand-dark tracking-tight truncate w-full">載入中...</h1>
        <p id="header-itinerary-subtitle" class="text-[11px] font-bold text-brand-textSub mt-0.5">--</p>
      </div>
      <div class="flex items-center gap-0.5 mt-2">
        <!-- 新增：編輯模式切換按鈕 -->
        <button id="btn-itinerary-edit" onclick="window.toggleEditMode()" class="w-9 h-9 flex items-center justify-center text-brand-dark hover:text-brand-primary transition-colors rounded-full">
          <i class="fa-solid fa-pen text-[16px]"></i>
        </button>
        <button id="btn-itinerary-setup" onclick="window.handleSetupClick()" class="w-9 h-9 flex items-center justify-center text-brand-dark hover:text-brand-primary transition-colors rounded-full">
          <i class="fa-solid fa-gear text-[18px]"></i>
        </button>
      </div>
    </header>

    <!-- VIEW: 首頁 / 計畫列表 -->
    <div id="view-plans" class="hidden flex-1 overflow-y-auto px-6 pb-6 hide-scrollbar">
      <div id="plans-list" class="space-y-4 mt-6"></div>
      <button onclick="createNewPlanInit()" class="w-full mt-6 py-4 border-2 border-dashed border-brand-primary text-brand-primary font-bold rounded-[20px] hover:bg-brand-light transition-all flex justify-center items-center gap-2">
        <i class="fa-solid fa-plus"></i> 建立新行程
      </button>
    </div>

    <!-- VIEW: 會員中心 -->
    <div id="view-profile" class="hidden flex-1 overflow-y-auto px-6 hide-scrollbar flex flex-col items-center pt-12 pb-6">
      <div id="profile-unauth" class="w-full flex flex-col items-center mt-6">
        <div class="w-20 h-20 bg-brand-primary rounded-3xl flex items-center justify-center mb-6 shadow-md shadow-brand-primary/20">
          <i class="fa-solid fa-compass text-white text-4xl"></i>
        </div>
        <h2 class="text-2xl font-bold text-brand-dark mb-2">登入或試用</h2>
        <p class="text-brand-textSub mb-8 text-sm text-center">登入可跨裝置同步行程資料<br>或使用本機試用模式體驗功能</p>
        <div class="w-full space-y-3">
          <button id="btn-login-google" class="w-full bg-white border-2 border-brand-light text-brand-textMain font-bold py-4 rounded-[20px] shadow-sm hover:bg-brand-bg active:scale-[0.98] transition-all flex items-center justify-center gap-3">
            <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            Google 帳號登入
          </button>
          <button onclick="window.handleGuestLogin()" class="w-full bg-brand-primary text-brand-card font-bold py-4 rounded-[20px] shadow-sm shadow-brand-primary/20 hover:bg-brand-dark active:scale-[0.98] transition-all flex items-center justify-center gap-3">
            <i class="fa-solid fa-user-astronaut text-lg"></i>
            先逛逛 (本機暫存模式)
          </button>
        </div>
      </div>

      <div id="profile-auth" class="hidden w-full flex flex-col items-center mt-6">
        <div class="w-24 h-24 bg-white border-4 border-brand-light rounded-full flex items-center justify-center mb-4 text-brand-primary text-4xl shadow-md overflow-hidden relative">
          <img id="profile-pic" src="" alt="avatar" class="hidden w-full h-full object-cover">
          <i id="profile-icon" class="fa-solid fa-user"></i>
        </div>
        <h2 id="profile-name" class="text-2xl font-bold text-brand-dark mb-1">User</h2>
        <p id="profile-email" class="text-sm font-bold text-brand-textSub mb-8">email@example.com</p>
        <button onclick="window.handleSignOut()" class="w-full bg-[#FFE5E5] text-[#E63946] font-bold text-lg py-4 rounded-[20px] shadow-sm hover:bg-[#FFD1D1] active:scale-[0.98] transition-all flex justify-center items-center gap-2 mt-auto">
          <i class="fa-solid fa-right-from-bracket"></i> 登出 / 離開試用
        </button>
      </div>
    </div>

    <!-- VIEW: SETUP -->
    <div id="view-setup" class="hidden flex-1 overflow-y-auto px-4 pb-12 hide-scrollbar">
      <form id="form-setup" class="space-y-6 mt-4">
        
        <!-- 基本設定 -->
        <div class="bg-white p-4 rounded-[24px] border border-brand-light shadow-sm space-y-3">
          <div>
            <label class="block text-[12px] font-bold text-brand-textSub mb-1.5 pl-1">行程名稱 <span class="text-brand-primary">*</span></label>
            <input type="text" id="setup-title" placeholder="例：東京五日遊" required class="w-full text-[15px] font-bold text-brand-dark outline-none bg-brand-bg rounded-xl px-4 py-3 placeholder-brand-textSub/50 border border-transparent focus:border-brand-primary/50 focus:bg-white transition-all">
          </div>
          <div>
            <label class="block text-[12px] font-bold text-brand-textSub mb-1.5 pl-1">出發日期與天數</label>
            <div class="flex items-center bg-brand-bg rounded-xl border border-transparent focus-within:border-brand-primary/50 focus-within:bg-white transition-all h-[46px] overflow-hidden">
              <input type="date" id="setup-start-date" class="flex-1 w-full text-[14px] font-bold text-brand-dark outline-none bg-transparent px-3 py-2">
              <div class="h-6 w-[1px] bg-brand-light"></div>
              <div class="w-24 shrink-0 flex items-center px-3">
                <input type="number" id="setup-days" min="1" max="30" value="3" required class="w-full text-[15px] font-bold text-brand-dark outline-none bg-transparent text-right">
                <span class="text-[13px] font-bold text-brand-textSub shrink-0 ml-1">天</span>
              </div>
            </div>
          </div>
        </div>

        <!-- 航班資訊 -->
        <div class="bg-white p-4 rounded-[24px] border border-brand-light shadow-sm">
          <h3 class="text-[14px] font-extrabold text-brand-dark mb-3 flex items-center gap-2">
            <div class="w-7 h-7 rounded-full bg-brand-primary/10 text-brand-primary flex items-center justify-center"><i class="fa-solid fa-plane-departure text-[12px]"></i></div> 航班資訊
          </h3>
          <div class="space-y-4">
            
            <!-- 去程 -->
            <div class="p-3.5 bg-brand-bg rounded-[20px] border border-brand-light/80 space-y-3 shadow-sm">
              <label class="block text-[13px] font-extrabold text-brand-primary border-b border-brand-light/80 pb-1.5 mb-1"><i class="fa-solid fa-plane-departure mr-1"></i>去程</label>
              
              <div class="grid grid-cols-2 gap-2.5">
                <div>
                  <label class="text-[11px] text-brand-textSub font-bold px-1 block mb-1">航空公司</label>
                  <input type="text" id="setup-flight-out-airline" placeholder="例: 長榮" class="w-full text-[14px] font-bold text-brand-dark outline-none bg-white rounded-xl px-3 py-2.5 placeholder-brand-textSub/40 border border-brand-light/50 focus:border-brand-primary transition-all">
                </div>
                <div>
                  <label class="text-[11px] text-brand-textSub font-bold px-1 block mb-1">航班編號</label>
                  <input type="text" id="setup-flight-out-no" placeholder="例: BR192" class="w-full text-[14px] font-bold text-brand-dark outline-none bg-white rounded-xl px-3 py-2.5 placeholder-brand-textSub/40 border border-brand-light/50 focus:border-brand-primary transition-all">
                </div>
              </div>
              <div class="grid grid-cols-2 gap-2.5">
                <div>
                  <label class="text-[11px] text-brand-textSub font-bold px-1 block mb-1">起飛地</label>
                  <input type="text" id="setup-flight-out-dept-loc" placeholder="例: 桃園" class="w-full text-[14px] font-bold text-brand-dark outline-none bg-white rounded-xl px-3 py-2.5 placeholder-brand-textSub/40 border border-brand-light/50 focus:border-brand-primary transition-all">
                </div>
                <div>
                  <label class="text-[11px] text-brand-textSub font-bold px-1 block mb-1">降落地</label>
                  <input type="text" id="setup-flight-out-arr-loc" placeholder="例: 關西" class="w-full text-[14px] font-bold text-brand-dark outline-none bg-white rounded-xl px-3 py-2.5 placeholder-brand-textSub/40 border border-brand-light/50 focus:border-brand-primary transition-all">
                </div>
              </div>
              <div>
                <label class="text-[11px] text-brand-textSub font-bold px-1 block mb-1">航班時間</label>
                <div class="flex items-center gap-2 bg-white rounded-xl px-3 border border-brand-light/50 focus-within:border-brand-primary focus-within:ring-1 focus-within:ring-brand-primary transition-all shadow-sm h-[44px]">
                  <input type="time" id="setup-flight-out-dept-time" class="flex-1 w-full text-[14px] font-bold text-brand-dark outline-none bg-transparent text-center">
                  <span class="text-[14px] text-brand-textSub font-bold shrink-0">-</span>
                  <input type="time" id="setup-flight-out-arr-time" class="flex-1 w-full text-[14px] font-bold text-brand-dark outline-none bg-transparent text-center">
                </div>
              </div>
            </div>

            <!-- 回程 -->
            <div class="p-3.5 bg-brand-bg rounded-[20px] border border-brand-light/80 space-y-3 shadow-sm">
              <label class="block text-[13px] font-extrabold text-brand-primary border-b border-brand-light/80 pb-1.5 mb-1"><i class="fa-solid fa-plane-arrival mr-1"></i>回程</label>
              
              <div class="grid grid-cols-2 gap-2.5">
                <div>
                  <label class="text-[11px] text-brand-textSub font-bold px-1 block mb-1">航空公司</label>
                  <input type="text" id="setup-flight-ret-airline" placeholder="例: 星宇" class="w-full text-[14px] font-bold text-brand-dark outline-none bg-white rounded-xl px-3 py-2.5 placeholder-brand-textSub/40 border border-brand-light/50 focus:border-brand-primary transition-all">
                </div>
                <div>
                  <label class="text-[11px] text-brand-textSub font-bold px-1 block mb-1">航班編號</label>
                  <input type="text" id="setup-flight-ret-no" placeholder="例: JX803" class="w-full text-[14px] font-bold text-brand-dark outline-none bg-white rounded-xl px-3 py-2.5 placeholder-brand-textSub/40 border border-brand-light/50 focus:border-brand-primary transition-all">
                </div>
              </div>
              <div class="grid grid-cols-2 gap-2.5">
                <div>
                  <label class="text-[11px] text-brand-textSub font-bold px-1 block mb-1">起飛地</label>
                  <input type="text" id="setup-flight-ret-dept-loc" placeholder="例: 關西" class="w-full text-[14px] font-bold text-brand-dark outline-none bg-white rounded-xl px-3 py-2.5 placeholder-brand-textSub/40 border border-brand-light/50 focus:border-brand-primary transition-all">
                </div>
                <div>
                  <label class="text-[11px] text-brand-textSub font-bold px-1 block mb-1">降落地</label>
                  <input type="text" id="setup-flight-ret-arr-loc" placeholder="例: 桃園" class="w-full text-[14px] font-bold text-brand-dark outline-none bg-white rounded-xl px-3 py-2.5 placeholder-brand-textSub/40 border border-brand-light/50 focus:border-brand-primary transition-all">
                </div>
              </div>
              <div>
                <label class="text-[11px] text-brand-textSub font-bold px-1 block mb-1">航班時間</label>
                <div class="flex items-center gap-2 bg-white rounded-xl px-3 border border-brand-light/50 focus-within:border-brand-primary focus-within:ring-1 focus-within:ring-brand-primary transition-all shadow-sm h-[44px]">
                  <input type="time" id="setup-flight-ret-dept-time" class="flex-1 w-full text-[14px] font-bold text-brand-dark outline-none bg-transparent text-center">
                  <span class="text-[14px] text-brand-textSub font-bold shrink-0">-</span>
                  <input type="time" id="setup-flight-ret-arr-time" class="flex-1 w-full text-[14px] font-bold text-brand-dark outline-none bg-transparent text-center">
                </div>
              </div>
            </div>

          </div>
        </div>

        <!-- 住宿資訊 -->
        <div class="bg-white p-4 rounded-[24px] border border-brand-light shadow-sm relative">
          <h3 class="text-[14px] font-extrabold text-brand-dark mb-3 flex items-center gap-2">
            <div class="w-7 h-7 rounded-full bg-brand-accent/10 text-brand-accent flex items-center justify-center"><i class="fa-solid fa-hotel text-[12px]"></i></div> 住宿安排
          </h3>
          
          <div id="hotel-list-container" class="space-y-3"></div>

          <button type="button" onclick="window.addSetupHotel()" class="w-full mt-3 py-3 bg-brand-bg border border-brand-light/80 text-brand-accent font-bold rounded-[16px] hover:bg-brand-accent/5 active:scale-95 transition-all flex justify-center items-center gap-2 text-[13px] shadow-sm">
            <i class="fa-solid fa-plus"></i> 新增住宿
          </button>
        </div>

        <button type="submit" class="w-full bg-brand-primary text-brand-card font-bold text-[16px] py-4 rounded-[20px] shadow-lg shadow-brand-primary/20 hover:bg-brand-dark active:scale-[0.98] transition-all mt-6 flex justify-center items-center gap-2">
          <i class="fa-solid fa-cloud-arrow-up text-lg"></i> 儲存行程設定
        </button>
        
        <button type="button" id="btn-delete-plan" class="hidden w-full bg-[#FFE5E5] text-[#E63946] font-bold text-[15px] py-4 rounded-[20px] shadow-sm hover:bg-[#FFD1D1] active:scale-[0.98] transition-all mt-4 flex justify-center items-center gap-2">
          <i class="fa-solid fa-trash-can"></i> 刪除此行程計畫
        </button>
      </form>

      <!-- 匯入 / 匯出 -->
      <div class="mt-8 mb-8 border-t border-brand-light pt-6">
        <label class="block text-xs font-bold text-brand-textSub mb-3 pl-1">資料備份與分享</label>
        <div class="flex gap-3">
          <button id="btn-export" type="button" class="flex-1 bg-white border border-brand-light text-brand-dark font-bold py-3 rounded-[16px] shadow-sm hover:bg-brand-light/50 active:scale-95 transition-all flex items-center justify-center gap-2 text-[13px]">
            <i class="fa-solid fa-file-export text-brand-primary"></i> 匯出行程
          </button>
          <button id="btn-import" type="button" class="flex-1 bg-white border border-brand-light text-brand-dark font-bold py-3 rounded-[16px] shadow-sm hover:bg-brand-light/50 active:scale-95 transition-all flex items-center justify-center gap-2 text-[13px]">
            <i class="fa-solid fa-file-import text-brand-primary"></i> 匯入行程
          </button>
          <input type="file" id="input-import-file" accept=".json" class="hidden">
        </div>
      </div>
    </div>

    <!-- VIEW: ITINERARY -->
    <div id="view-itinerary" class="hidden flex-1 flex flex-col h-full overflow-hidden bg-brand-card relative">
      <div class="px-6 py-3 shrink-0 border-b border-brand-light bg-brand-bg z-10">
        <div id="days-tabs" class="flex overflow-x-auto gap-3 snap-x hide-scrollbar pb-1"></div>
      </div>
      <div id="timeline-container" class="flex-1 overflow-y-auto px-2 pb-24 pt-6 relative bg-brand-card mx-2 mt-2 border border-transparent">
      </div>
      
      <!-- 浮動按鈕 FAB (僅在編輯模式顯示) -->
      <div id="fab-container" class="absolute bottom-6 right-6 z-20 pointer-events-none hidden transition-transform scale-0 duration-300">
        <button onclick="window.showAddMenu('main')" class="pointer-events-auto w-14 h-14 bg-brand-primary text-brand-card rounded-full shadow-lg shadow-brand-primary/30 flex items-center justify-center text-2xl hover:bg-brand-dark active:scale-95 transition-all">
          <i class="fa-solid fa-plus"></i>
        </button>
      </div>
    </div>

    <!-- 底部導覽列 -->
    <nav id="bottom-nav" class="hidden bg-brand-card border-t border-brand-light shrink-0 z-40 pb-safe">
      <div class="flex justify-around items-center h-[60px]">
        <button id="nav-btn-plans" onclick="window.switchView('plans')" class="flex flex-col items-center justify-center w-full h-full text-brand-primary transition-colors">
          <i class="fa-solid fa-house mb-1 text-[18px]"></i>
          <span class="text-[10px] font-bold">首頁</span>
        </button>
        <button id="nav-btn-profile" onclick="window.switchView('profile')" class="flex flex-col items-center justify-center w-full h-full text-brand-textSub hover:text-brand-primary transition-colors">
          <i class="fa-solid fa-user mb-1 text-[18px]"></i>
          <span class="text-[10px] font-bold">會員</span>
        </button>
      </div>
    </nav>

  </div> <!-- End App -->

  <!-- ================= MODALS ================= -->
  <div id="modal-overlay" class="overlay closed fixed inset-0 z-[50] bg-brand-textMain/40 backdrop-blur-[2px]"></div>

  <!-- 多層級新增選單 -->

    let state = {

    }

    // 安全設值函數，避免 DOM 找不到時報錯
    function safeSet(id, val) {
        const el = document.getElementById(id);
        if (el) { el.value = val; }

    // 切換編輯/瀏覽模式
    window.toggleEditMode = function() {
        state.isEditMode = !state.isEditMode;

      state.isGuest = true;

      document.getElementById('profile-auth').classList.remove('hidden'); document.getElementById('profile-unauth').classList.add('hidden');
      document.getElementById('profile-name').innerText = '訪客模式'; document.getElementById('profile-email').innerText = '僅儲存於此瀏覽器，不會同步至雲端';

      window.switchView('plans'); renderPlansList();
    };

    window.handleSignOut = () => {
      if (state.isGuest) {
          state.isGuest = false; state.user = null; state.plans = [];

          signOut(auth).then(() => { showToast("已登出帳號"); });

    window.handleSetupClick = () => { window.openSetup(state.currentPlanId); };

    window.addSetupHotel = () => {

      const html = `

            <button type="button" onclick="this.closest('.hotel-item').remove()" class="w-6 h-6 flex items-center justify-center bg-white rounded-full text-brand-textSub hover:text-[#E63946] border border-brand-light shadow-sm transition-colors"><i class="fa-solid fa-trash-can text-[10px]"></i></button>
          </div>
          <div class="space-y-2">
            <div><input type="text" class="hotel-name w-full text-[13px] font-bold text-brand-dark outline-none bg-white rounded-lg px-3 py-2 placeholder-brand-textSub/50 border border-brand-light/50 focus:border-brand-primary transition-all shadow-sm" placeholder="中文或常用名稱 (必填)"></div>
            <div><input type="text" class="hotel-foreign w-full text-[13px] font-bold text-brand-dark outline-none bg-white rounded-lg px-3 py-2 placeholder-brand-textSub/50 border border-brand-light/50 focus:border-brand-primary transition-all shadow-sm" placeholder="外文名稱 (選填)"></div>

              <span class="text-[12px] font-bold text-brand-textSub">晚</span>
            </div>
          </div>
        </div>`;
      container.insertAdjacentHTML('beforeend', html);
    };

    window.renderSetupHotels = (accommodations = []) => {
      const container = document.getElementById('hotel-list-container');
      container.innerHTML = '';

      else {
        accommodations.forEach(h => {
          window.addSetupHotel();
          const items = container.querySelectorAll('.hotel-item');
          const lastItem = items[items.length - 1];
          lastItem.querySelector('.hotel-name').value = h.name || '';
          lastItem.querySelector('.hotel-foreign').value = h.foreignName || '';
          lastItem.querySelector('.hotel-address').value = h.address || '';
          lastItem.querySelector('.hotel-nights').value = h.nights || 1;
        });
      }
    };

      if(state.isGuest) return;

      if (user) {
        document.getElementById('profile-auth').classList.remove('hidden'); document.getElementById('profile-unauth').classList.add('hidden');

            document.getElementById('profile-pic').src = user.photoURL;
            document.getElementById('profile-pic').classList.remove('hidden'); document.getElementById('profile-icon').classList.add('hidden');
        }
        listenToPlans();

        document.getElementById('profile-auth').classList.add('hidden'); document.getElementById('profile-unauth').classList.remove('hidden');
        closeAllModals(); state.plans = []; renderPlansList();
      }
    });

      if (!state.user || state.isGuest) return;
      const q = collection(db, 'artifacts', appId, 'users', state.user.uid, 'plans');
      onSnapshot(q, (snapshot) => {
        state.plans = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderPlansList();
        if (state.currentPlanId) {
          const activePlan = state.plans.find(p => p.id === state.currentPlanId);
          if (activePlan) {
            state.tripData = activePlan;
            if (!document.getElementById('view-itinerary').classList.contains('hidden')) renderItinerary();
          } else { window.switchView('plans'); }
        }
      });
    }

    window.switchView = function(v) {
      ['plans', 'setup', 'itinerary', 'profile'].forEach(id => document.getElementById(`view-${id}`)?.classList.add('hidden'));
      document.getElementById(`view-${v}`)?.classList.remove('hidden');
      
      const headerStandard = document.getElementById('header-standard'); const headerItinerary = document.getElementById('header-itinerary');
      const title = document.getElementById('header-title'); const sub = document.getElementById('header-subtitle');
      const btnAction = document.getElementById('btn-header-action');
      const bottomNav = document.getElementById('bottom-nav');
      const navBtnPlans = document.getElementById('nav-btn-plans'); const navBtnProfile = document.getElementById('nav-btn-profile');

      if (v === 'plans' || v === 'profile' || v === 'itinerary') {
         bottomNav.classList.remove('hidden');
         if(v === 'profile') {
             navBtnProfile.classList.add('text-brand-primary'); navBtnProfile.classList.remove('text-brand-textSub');
             navBtnPlans.classList.add('text-brand-textSub'); navBtnPlans.classList.remove('text-brand-primary');
         } else {
             navBtnPlans.classList.add('text-brand-primary'); navBtnPlans.classList.remove('text-brand-textSub');
             navBtnProfile.classList.add('text-brand-textSub'); navBtnProfile.classList.remove('text-brand-primary');
         }
      } else { bottomNav.classList.add('hidden'); }

      if (v === 'plans') {
        headerItinerary.classList.add('hidden'); headerStandard.classList.remove('hidden');
        sub.innerText = state.user?.displayName ? `Hi, ${state.user.displayName}` : 'Welcome'; title.innerText = '我的計畫';
        btnAction.innerHTML = '<i class="fa-solid fa-bell text-lg"></i>'; btnAction.onclick = () => showToast('目前沒有新通知');
      } else if (v === 'profile') {
        headerItinerary.classList.add('hidden'); headerStandard.classList.remove('hidden');
        sub.innerText = 'Account'; title.innerText = '會員中心';
        btnAction.innerHTML = '<i class="fa-solid fa-gear text-lg"></i>'; btnAction.onclick = () => showToast('設定功能建置中');
      } else if (v === 'setup') {
        headerItinerary.classList.add('hidden'); headerStandard.classList.remove('hidden');
        sub.innerText = 'My Trip'; title.innerText = state.currentPlanId ? '行程設定' : '建立新行程';
        btnAction.innerHTML = '<i class="fa-solid fa-xmark text-xl"></i>'; btnAction.onclick = () => window.switchView(state.currentPlanId ? 'itinerary' : 'plans');
      } else if (v === 'itinerary') {
        headerStandard.classList.add('hidden'); headerItinerary.classList.remove('hidden');
      }
    };

    function renderPlansList() {
      const container = document.getElementById('plans-list');
      if (!state.user) {
        container.innerHTML = `<div class="py-24 text-center text-brand-textSub opacity-50"><i class="fa-solid fa-compass text-6xl mb-6"></i><p class="font-bold mt-2 text-[14px]">請先至會員中心登入<br>或使用免登入試用模式</p></div>`;
        return;
      }
      if (state.plans.length === 0) { 
        container.innerHTML = `<div class="py-24 text-center text-brand-textSub opacity-50"><i class="fa-solid fa-map-location-dot text-6xl mb-6"></i><p class="font-bold">尚無任何行程</p></div>`; return; 
      }
      container.innerHTML = state.plans.sort((a, b) => b.createdAt - a.createdAt).map(plan => `
        <div onclick="openPlan('${plan.id}')" class="bg-brand-card rounded-[24px] p-6 border border-brand-light shadow-sm flex items-center justify-between active:scale-[0.98] transition-all cursor-pointer">
          <div>
            <h3 class="font-bold text-brand-textMain text-[16px] truncate mb-1 uppercase">${plan.title}</h3>
            <p class="text-[11px] text-brand-textSub font-bold tracking-widest">${plan.startDate} · ${plan.days} DAYS</p>
          </div>
          <div class="w-10 h-10 rounded-full bg-brand-bg flex items-center justify-center text-brand-primary"><i class="fa-solid fa-chevron-right"></i></div>
        </div>
      `).join('');
    }

    window.openPlan = (id) => { 
      if(!state.user) { showToast('請先登入或試用'); window.switchView('profile'); return; }
      state.currentPlanId = id; state.activeDay = 0; 
      state.isEditMode = false; // 每次進入預設為瀏覽模式
      state.tripData = state.plans.find(p => p.id === id) || state.tripData;
      renderItinerary(); window.switchView('itinerary'); 
    };

    window.createNewPlanInit = () => {
      if(!state.user) { showToast('請先登入或試用'); window.switchView('profile'); return; }
      window.openSetup(null);
    };

    window.openSetup = (id = null) => {
      state.currentPlanId = id;
      if (id) {
        const plan = state.plans.find(p => p.id === id); state.tripData = { ...plan };
        document.getElementById('btn-delete-plan').classList.remove('hidden');
      } else {
        state.tripData = { title: '', startDate: '', days: 3, flightOutAirline: '', flightOutNo: '', flightOutDeptLoc: '', flightOutArrLoc: '', flightOutDeptTime: '', flightOutArrTime: '', flightRetAirline: '', flightRetNo: '', flightRetDeptLoc: '', flightRetArrLoc: '', flightRetDeptTime: '', flightRetArrTime: '', accommodations: [], itinerary: {} };
        document.getElementById('btn-delete-plan').classList.add('hidden');
      }
      
      safeSet('setup-title', state.tripData.title || ''); 
      safeSet('setup-start-date', state.tripData.startDate || '');
      safeSet('setup-days', state.tripData.days || 3); 
      
      safeSet('setup-flight-out-airline', state.tripData.flightOutAirline || ''); 
      safeSet('setup-flight-out-no', state.tripData.flightOutNo || ''); 
      safeSet('setup-flight-out-dept-loc', state.tripData.flightOutDeptLoc || ''); 
      safeSet('setup-flight-out-arr-loc', state.tripData.flightOutArrLoc || ''); 
      safeSet('setup-flight-out-dept-time', state.tripData.flightOutDeptTime || ''); 
      safeSet('setup-flight-out-arr-time', state.tripData.flightOutArrTime || ''); 
      
      safeSet('setup-flight-ret-airline', state.tripData.flightRetAirline || ''); 
      safeSet('setup-flight-ret-no', state.tripData.flightRetNo || ''); 
      safeSet('setup-flight-ret-dept-loc', state.tripData.flightRetDeptLoc || ''); 
      safeSet('setup-flight-ret-arr-loc', state.tripData.flightRetArrLoc || ''); 
      safeSet('setup-flight-ret-dept-time', state.tripData.flightRetDeptTime || ''); 
      safeSet('setup-flight-ret-arr-time', state.tripData.flightRetArrTime || ''); 
      
      window.renderSetupHotels(state.tripData.accommodations);
      window.switchView('setup');
    };

    window.deletePlan = async () => {
      if(confirm("確定要刪除整個行程嗎？")) {
        if(state.isGuest) {
            state.plans = state.plans.filter(p => p.id !== state.currentPlanId);
            localStorage.setItem('guest_plans', JSON.stringify(state.plans));
        } else { await deleteDoc(doc(db, 'artifacts', appId, 'users', state.user.uid, 'plans', state.currentPlanId)); }
        state.currentPlanId = null; window.switchView('plans');
        if(state.isGuest) renderPlansList();
      }
    };

    function renderItinerary() {
      const formattedDate = (state.tripData.startDate || '').replace(/-/g, '/');
      document.getElementById('header-itinerary-title').innerText = state.tripData.title || '行程表';
      document.getElementById('header-itinerary-subtitle').innerText = `${formattedDate} · ${state.tripData.days || 1}天`;
      
      // 更新編輯按鈕UI
      const editBtn = document.getElementById('btn-itinerary-edit');
      if (state.isEditMode) {
          editBtn.innerHTML = '<i class="fa-solid fa-check text-lg text-brand-primary"></i>';
          editBtn.classList.add('bg-brand-primary/10');
      } else {
          editBtn.innerHTML = '<i class="fa-solid fa-pen text-lg"></i>';
          editBtn.classList.remove('bg-brand-primary/10');
      }
      
      renderDaysTabs(); renderTimeline();
    }

    function getDayDateString(dayIndex) {
      if (!state.tripData.startDate) return `Day ${dayIndex}`;
      const date = new Date(state.tripData.startDate);
      date.setDate(date.getDate() + dayIndex - 1);
      return `${date.getMonth() + 1}/${date.getDate()}`;
    }

    function renderDaysTabs() {
      const tabs = document.getElementById('days-tabs'); tabs.innerHTML = '';
      
      const isOverview = state.activeDay === 0;
      const btnOverview = document.createElement('button');
      btnOverview.className = `snap-start shrink-0 px-5 py-2.5 rounded-full font-bold transition-all duration-200 border ${
        isOverview ? 'bg-brand-primary text-brand-card border-brand-primary shadow-md shadow-brand-primary/20' : 'bg-brand-card text-brand-textSub border-brand-light hover:bg-brand-light/50'}`;
      btnOverview.innerHTML = `<div class="flex items-center gap-2"><span class="text-[12px]">總覽</span></div>`;
      btnOverview.onclick = () => { state.activeDay = 0; renderDaysTabs(); renderTimeline(); };
      tabs.appendChild(btnOverview);

      for (let i = 1; i <= state.tripData.days; i++) {
        const isActive = state.activeDay === i;
        const btn = document.createElement('button');
        btn.className = `snap-start shrink-0 px-5 py-2.5 rounded-full font-bold transition-all duration-200 border ${
          isActive ? 'bg-brand-primary text-brand-card border-brand-primary shadow-md shadow-brand-primary/20' : 'bg-brand-card text-brand-textSub border-brand-light hover:bg-brand-light/50'}`;
        btn.innerHTML = `<div class="flex items-center gap-2"><span class="text-[11px] opacity-80">Day ${i}</span><span class="text-[12px]">${getDayDateString(i)}</span></div>`;
        btn.onclick = () => { state.activeDay = i; renderDaysTabs(); renderTimeline(); };
        tabs.appendChild(btn);
      }
    }

    function renderTimeDisplay(start, end, showStart = true, showEnd = true) {
      let html = `<div class="flex flex-col items-end gap-1 mt-[2px]">`;
      if (start) html += `<span class="text-[14px] font-bold font-mono text-brand-dark tracking-tight leading-none ${showStart ? '' : 'opacity-0'}">${start}</span>`;
      if (end) html += `<span class="text-[14px] font-bold font-mono text-brand-dark tracking-tight leading-none ${showEnd ? '' : 'opacity-0'}">${end}</span>`;
      html += `</div>`; return html;
    }

    function renderCost(cost, curr) {
      if (!cost) return '';
      const symbol = curr === 'TWD' ? '$' : '¥';
      return `<div class="text-[13px] font-medium text-brand-textSub mt-1.5">費用：${symbol}${cost}</div>`;
    }

    function renderTimeline() {
      const container = document.getElementById('timeline-container');
      const plan = state.tripData;
      const isEdit = state.isEditMode;
      
      const fabBtn = document.getElementById('fab-container');
      
      // 總覽
      if (state.activeDay === 0) {
        fabBtn.classList.add('hidden');
        fabBtn.classList.remove('scale-100');
        
        let flightOutTitle = plan.flightOutAirline || plan.flightOutNo ? `${plan.flightOutAirline || ''} ${plan.flightOutNo || ''}`.trim() : '未設定出發航班';
        let flightOutRoute = plan.flightOutDeptLoc || plan.flightOutArrLoc ? `${plan.flightOutDeptLoc || '出發地'} <i class="fa-solid fa-plane text-[10px] mx-1.5 opacity-50"></i> ${plan.flightOutArrLoc || '降落地'}` : '';
        let flightOutTimeStr = plan.flightOutDeptTime || plan.flightOutArrTime ? `${plan.flightOutDeptTime || '--:--'} - ${plan.flightOutArrTime || '--:--'}` : '';

        let flightRetTitle = plan.flightRetAirline || plan.flightRetNo ? `${plan.flightRetAirline || ''} ${plan.flightRetNo || ''}`.trim() : '未設定回程航班';
        let flightRetRoute = plan.flightRetDeptLoc || plan.flightRetArrLoc ? `${plan.flightRetDeptLoc || '出發地'} <i class="fa-solid fa-plane text-[10px] mx-1.5 opacity-50"></i> ${plan.flightRetArrLoc || '降落地'}` : '';
        let flightRetTimeStr = plan.flightRetDeptTime || plan.flightRetArrTime ? `${plan.flightRetDeptTime || '--:--'} - ${plan.flightRetArrTime || '--:--'}` : '';

        let flightHtml = `
          <div class="bg-white border border-brand-light rounded-[24px] p-5 shadow-sm mb-6">
             <h3 class="text-[15px] font-extrabold text-brand-dark mb-4 flex items-center gap-2">
                <div class="w-8 h-8 rounded-full bg-brand-primary/10 text-brand-primary flex items-center justify-center"><i class="fa-solid fa-plane-departure text-[13px]"></i></div> 航班資訊
             </h3>
             <div class="space-y-3">
                <div class="bg-brand-bg rounded-[16px] p-4 border border-brand-light/50 relative">
                   <div class="flex justify-between items-start mb-1">
                      <p class="text-[11px] text-brand-textSub font-bold bg-white px-2 py-0.5 rounded border border-brand-light/80">出發</p>
                      ${flightOutTimeStr ? `<p class="text-[13px] font-mono text-brand-primary font-bold mt-0.5">${flightOutTimeStr}</p>` : ''}
                   </div>
                   <p class="text-[15px] font-extrabold text-brand-dark truncate">${flightOutTitle}</p>
                   ${flightOutRoute ? `<p class="text-[12px] font-bold text-brand-textSub mt-1 truncate flex items-center">${flightOutRoute}</p>` : ''}
                </div>
                <div class="bg-brand-bg rounded-[16px] p-4 border border-brand-light/50 relative">
                   <div class="flex justify-between items-start mb-1">
                      <p class="text-[11px] text-brand-textSub font-bold bg-white px-2 py-0.5 rounded border border-brand-light/80">回程</p>
                      ${flightRetTimeStr ? `<p class="text-[13px] font-mono text-brand-primary font-bold mt-0.5">${flightRetTimeStr}</p>` : ''}
                   </div>
                   <p class="text-[15px] font-extrabold text-brand-dark truncate">${flightRetTitle}</p>
                   ${flightRetRoute ? `<p class="text-[12px] font-bold text-brand-textSub mt-1 truncate flex items-center">${flightRetRoute}</p>` : ''}
                </div>
             </div>
          </div>
        `;

        let accommodationsHtml = '';
        if (plan.accommodations && plan.accommodations.length > 0) {
            accommodationsHtml = `<div class="space-y-3">`;
            plan.accommodations.forEach((h, idx) => {
                accommodationsHtml += `
                  <div class="bg-brand-bg p-4 rounded-[20px] border border-brand-light/50 flex flex-col gap-2">
                     <div class="flex justify-between items-start">
                         <div class="flex-1 pr-3">
                             <div class="flex items-center gap-1.5 mb-1.5">
                                 <span class="w-[18px] h-[18px] rounded-full bg-brand-accent text-white flex items-center justify-center text-[10px] font-bold shadow-sm">${idx + 1}</span>
                                 <p class="text-[15px] font-extrabold text-brand-dark leading-snug line-clamp-1">${h.name || '未命名住宿'}</p>
                             </div>
                             ${h.foreignName ? `<p class="text-[11px] font-medium text-brand-textSub line-clamp-1 pl-6">${h.foreignName}</p>` : ''}
                         </div>
                         <span class="text-[11px] font-bold text-brand-accent bg-brand-accent/10 px-2 py-1 rounded shrink-0">入住 ${h.nights || 1} 晚</span>
                     </div>
                     ${h.address ? `<p class="text-[12px] font-medium text-brand-textSub mt-1 flex items-start gap-1 pl-[22px]"><i class="fa-solid fa-location-dot mt-0.5 opacity-70"></i> <span>${h.address}</span></p>` : ''}
                  </div>
                `;
            });
            accommodationsHtml += `</div>`;
        } else {
            accommodationsHtml = `<div class="text-center py-6 text-brand-textSub bg-brand-bg rounded-[16px] border border-brand-light/50"><p class="text-[13px] font-bold">尚未設定住宿</p></div>`;
        }

        let hotelHtml = `
          <div class="bg-white border border-brand-light rounded-[24px] p-5 shadow-sm mb-6">
             <h3 class="text-[15px] font-extrabold text-brand-dark mb-4 flex items-center gap-2">
                <div class="w-8 h-8 rounded-full bg-brand-accent/10 text-brand-accent flex items-center justify-center"><i class="fa-solid fa-bed text-[13px]"></i></div> 預定住宿
             </h3>
             ${accommodationsHtml}
          </div>
        `;

        container.innerHTML = `<div class="px-2 py-2">${flightHtml}${hotelHtml}</div>`;
        return;
      }

      // 一般行程
      if (isEdit) {
          fabBtn.classList.remove('hidden');
          setTimeout(() => fabBtn.classList.add('scale-100'), 10);
      } else {
          fabBtn.classList.remove('scale-100');
          setTimeout(() => fabBtn.classList.add('hidden'), 300);
      }

      const items = plan.itinerary[state.activeDay] || [];
      container.innerHTML = '';

      if (items.length === 0) {
        container.innerHTML = `<div class="flex flex-col items-center justify-center h-48 mt-12 text-brand-textSub"><div class="w-16 h-16 bg-brand-bg border border-brand-light rounded-full flex items-center justify-center mb-4 shadow-sm"><i class="fa-solid fa-calendar-day text-2xl text-brand-primary"></i></div><p class="font-bold text-[14px]">這一天尚未安排行程</p></div>`;
        return;
      }

      let html = '<div class="relative pl-1 pr-1 pt-4 pb-4">';
      items.sort((a, b) => (a.timeStart || '').localeCompare(b.timeStart || '')).forEach((item, index) => {
        const isLast = index === items.length - 1; const isFirst = index === 0; const isOnly = items.length === 1;
        const costHtml = renderCost(item.cost, item.currency);

        const editClick = isEdit ? `onclick="window.openOptions('${item.id}')"` : '';
        const cursorClass = isEdit ? 'cursor-pointer hover:bg-brand-bg/30 rounded-2xl' : '';
        const ellipsisBtn = isEdit ? `<button class="absolute right-0 top-3 w-8 h-8 flex items-center justify-center text-brand-textSub hover:text-brand-dark rounded-full transition-colors"><i class="fa-solid fa-ellipsis-vertical text-lg"></i></button>` : '';

        let lineHtml = '';
        if (!isOnly) {
            if (isFirst) lineHtml = `<div class="absolute top-[26px] bottom-0 timeline-line bg-brand-primary z-0"></div>`;
            else if (isLast) lineHtml = `<div class="absolute top-0 h-[26px] timeline-line bg-brand-primary z-0"></div>`;
            else lineHtml = `<div class="absolute top-0 bottom-0 timeline-line bg-brand-primary z-0"></div>`;
        }

        if (item.type === 'location') {
          const nameHtml = item.name.replace(/\n/g, '<br>');
          const subHtml = item.subtitle ? item.subtitle.replace(/\n/g, '<br>') : '';
          const timeHtml = renderTimeDisplay(item.timeStart, item.timeEnd, true, true);
          const locObj = LOCATION_MODES.find(m => m.id === item.locMode) || LOCATION_MODES[0];
          
          let nodeDot = '';
          if(item.isTransfer) { 
             nodeDot = `<div class="w-6 h-6 rounded-full bg-[#E76F51] border-[3px] border-brand-bg z-10 mt-[16px] shadow-sm flex items-center justify-center"><i class="fa-solid fa-person-walking-arrow-right text-[10px] text-white"></i></div>`;
          } else if(item.isThrough) { 
             nodeDot = `<div class="w-5 h-5 rounded-full bg-brand-primary border-[3px] border-brand-bg z-10 mt-[18px] shadow-sm flex items-center justify-center"><i class="fa-solid fa-angles-down text-[8px] text-white"></i></div>`;
          } else {
             nodeDot = `<div class="w-3.5 h-3.5 rounded-full border-[3px] border-brand-primary bg-brand-card z-10 mt-[20px] shadow-sm"></div>`;
          }

          html += `
            <div class="relative flex group ${cursorClass} transition-colors" ${editClick}>
              <div class="w-[68px] shrink-0 text-right pr-3 pt-[20px]">${timeHtml}</div>
              <div class="w-6 shrink-0 flex flex-col items-center relative self-stretch">${lineHtml}${nodeDot}</div>
              <div class="flex-1 pt-[16px] pb-6 pl-2 relative pr-8">
                <div class="flex items-start gap-2.5">
                   <div class="w-[24px] h-[24px] rounded bg-brand-primary/15 text-brand-primary flex items-center justify-center shrink-0 mt-[1px]">
                     <i class="${locObj.icon} text-[12px]"></i>
                   </div>
                   <div class="text-[16px] font-extrabold text-brand-textMain leading-snug break-words flex-1">
                     ${nameHtml}
                   </div>
                </div>
                ${item.isTransfer ? `<div class="mt-1.5 ml-[34px]"><span class="text-[9px] font-bold text-white bg-[#E76F51]/90 px-1.5 py-0.5 rounded">換乘轉車</span></div>` : ''}
                ${item.isThrough ? `<div class="mt-1.5 ml-[34px]"><span class="text-[9px] font-bold text-white bg-brand-primary/90 px-1.5 py-0.5 rounded">免下車直通</span></div>` : ''}
                ${subHtml ? `<div class="text-[13px] font-medium text-brand-textMain mt-1.5 ml-[34px] leading-relaxed">${subHtml}</div>` : ''}
                <div class="ml-[34px]">${costHtml}</div>
                ${ellipsisBtn}
              </div>
            </div>`;
        } else {
          let showStart = true; let showEnd = true;
          const prevItem = items[index - 1]; const nextItem = items[index + 1];
          if (prevItem && item.timeStart === (prevItem.timeEnd || prevItem.timeStart)) showStart = false;
          if (nextItem && item.timeEnd && item.timeEnd === nextItem.timeStart) showEnd = false;

          let timeColHtml = `
             <div class="w-[68px] shrink-0 text-right pr-3 py-[20px] flex flex-col justify-between items-end">
                <span class="text-[14px] font-bold font-mono text-brand-dark leading-none tracking-tight ${showStart ? '' : 'opacity-0'}">${item.timeStart || ''}</span>
                <div class="flex flex-col items-end my-2 gap-1 w-[48px]">
                   ${item.duration ? `<span class="text-[12px] font-medium text-brand-textSub leading-tight text-right w-full whitespace-pre-wrap break-words">${item.duration.replace(/\\n/g, '<br>')}</span>` : ''}
                   ${item.extraInfo ? `<span class="text-[11px] font-bold text-brand-accent leading-none flex items-center justify-end mt-1">${item.extraInfo}<i class="fa-solid fa-caret-down text-[10px] ml-1"></i></span>` : ''}
                </div>
                <span class="text-[14px] font-bold font-mono text-brand-dark leading-none tracking-tight ${showEnd ? '' : 'opacity-0'}">${item.timeEnd || ''}</span>
             </div>`;

          const modeObj = TRANSPORT_MODES.find(m => m.id === item.mode) || TRANSPORT_MODES[1];
          const opStr = item.operator || '';
          const vehStr = item.vehicleNo || '';
          const routeStr = item.name ? item.name.replace(/\n/g, '<br>') : '';
          const dirStr = item.direction ? `（${item.direction}）` : '';
          const titleLine = `${opStr} ${vehStr}`.trim();

          html += `
            <div class="relative flex items-stretch group ${cursorClass} transition-colors" ${editClick}>
              ${timeColHtml}
              <div class="w-6 shrink-0 flex flex-col items-center relative self-stretch">${lineHtml}</div>
              <div class="flex-1 pl-2 pr-0 py-[20px] relative">
                 <div class="pl-1 relative pb-2">
                   <div class="flex items-center gap-2.5 mb-1 pr-6">
                     <div class="w-[24px] h-[24px] rounded bg-brand-accent/15 text-brand-accent flex items-center justify-center shrink-0">
                       <i class="${modeObj.icon} text-[12px]"></i>
                     </div>
                     ${titleLine ? `<span class="text-[14px] font-bold text-brand-accent leading-tight">${titleLine}</span>` : ''}
                   </div>
                   ${routeStr ? `<div class="text-[14px] font-extrabold text-brand-textMain leading-snug pr-6 ml-[34px]">${routeStr}${dirStr}</div>` : ''}
                   <div class="ml-[34px]">${costHtml}</div>
                 </div>
                 ${ellipsisBtn}
              </div>
            </div>`;
        }
      });
      html += '</div>'; container.innerHTML = html;
    }

    // --- 5大選項選單 ---

    window.toggleTransferUI = function() {
        const val = document.querySelector('input[name="transfer_type"]:checked').value;
        const groupTrans = document.getElementById('group-transfer-fields');
        const groupLoc = document.getElementById('group-location-fields');
        const labelLocName = document.getElementById('label-loc-name');
        
        if(val === 'transfer') {
            if(groupTrans) groupTrans.classList.remove('hidden');
            if(groupLoc) groupLoc.classList.add('hidden');
        } else {
            if(groupTrans) groupTrans.classList.add('hidden');
            if(groupLoc) groupLoc.classList.remove('hidden');
            if(labelLocName) labelLocName.innerHTML = '車站名稱 <span class="text-brand-primary">*</span>';
        }
    };

    // --- 極簡扁平表單 ---
    window.openFormModal = function(subType, itemId = null, autoFillData = null) {
      let baseType = (subType === 'transport' || subType === 'flight') ? 'transport' : 'location';
      
      state.itemType = baseType; state.subType = subType; state.editingId = itemId;
      const plan = state.tripData;
      
      ['group-location-mode', 'group-location-fields', 'group-transport-mode', 'group-transport-fields', 'group-flight-fields', 'group-hotel-fields', 'group-transfer-type', 'group-transfer-fields']
        .forEach(id => { const el = document.getElementById(id); if(el) el.classList.add('hidden'); });
      
      let titleStr = '新增項目';
      
      if (subType === 'location') {
         titleStr = itemId ? '編輯地點' : '新增地點';
         document.getElementById('group-location-mode')?.classList.remove('hidden');
         document.getElementById('group-location-fields')?.classList.remove('hidden');
         const lbl = document.getElementById('label-loc-name'); if(lbl) lbl.innerHTML = '名稱 <span class="text-brand-primary">*</span>';
         renderLocationModes();
      } else if (subType === 'hotel') {
         titleStr = itemId ? '編輯住宿' : '新增住宿';
         document.getElementById('group-hotel-fields')?.classList.remove('hidden');
      } else if (subType === 'transfer') {
         titleStr = itemId ? '編輯轉乘資訊' : '新增轉乘站/免換乘';
         document.getElementById('group-transfer-type')?.classList.remove('hidden');
         window.toggleTransferUI();
      } else if (subType === 'transport') {
         titleStr = itemId ? '編輯交通' : '新增交通';
         document.getElementById('group-transport-mode')?.classList.remove('hidden');
         document.getElementById('group-transport-fields')?.classList.remove('hidden');
         renderTransportModes();
      } else if (subType === 'flight') {
         titleStr = itemId ? '編輯航班' : '新增航班';
         document.getElementById('group-flight-fields')?.classList.remove('hidden');
      }
      
      const titleEl = document.getElementById('form-modal-title');
      if(titleEl) titleEl.innerText = titleStr;

      // 不帶預設時間
      state.formData = { 
        timeStart: '', timeEnd: '', name: '', subtitle: '', 
        mode: 'train', locMode: 'spot', operator: '', vehicleNo: '', 
        direction: '', duration: '', extraInfo: '', cost: '', currency: 'JPY', 
        isThrough: false, isTransfer: false
      };

      if (itemId) {
         const item = plan.itinerary[state.activeDay].find(i => i.id === itemId);
         state.formData = { ...item };
      } else {
         if (subType === 'flight') state.formData.mode = 'flight';
         if (subType === 'hotel') state.formData.locMode = 'hotel';
         if (subType === 'transfer') state.formData.locMode = 'station';
         
         if(subType === 'flight' && autoFillData) {
             if(autoFillData === 'outbound') {
                 state.formData.operator = plan.flightOutAirline || ''; state.formData.vehicleNo = plan.flightOutNo || '';
                 state.formData.name = plan.flightOutDeptLoc || ''; state.formData.subtitle = plan.flightOutArrLoc || '';
                 state.formData.timeStart = plan.flightOutDeptTime || ''; state.formData.timeEnd = plan.flightOutArrTime || '';
             } else if(autoFillData === 'return') {
                 state.formData.operator = plan.flightRetAirline || ''; state.formData.vehicleNo = plan.flightRetNo || '';
                 state.formData.name = plan.flightRetDeptLoc || ''; state.formData.subtitle = plan.flightRetArrLoc || '';
                 state.formData.timeStart = plan.flightRetDeptTime || ''; state.formData.timeEnd = plan.flightRetArrTime || '';
             }
         } else if (subType === 'hotel' && autoFillData !== null) {
             const h = plan.accommodations[autoFillData];
             if(h) {
                 state.formData.name = h.name || ''; state.formData.operator = h.foreignName || ''; state.formData.subtitle = h.address || '';
             }
         }
      }
      
      safeSet('input-time-start', state.formData.timeStart || '');
      safeSet('input-time-end', state.formData.timeEnd || '');
      safeSet('input-cost', state.formData.cost || '');
      
      if (subType === 'location') {
         safeSet('input-loc-name', state.formData.name || ''); safeSet('input-loc-subtitle', state.formData.subtitle || '');
      } else if (subType === 'hotel') {
         safeSet('input-hotel-name', state.formData.name || ''); safeSet('input-hotel-foreign', state.formData.operator || ''); safeSet('input-hotel-address', state.formData.subtitle || '');
      } else if (subType === 'flight') {
         safeSet('input-flight-airline', state.formData.operator || ''); safeSet('input-flight-no', state.formData.vehicleNo || '');
         safeSet('input-flight-dept', state.formData.name || ''); safeSet('input-flight-arr', state.formData.subtitle || '');
      } else if (subType === 'transport') {
         safeSet('input-operator', state.formData.operator || ''); safeSet('input-vehicle-no', state.formData.vehicleNo || '');
         safeSet('input-route-name', state.formData.name || ''); safeSet('input-direction', state.formData.direction || '');
         safeSet('input-duration', state.formData.duration || ''); safeSet('input-extraInfo', state.formData.extraInfo || '');
      } else if (subType === 'transfer') {
         const radios = document.getElementsByName('transfer_type');
         if(radios && radios.length > 1) {
             if(state.formData.isThrough) { 
                radios[1].checked = true;
                safeSet('input-loc-name', state.formData.name || ''); safeSet('input-loc-subtitle', state.formData.subtitle || '');
             } else { 
                radios[0].checked = true;
                safeSet('input-trans-lineA', state.formData.operator || ''); safeSet('input-trans-staA', state.formData.name || '');
                safeSet('input-trans-lineB', state.formData.direction || ''); safeSet('input-trans-staB', state.formData.subtitle || '');
             }
             window.toggleTransferUI();
         }
      }
      
      window.selectCurrency(state.formData.currency || 'JPY');
      
      setTimeout(() => { document.querySelectorAll('textarea').forEach(t => { if(t) { t.style.height = ''; t.style.height = t.scrollHeight + 'px'; } }); }, 10);
      
      document.getElementById('sheet-add-menu')?.classList.remove('open'); document.getElementById('sheet-add-menu')?.classList.add('closed');
      document.getElementById('modal-overlay')?.classList.remove('closed'); document.getElementById('modal-overlay')?.classList.add('open');
      document.getElementById('sheet-form')?.classList.remove('closed'); document.getElementById('sheet-form')?.classList.add('open');
    }

    function renderTransportModes() {
      const el = document.getElementById('transport-modes-grid');
      if(el) {
          el.innerHTML = TRANSPORT_MODES.map(mode => `
            <button type="button" onclick="window.selectTransportMode('${mode.id}')"
              class="mode-btn py-2.5 rounded-xl flex flex-col items-center gap-1.5 transition-all border ${
                state.formData.mode === mode.id ? 'bg-brand-accent text-white border-brand-accent shadow-sm' : 'bg-[#F1F5F9] text-brand-textSub border-transparent hover:bg-brand-light/50'
              }"><i class="${mode.icon} text-lg"></i><span class="text-[11px] font-bold">${mode.label}</span></button>
          `).join('');
      }
    }

    function renderLocationModes() {
      const el = document.getElementById('location-modes-grid');
      if(el) {
          el.innerHTML = LOCATION_MODES.map(mode => `
            <button type="button" onclick="window.selectLocationMode('${mode.id}')"
              class="mode-btn py-2.5 rounded-xl flex flex-col items-center gap-1.5 transition-all border ${
                state.formData.locMode === mode.id ? 'bg-brand-primary text-white border-brand-primary shadow-sm' : 'bg-[#F1F5F9] text-brand-textSub border-transparent hover:bg-brand-light/50'
              }"><i class="${mode.icon} text-lg"></i><span class="text-[11px] font-bold">${mode.label}</span></button>
          `).join('');
      }
    }

    window.selectCurrency = function(val) {
      state.formData.currency = val;
      const el = document.getElementById('display-curr-symbol');
      if(el) el.innerText = val === 'TWD' ? '$' : '¥';
      document.querySelectorAll('.curr-btn').forEach(btn => {
        if (btn.dataset.val === val) {
          btn.classList.add('bg-white', 'shadow-sm', 'text-brand-dark'); btn.classList.remove('text-brand-textSub', 'bg-transparent');
        } else {
          btn.classList.remove('bg-white', 'shadow-sm', 'text-brand-dark'); btn.classList.add('text-brand-textSub', 'bg-transparent');
        }
      });
    };

    window.openOptions = function(id) {
      if(!state.isEditMode) return; // 安全阻擋：非編輯模式不允許叫出選單
      state.editingId = id;
      document.getElementById('modal-overlay').classList.remove('closed'); document.getElementById('modal-overlay').classList.add('open');
      document.getElementById('sheet-options').classList.remove('closed'); document.getElementById('sheet-options').classList.add('open');
    };

    window.selectTransportMode = function(id) { state.formData.mode = id; renderTransportModes(); };
    window.selectLocationMode = function(id) { state.formData.locMode = id; renderLocationModes(); };

    window.closeAllModals = function() {
      ['modal-overlay', 'sheet-add-menu', 'sheet-form', 'sheet-options', 'modal-delete'].forEach(id => {
          const el = document.getElementById(id);
          if(el) { el.classList.remove('open'); el.classList.add('closed'); }
      });
      const delContent = document.getElementById('delete-dialog-content');
      if(delContent) { delContent.classList.add('scale-95', 'opacity-0'); delContent.classList.remove('scale-100', 'opacity-100'); }
    }

    window.handleExport = () => {
      if(!state.user) { showToast('請先登入'); window.switchView('profile'); return; }
      const dataStr = JSON.stringify(state.plans, null, 2);
      const blob = new Blob([dataStr], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = `趣旅行_備份.json`; a.click();
      URL.revokeObjectURL(url); showToast('已匯出 JSON 行程檔！');
    };

    window.handleImport = (e) => {
      if(!state.user) { showToast('請先登入'); window.switchView('profile'); return; }
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = async (event) => {
        try {
          const imported = JSON.parse(event.target.result);
          const plansToImport = (imported && imported.title && !Array.isArray(imported)) ? [imported] : imported;
          if (!Array.isArray(plansToImport)) throw new Error("Invalid format");
          
          for (let p of plansToImport) {
            const cleanPlan = { 
              title: p.title || "未命名行程", startDate: p.startDate || new Date().toISOString().split('T')[0], days: p.days || 1, 
              flightOutAirline: p.flightOutAirline || "", flightOutNo: p.flightOutNo || "", flightOutDeptLoc: p.flightOutDeptLoc || "", flightOutArrLoc: p.flightOutArrLoc || "", flightOutDeptTime: p.flightOutDeptTime || "", flightOutArrTime: p.flightOutArrTime || "",
              flightRetAirline: p.flightRetAirline || "", flightRetNo: p.flightRetNo || "", flightRetDeptLoc: p.flightRetDeptLoc || "", flightRetArrLoc: p.flightRetArrLoc || "", flightRetDeptTime: p.flightRetDeptTime || "", flightRetArrTime: p.flightRetArrTime || "",
              accommodations: p.accommodations || [], itinerary: p.itinerary || {}, createdAt: serverTimestamp() 
            };
            if(state.isGuest) {
                cleanPlan.id = Date.now().toString() + Math.random().toString(36).substring(7);
                state.plans.push(cleanPlan);
            } else {
                await addDoc(collection(db, 'artifacts', appId, 'users', state.user.uid, 'plans'), cleanPlan);
            }
          }
          if(state.isGuest) localStorage.setItem('guest_plans', JSON.stringify(state.plans));
          showToast('成功匯入行程！'); window.switchView('plans');
          if(state.isGuest) renderPlansList();
        } catch (err) { alert('檔案格式錯誤，請確認這是由本系統匯出的 JSON 行程檔。'); }
        document.getElementById('input-import-file').value = '';
      };
      reader.readAsText(file);
    };

    function setupEventListeners() {
      
      document.getElementById('form-setup').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const hotelItems = document.querySelectorAll('#hotel-list-container .hotel-item');
        const accommodations = [];
        hotelItems.forEach(item => {
            const name = item.querySelector('.hotel-name').value;
            if(name) {
                accommodations.push({
                    name: name, foreignName: item.querySelector('.hotel-foreign').value,
                    address: item.querySelector('.hotel-address').value, nights: parseInt(item.querySelector('.hotel-nights').value) || 1
                });
            }
        });

        const planData = {
          title: document.getElementById('setup-title').value, startDate: document.getElementById('setup-start-date').value, days: parseInt(document.getElementById('setup-days').value) || 1,
          flightOutAirline: document.getElementById('setup-flight-out-airline').value, flightOutNo: document.getElementById('setup-flight-out-no').value, flightOutDeptLoc: document.getElementById('setup-flight-out-dept-loc').value, flightOutArrLoc: document.getElementById('setup-flight-out-arr-loc').value, flightOutDeptTime: document.getElementById('setup-flight-out-dept-time').value, flightOutArrTime: document.getElementById('setup-flight-out-arr-time').value,
          flightRetAirline: document.getElementById('setup-flight-ret-airline').value, flightRetNo: document.getElementById('setup-flight-ret-no').value, flightRetDeptLoc: document.getElementById('setup-flight-ret-dept-loc').value, flightRetArrLoc: document.getElementById('setup-flight-ret-arr-loc').value, flightRetDeptTime: document.getElementById('setup-flight-ret-dept-time').value, flightRetArrTime: document.getElementById('setup-flight-ret-arr-time').value,
          accommodations: accommodations
        };
        
        if (state.isGuest) {
            if (state.currentPlanId) {
                const idx = state.plans.findIndex(p => p.id === state.currentPlanId);
                state.plans[idx] = { ...state.plans[idx], ...planData };
                localStorage.setItem('guest_plans', JSON.stringify(state.plans));
                showToast("已暫存設定"); window.switchView('itinerary'); state.tripData = state.plans[idx]; renderItinerary();
            } else {
                planData.id = Date.now().toString(); planData.itinerary = {}; planData.createdAt = Date.now();
                state.plans.push(planData); localStorage.setItem('guest_plans', JSON.stringify(state.plans));
                window.openPlan(planData.id); showToast("已建立新行程");
            }
            return;
        }

        if (state.currentPlanId) {
          await updateDoc(doc(db, 'artifacts', appId, 'users', state.user.uid, 'plans', state.currentPlanId), planData);
          showToast("已儲存設定"); window.switchView('itinerary');
        } else {
          planData.itinerary = {}; planData.createdAt = serverTimestamp();
          const docRef = await addDoc(collection(db, 'artifacts', appId, 'users', state.user.uid, 'plans'), planData);
          window.openPlan(docRef.id); showToast("已建立新行程");
        }
      });

      document.getElementById('btn-login-google').onclick = () => {
         signInWithPopup(auth, new GoogleAuthProvider()).catch(err => { console.error(err); showToast("登入失敗：" + err.message); });
      };
      
      document.getElementById('btn-export').addEventListener('click', window.handleExport);
      document.getElementById('btn-import').addEventListener('click', () => {
        if(!state.user) { showToast('請先登入或試用'); window.switchView('profile'); return; }
        document.getElementById('input-import-file').click();
      });
      document.getElementById('input-import-file').addEventListener('change', window.handleImport);

      document.querySelectorAll('.btn-close-modal').forEach(btn => btn.addEventListener('click', window.closeAllModals));
      document.getElementById('modal-overlay').addEventListener('click', window.closeAllModals);

      document.getElementById('btn-save-item').addEventListener('click', async () => {
        const plan = state.tripData;
        if (!plan.itinerary[state.activeDay]) plan.itinerary[state.activeDay] = [];
        
        const baseType = state.itemType;
        const subType = state.subType;
        
        const data = { 
          id: state.editingId || Date.now().toString(), type: baseType, 
          timeStart: document.getElementById('input-time-start').value, timeEnd: document.getElementById('input-time-end').value, 
          cost: document.getElementById('input-cost').value, currency: state.formData.currency 
        };
        
        if (subType === 'location') { 
          data.locMode = state.formData.locMode; 
          data.name = document.getElementById('input-loc-name').value; 
          data.subtitle = document.getElementById('input-loc-subtitle').value; 
          data.isThrough = false; data.isTransfer = false;
        } else if (subType === 'hotel') {
          data.locMode = 'hotel'; 
          data.name = document.getElementById('input-hotel-name').value; 
          data.operator = document.getElementById('input-hotel-foreign').value; 
          data.subtitle = document.getElementById('input-hotel-address').value; 
          data.isThrough = false; data.isTransfer = false;
        } else if (subType === 'transfer') {
          data.locMode = 'station';
          const val = document.querySelector('input[name="transfer_type"]:checked').value;
          data.isTransfer = (val === 'transfer');
          data.isThrough = (val === 'through');
          if(data.isTransfer) {
              data.operator = document.getElementById('input-trans-lineA').value;
              data.name = document.getElementById('input-trans-staA').value;
              data.direction = document.getElementById('input-trans-lineB').value;
              data.subtitle = document.getElementById('input-trans-staB').value;
          } else {
              data.name = document.getElementById('input-loc-name').value;
              data.subtitle = document.getElementById('input-loc-subtitle').value;
          }
        } else if (subType === 'flight') {
          data.mode = 'flight'; 
          data.operator = document.getElementById('input-flight-airline').value; 
          data.vehicleNo = document.getElementById('input-flight-no').value; 
          data.name = document.getElementById('input-flight-dept').value; 
          data.subtitle = document.getElementById('input-flight-arr').value; 
        } else if (subType === 'transport') {
          data.mode = state.formData.mode; data.operator = document.getElementById('input-operator').value; 
          data.vehicleNo = document.getElementById('input-vehicle-no').value; data.name = document.getElementById('input-route-name').value; 
          data.direction = document.getElementById('input-direction').value; data.duration = document.getElementById('input-duration').value; 
          data.extraInfo = document.getElementById('input-extraInfo').value; 
        }
        
        if (state.editingId) { 
          const idx = plan.itinerary[state.activeDay].findIndex(i => i.id === state.editingId); 
          plan.itinerary[state.activeDay][idx] = data; 
        } else { 
          plan.itinerary[state.activeDay].push(data); 
        }
        
        if(state.isGuest) {
            const planIdx = state.plans.findIndex(p => p.id === state.currentPlanId);
            state.plans[planIdx].itinerary = plan.itinerary;
            localStorage.setItem('guest_plans', JSON.stringify(state.plans));
            window.closeAllModals(); showToast("已暫存至本機！");
            renderItinerary();
        } else {
            await updateDoc(doc(db, 'artifacts', appId, 'users', state.user.uid, 'plans', state.currentPlanId), { itinerary: plan.itinerary });
            window.closeAllModals(); showToast("已同步至雲端！");
        }
      });

      document.getElementById('btn-option-edit').addEventListener('click', () => {
        window.closeAllModals();
        setTimeout(() => {
          const item = state.tripData.itinerary[state.activeDay].find(i => i.id === state.editingId);
          if (item) {
             let guessSubType = item.type;
             if(item.type === 'location' && item.locMode === 'hotel') guessSubType = 'hotel';
             if(item.type === 'location' && (item.isTransfer || item.isThrough)) guessSubType = 'transfer';
             if(item.type === 'transport' && item.mode === 'flight') guessSubType = 'flight';
             window.openFormModal(guessSubType, item.id);
          }
        }, 300);
      });

      document.getElementById('btn-option-delete').addEventListener('click', () => {
        window.closeAllModals(); setTimeout(() => {
          document.getElementById('modal-overlay').classList.remove('closed'); document.getElementById('modal-overlay').classList.add('open');
          document.getElementById('modal-delete').classList.remove('closed'); document.getElementById('modal-delete').classList.add('open');
          document.getElementById('delete-dialog-content').classList.remove('scale-95', 'opacity-0'); document.getElementById('delete-dialog-content').classList.add('scale-100', 'opacity-100');
        }, 300);
      });

      document.getElementById('btn-confirm-delete').addEventListener('click', async () => {
        state.tripData.itinerary[state.activeDay] = state.tripData.itinerary[state.activeDay].filter(i => i.id !== state.editingId);
        
        if(state.isGuest) {
            const planIdx = state.plans.findIndex(p => p.id === state.currentPlanId);
            state.plans[planIdx].itinerary = state.tripData.itinerary;
            localStorage.setItem('guest_plans', JSON.stringify(state.plans));
            window.closeAllModals(); showToast("已刪除項目");
            renderItinerary();
        } else {
            await updateDoc(doc(db, 'artifacts', appId, 'users', state.user.uid, 'plans', state.currentPlanId), { itinerary: state.tripData.itinerary });
            window.closeAllModals(); showToast("已刪除項目");
        }
      });
    }

    init();
  </script>
</body>
</html>
