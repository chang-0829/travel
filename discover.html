    import { getFirestore, collection, query, onSnapshot, doc, getDoc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ✅ 使用您真實的 Firebase 金鑰

        apiKey: "AIzaSyCQF8A3ieML0JP3X8X78NCRuiUETRAiu5E",
        authDomain: "travel-96009.firebaseapp.com",
        projectId: "travel-96009",
        storageBucket: "travel-96009.firebasestorage.app",
        messagingSenderId: "578860064042",
        appId: "1:578860064042:web:b147880df3a01dd8f75253"
    };

    let app, auth, db;
    try {
        app = initializeApp(firebaseConfig);
        auth = getAuth();

    } catch (e) {

    }

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
    let currentUser = null;
    let userFavorites = new Set();
    let unsubscribeFavorites = null;

    // --- 假景點資料 (保留原有) ---
    const allSpots = [
        { id: 's1', name: '台北101', lat: 25.033964, lng: 121.564468, category: 'culture', image: 'https://images.unsplash.com/photo-1572004245648-9366df0410ff?q=80&w=500&auto=format&fit=crop', desc: '台灣最具代表性的地標建築，擁有高速電梯與無敵夜景觀景台。', address: '台北市信義區信義路五段7號', rating: 4.8, phone: '02-8101-8800', website: 'https://www.taipei-101.com.tw' },
        { id: 's2', name: '日月潭', lat: 23.8621, lng: 120.9133, category: 'nature', image: 'https://images.unsplash.com/photo-1583091993444-998851ccfca7?q=80&w=500&auto=format&fit=crop', desc: '台灣最大的高山湖泊，湖光山色如詩如畫，適合自行車環湖與遊船。', address: '南投縣魚池鄉', rating: 4.7 },
        { id: 's3', name: '逢甲夜市', lat: 24.1793, lng: 120.6455, category: 'food', image: 'https://images.unsplash.com/photo-1574005856403-9bb6baeeec24?q=80&w=500&auto=format&fit=crop', desc: '全台知名的超大型夜市，各種創新小吃與潮流服飾的發源地。', address: '台中市西屯區文華路', rating: 4.5, hours: '16:00 - 01:00' },
        { id: 's4', name: '阿里山國家森林遊樂區', lat: 23.5100, lng: 120.8033, category: 'nature', image: 'https://images.unsplash.com/photo-1605300287413-5a02484ab9a1?q=80&w=500&auto=format&fit=crop', desc: '以日出、雲海、晚霞、森林與高山鐵路「五奇」聞名於世。', address: '嘉義縣阿里山鄉', rating: 4.9 },
        { id: 's5', name: '信義商圈', lat: 25.0366, lng: 121.5663, category: 'shopping', image: 'https://images.unsplash.com/photo-1543884803-b097bbf9eeb0?q=80&w=500&auto=format&fit=crop', desc: '百貨公司林立的頂級購物區，是台北體驗時尚與品味的首選。', address: '台北市信義區', rating: 4.6 }
    ];

    const categoryConfig = {
        'nature': { label: '自然風景', color: '#10B981', icon: 'fa-leaf' },
        'culture': { label: '歷史文化', color: '#8B5CF6', icon: 'fa-landmark' },
        'food': { label: '在地美食', color: '#F59E0B', icon: 'fa-utensils' },
        'shopping': { label: '逛街購物', color: '#EC4899', icon: 'fa-shopping-bag' }
    };

    let activeCategory = 'all';
    let markers = {};

    // --- 確保 Leaflet 載入完畢 ---
    let leafletWait = setInterval(() => {
        if (window.L) {
            clearInterval(leafletWait);
            initDiscoverMap();
            startApp();
        }
    }, 50);

    function initDiscoverMap() {
        // 清理殘留地圖以避免 SPA 錯誤
        if (window.discoverMap) {
            window.discoverMap.remove();
        }

        window.discoverMap = L.map('map', { zoomControl: false }).setView([23.6978, 120.9605], 7);
        
        L.control.zoom({ position: 'topright' }).addTo(window.discoverMap);

        // 使用淺色、乾淨的底圖風格
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
        }).addTo(window.discoverMap);

        // 解決動態載入時地圖破圖的問題
        setTimeout(() => { window.discoverMap.invalidateSize(); }, 300);

        renderSpots(allSpots);
        initBottomPanelDrag();
    }

    // --- 面板拖曳邏輯 (完美相容新架構版) ---
    function initBottomPanelDrag() {
        const panel = document.getElementById('bottom-panel');
        const handle = document.getElementById('drag-handle-area');
        if (!panel || !handle) return;

        let isDragging = false;
        let startY = 0;
        let panelHeight = 0;
        let minTranslate = 0; // 全展開
        let maxTranslate = 0; // 收合 (留下 80px)
        let currentTranslate = 0;

        // 初始化面板位置 (在底部隱藏狀態，只露出 80px)
        setTimeout(() => {
            panelHeight = panel.offsetHeight;
            maxTranslate = panelHeight - 80;
            currentTranslate = maxTranslate;
            panel.style.transform = `translateY(${currentTranslate}px)`;
        }, 100);

        handle.addEventListener('touchstart', (e) => {
            isDragging = true;
            panelHeight = panel.offsetHeight;
            maxTranslate = panelHeight - 80;
            startY = e.touches[0].clientY - currentTranslate;
            panel.style.transition = 'none';
        }, {passive: true});

        handle.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            let y = e.touches[0].clientY - startY;
            if (y < minTranslate) y = minTranslate; // 頂到底
            if (y > maxTranslate) y = maxTranslate; // 退到最底
            currentTranslate = y;
            panel.style.transform = `translateY(${currentTranslate}px)`;
        }, {passive: false});

        handle.addEventListener('touchend', () => {
            if (!isDragging) return;
            isDragging = false;
            panel.style.transition = 'transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.1)'; // 加一點回彈感
            
            // 判斷應該吸附到上方還是下方
            if (currentTranslate < maxTranslate / 2) {
                currentTranslate = minTranslate; // 展開
            } else {
                currentTranslate = maxTranslate; // 收合
            }
            panel.style.transform = `translateY(${currentTranslate}px)`;
        });
    }

    function renderSpots(spots) {
        Object.values(markers).forEach(m => window.discoverMap.removeLayer(m));
        markers = {};
        
        const listContainer = document.getElementById('spot-list-container');
        listContainer.innerHTML = '';
        document.getElementById('spot-count-text').innerText = `為您找到 ${spots.length} 個精彩景點`;

        if (spots.length === 0) {
            listContainer.innerHTML = `<div class="text-center py-10 text-brand-textSub"><i class="fas fa-search-location text-4xl mb-3 opacity-50"></i><p>找不到符合的景點</p></div>`;
            return;
        }

        const bounds = L.latLngBounds();

        spots.forEach(spot => {
            const conf = categoryConfig[spot.category] || categoryConfig['nature'];
            
            // 1. 建立地圖 Marker
            const markerHtml = `
                <div class="custom-marker-wrapper">
                    <div class="marker-pin rounded-xl flex items-center justify-center text-white text-lg shadow-lg border-2 border-white" style="background-color: ${conf.color};">
                        <i class="fas ${conf.icon}"></i>
                    </div>
                </div>`;
            
            const icon = L.divIcon({
                html: markerHtml,
                className: '',
                iconSize: [36, 44],
                iconAnchor: [18, 44]
            });

            const marker = L.marker([spot.lat, spot.lng], { icon }).addTo(window.discoverMap);
            marker.on('click', () => openSpotDetail(spot));
            markers[spot.id] = marker;
            bounds.extend([spot.lat, spot.lng]);

            // 2. 建立列表卡片
            const isFav = userFavorites.has(spot.id);
            const favIconClass = isFav ? 'fas text-brand-accent' : 'far text-brand-textSub';

            const card = document.createElement('div');
            card.className = "flex gap-4 p-3 bg-white rounded-2xl border border-brand-light shadow-sm hover:shadow-md transition-shadow cursor-pointer group";
            card.innerHTML = `
                <div class="w-24 h-24 rounded-xl overflow-hidden shrink-0 relative">
                    <img src="${spot.image}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" alt="">
                    <div class="absolute top-1 left-1 px-1.5 py-0.5 bg-black/50 backdrop-blur-md rounded text-[10px] font-bold text-white flex items-center">
                        <i class="fas fa-star text-yellow-400 mr-1 text-[8px]"></i>${spot.rating}
                    </div>
                </div>
                <div class="flex-1 py-1 flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-start">
                            <h4 class="font-bold text-brand-textMain text-base line-clamp-1 group-hover:text-brand-primary transition-colors">${spot.name}</h4>
                            <button class="btn-fav-list shrink-0 w-8 h-8 flex items-center justify-center -mt-1 -mr-1 rounded-full hover:bg-brand-bg transition-colors" data-id="${spot.id}">
                                <i class="${favIconClass} fa-heart text-lg"></i>
                            </button>
                        </div>
                        <p class="text-xs text-brand-textSub mt-1 line-clamp-1"><i class="fas fa-map-marker-alt opacity-70 mr-1"></i>${spot.address.substring(0,6)}...</p>
                    </div>
                    <span class="inline-block px-2 py-0.5 rounded text-[10px] font-bold w-max" style="background-color: ${conf.color}15; color: ${conf.color};">
                        ${conf.label}
                    </span>
                </div>
            `;
            
            // 點擊卡片內容開啟詳細資訊
            card.addEventListener('click', (e) => {
                if(!e.target.closest('.btn-fav-list')) {
                    openSpotDetail(spot);
                    window.discoverMap.flyTo([spot.lat, spot.lng], 14, { duration: 1.5 });
                }
            });
            
            // 列表愛心按鈕綁定
            const favBtn = card.querySelector('.btn-fav-list');
            favBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                window.toggleFavorite(spot.id);
            });

            listContainer.appendChild(card);
        });

        if (spots.length > 0) window.discoverMap.fitBounds(bounds, { padding: [50, 50], maxZoom: 12 });
    }

    // --- UI 互動邏輯綁定 ---
    
    // 全域暴露開關面板函式，讓 HTML 標籤可以呼叫
    window.closeSpotDetail = function() {
        document.getElementById('spot-detail-panel').classList.add('translate-x-full');
    };

    function openSpotDetail(spot) {
        document.getElementById('detail-image').src = spot.image;
        document.getElementById('detail-title').innerText = spot.name;
        document.getElementById('detail-desc').innerText = spot.desc || '暫無簡介';
        document.getElementById('detail-address').innerText = spot.address || '未提供';
        document.getElementById('detail-hours').innerText = spot.hours || '依各設施公告為主';
        document.getElementById('detail-rating').innerText = spot.rating || 'N/A';

        const conf = categoryConfig[spot.category] || categoryConfig['nature'];
        const badge = document.getElementById('detail-category-badge');
        badge.innerText = conf.label;
        badge.style.color = conf.color;

        const navBtn = document.getElementById('circle-nav-btn');
        if (spot.lat && spot.lng) navBtn.href = `https://www.google.com/maps/dir/?api=1&destination=${spot.lat},${spot.lng}`;
        else navBtn.href = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(spot.address || spot.name)}`;

        const webBtn = document.getElementById('circle-web-btn');
        if (spot.website) { webBtn.href = spot.website; webBtn.style.display = 'flex'; } 
        else webBtn.style.display = 'none';

        const phoneBtn = document.getElementById('circle-phone-btn');
        if (spot.phone) { phoneBtn.href = `tel:${spot.phone}`; phoneBtn.style.display = 'flex'; } 
        else phoneBtn.style.display = 'none';

        updateFavoriteUI(spot.id);
        const favBtn = document.getElementById('btn-favorite-spot');
        favBtn.onclick = () => window.toggleFavorite(spot.id);

        document.getElementById('spot-detail-panel').classList.remove('translate-x-full');
    }

    // 分類過濾
    document.querySelectorAll('.category-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const cat = e.currentTarget.getAttribute('data-category');
            activeCategory = cat;
            
            // 樣式切換
            document.querySelectorAll('.category-btn').forEach(b => {
                b.classList.remove('bg-brand-primary', 'text-white', 'shadow-md');
                b.classList.add('bg-white', 'text-brand-textSub', 'border', 'border-brand-light');
            });
            e.currentTarget.classList.add('bg-brand-primary', 'text-white', 'shadow-md');
            e.currentTarget.classList.remove('bg-white', 'text-brand-textSub', 'border', 'border-brand-light');

            // 執行過濾
            filterSpots();
        });
    });

    // 搜尋過濾
    document.getElementById('search-input').addEventListener('input', filterSpots);

    function filterSpots() {
        const keyword = document.getElementById('search-input').value.toLowerCase();
        const filtered = allSpots.filter(spot => {
            const matchCat = (activeCategory === 'all' || spot.category === activeCategory);
            const matchKeyword = spot.name.toLowerCase().includes(keyword) || (spot.address && spot.address.toLowerCase().includes(keyword));
            return matchCat && matchKeyword;
        });
        renderSpots(filtered);
    }

    // 定位按鈕
    document.getElementById('btn-my-location').addEventListener('click', () => {
        if (!navigator.geolocation) {
            alert('您的瀏覽器不支援地理定位');
            return;
        }
        document.getElementById('btn-my-location').innerHTML = '<i class="fas fa-spinner fa-spin text-xl"></i>';
        navigator.geolocation.getCurrentPosition(
            (pos) => {
                const { latitude, longitude } = pos.coords;
                window.discoverMap.flyTo([latitude, longitude], 14, {duration: 1.5});
                L.marker([latitude, longitude]).addTo(window.discoverMap).bindPopup("您的位置").openPopup();
                document.getElementById('btn-my-location').innerHTML = '<i class="fas fa-location-crosshairs text-xl"></i>';
            },
            () => {
                alert('無法取得您的位置');
                document.getElementById('btn-my-location').innerHTML = '<i class="fas fa-location-crosshairs text-xl"></i>';
            }
        );
    });

    // --- Firebase 收藏功能邏輯 ---

    async function startApp() {
        try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }
        } catch (error) {
            console.error("Auth error:", error);
        }

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                if (unsubscribeFavorites) unsubscribeFavorites();
                const favRef = doc(db, 'artifacts', appId, 'users', user.uid, 'userdata', 'favorites');
                
                unsubscribeFavorites = onSnapshot(favRef, (docSnap) => {
                    if (docSnap.exists() && docSnap.data().spotIds) {
                        userFavorites = new Set(docSnap.data().spotIds);
                    } else {
                        userFavorites = new Set();
                    }
                    // 刷新畫面愛心狀態
                    filterSpots();
                    
                    // 同步更新詳細面板的愛心
                    const currentDetailTitle = document.getElementById('detail-title').innerText;
                    const activeSpot = allSpots.find(s => s.name === currentDetailTitle);
                    if(activeSpot) updateFavoriteUI(activeSpot.id);
                });
            }
        });
    }

    window.toggleFavorite = async function(spotId) {
        if (!currentUser) {
            alert("請先登入即可收藏景點！");
            return;
        }
        try {
            const favRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'userdata', 'favorites');
            let newFavs = Array.from(userFavorites);
            
            if (newFavs.includes(spotId)) {
                newFavs = newFavs.filter(id => id !== spotId);
            } else {
                newFavs.push(spotId);
            }
            
            await setDoc(favRef, { spotIds: newFavs }, { merge: true });
            
            // 樂觀更新 UI (Optimistic UI)
            if (userFavorites.has(spotId)) {
                userFavorites.delete(spotId);
            } else {
                userFavorites.add(spotId);
            }
            updateFavoriteUI(spotId);
            filterSpots();
            
        } catch (e) {
            console.error("更新收藏失敗", e);
        }
    };

    function updateFavoriteUI(spotId) {
        const isFav = userFavorites.has(spotId);
        
        // 更新詳細面板的按鈕
        const favBtn = document.getElementById('btn-favorite-spot');
        if (favBtn) {
            if (isFav) {
                favBtn.innerHTML = '<i class="fas fa-heart text-xl text-brand-accent scale-110 transition-transform"></i>';
            } else {
                favBtn.innerHTML = '<i class="far fa-heart text-xl transition-transform hover:scale-110"></i>';
            }
        }
    }

</script>
