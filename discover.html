<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>探索世界 - 旅圖製造所</title>
    <!-- === 防破圖路由守衛 === -->
    <script>
        if (!window.location.hash && window.location.pathname.endsWith('discover.html')) {
            window.location.replace('/#discover');
        }
    </script>

    <!-- Leaflet 資源 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        /* 確保容器填滿 index.html 的主內容區 */
        #map-wrapper {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background-color: #f3f4f6;
        }

        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 定位按鈕自訂樣式 */
        .locate-control {
            background: white;
            width: 44px;
            height: 44px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            cursor: pointer;
            border: none;
            transition: background-color 0.2s;
        }

        .locate-control:hover {
            background-color: #f4f4f4;
        }

        .locate-control svg {
            width: 24px;
            height: 24px;
            color: #4285F4; /* Google Blue */
        }

        /* 隱藏 Leaflet 預設屬性 */
        .leaflet-control-attribution {
            display: none;
        }
    </style>
</head>
<body class="m-0 p-0">

    <div id="map-wrapper">
        <!-- 地圖本體 -->
        <div id="map"></div>
    </div>

    <script>
        (function() {
            let map;
            let userMarker;

            function initMap() {
                // 如果已經有地圖實例則清除，避免 SPA 框架下的重複初始化錯誤
                if (map) {
                    map.remove();
                }

                // 1. 初始化地圖中心 (預設台灣)
                map = L.map('map', {
                    zoomControl: true
                }).setView([23.6978, 120.9605], 7);

                // 2. 載入 Google Maps 街道圖磚 (Roadmap)
                // 使用 Google 的圖磚伺服器：mt0, mt1, mt2, mt3
                L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
                    maxZoom: 20,
                    subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
                }).addTo(map);

                // 3. 加入自訂定位按鈕到地圖右上角
                const LocateControl = L.Control.extend({
                    options: { position: 'topright' },
                    onAdd: function() {
                        const btn = L.DomUtil.create('button', 'locate-control');
                        btn.innerHTML = `
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                            </svg>`;
                        btn.title = "我的位置";
                        btn.onclick = (e) => {
                            e.preventDefault();
                            e.stopPropagation();
                            handleGeolocation();
                        };
                        return btn;
                    }
                });
                map.addControl(new LocateControl());

                // 解決進入頁面時容器大小計算延遲導致的地圖破圖
                setTimeout(() => {
                    map.invalidateSize();
                }, 300);
            }

            // 定位邏輯
            function handleGeolocation() {
                if (!navigator.geolocation) {
                    alert("您的瀏覽器不支援地理定位");
                    return;
                }

                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const { latitude, longitude } = position.coords;
                        const latlng = [latitude, longitude];

                        // 視角移動
                        map.flyTo(latlng, 16, { duration: 1.5 });

                        // 更新定位點標記
                        if (userMarker) {
                            userMarker.setLatLng(latlng);
                        } else {
                            userMarker = L.circleMarker(latlng, {
                                radius: 8,
                                fillColor: '#4285F4',
                                color: '#fff',
                                weight: 3,
                                opacity: 1,
                                fillOpacity: 0.9
                            }).addTo(map);
                        }
                    },
                    (error) => {
                        console.error("定位出錯:", error);
                        alert("無法取得您的位置，請確認是否已開啟定位權限。");
                    }
                );
            }

            // 啟動地圖
            initMap();

        })();
    </script>
</body>
</html>
