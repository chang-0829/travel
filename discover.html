    .marker-pin i {

    .marker-pin:hover {

    window.showToast = function(msg) {

      document.getElementById('toast-msg').innerText = msg;
      el.classList.remove('opacity-0', '-translate-y-4', 'pointer-events-none');
      el.classList.add('opacity-100', 'translate-y-0');
      setTimeout(() => {
        el.classList.remove('opacity-100', 'translate-y-0');
        el.classList.add('opacity-0', '-translate-y-4', 'pointer-events-none');
      }, 3000);
    }

    const LOCATION_MODES = [

      { id: 'hotel', label: '住宿', icon: 'fa-solid fa-hotel' },
      { id: 'park', label: '樂園', icon: 'fa-solid fa-wand-magic-sparkles' },
      { id: 'car_rental', label: '租車站', icon: 'fa-solid fa-key' },
      { id: 'station', label: '車站', icon: 'fa-solid fa-train' },
      { id: 'airport', label: '機場', icon: 'fa-solid fa-plane-arrival' },
      { id: 'other', label: '其他', icon: 'fa-solid fa-location-dot' }
    ];

    // ========== 地圖初始化與控制 ==========
    let map = null;
    let markersLayer = null;
    let markersDict = {};
    let userMarker = null;
    let isFirstLoad = true;

    function initMap() {
        const streetLayer = L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
            attribution: '&copy; Google', maxZoom: 20, keepBuffer: 4, updateWhenIdle: true
        });

        map = L.map('map', { zoomControl: false, layers: [streetLayer] }).setView([23.5, 121], 13); 
        L.control.zoom({ position: 'topright' }).addTo(map);

        markersLayer = L.layerGroup().addTo(map);
        
        map.on('locationfound', function(e) {
            if (!userMarker) {
                const userIcon = L.divIcon({ className: 'user-marker', html: `<div class="w-5 h-5 bg-[#4285F4] rounded-full border-[3px] border-white shadow-[0_0_16px_rgba(66,133,244,0.6)]"></div>`, iconSize: [20, 20], iconAnchor: [10, 10] });
                userMarker = L.marker(e.latlng, { icon: userIcon, zIndexOffset: 1000 }).addTo(map);
            } else { userMarker.setLatLng(e.latlng); }
            document.querySelector('#btn-locate i').className = 'fa-solid fa-location-crosshairs text-[#4285F4]';
            window.showToast("已取得目前位置");
        });

        setTimeout(() => { map.invalidateSize(); }, 500);
    }
    
    window.locateUser = function() {
        document.querySelector('#btn-locate i').className = 'fa-solid fa-spinner fa-spin text-brand-primary';
        window.showToast("正在尋找您的位置...");
        map.locate({ setView: true, maxZoom: 16, enableHighAccuracy: true, timeout: 10000 });
    };

    function renderMarkersOnMap(spots) {
        markersLayer.clearLayers();
        markersDict = {};
        let validCoords = [];

        spots.forEach(spot => {
            if (spot.lat && spot.lng) {
                validCoords.push([spot.lat, spot.lng]);
                const locObj = LOCATION_MODES.find(m => m.id === spot.locMode) || LOCATION_MODES[0];
                
                const customIcon = L.divIcon({
                    className: 'custom-marker',
                    html: `<div class="marker-pin"><i class="${locObj.icon}"></i></div>`,
                    iconSize: [44, 44], iconAnchor: [22, 44], popupAnchor: [0, -44]
                });
                
                const marker = L.marker([spot.lat, spot.lng], { icon: customIcon });
                marker.on('click', () => { window.flyToSpot(spot.id); });
                markersLayer.addLayer(marker);
                markersDict[spot.id] = marker;
            }
        });

        if (isFirstLoad && validCoords.length > 0) {
            map.setView(validCoords[0], 14);
            isFirstLoad = false;
        }
    }

    window.flyToSpot = function(spotId) {
        const spot = publicSpots.find(s => s.id === spotId);
        if (!spot) return;

        if (spot.lat && spot.lng) {
            const isMobile = window.innerWidth < 768;
            let targetLat = spot.lat;
            if(isMobile) {
                targetLat = spot.lat - 0.003; 
            }
            map.flyTo([targetLat, spot.lng], 16, { duration: 1 });
        } else {
            window.showToast('這個景點尚未設定精確座標！但可以查看詳細資訊。');
        }
        
        window.showSpotDetail(spotId);
    };

    // ========== 手機版清單觸控拖曳 & 佈局切換 ==========
    const sheetPanel = document.getElementById('mobile-list-panel');
    const sheetHeader = document.getElementById('sheet-header');
    let dragStartY = null;
    let startHeight = 0;

    // 將清單切換為 水平滑動 (Horizontal) 或 垂直滑動 (Vertical)
    function applyListLayoutMode() {
        const list = document.getElementById('explore-list');
        const cards = document.querySelectorAll('.spot-card');
        
        if (window.innerWidth >= 768) {
             list.className = 'flex-1 overflow-y-auto overflow-x-hidden px-5 md:px-6 pb-8 pt-2 hide-scrollbar flex flex-col relative gap-3.5 min-h-0 transition-all';
             cards.forEach(c => { c.classList.remove('w-[85vw]', 'snap-start'); c.classList.add('w-full'); });
             return;
        }

        if (isListCollapsed) {
            // 切換為水平滑動模式 (最下方狀態)
            list.className = 'flex-1 overflow-x-auto overflow-y-hidden px-5 pb-4 pt-0 hide-scrollbar flex flex-row relative gap-3.5 min-h-0 snap-x snap-mandatory transition-all';
            cards.forEach(c => {
                c.classList.remove('w-full');
                c.classList.add('w-[85vw]', 'snap-start'); // 85vw 讓卡片維持完美比例且能看到下一個景點的邊緣
            });
            // 自動滾回最左側
            list.scrollTo({ left: 0, behavior: 'smooth' });
        } else {
            // 切換為垂直滑動模式 (半版/滿版狀態)
            list.className = 'flex-1 overflow-y-auto overflow-x-hidden px-5 pb-8 pt-2 hide-scrollbar flex flex-col relative gap-3.5 min-h-0 transition-all';
            cards.forEach(c => {
                c.classList.remove('w-[85vw]', 'snap-start');
                c.classList.add('w-full');
            });
        }
    }
    
    // 監聽螢幕旋轉/縮放以校正佈局
    window.addEventListener('resize', applyListLayoutMode);

    sheetHeader.addEventListener('touchstart', (e) => {
        if(window.innerWidth >= 768) return;
        dragStartY = e.touches[0].clientY;
        startHeight = sheetPanel.offsetHeight;
        sheetPanel.style.transition = 'none';
    }, {passive: true});

    sheetHeader.addEventListener('touchmove', (e) => {
        if(window.innerWidth >= 768 || dragStartY === null) return;
        const dy = dragStartY - e.touches[0].clientY;
        let newHeight = startHeight + dy;
        
        if (newHeight < window.innerHeight * 0.1) newHeight = window.innerHeight * 0.1;
        if (newHeight > window.innerHeight * 0.9) newHeight = window.innerHeight * 0.9;
        
        sheetPanel.style.height = `${newHeight}px`;
        document.getElementById('fab-group').style.bottom = `calc(${newHeight}px + 85px)`;
    }, {passive: true});

    sheetHeader.addEventListener('touchend', () => {
        if(window.innerWidth >= 768 || dragStartY === null) return;
        dragStartY = null;
        sheetPanel.style.transition = 'height 0.3s cubic-bezier(0.2, 0.8, 0.2, 1)';
        document.getElementById('fab-group').style.transition = 'bottom 0.3s cubic-bezier(0.2, 0.8, 0.2, 1)';
        
        const vh = window.innerHeight;
        const currentH = sheetPanel.offsetHeight;
        let targetHeight = '';
        
        if (currentH > vh * 0.6) {
            targetHeight = '85vh';
            isListCollapsed = false;
        } else if (currentH < vh * 0.35) {
            // 剛好容納標題區 + 一張橫向卡片的絕佳高度
            targetHeight = '180px'; 
            isListCollapsed = true;
        } else {
            targetHeight = '48vh';
            isListCollapsed = false;
        }
        
        sheetPanel.style.height = targetHeight;
        // 若為 180px (約底部)，定點位置剛好在卡片之上 265px，絕不會重疊卡片
        document.getElementById('fab-group').style.bottom = `calc(${targetHeight} + 85px)`;
        
        applyListLayoutMode();

        setTimeout(() => { document.getElementById('fab-group').style.transition = ''; }, 300);
    });

    // ========== 景點資訊面板邏輯 ==========
    window.showSpotDetail = function(spotId) {
        const spot = publicSpots.find(s => s.id === spotId);
        if (!spot) return;

        const locObj = LOCATION_MODES.find(m => m.id === spot.locMode) || LOCATION_MODES[0];

        const coverEl = document.getElementById('detail-cover-image');
        const defaultIconEl = document.getElementById('detail-default-icon');
        
        if (coverEl && defaultIconEl) {
            if (spot.imageUrl) {
                coverEl.style.backgroundImage = `url('${spot.imageUrl}')`;
                coverEl.classList.remove('opacity-0');
                defaultIconEl.classList.add('opacity-0');
            } else {
                coverEl.style.backgroundImage = 'none';
                coverEl.classList.add('opacity-0');
                defaultIconEl.className = `fa-solid ${locObj.icon} text-[120px] text-white/10 relative z-0 drop-shadow-2xl transition-opacity duration-300`;
                defaultIconEl.classList.remove('opacity-0');
            }
        }

        document.getElementById('detail-category').innerHTML = `<i class="${locObj.icon}"></i> ${locObj.label}`;
        document.getElementById('detail-name').innerText = spot.name;
        
        const foreign1 = spot.foreignName1;
        const foreign2 = spot.foreignName2;
        const foreignContainer = document.getElementById('detail-foreign-names');
        const f1El = document.getElementById('detail-foreign-1');
        const f2El = document.getElementById('detail-foreign-2');
        
        if (foreign1 || foreign2) {
            foreignContainer.classList.remove('hidden');
            foreignContainer.classList.add('flex');
            f1El.innerText = foreign1 || '';
            f1El.style.display = foreign1 ? 'block' : 'none';
            f2El.innerText = foreign2 || '';
            f2El.style.display = foreign2 ? 'block' : 'none';
        } else {
            foreignContainer.classList.add('hidden');
            foreignContainer.classList.remove('flex');
        }

        const displayAddress = spot.address || spot.subtitle || '無詳細地址備註';
        document.getElementById('detail-address').innerText = displayAddress;
        
        const descEl = document.getElementById('detail-desc');
        const descContainer = document.getElementById('detail-desc-container');
        if (spot.description) {
            descEl.innerHTML = spot.description.replace(/\n/g, '<br>');
            descContainer.classList.remove('hidden');
            descContainer.classList.add('flex');
        } else {
            descContainer.classList.add('hidden');
            descContainer.classList.remove('flex');
        }

        const navBtn = document.getElementById('circle-nav-btn');
        if (spot.lat && spot.lng) {
            navBtn.href = `https://www.google.com/maps/dir/?api=1&destination=${spot.lat},${spot.lng}`;
        } else {
            navBtn.href = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(displayAddress)}`;
        }

        const webBtn = document.getElementById('circle-web-btn');
        if (spot.website) {
            webBtn.href = spot.website;
            webBtn.classList.replace('hidden', 'flex');
        } else {
            webBtn.classList.replace('flex', 'hidden');
        }

        const phoneBtn = document.getElementById('circle-phone-btn');
        if (spot.phone) {
            phoneBtn.href = `tel:${spot.phone}`;
            phoneBtn.classList.replace('hidden', 'flex');
        } else {
            phoneBtn.classList.replace('flex', 'hidden');
        }

        updateFavoriteUI(spot.id);
        document.getElementById('btn-add-to-trip').onclick = () => window.showToast(`請至「我的行程」將「${spot.name}」排入行程表`);
        
        const favBtn = document.getElementById('btn-favorite-spot');
        favBtn.onclick = () => window.toggleFavorite(spot.id);

        document.getElementById('spot-detail-panel').classList.remove('translate-x-full');
    };

    window.closeSpotDetail = function() {
        document.getElementById('spot-detail-panel').classList.add('translate-x-full');
    };

    // ========== 收藏功能邏輯 ==========

    function listenToFavorites(userId) {
        const favRef = collection(db, 'artifacts', appId, 'users', userId, 'favorites');
        onSnapshot(favRef, (snapshot) => {
            userFavorites = new Set(snapshot.docs.map(doc => doc.id));
            publicSpots.forEach(spot => updateFavoriteUI(spot.id));
        });
    }

    function updateFavoriteUI(spotId) {
        const isFav = userFavorites.has(spotId);

        const favBtn = document.getElementById('btn-favorite-spot');
        if(favBtn) {
           const icon = favBtn.querySelector('i');
           if (isFav) {
               icon.className = 'fa-solid fa-heart text-[#E63946]';
               favBtn.classList.add('border-[#E63946]/30', 'bg-[#FFE5E5]');
               favBtn.classList.remove('bg-white');
           } else {
               icon.className = 'fa-regular fa-heart';
               favBtn.classList.remove('border-[#E63946]/30', 'bg-[#FFE5E5]');
               favBtn.classList.add('bg-white');
           }
        }

        const listFavBtnIcon = document.querySelector(`#list-fav-btn-${spotId} i`);
        if (listFavBtnIcon) {
            // 將按鈕大小從 text-[22px] 改為 text-[18px]
            if (isFav) {
                listFavBtnIcon.className = 'fa-solid fa-heart text-[#E63946] text-[18px] transition-transform active:scale-90';
            } else {
                listFavBtnIcon.className = 'fa-regular fa-heart text-brand-textSub text-[18px] transition-transform active:scale-90';
            }
        }
    }

    // 針對單一景點即時更新畫面上的收藏數字
    function updateFavoriteCountUI(spotId) {
        const spot = publicSpots.find(s => s.id === spotId);
        if (!spot) return;
        const countEls = document.querySelectorAll(`.fav-count-${spotId}`);
        countEls.forEach(el => el.innerText = spot.favoriteCount || 0);
    }

    window.toggleFavorite = async function(spotId) {
        // 【1. 判斷未登錄限制收藏】
        if (isGuest || !currentUser) { 
            window.showToast("請先登入後才能使用收藏功能"); 
            return; 
        }

        const isFav = userFavorites.has(spotId);
        const spot = publicSpots.find(s => s.id === spotId);
        
        // 【即時樂觀更新 (Optimistic Update)】：立刻反映在畫面上
        if (isFav) {
            userFavorites.delete(spotId);
            if (spot) spot.favoriteCount = Math.max(0, (spot.favoriteCount || 0) - 1);
        } else {
            userFavorites.add(spotId);
            if (spot) spot.favoriteCount = (spot.favoriteCount || 0) + 1;
        }
        
        updateFavoriteUI(spotId);
        updateFavoriteCountUI(spotId);

        try {
            // 更新個人的收藏清單
            const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'favorites', spotId);
            if (isFav) {
                await deleteDoc(docRef);
            } else {
                await setDoc(docRef, { timestamp: Date.now() });
                window.showToast("已收藏景點！");
            }

            // 同時更新公開景點庫的總收藏數，讓所有人都能看到
            if (spot) {
                const spotRef = doc(db, 'artifacts', appId, 'public', 'data', 'spots', spotId);
                await updateDoc(spotRef, { favoriteCount: spot.favoriteCount });
            }

        } catch (e) {
            console.error("更新收藏失敗:", e);
        }
    };

    // ========== 資料載入 ==========
    function loadSpots() {
      const qSpots = collection(db, 'artifacts', appId, 'public', 'data', 'spots');
      onSnapshot(qSpots, (snapshot) => {
        publicSpots = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderListAndMap(document.getElementById('input-explore-search').value);
      });
    }

    function renderListAndMap(filter = '') {
      const container = document.getElementById('explore-list');
      let spots = publicSpots;
      if (filter) {
          const kw = filter.toLowerCase();
          spots = spots.filter(s => (s.name || '').toLowerCase().includes(kw) || (s.address || s.subtitle || '').toLowerCase().includes(kw));
      }

      if (map) renderMarkersOnMap(spots);

      if (spots.length === 0) {
          container.innerHTML = `
            <div class="h-full w-full flex flex-col items-center justify-center text-center text-brand-textSub opacity-60 pb-10 m-auto shrink-0">
               <div class="w-16 h-16 bg-brand-bg rounded-full flex items-center justify-center mb-4">
                  <i class="fa-solid fa-map-location-dot text-2xl text-brand-primary"></i>
               </div>
               <p class="font-extrabold text-[15px]">未找到相關景點</p>
               <p class="text-[12px] font-bold mt-1">請嘗試其他關鍵字</p>
            </div>`;
          return;
      }

      container.innerHTML = [...spots].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)).map(spot => {
          const locObj = LOCATION_MODES.find(m => m.id === spot.locMode) || LOCATION_MODES[0];
          
          const thumbnailHtml = spot.imageUrl
              ? `<img src="${spot.imageUrl}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" alt="${spot.name}">`
              : `<div class="w-full h-full flex items-center justify-center bg-gradient-to-br from-brand-primary/10 to-brand-dark/10 text-brand-primary"><i class="${locObj.icon} text-[26px] drop-shadow-sm"></i></div>`;

          const isFav = userFavorites.has(spot.id);
          const favIconClass = isFav ? 'fa-solid fa-heart text-[#E63946]' : 'fa-regular fa-heart text-brand-textSub';

          // 加入 spot-card 與 shrink-0 類別確保卡片排版穩定
          return `
          <div onclick="window.flyToSpot('${spot.id}')" class="spot-card w-full shrink-0 bg-white p-3.5 rounded-[28px] border border-brand-light/60 shadow-[0_4px_20px_rgba(0,0,0,0.03)] flex items-center gap-4 cursor-pointer hover:shadow-[0_12px_32px_rgba(0,0,0,0.08)] hover:border-brand-primary/30 hover:-translate-y-1 active:scale-95 transition-all group overflow-hidden relative">
             
             <!-- 縮圖 -->
             <div class="w-[88px] h-[88px] rounded-[20px] bg-brand-bg shrink-0 shadow-inner relative overflow-hidden border border-brand-light/50">
                 ${thumbnailHtml}
             </div>
             
             <!-- 資訊區塊 -->
             <div class="flex-1 flex flex-col justify-center py-1 pr-10 min-w-0">
                <div class="flex items-center gap-2 mb-1.5">
                   <span class="px-2.5 py-0.5 rounded-md bg-brand-primary/10 text-brand-primary text-[10px] font-extrabold tracking-wider border border-brand-primary/10">${locObj.label}</span>
                   <!-- 綁定專屬的數字 Class 以便立即更新 -->
                   <div class="flex items-center gap-1 text-[11px] font-bold text-brand-textSub">
                       <i class="fa-solid fa-heart text-[#E63946] opacity-70"></i>
                       <span class="fav-count-${spot.id}">${spot.favoriteCount || 0}</span>
                   </div>
                </div>
                <div class="text-[16px] font-extrabold text-brand-dark truncate leading-tight group-hover:text-brand-primary transition-colors">${spot.name}</div>
             </div>
             
             <!-- 列表快速收藏按鈕 (調整大小 text-[18px]) -->
             <div class="absolute right-4 top-1/2 -translate-y-1/2 z-10">
                <button id="list-fav-btn-${spot.id}" onclick="event.stopPropagation(); window.toggleFavorite('${spot.id}')" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-brand-bg transition-colors">
                    <i class="${favIconClass} text-[18px] transition-transform active:scale-90"></i>
                </button>
             </div>
          </div>`;
      }).join('');

      // 重新生成清單後，確保卡片的佈局符合目前的面板高低模式
      applyListLayoutMode();
    }

    document.getElementById('input-explore-search').addEventListener('input', (e) => renderListAndMap(e.target.value));

    async function startApp() {
        try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await signInWithCustomToken(auth, __initial_auth_token);
            else await signInAnonymously(auth);
        } catch (e) {}
        initMap(); loadSpots();
    }

    startApp();
  </script>
</body>
</html>
