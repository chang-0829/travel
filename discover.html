<style>
    /* 舊版自訂字體 */
    @font-face {
        font-family: 'GenJyuuGothic';
        src: url('https://cdn.jsdelivr.net/gh/tsengpenghsiang/genjyuugothic/GenJyuuGothic-Regular.woff2') format('woff2');
        font-weight: normal;
        font-style: normal;
    }
    @font-face {
        font-family: 'GenJyuuGothic';
        src: url('https://cdn.jsdelivr.net/gh/tsengpenghsiang/genjyuugothic/GenJyuuGothic-Bold.woff2') format('woff2');
        font-weight: bold;
        font-style: normal;
    }

    #discover-page-root {
        font-family: 'GenJyuuGothic', 'Microsoft JhengHei', sans-serif;
    }

    .hide-scrollbar::-webkit-scrollbar {
        display: none;
    }
    .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
    }

    /* 舊版：修正 Leaflet 預設樣式 */
    .leaflet-container {
        font-family: 'GenJyuuGothic', 'Microsoft JhengHei', sans-serif;
    }
    .leaflet-popup-content-wrapper {
        border-radius: 1rem;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .leaflet-popup-content {
        margin: 16px;
    }

    /* 舊版：自訂地圖圖示 */
    .custom-marker-wrapper {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        background-color: white;
        border-radius: 50%;
        box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        border: 2px solid #748CAB; /* brand-primary */
        color: #748CAB; /* brand-primary */
        transition: transform 0.2s, background-color 0.2s, color 0.2s;
    }
    .custom-marker-wrapper:hover {
        transform: scale(1.1);
        background-color: #748CAB; /* brand-primary */
        color: white;
    }
    
    .custom-marker-wrapper.user-location {
        border-color: #3E5C76; /* brand-dark */
        color: #3E5C76;
    }
    .custom-marker-wrapper.user-location:hover {
        background-color: #3E5C76;
    }

    /* 動畫 */
    .animate-pulse-slow {
        animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: .7; transform: scale(1.05); }
    }
    
    .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
</style>

<div id="discover-page-root" class="h-full relative overflow-hidden bg-[#F2F5F8]"> <!-- bg-brand-bg -->

    <!-- ========================================== -->

    <!-- 舊版：側邊/底部景點詳細資訊面板 -->
    <!-- 手機版 Bottom Sheet，電腦版 Right Panel -->
    <div id="spot-detail-panel" class="absolute inset-x-0 bottom-0 md:inset-y-0 md:right-0 md:left-auto md:w-[400px] bg-white shadow-[0_-10px_40px_rgba(0,0,0,0.1)] md:shadow-2xl z-[1000] transform translate-y-full md:translate-y-0 md:translate-x-full transition-transform duration-300 flex flex-col rounded-t-3xl md:rounded-none h-[80%] md:h-full pb-safe">
        
        <!-- 手機版拖曳條 -->
        <div class="w-full flex justify-center py-3 md:hidden shrink-0 cursor-pointer" onclick="window.closeSpotDetail()">
            <div class="w-12 h-1.5 bg-[#E6EBEF] rounded-full"></div> <!-- bg-brand-light -->

        <!-- 景點圖片 -->
        <div class="relative h-48 md:h-64 shrink-0 w-full bg-[#E6EBEF]"> <!-- bg-brand-light -->
            <img id="spot-detail-img" src="" alt="景點預覽" class="w-full h-full object-cover">
            
            <!-- 電腦版關閉按鈕 -->
            <button onclick="window.closeSpotDetail()" class="hidden md:flex absolute top-4 right-4 w-8 h-8 bg-black/40 text-white rounded-full items-center justify-center hover:bg-black/60 transition-colors z-10 focus:outline-none">

        <!-- 內容區與操作 -->
        <div class="flex-1 overflow-y-auto relative bg-white">
            
            <!-- 懸浮圓形收藏按鈕 (FAB) -->
            <button id="btn-favorite-spot" class="absolute right-5 -top-6 w-12 h-12 bg-white rounded-full shadow-[0_4px_12px_rgba(0,0,0,0.15)] flex items-center justify-center text-gray-300 text-xl z-10 hover:scale-110 transition-transform focus:outline-none">
                <i id="fav-icon-inner" class="fas fa-heart"></i>
            </button>

            <div class="p-5 md:p-6 pb-2">
                <!-- 標題與評價 -->
                <h2 id="spot-detail-title" class="text-2xl font-bold text-[#2C3E50] mb-1">載入中...</h2> <!-- text-brand-textMain -->
                <div class="flex items-center text-sm text-[#8796A5] mb-4"> <!-- text-brand-textSub -->

                    <a id="circle-web-btn" target="_blank" class="flex flex-col items-center group cursor-pointer">

                <!-- 資訊列表 -->
                <div class="space-y-4 pb-12">

<!-- === 核心邏輯腳本 === -->
<script type="module">
    import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const fallbackConfig = {
        apiKey: "AIzaSyCQF8A3ieML0JP3X8X78NCRuiUETRAiu5E",
        authDomain: "travel-96009.firebaseapp.com",
        projectId: "travel-96009",
        storageBucket: "travel-96009.firebasestorage.app",
        messagingSenderId: "578860064042",
        appId: "1:578860064042:web:b147880df3a01dd8f75253"
    };
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : fallbackConfig;
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'travel-app';

    const app = !getApps().length ? initializeApp(firebaseConfig) : getApp();
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let allSpots = [];
    let userFavorites = new Set();
    let mapInstance = null;
    let markersLayer = null;

    // --- 1. 初始化 Leaflet 地圖 (純粹還原舊版) ---
    function initMap() {
        const checkL = setInterval(() => {
            if (typeof L !== 'undefined') {
                const mapEl = document.getElementById('full-screen-map');
                if (!mapEl || mapEl._leaflet_id) return;
                clearInterval(checkL);

                // 舊版設定：CartoDB Voyager 圖磚、有關閉預設縮放的設定
                mapInstance = L.map('full-screen-map', { zoomControl: false }).setView([23.5, 121], 6);

                L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                    maxZoom: 19
                }).addTo(mapInstance);

                L.control.zoom({ position: 'bottomright' }).addTo(mapInstance);
                markersLayer = L.layerGroup().addTo(mapInstance);

                if (allSpots.length > 0) renderMapMarkers();

                // 隱藏載入遮罩
                const loader = document.getElementById('loading-overlay');
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.style.display = 'none', 500);
                }
                
                // 強制重繪地圖，解決灰頻問題
                setTimeout(() => mapInstance.invalidateSize(), 300);
            }
        }, 100);
    }

    // --- 2. Firebase 資料載入 ---
    const initAuth = async () => {
        try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth).catch(() => console.warn("以訪客模式瀏覽。"));
            }
        } catch (error) { 
            console.warn("Auth Error:", error.message); 
        }
    };
    initAuth();

    onAuthStateChanged(auth, (user) => {
        currentUser = user;
        loadPublicSpots();
        if (user) loadUserFavorites();
    });

    function useLocalDefaultSpots() {
        // 完全使用您舊版的假資料
        allSpots = [
            { id: 'spot_1', name: "台北 101", lat: 25.0339, lng: 121.5644, rating: 4.8, address: "台北市信義區信義路五段7號", desc: "台灣最具代表性的摩天大樓，觀景台可俯瞰整個台北市。", img: "https://images.unsplash.com/photo-1552993873-0aa1140e7041?q=80&w=800", phone: "02-8101-8800", website: "https://www.taipei-101.com.tw/" },
            { id: 'spot_2', name: "淺草寺", lat: 35.7147, lng: 139.7966, rating: 4.7, address: "日本東京都台東區淺草二丁目", desc: "東京歷史最悠久的寺廟，著名的「雷門」燈籠是必拍景點。", img: "https://images.unsplash.com/photo-1532236204992-f5e85c0142ce?q=80&w=800", phone: "+81-3-3842-0181", website: "https://www.senso-ji.jp/" },
            { id: 'spot_3', name: "玉山國家公園", lat: 23.4699, lng: 120.9572, rating: 4.9, address: "台灣南投縣信義鄉", desc: "台灣面積最大的國家公園，擁有豐富的自然生態與高山景觀。", img: "https://images.unsplash.com/photo-1578637387939-43c525550085?q=80&w=800", phone: "049-277-3121", website: "" }
        ];
        renderMapMarkers();
        initMap(); // 確保地圖有被初始化
    }

    // 💡 強化版的資料讀取：使用 getDocs 先嘗試一次，失敗就立刻退回預設資料，不讓畫面卡住
    async function loadPublicSpots() {
        const isLocalEnv = typeof __firebase_config === 'undefined';
        const spotsCollection = isLocalEnv ? collection(db, 'spots') : collection(db, 'artifacts', appId, 'public', 'data', 'spots');

        try {
            const snapshot = await getDocs(spotsCollection);
            if (snapshot.empty && allSpots.length === 0) {
                useLocalDefaultSpots();
            } else {
                allSpots = snapshot.docs.map(doc => {
                    const data = doc.data();
                    return {
                        id: doc.id,
                        name: data.name || '未知景點',
                        lat: data.lat || data.latitude,
                        lng: data.lng || data.longitude,
                        rating: data.rating || 4.5,
                        address: data.address || '',
                        desc: data.desc || data.description || '',
                        img: data.img || data.image || data.imageUrl || 'https://via.placeholder.com/800x600',
                        phone: data.phone || '',
                        website: data.website || ''
                    };
                });
                allSpots = allSpots.filter(s => s.lat && s.lng);
                renderMapMarkers();
                initMap();
                
                // 順便掛上監聽
                onSnapshot(spotsCollection, () => {}); 
            }
        } catch (error) {
            console.warn("Firestore 讀取被阻擋，切換為本地預設景點");
            useLocalDefaultSpots();
        }
    }

    function loadUserFavorites() {
        if (!currentUser) return;
        const isLocalEnv = typeof __firebase_config === 'undefined';
        const favRef = isLocalEnv 
            ? collection(db, 'users', currentUser.uid, 'favorites') 
            : collection(db, 'artifacts', appId, 'users', currentUser.uid, 'favorites');

        onSnapshot(favRef, (snapshot) => {
            userFavorites = new Set(snapshot.docs.map(doc => doc.id));
            if (window.currentOpenSpotId) updateFavoriteUI(window.currentOpenSpotId);
        }, () => {
             console.warn("無法即時讀取收藏");
        });
    }

    function renderMapMarkers() {
        if (!mapInstance || !markersLayer) return;
        markersLayer.clearLayers();

        allSpots.forEach(spot => {
            // 舊版圖標邏輯
            const iconHtml = `<div class="custom-marker-wrapper"><i class="${(spot.name||'').includes('山') ? 'fas fa-mountain' : 'fas fa-camera'}"></i></div>`;
            const customIcon = L.divIcon({ 
                className: '', 
                html: iconHtml, 
                iconSize: [36, 36], 
                iconAnchor: [18, 36] // 舊版的錨點設定
            });
            
            const marker = L.marker([spot.lat, spot.lng], { icon: customIcon }).addTo(markersLayer);
            marker.on('click', () => window.openSpotDetail(spot));
        });
    }

    // --- 3. UI 互動邏輯 (完全還原舊版) ---
    window.openSpotDetail = function(spot) {
        window.currentOpenSpotId = spot.id;

        document.getElementById('spot-detail-title').textContent = spot.name;
        document.getElementById('spot-detail-address').textContent = spot.address;
        document.getElementById('spot-detail-desc').textContent = spot.desc;
        document.getElementById('spot-detail-rating').textContent = spot.rating || '4.0';
        document.getElementById('spot-detail-img').src = spot.img || 'https://via.placeholder.com/800x600';

        const navBtn = document.getElementById('circle-nav-btn');
        if (spot.lat && spot.lng) {
            navBtn.href = `https://www.google.com/maps/dir/?api=1&destination=${spot.lat},${spot.lng}`;
        } else {
            navBtn.href = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(spot.address || spot.name)}`;
        }

        const webBtn = document.getElementById('circle-web-btn');
        if (spot.website) { webBtn.href = spot.website; webBtn.style.display = 'flex'; } 
        else { webBtn.style.display = 'none'; }

        const phoneBtn = document.getElementById('circle-phone-btn');
        if (spot.phone) { phoneBtn.href = `tel:${spot.phone}`; phoneBtn.style.display = 'flex'; } 
        else { phoneBtn.style.display = 'none'; }

        updateFavoriteUI(spot.id);

        const favBtn = document.getElementById('btn-favorite-spot');
        favBtn.onclick = () => window.toggleFavorite(spot.id);

        // 舊版的展開邏輯
        document.getElementById('spot-detail-panel').classList.remove('translate-y-full', 'md:translate-x-full');
        document.getElementById('spot-detail-panel').classList.add('translate-y-0', 'md:translate-x-0');
    };

    window.closeSpotDetail = function() {
        window.currentOpenSpotId = null;
        document.getElementById('spot-detail-panel').classList.add('translate-y-full', 'md:translate-x-full');
        document.getElementById('spot-detail-panel').classList.remove('translate-y-0', 'md:translate-x-0');
    };

    window.toggleFavorite = async function(spotId) {
        if (!currentUser) {
            alert("請先前往登入頁面，即可使用收藏！");
            return;
        }
        
        const isLocalEnv = typeof __firebase_config === 'undefined';
        const favDocRef = isLocalEnv 
            ? doc(db, 'users', currentUser.uid, 'favorites', spotId)
            : doc(db, 'artifacts', appId, 'users', currentUser.uid, 'favorites', spotId);

        try {
            if (userFavorites.has(spotId)) {
                await deleteDoc(favDocRef);
            } else {
                await setDoc(favDocRef, { savedAt: new Date().toISOString() });
            }
        } catch (error) {
            console.error("更新收藏失敗:", error);
        }
    };

    function updateFavoriteUI(spotId) {
        const favIcon = document.getElementById('fav-icon-inner');
        if (!favIcon) return;

        if (userFavorites.has(spotId)) {
            favIcon.classList.remove('text-gray-300');
            favIcon.classList.add('text-red-500');
        } else {
            favIcon.classList.remove('text-red-500');
            favIcon.classList.add('text-gray-300');
        }
    }
</script>
