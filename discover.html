<!-- ========================================== -->
<!-- 探索地圖 (discover.html) - 地圖基礎版 -->
<!-- ⚠️ 注意：此檔案由 index.html 動態載入，不需 head/body 標籤 -->
<!-- ========================================== -->

<!-- 將所有內容包在一個 div 內，確保 DOMParser 正確解析在 body 中 -->
<div>
    <!-- === 防破圖路由守衛 === -->
    <script>
        if (!window.location.hash && window.location.pathname.endsWith('discover.html')) {
            window.location.replace('/#discover');
        }
    </script>

    <style>
        /* 確保容器填滿 index.html 分配的主內容區，並完美避開側邊欄 */
        #map-wrapper {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100vh; /* 確保有足夠高度 */
            background-color: #f3f4f6;
            z-index: 0;
        }

        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 定位按鈕自訂樣式 */
        .locate-control {
            background: white;
            width: 44px;
            height: 44px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            cursor: pointer;
            border: none;
            transition: background-color 0.2s;
        }

        .locate-control:hover {
            background-color: #f4f4f4;
        }

        .locate-control svg {
            width: 24px;
            height: 24px;
            color: #4285F4; /* Google Blue */
        }

        /* 隱藏 Leaflet 預設屬性浮水印 */
        .leaflet-control-attribution {
            display: none !important;
        }
        
        /* 微調預設縮放按鈕位置 */
        .leaflet-top.leaflet-left {
            margin-top: 10px;
            margin-left: 10px;
        }
    </style>

    <div id="map-wrapper">
        <!-- 地圖本體 -->
        <div id="map"></div>
    </div>

    <script>
        (function() {
            // 1. 動態強制注入 Leaflet CSS (解決破圖無樣式的核心關鍵)
            if (!document.getElementById('leaflet-css')) {
                const link = document.createElement('link');
                link.id = 'leaflet-css';
                link.rel = 'stylesheet';
                link.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
                document.head.appendChild(link);
            }

            // 2. 動態強制注入 Leaflet JS
            if (!document.getElementById('leaflet-js')) {
                const script = document.createElement('script');
                script.id = 'leaflet-js';
                script.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
                document.head.appendChild(script);
            }

            let map;

            // 3. 持續檢查 Leaflet 是否載入完成，完成後才初始化地圖
            let checkLeaflet = setInterval(() => {
                if (window.L) {
                    clearInterval(checkLeaflet);
                    initMap();
                }
            }, 100);

            function initMap() {
                // 如果已經有地圖實例則清除，避免 SPA 框架下來回切換導致的重複初始化錯誤
                if (window.discoverMapInstance) {
                    window.discoverMapInstance.remove();
                }

                // 初始化地圖中心 (預設台灣)
                map = L.map('map', {
                    zoomControl: false // 先關閉預設，稍後手動加入以調整位置
                }).setView([23.6978, 120.9605], 7);
                
                // 把實例存到全域，方便下次進來時清除
                window.discoverMapInstance = map;

                // 重新加入縮放按鈕
                L.control.zoom({ position: 'topleft' }).addTo(map);

                // 載入 Google Maps 街道圖磚 (Roadmap)
                L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
                    maxZoom: 20,
                    subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
                }).addTo(map);

                // 加入自訂定位按鈕到地圖右上角
                const LocateControl = L.Control.extend({
                    options: { position: 'topright' },
                    onAdd: function() {
                        const btn = L.DomUtil.create('button', 'locate-control');
                        btn.style.marginTop = '10px';
                        btn.style.marginRight = '10px';
                        btn.innerHTML = `
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                            </svg>`;
                        btn.title = "我的位置";
                        btn.onclick = (e) => {
                            e.preventDefault();
                            e.stopPropagation();
                            handleGeolocation();
                        };
                        return btn;
                    }
                });
                map.addControl(new LocateControl());

                // 解決進入頁面時容器大小計算延遲導致的地圖破圖 (灰畫面)
                setTimeout(() => {
                    map.invalidateSize();
                }, 500);
            }

            // 定位邏輯
            function handleGeolocation() {
                if (!navigator.geolocation) {
                    alert("您的瀏覽器不支援地理定位");
                    return;
                }

                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const { latitude, longitude } = position.coords;
                        const latlng = [latitude, longitude];

                        // 視角移動 (放大至 level 16)
                        map.flyTo(latlng, 16, { duration: 1.5 });

                        // 更新定位點標記
                        if (window.userMarker) {
                            window.userMarker.setLatLng(latlng);
                        } else {
                            window.userMarker = L.circleMarker(latlng, {
                                radius: 8,
                                fillColor: '#4285F4',
                                color: '#fff',
                                weight: 3,
                                opacity: 1,
                                fillOpacity: 0.9
                            }).addTo(map);
                        }
                    },
                    (error) => {
                        console.error("定位出錯:", error);
                        alert("無法取得您的位置，請確認是否已開啟裝置的定位權限。");
                    }
                );
            }
        })();
    </script>
</div>
