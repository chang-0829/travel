<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>趣旅行 - 探索</title>
  <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)">
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  <script>tailwind.config={theme:{extend:{colors:{brand:{primary:'#748CAB',dark:'#3E5C76',light:'#E6EBEF',bg:'#F2F5F8',card:'#FFFFFF',textMain:'#2C3E50',textSub:'#8796A5'}}}}}</script>
  <style>
    body { font-family: ui-sans-serif, system-ui, sans-serif; background-color: #F2F5F8; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .pb-safe { padding-bottom: max(12px, env(safe-area-inset-bottom)); }
    .pt-safe { padding-top: max(16px, env(safe-area-inset-top)); }
  </style>
</head>
<body class="text-brand-textMain antialiased overflow-hidden">
  <div class="max-w-md mx-auto h-[100dvh] bg-brand-bg shadow-xl relative flex flex-col">
    <!-- Header -->
    <header class="bg-brand-bg pt-safe pb-4 px-6 shrink-0 flex justify-between items-end border-b border-brand-light z-10">
      <div>
        <p class="text-sm font-bold text-brand-primary mb-1 uppercase tracking-widest mt-2">Discover</p>
        <h1 class="text-3xl font-extrabold text-brand-dark tracking-tight">探索景點</h1>
      </div>
    </header>

    <!-- View: Explore -->
    <div class="flex-1 flex flex-col bg-brand-bg relative overflow-hidden">
       <div class="px-6 pt-4 pb-2 shrink-0 bg-brand-bg z-10">
          <div class="relative">
             <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-brand-textSub"></i>
             <input type="text" id="input-explore-search" placeholder="搜尋大家建立的景點..." class="w-full bg-white rounded-2xl py-3 pl-11 pr-4 shadow-sm border border-brand-light/80 outline-none focus:border-brand-primary/50 transition-all text-[15px] font-bold text-brand-dark">
          </div>
       </div>
       <div id="explore-list" class="flex-1 overflow-y-auto px-6 py-4 hide-scrollbar space-y-3 pb-24">
          <!-- 列表 -->
       </div>
    </div>

    <!-- 底部導覽列 -->
    <nav class="bg-white border-t border-brand-light shrink-0 z-40 pb-safe shadow-[0_-4px_20px_rgba(0,0,0,0.02)]">
      <div class="flex justify-around items-center h-[65px]">
        <a href="./index.html" class="flex flex-col items-center justify-center w-full h-full text-brand-textSub hover:text-brand-primary transition-colors">
          <i class="fa-solid fa-house mb-1 text-[18px]"></i><span class="text-[10px] font-bold">首頁</span>
        </a>
        <a href="./discover.html" class="flex flex-col items-center justify-center w-full h-full text-brand-primary transition-colors">
          <i class="fa-solid fa-earth-americas mb-1 text-[18px]"></i><span class="text-[10px] font-bold">探索</span>
        </a>
        <a href="./mytrip.html" class="flex flex-col items-center justify-center w-full h-full text-brand-textSub hover:text-brand-primary transition-colors">
          <i class="fa-solid fa-suitcase-rolling mb-1 text-[18px]"></i><span class="text-[10px] font-bold">行程</span>
        </a>
        <a href="./account.html" class="flex flex-col items-center justify-center w-full h-full text-brand-textSub hover:text-brand-primary transition-colors">
          <i class="fa-solid fa-user mb-1 text-[18px]"></i><span class="text-[10px] font-bold">會員</span>
        </a>
      </div>
    </nav>
  </div>

  <script type="module">
    import { initializeApp } from '[https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js](https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js)';
    import { getFirestore, collection, onSnapshot } from '[https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js](https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js)';

    const firebaseConfig = { apiKey: "AIza...", authDomain: "...", projectId: "...", storageBucket: "...", messagingSenderId: "...", appId: "..." };
    const app = initializeApp(firebaseConfig); const db = getFirestore(app); const appId = "travel-platform-v2";
    
    let publicSpots = [];
    const isGuest = localStorage.getItem('isGuest') === 'true';

    function loadSpots() {
      if (isGuest) {
        const localSpots = localStorage.getItem('guest_spots');
        publicSpots = localSpots ? JSON.parse(localSpots) : []; renderList();
      } else {
        onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'spots'), (snapshot) => {
          publicSpots = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })); renderList();
        });
      }
    }

    function renderList(filter = '') {
      const container = document.getElementById('explore-list');
      let spots = publicSpots;
      if(filter) { const kw = filter.toLowerCase(); spots = spots.filter(s => (s.name||'').toLowerCase().includes(kw)); }
      
      container.innerHTML = spots.sort((a,b) => (b.createdAt || 0) - (a.createdAt || 0)).map(spot => `
        <div class="bg-white p-4 rounded-[20px] border border-brand-light shadow-sm flex items-center gap-3">
           <div class="w-12 h-12 rounded-full bg-brand-bg text-brand-primary flex items-center justify-center text-xl shrink-0"><i class="fa-solid fa-location-dot"></i></div>
           <div class="flex-1 overflow-hidden">
              <div class="text-[16px] font-extrabold text-brand-dark truncate">${spot.name}</div>
              <div class="text-[12px] font-bold text-brand-textSub mt-0.5 truncate">${spot.subtitle || ''}</div>
           </div>
        </div>
      `).join('');
    }

    document.getElementById('input-explore-search').addEventListener('input', (e) => renderList(e.target.value));
    loadSpots();
  </script>
</body>
</html>
