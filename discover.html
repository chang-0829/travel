  <!-- Firebase / 邏輯 -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
    import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc, getDoc } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

    // Firebase Config
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { 
      apiKey: "AIzaSyCQF8A3ieML0JP3X8X78NCRuiUETRAiu5E", 
      authDomain: "travel-96009.firebaseapp.com", 
      projectId: "travel-96009", 
      storageBucket: "travel-96009.firebasestorage.app", 
      messagingSenderId: "578860064042", 
      appId: "1:578860064042:web:b147880df3a01dd8f75253" 
    };
    const app = initializeApp(firebaseConfig); 
    const auth = getAuth(app);
    const db = getFirestore(app); 
    const appId = typeof __app_id !== 'undefined' ? __app_id : "travel-platform-v2";

    // 狀態管理
    let currentUser = null;
    let publicSpots = [];
    let userFavorites = new Set();
    const isGuest = localStorage.getItem('isGuest') === 'true';

    // 監聽登入與資料初始化
    onAuthStateChanged(auth, user => { 
        currentUser = user; 
        if (user && !isGuest) {
            listenToFavorites(user.uid);
        }
    });

    // Toast 顯示
    window.showToast = function(msg) {
      const el = document.getElementById('toast');
      document.getElementById('toast-msg').innerText = msg;
      el.classList.remove('opacity-0', '-translate-y-4', 'pointer-events-none');
      el.classList.add('opacity-100', 'translate-y-0');
      setTimeout(() => {
        el.classList.remove('opacity-100', 'translate-y-0');
        el.classList.add('opacity-0', '-translate-y-4', 'pointer-events-none');
      }, 3000);
    }

    const LOCATION_MODES = [
      { id: 'spot', label: '景點', icon: 'fa-solid fa-camera' },
      { id: 'food', label: '美食', icon: 'fa-solid fa-utensils' },
      { id: 'shop', label: '購物', icon: 'fa-solid fa-bag-shopping' },
      { id: 'hotel', label: '住宿', icon: 'fa-solid fa-hotel' },
      { id: 'park', label: '樂園', icon: 'fa-solid fa-wand-magic-sparkles' },
      { id: 'car_rental', label: '租車站', icon: 'fa-solid fa-key' },
      { id: 'station', label: '車站', icon: 'fa-solid fa-train' },
      { id: 'airport', label: '機場', icon: 'fa-solid fa-plane-arrival' },
      { id: 'other', label: '其他', icon: 'fa-solid fa-location-dot' }
    ];

    // ========== 地圖與 Marker 控制 ==========
    let map = null;
    let markersLayer = null;
    let markersDict = {};
    let userMarker = null;

    function initMap() {
        const streetLayer = L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
            attribution: '&copy; Google', maxZoom: 20, keepBuffer: 4, updateWhenIdle: true
        });
        const satelliteLayer = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
            attribution: '&copy; Google', maxZoom: 20, keepBuffer: 4, updateWhenIdle: true
        });

        map = L.map('map', { zoomControl: false, layers: [streetLayer] }).setView([23.5, 121], 6); 
        L.control.layers({ "街道圖": streetLayer, "衛星圖": satelliteLayer }, null, { position: 'topright' }).addTo(map);
        L.control.zoom({ position: 'topright' }).addTo(map);

        markersLayer = L.layerGroup().addTo(map);
        
        map.on('locationfound', function(e) {
            if (!userMarker) {
                const userIcon = L.divIcon({ className: 'user-marker', html: `<div class="w-4 h-4 bg-[#4285F4] rounded-full border-2 border-white shadow-[0_0_10px_rgba(66,133,244,0.6)]"></div>`, iconSize: [16, 16], iconAnchor: [8, 8] });
                userMarker = L.marker(e.latlng, { icon: userIcon, zIndexOffset: 1000 }).addTo(map);
            } else { userMarker.setLatLng(e.latlng); }
            document.querySelector('#btn-locate i').className = 'fa-solid fa-location-crosshairs text-[#4285F4]';
            window.showToast("已取得目前位置");
        });

        setTimeout(() => { map.invalidateSize(); }, 500);
    }
    
    window.locateUser = function() {
        document.querySelector('#btn-locate i').className = 'fa-solid fa-spinner fa-spin text-brand-primary';
        window.showToast("正在尋找您的位置...");
        map.locate({ setView: true, maxZoom: 16, enableHighAccuracy: true, timeout: 10000 });
    };

    function renderMarkersOnMap(spots) {
        markersLayer.clearLayers();
        markersDict = {};
        let validCoords = [];

        spots.forEach(spot => {
            if (spot.lat && spot.lng) {
                validCoords.push([spot.lat, spot.lng]);
                const locObj = LOCATION_MODES.find(m => m.id === spot.locMode) || LOCATION_MODES[0];
                const customIcon = L.divIcon({
                    className: 'custom-marker',
                    html: `<div class="marker-pin"><i class="${locObj.icon}"></i></div>`,
                    iconSize: [36, 36], iconAnchor: [18, 18], popupAnchor: [0, -16]
                });
                const marker = L.marker([spot.lat, spot.lng], { icon: customIcon });
                marker.on('click', () => { window.flyToSpot(spot.id); });
                markersLayer.addLayer(marker);
                markersDict[spot.id] = marker;
            }
        });

        if (validCoords.length > 0) {
            const bounds = L.latLngBounds(validCoords);
            const isDesktop = window.innerWidth >= 768;
            const padOptions = isDesktop ? { paddingTopLeft: [400, 0], padding: [50, 50] } : { paddingBottomRight: [0, 300], padding: [30, 30] };
            map.flyToBounds(bounds, { ...padOptions, duration: 1.2, maxZoom: 15 });
        }
    }

    window.flyToSpot = function(spotId) {
        const spot = publicSpots.find(s => s.id === spotId);
        if (spot && spot.lat && spot.lng) {
            map.flyTo([spot.lat, spot.lng], 16, { duration: 1 });
            window.showSpotDetail(spotId);
        } else {
            window.showToast('這個景點尚未設定精確座標！');
        }
    };

    // ========== 景點資訊面板邏輯 (UI 改版) ==========
    window.showSpotDetail = function(spotId) {
        const spot = publicSpots.find(s => s.id === spotId);
        if (!spot) return;

        const locObj = LOCATION_MODES.find(m => m.id === spot.locMode) || LOCATION_MODES[0];

        // 圖示、標題與分類
        document.getElementById('detail-icon').innerHTML = `<i class="${locObj.icon}"></i>`;
        document.getElementById('detail-name').innerText = spot.name;
        document.getElementById('detail-cat').innerText = locObj.label;
        
        // 處理外文名稱 (分行)
        const foreign1 = spot.foreignName1;
        const foreign2 = spot.foreignName2;
        const foreignContainer = document.getElementById('detail-foreign-names');
        const f1El = document.getElementById('detail-foreign-1');
        const f2El = document.getElementById('detail-foreign-2');
        
        if (foreign1 || foreign2) {
            foreignContainer.classList.remove('hidden');
            f1El.innerText = foreign1 || '';
            f1El.style.display = foreign1 ? 'block' : 'none';
            f2El.innerText = foreign2 || '';
            f2El.style.display = foreign2 ? 'block' : 'none';
        } else {
            foreignContainer.classList.add('hidden');
        }

        // 地址與描述
        const displayAddress = spot.address || spot.subtitle || '無詳細地址備註';
        document.getElementById('detail-address').innerText = displayAddress;
        
        const descEl = document.getElementById('detail-desc');
        if (spot.description) {
            descEl.innerHTML = spot.description.replace(/\n/g, '<br>');
            descEl.classList.remove('hidden');
        } else {
            descEl.classList.add('hidden');
        }

        // --- 三個圓圈功能按鈕設定 ---
        
        // 1. 導航
        const navBtn = document.getElementById('circle-nav-btn');
        if (spot.lat && spot.lng) {
            navBtn.href = `https://www.google.com/maps/dir/?api=1&destination=${spot.lat},${spot.lng}`;
        } else {
            navBtn.href = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(displayAddress)}`;
        }

        // 2. 官網
        const webBtn = document.getElementById('circle-web-btn');
        if (spot.website) {
            webBtn.href = spot.website;
            webBtn.style.display = 'flex';
        } else {
            webBtn.style.display = 'none';
        }

        // 3. 電話
        const phoneBtn = document.getElementById('circle-phone-btn');
        if (spot.phone) {
            phoneBtn.href = `tel:${spot.phone}`;
            phoneBtn.style.display = 'flex';
        } else {
            phoneBtn.style.display = 'none';
        }

        // 更新收藏按鈕狀態
        updateFavoriteUI(spot.id);

        // 綁定其他功能
        document.getElementById('btn-add-to-trip').onclick = () => window.showToast(`已觸發！請至「我的行程」將「${spot.name}」排入行程表`);
        document.getElementById('btn-favorite-spot').onclick = () => window.toggleFavorite(spot.id);

        // 滑入面板
        const panel = document.getElementById('spot-detail-panel');
        panel.classList.remove('translate-x-full');
        panel.classList.add('translate-x-0');
    };

    window.closeSpotDetail = function() {
        document.getElementById('spot-detail-panel').classList.add('translate-x-full');
    };

    // ========== 收藏功能持久化邏輯 ==========

    function listenToFavorites(userId) {
        // 從私有路徑讀取收藏
        const favRef = collection(db, 'artifacts', appId, 'users', userId, 'favorites');
        onSnapshot(favRef, (snapshot) => {
            userFavorites = new Set(snapshot.docs.map(doc => doc.id));
            // 如果當前詳情面板開著，且剛好是正在更新的這一個，重新整理 UI
            const panel = document.getElementById('spot-detail-panel');
            if (panel && panel.classList.contains('translate-x-0')) {
                // 這裡簡單處理，暫不重新渲染全文，僅更新按鈕
            }
        });
    }

    function updateFavoriteUI(spotId) {
        const favBtn = document.getElementById('btn-favorite-spot');
        const isFav = userFavorites.has(spotId);
        
        if (isFav) {
            favBtn.innerHTML = '<i class="fa-solid fa-heart"></i>';
            favBtn.classList.remove('text-brand-textSub', 'bg-brand-bg');
            favBtn.classList.add('text-[#E63946]', 'bg-[#FFE5E5]');
        } else {
            favBtn.innerHTML = '<i class="fa-regular fa-heart"></i>';
            favBtn.classList.remove('text-[#E63946]', 'bg-[#FFE5E5]');
            favBtn.classList.add('text-brand-textSub', 'bg-brand-bg');
        }
    }

    window.toggleFavorite = async function(spotId) {
        if (!currentUser && !isGuest) {
            window.showToast("請先登入後再使用收藏功能");
            return;
        }

        const isFav = userFavorites.has(spotId);
        
        if (isGuest) {
            // 訪客模式存 LocalStorage
            if (isFav) userFavorites.delete(spotId); else userFavorites.add(spotId);
            localStorage.setItem('guest_favorites', JSON.stringify([...userFavorites]));
            updateFavoriteUI(spotId);
            window.showToast(isFav ? "已取消收藏" : "已收藏景點！");
            return;
        }

        // Firebase 模式
        try {
            const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'favorites', spotId);
            if (isFav) {
                await deleteDoc(docRef);
                window.showToast("已取消收藏");
            } else {
                await setDoc(docRef, { timestamp: Date.now() });
                window.showToast("已加入收藏！");
            }
            // 狀態會由 onSnapshot 自動更新
        } catch (e) {
            console.error(e);
            window.showToast("收藏失敗，請檢查權限");
        }
    };

    // ========== 資料載入 ==========
    function loadSpots() {
      if (isGuest) {
        const localSpots = localStorage.getItem('guest_spots');
        publicSpots = localSpots ? JSON.parse(localSpots) : [];
        const localFavs = localStorage.getItem('guest_favorites');
        if (localFavs) userFavorites = new Set(JSON.parse(localFavs));
        renderListAndMap();
      } else {
        const qSpots = collection(db, 'artifacts', appId, 'public', 'data', 'spots');
        onSnapshot(qSpots, (snapshot) => {
          publicSpots = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          renderListAndMap();
        }, err => {
          console.error(err);
          renderListAndMap();
        });
      }
    }

    function renderListAndMap(filter = '') {
      const container = document.getElementById('explore-list');
      let spots = publicSpots;
      
      if (filter) {
          const kw = filter.toLowerCase();
          spots = spots.filter(s => 
              (s.name || '').toLowerCase().includes(kw) || 
              (s.address || s.subtitle || '').toLowerCase().includes(kw)
          );
      }

      if (map) renderMarkersOnMap(spots);
      document.getElementById('spot-count').innerText = `${spots.length} 個地標`;

      if (spots.length === 0) {
          container.innerHTML = `<div class="py-12 text-center text-brand-textSub opacity-50"><i class="fa-solid fa-map-location-dot text-4xl mb-3"></i><p class="font-bold text-sm">無相關結果</p></div>`;
          return;
      }

      const sortedSpots = [...spots].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

      container.innerHTML = sortedSpots.map(spot => {
          const locObj = LOCATION_MODES.find(m => m.id === spot.locMode) || LOCATION_MODES[0];
          const displayAddress = spot.address || spot.subtitle || '';
          return `
          <div onclick="window.flyToSpot('${spot.id}')" class="bg-white p-3 md:p-4 rounded-[16px] md:rounded-[20px] border border-brand-light shadow-sm flex items-center gap-3 md:gap-4 cursor-pointer hover:shadow-md hover:border-brand-primary/40 active:scale-[0.98] transition-all group">
             <div class="w-10 h-10 md:w-12 md:h-12 rounded-full bg-brand-primary/10 text-brand-primary flex items-center justify-center text-lg md:text-xl shrink-0 group-hover:scale-110 transition-transform">
                 <i class="${locObj.icon}"></i>
             </div>
             <div class="flex-1 overflow-hidden w-full">
                <div class="text-[14px] md:text-[15px] font-extrabold text-brand-dark truncate group-hover:text-brand-primary transition-colors">${spot.name}</div>
                <div class="text-[11px] md:text-[12px] font-bold text-brand-textSub mt-0.5 truncate flex items-center gap-1.5">
                   <span class="text-brand-primary/80 shrink-0 bg-brand-primary/10 px-1.5 py-[2px] rounded text-[9px] md:text-[10px]">${locObj.label}</span>
                   ${displayAddress ? `<span class="truncate opacity-80">${displayAddress}</span>` : ''}
                </div>
             </div>
             <i class="fa-solid fa-location-arrow text-brand-light group-hover:text-brand-primary text-sm transition-colors"></i>
          </div>`;
      }).join('');
    }

    document.getElementById('input-explore-search').addEventListener('input', (e) => renderListAndMap(e.target.value));

    // ========== App 初始化流程 ==========
    async function startApp() {
        try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }
        } catch (e) { console.log('Auth Init Fallback', e); }
        initMap();
        loadSpots();
    }

    startApp();
    window.addEventListener('resize', () => { if(map) map.invalidateSize(); });
  </script>
</body>
</html>
