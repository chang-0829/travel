<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>趣旅行 - 尋覓世界</title>
    
    <!-- === 載入外部資源 === -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- === 舊版 Tailwind 自訂色彩設定 === -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            primary: '#748CAB',
                            dark: '#3E5C76',
                            light: '#E6EBEF',
                            bg: '#F2F5F8',
                            textMain: '#2C3E50',
                            textSub: '#8796A5',
                            accent: '#D5896F'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            overflow: hidden; /* 防止整個頁面捲動，交由內部容器控制 */
        }

        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 修正 Leaflet 層級 */
        .leaflet-container { z-index: 10; font-family: inherit; }
        .leaflet-popup-content-wrapper { border-radius: 1rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        
        /* 舊版：自訂地圖圖示 */
        .custom-marker-wrapper {
            display: flex; align-items: center; justify-content: center;
            width: 36px; height: 36px; background-color: white; border-radius: 50%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2); 
            border: 2px solid #748CAB; 
            color: #748CAB;
            transition: transform 0.2s, background-color 0.2s, color 0.2s;
        }
        .custom-marker-wrapper:hover { 
            transform: scale(1.1); 
            background-color: #748CAB; 
            color: white; 
        }

        /* PB-SAFE 確保在 iOS 底部不被裁切 */
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body>

    <div id="discover-page-root" class="h-full">
        
        <!-- 💡 修復佈局：使用 flex-col 保證內容不重疊且完美滿版 -->
        <div class="h-full flex flex-col animate-fade-in relative bg-white">
            
            <!-- ========================================== -->
            <!-- 頂部分頁控制列 (Tabs) - 固定在上方 -->
            <!-- ========================================== -->
            <div class="bg-white px-4 sm:px-6 lg:px-8 pt-6 border-b border-gray-200 shrink-0 z-30">
                <h1 class="text-3xl font-bold text-gray-900 tracking-tight mb-4">尋覓世界</h1>
                <div class="flex space-x-6 overflow-x-auto hide-scrollbar">
                    <button id="tab-btn-curated" class="pb-3 text-sm font-bold text-blue-600 border-b-2 border-blue-600 transition-colors whitespace-nowrap">
                        精選推薦
                    </button>
                    <button id="tab-btn-map" class="pb-3 text-sm font-bold text-gray-500 hover:text-gray-800 border-b-2 border-transparent transition-colors whitespace-nowrap">
                        探索地圖
                    </button>
                </div>
            </div>

            <!-- ========================================== -->
            <!-- Tab 1: 精選推薦 -->
            <!-- ========================================== -->
            <div id="tab-content-curated" class="flex-1 overflow-y-auto pb-24">
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
                    <!-- 搜尋列 -->
                    <div class="relative max-w-2xl mb-8">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        </div>
                        <input type="text" placeholder="想去哪裡？搜尋城市、景點或主題..." class="w-full pl-11 pr-4 py-3 bg-white border border-gray-200 rounded-2xl text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm transition-all">
                    </div>

                    <!-- 分類標籤 -->
                    <div class="flex overflow-x-auto hide-scrollbar gap-3 mb-8 pb-2">
                        <button class="px-5 py-2.5 bg-blue-600 text-white text-sm font-medium rounded-full shrink-0 shadow-sm transition-colors">全部推薦</button>
                        <button class="px-5 py-2.5 bg-white border border-gray-200 text-gray-600 text-sm font-medium rounded-full shrink-0 hover:bg-gray-50 transition-colors">🔥 熱門排行</button>
                        <button class="px-5 py-2.5 bg-white border border-gray-200 text-gray-600 text-sm font-medium rounded-full shrink-0 hover:bg-gray-50 transition-colors">🌸 季節限定</button>
                        <button class="px-5 py-2.5 bg-white border border-gray-200 text-gray-600 text-sm font-medium rounded-full shrink-0 hover:bg-gray-50 transition-colors">⛰️ 秘境探險</button>
                    </div>

                    <!-- 編輯精選 -->
                    <div class="mb-12">
                        <h2 class="text-xl font-bold text-gray-900 mb-4 px-1">編輯精選</h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            <a href="#" class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition-all group">
                                <div class="relative h-48 overflow-hidden">
                                    <img src="https://images.unsplash.com/photo-1548013146-72479768bada?q=80&w=800&auto=format&fit=crop" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" alt="週末快閃">
                                </div>
                                <div class="p-6">
                                    <h3 class="text-lg font-bold text-gray-900 mb-2">週末快閃：兩天一夜提案</h3>
                                    <p class="text-sm text-gray-500 line-clamp-2">不用請假也能出國！精選鄰近城市快閃行程，用 48 小時體驗異國風情。</p>
                                </div>
                            </a>
                            <a href="#" class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition-all group">
                                <div class="relative h-48 overflow-hidden">
                                    <img src="https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?q=80&w=800&auto=format&fit=crop" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" alt="秘境探險">
                                </div>
                                <div class="p-6">
                                    <h3 class="text-lg font-bold text-gray-900 mb-2">避開人潮：尋找隱藏秘境</h3>
                                    <p class="text-sm text-gray-500 line-clamp-2">受夠了人擠人的觀光景點？跟著達人腳步，探索鮮為人知的私房秘境。</p>
                                </div>
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ========================================== -->
            <!-- Tab 2: 探索地圖 (使用 flex-1 填滿剩餘高度) -->
            <!-- ========================================== -->
            <div id="tab-content-map" class="hidden flex-1 relative w-full overflow-hidden bg-brand-bg">
                
                <!-- 地圖容器 -->
                <div id="full-screen-map" class="w-full h-full z-0 absolute inset-0"></div>

                <!-- 舊版：懸浮搜尋與篩選 -->
                <div class="absolute top-4 left-4 right-4 z-[999] md:w-96 md:left-6 md:top-6 pointer-events-none">
                    <div class="bg-white rounded-2xl shadow-lg flex items-center p-2 mb-3 pointer-events-auto">
                        <div class="pl-3 pr-2 text-brand-textSub"><i class="fas fa-search"></i></div>
                        <input type="text" placeholder="在地圖上搜尋景點..." class="flex-1 bg-transparent border-none focus:outline-none text-brand-textMain w-full placeholder-brand-textSub">
                        <button class="w-10 h-10 rounded-xl bg-brand-bg text-brand-primary flex items-center justify-center ml-2 hover:bg-brand-light transition-colors"><i class="fas fa-sliders-h"></i></button>
                    </div>
                    <!-- 快速篩選 (舊版配色) -->
                    <div class="flex gap-2 overflow-x-auto hide-scrollbar pb-2 px-1 pointer-events-auto">
                        <button class="px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap bg-brand-primary text-white shadow-md transition-colors"><i class="fas fa-map-marker-alt mr-1"></i> 全部</button>
                        <button class="px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap bg-white text-brand-textMain shadow-sm hover:bg-brand-bg transition-colors"><i class="fas fa-utensils mr-1"></i> 美食</button>
                        <button class="px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap bg-white text-brand-textMain shadow-sm hover:bg-brand-bg transition-colors"><i class="fas fa-mountain mr-1"></i> 自然</button>
                    </div>
                </div>

                <!-- 舊版：側邊/底部景點詳細資訊面板 -->
                <div id="spot-detail-panel" class="absolute inset-x-0 bottom-0 md:inset-y-0 md:right-0 md:left-auto md:w-[400px] bg-white shadow-[0_-10px_40px_rgba(0,0,0,0.1)] md:shadow-2xl z-[1000] transform translate-y-full md:translate-y-0 md:translate-x-full transition-transform duration-300 flex flex-col rounded-t-3xl md:rounded-none h-[80%] md:h-full pb-safe">
                    
                    <!-- 手機版拖曳條 -->
                    <div class="w-full flex justify-center py-3 md:hidden shrink-0 cursor-pointer" onclick="window.closeSpotDetail()">
                        <div class="w-12 h-1.5 bg-gray-300 rounded-full"></div>
                    </div>

                    <!-- 景點圖片 -->
                    <div class="relative h-48 md:h-64 shrink-0 w-full bg-gray-200">
                        <img id="spot-detail-img" src="" alt="景點預覽" class="w-full h-full object-cover">
                        <button onclick="window.closeSpotDetail()" class="hidden md:flex absolute top-4 right-4 w-8 h-8 bg-black/40 text-white rounded-full items-center justify-center hover:bg-black/60 transition-colors z-10">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>

                    <!-- 內容區與操作 -->
                    <div class="flex-1 overflow-y-auto relative bg-white">
                        
                        <!-- 舊版精髓：懸浮圓形收藏按鈕 (FAB) -->
                        <button id="btn-favorite-spot" class="absolute right-5 -top-6 w-12 h-12 bg-white rounded-full shadow-[0_4px_12px_rgba(0,0,0,0.15)] flex items-center justify-center text-gray-300 text-xl z-10 hover:scale-110 transition-transform">
                            <i id="fav-icon-inner" class="fas fa-heart"></i>
                        </button>

                        <div class="p-5 md:p-6 pb-2">
                            <h2 id="spot-detail-title" class="text-2xl font-bold text-brand-textMain mb-1">載入中...</h2>
                            <div class="flex items-center text-sm text-brand-textSub mb-4">
                                <span class="text-yellow-400 mr-1"><i class="fas fa-star"></i></span>
                                <span id="spot-detail-rating" class="font-medium mr-2">4.5</span>
                            </div>

                            <!-- 舊版精髓：行動按鈕 -->
                            <div class="flex justify-around py-4 border-y border-brand-light mb-5">
                                <a id="circle-nav-btn" target="_blank" class="flex flex-col items-center group cursor-pointer">
                                    <div class="w-12 h-12 rounded-full bg-brand-light text-brand-primary flex items-center justify-center mb-1.5 group-hover:bg-brand-primary group-hover:text-white transition-colors text-lg">
                                        <i class="fas fa-location-arrow"></i>
                                    </div>
                                    <span class="text-[11px] font-medium text-brand-textSub">導航</span>
                                </a>
                                <a id="circle-web-btn" target="_blank" class="flex flex-col items-center group cursor-pointer">
                                    <div class="w-12 h-12 rounded-full bg-brand-light text-brand-primary flex items-center justify-center mb-1.5 group-hover:bg-brand-primary group-hover:text-white transition-colors text-lg">
                                        <i class="fas fa-globe"></i>
                                    </div>
                                    <span class="text-[11px] font-medium text-brand-textSub">網站</span>
                                </a>
                                <a id="circle-phone-btn" class="flex flex-col items-center group cursor-pointer">
                                    <div class="w-12 h-12 rounded-full bg-brand-light text-brand-primary flex items-center justify-center mb-1.5 group-hover:bg-brand-primary group-hover:text-white transition-colors text-lg">
                                        <i class="fas fa-phone"></i>
                                    </div>
                                    <span class="text-[11px] font-medium text-brand-textSub">電話</span>
                                </a>
                            </div>

                            <!-- 資訊列表 -->
                            <div class="space-y-4 pb-12">
                                <div class="flex items-start">
                                    <i class="fas fa-map-marker-alt w-5 text-center text-brand-primary mt-1 shrink-0"></i>
                                    <p id="spot-detail-address" class="ml-3 text-sm text-brand-textMain leading-relaxed"></p>
                                </div>
                                <div class="flex items-start">
                                    <i class="fas fa-info-circle w-5 text-center text-brand-primary mt-1 shrink-0"></i>
                                    <p id="spot-detail-desc" class="ml-3 text-sm text-brand-textMain leading-relaxed"></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- === Firebase & 頁面邏輯模組 === -->
        <script type="module">
            import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
            import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
            import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

            const fallbackConfig = {
                apiKey: "AIzaSyCQF8A3ieML0JP3X8X78NCRuiUETRAiu5E",
                authDomain: "travel-96009.firebaseapp.com",
                projectId: "travel-96009",
                storageBucket: "travel-96009.firebasestorage.app",
                messagingSenderId: "578860064042",
                appId: "1:578860064042:web:b147880df3a01dd8f75253"
            };
            const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : fallbackConfig;
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'travel-app';

            const app = !getApps().length ? initializeApp(firebaseConfig) : getApp();
            const auth = getAuth(app);
            const db = getFirestore(app);

            let currentUser = null;
            let allSpots = [];
            let userFavorites = new Set();
            let markersLayer = null;
            let publicSpotsLoaded = false;

            // --- 1. Firebase 驗證與資料拉取 ---
            const initAuth = async () => {
                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        // 攔截匿名登入報錯，避免影響後續程式
                        await signInAnonymously(auth).catch(err => {
                            console.warn("提示：匿名登入未啟用，目前以訪客身分瀏覽地圖。");
                        });
                    }
                } catch (error) { 
                    console.warn("Firebase Auth Init Warning:", error.message); 
                }
            };
            initAuth();

            onAuthStateChanged(auth, (user) => {
                currentUser = user;
                
                // 不論是否登入，都預設載入地圖資料
                if (!publicSpotsLoaded) {
                    loadPublicSpots();
                    publicSpotsLoaded = true;
                }

                if (user) {
                    loadUserFavorites();
                }
            });

            // 💡 核心修復：自動判斷要讀取您本地的 `spots` 還是沙盒的資料
            function loadPublicSpots() {
                const isLocalEnv = typeof __firebase_config === 'undefined';
                const spotsCollection = isLocalEnv ? collection(db, 'spots') : collection(db, 'artifacts', appId, 'public', 'data', 'spots');
                
                console.log(`[Firebase] 正在嘗試從 ${isLocalEnv ? '根目錄 spots' : '沙盒路徑'} 讀取資料...`);

                onSnapshot(spotsCollection, (snapshot) => {
                    if (snapshot.empty && allSpots.length === 0) {
                        console.log("[Firebase] 查無資料，自動載入預設示範資料...");
                        seedDefaultSpots();
                    } else {
                        console.log(`[Firebase] 成功讀取到 ${snapshot.docs.length} 筆景點資料！`);
                        
                        allSpots = snapshot.docs.map(doc => {
                            const data = doc.data();
                            // 💡 容錯處理：相容不同命名習慣 (lat vs latitude, img vs image)
                            return {
                                id: doc.id,
                                name: data.name || '未知景點',
                                lat: data.lat || data.latitude,
                                lng: data.lng || data.longitude,
                                rating: data.rating || 4.5,
                                address: data.address || '',
                                desc: data.desc || data.description || '',
                                img: data.img || data.image || data.imageUrl || 'https://via.placeholder.com/800x600',
                                phone: data.phone || '',
                                website: data.website || ''
                            };
                        });
                        
                        // 過濾掉沒有座標的異常資料
                        allSpots = allSpots.filter(s => s.lat && s.lng);
                        renderMapMarkers();
                    }
                }, (error) => console.warn("載入景點資料失敗:", error.message));
            }

            function loadUserFavorites() {
                if (!currentUser) return;
                const isLocalEnv = typeof __firebase_config === 'undefined';
                const favRef = isLocalEnv 
                    ? collection(db, 'users', currentUser.uid, 'favorites') 
                    : collection(db, 'artifacts', appId, 'users', currentUser.uid, 'favorites');

                onSnapshot(favRef, (snapshot) => {
                    userFavorites = new Set(snapshot.docs.map(doc => doc.id));
                    if (window.currentOpenSpotId) updateFavoriteUI(window.currentOpenSpotId);
                }, (error) => console.error("Error loading favorites:", error));
            }

            async function seedDefaultSpots() {
                const defaultSpots = [
                    { name: "台北 101", lat: 25.0339, lng: 121.5644, rating: 4.8, address: "台北市信義區信義路五段7號", desc: "台灣最具代表性的摩天大樓，觀景台可俯瞰整個台北市。", img: "https://images.unsplash.com/photo-1552993873-0aa1140e7041?q=80&w=800", phone: "02-8101-8800", website: "https://www.taipei-101.com.tw/" },
                    { name: "淺草寺", lat: 35.7147, lng: 139.7966, rating: 4.7, address: "日本東京都台東區淺草二丁目", desc: "東京歷史最悠久的寺廟，著名的「雷門」燈籠是必拍景點。", img: "https://images.unsplash.com/photo-1532236204992-f5e85c0142ce?q=80&w=800", phone: "+81-3-3842-0181", website: "https://www.senso-ji.jp/" },
                    { name: "玉山國家公園", lat: 23.4699, lng: 120.9572, rating: 4.9, address: "台灣南投縣信義鄉", desc: "台灣面積最大的國家公園，擁有豐富的自然生態與高山景觀。", img: "https://images.unsplash.com/photo-1578637387939-43c525550085?q=80&w=800", phone: "049-277-3121", website: "" }
                ];
                
                const isLocalEnv = typeof __firebase_config === 'undefined';
                const spotsCollection = isLocalEnv ? collection(db, 'spots') : collection(db, 'artifacts', appId, 'public', 'data', 'spots');
                
                try {
                    for (const spot of defaultSpots) {
                        await setDoc(doc(spotsCollection), spot);
                    }
                } catch (e) {
                    allSpots = defaultSpots.map((spot, index) => ({ id: 'default_' + index, ...spot }));
                    renderMapMarkers();
                }
            }

            // --- 2. Tab 切換邏輯 ---
            const btnCurated = document.getElementById('tab-btn-curated');
            const btnMap = document.getElementById('tab-btn-map');
            const contentCurated = document.getElementById('tab-content-curated');
            const contentMap = document.getElementById('tab-content-map');
            let fullMapInitialized = false;

            function switchTab(tabName) {
                if (tabName === 'curated') {
                    contentCurated.style.display = 'block';
                    contentMap.style.display = 'none';
                    btnCurated.className = "pb-3 text-sm font-bold text-blue-600 border-b-2 border-blue-600 transition-colors whitespace-nowrap";
                    btnMap.className = "pb-3 text-sm font-bold text-gray-500 hover:text-gray-800 border-b-2 border-transparent transition-colors whitespace-nowrap";
                } else {
                    contentCurated.style.display = 'none';
                    contentMap.style.display = 'block';
                    btnMap.className = "pb-3 text-sm font-bold text-blue-600 border-b-2 border-blue-600 transition-colors whitespace-nowrap";
                    btnCurated.className = "pb-3 text-sm font-bold text-gray-500 hover:text-gray-800 border-b-2 border-transparent transition-colors whitespace-nowrap";
                    
                    if (!fullMapInitialized) {
                        initLeafletMap();
                        fullMapInitialized = true;
                    } else if (window.fullMapInstance) {
                        // 確保地圖尺寸重新計算，避免灰屏
                        setTimeout(() => window.fullMapInstance.invalidateSize(), 100);
                    }
                }
            }

            btnCurated.addEventListener('click', () => switchTab('curated'));
            btnMap.addEventListener('click', () => switchTab('map'));

            // 初始狀態
            switchTab('curated');

            // --- 3. Leaflet 地圖初始化 (Google Maps 圖磚) ---
            function initLeafletMap() {
                const checkL = setInterval(() => {
                    if (typeof L !== 'undefined') {
                        const mapEl = document.getElementById('full-screen-map');
                        if (!mapEl || mapEl.clientHeight === 0) return; 

                        clearInterval(checkL);
                        if (mapEl._leaflet_id) return;

                        const map = L.map('full-screen-map', { zoomControl: false }).setView([23.5, 121], 6);
                        window.fullMapInstance = map;

                        L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
                            maxZoom: 20,
                            subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
                            attribution: '&copy; Google Maps'
                        }).addTo(map);

                        L.control.zoom({ position: 'bottomright' }).addTo(map);
                        markersLayer = L.layerGroup().addTo(map);

                        if (allSpots.length > 0) renderMapMarkers();
                        
                        // 初始化後強制重新計算一次尺寸
                        setTimeout(() => map.invalidateSize(), 200);
                    }
                }, 100);
            }

            function renderMapMarkers() {
                if (!window.fullMapInstance || !markersLayer) return;
                markersLayer.clearLayers();

                allSpots.forEach(spot => {
                    const iconHtml = `<div class="custom-marker-wrapper"><i class="${(spot.name||'').includes('山') ? 'fas fa-mountain' : 'fas fa-camera'}"></i></div>`;
                    const customIcon = L.divIcon({ className: '', html: iconHtml, iconSize: [36, 36], iconAnchor: [18, 36] });
                    
                    const marker = L.marker([spot.lat, spot.lng], { icon: customIcon }).addTo(markersLayer);
                    marker.on('click', () => window.openSpotDetail(spot));
                });
            }

            // --- 4. 面板互動與收藏邏輯 ---
            window.openSpotDetail = function(spot) {
                window.currentOpenSpotId = spot.id;

                document.getElementById('spot-detail-title').textContent = spot.name;
                document.getElementById('spot-detail-address').textContent = spot.address;
                document.getElementById('spot-detail-desc').textContent = spot.desc;
                document.getElementById('spot-detail-rating').textContent = spot.rating || '4.0';
                document.getElementById('spot-detail-img').src = spot.img || 'https://via.placeholder.com/800x600';

                const navBtn = document.getElementById('circle-nav-btn');
                if (spot.lat && spot.lng) {
                    navBtn.href = `https://www.google.com/maps/dir/?api=1&destination=${spot.lat},${spot.lng}`;
                } else {
                    navBtn.href = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(spot.address || spot.name)}`;
                }

                const webBtn = document.getElementById('circle-web-btn');
                if (spot.website) { webBtn.href = spot.website; webBtn.style.display = 'flex'; } 
                else { webBtn.style.display = 'none'; }

                const phoneBtn = document.getElementById('circle-phone-btn');
                if (spot.phone) { phoneBtn.href = `tel:${spot.phone}`; phoneBtn.style.display = 'flex'; } 
                else { phoneBtn.style.display = 'none'; }

                updateFavoriteUI(spot.id);

                const favBtn = document.getElementById('btn-favorite-spot');
                favBtn.onclick = () => window.toggleFavorite(spot.id);

                const panel = document.getElementById('spot-detail-panel');
                panel.classList.remove('translate-y-full', 'md:translate-x-full');
                panel.classList.add('translate-y-0', 'md:translate-x-0');
            };

            window.closeSpotDetail = function() {
                window.currentOpenSpotId = null;
                const panel = document.getElementById('spot-detail-panel');
                panel.classList.add('translate-y-full', 'md:translate-x-full');
                panel.classList.remove('translate-y-0', 'md:translate-x-0');
            };

            window.toggleFavorite = async function(spotId) {
                if (!currentUser) {
                    alert("請先登入帳號，即可使用收藏功能！");
                    return;
                }
                
                const isLocalEnv = typeof __firebase_config === 'undefined';
                const favDocRef = isLocalEnv 
                    ? doc(db, 'users', currentUser.uid, 'favorites', spotId)
                    : doc(db, 'artifacts', appId, 'users', currentUser.uid, 'favorites', spotId);

                try {
                    if (userFavorites.has(spotId)) {
                        await deleteDoc(favDocRef);
                    } else {
                        await setDoc(favDocRef, { savedAt: new Date().toISOString() });
                    }
                } catch (error) {
                    console.error("更新收藏失敗:", error);
                }
            };

            function updateFavoriteUI(spotId) {
                const favIcon = document.getElementById('fav-icon-inner');
                if (!favIcon) return;

                if (userFavorites.has(spotId)) {
                    favIcon.classList.remove('text-gray-300');
                    favIcon.classList.add('text-red-500');
                } else {
                    favIcon.classList.remove('text-red-500');
                    favIcon.classList.add('text-gray-300');
                }
            }
        </script>
    </div>
</body>
</html>
