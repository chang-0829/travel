<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>趣旅行 - 我的行程</title>
  <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)">
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  <script>tailwind.config={theme:{extend:{colors:{brand:{primary:'#748CAB',dark:'#3E5C76',light:'#E6EBEF',bg:'#F2F5F8',card:'#FFFFFF',textMain:'#2C3E50',textSub:'#8796A5'}}}}}</script>
  <style>
    body { font-family: ui-sans-serif, system-ui, sans-serif; background-color: #F2F5F8; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .pb-safe { padding-bottom: max(12px, env(safe-area-inset-bottom)); }
    .pt-safe { padding-top: max(16px, env(safe-area-inset-top)); }
  </style>
</head>
<body class="text-brand-textMain antialiased overflow-hidden">
  <div class="max-w-md mx-auto h-[100dvh] bg-brand-bg shadow-xl relative flex flex-col">
    <!-- Header -->
    <header id="header-standard" class="bg-brand-bg pt-safe pb-4 px-6 shrink-0 flex justify-between items-end border-b border-brand-light z-10">
      <div>
        <p id="header-subtitle" class="text-sm font-bold text-brand-primary mb-1 uppercase tracking-widest mt-2">My Trip</p>
        <h1 id="header-title" class="text-3xl font-extrabold text-brand-dark tracking-tight">我的行程</h1>
      </div>
    </header>

    <!-- Header for Itinerary Details (Hidden by default) -->
    <header id="header-itinerary" class="hidden bg-brand-bg pt-safe pb-2 px-4 shrink-0 flex justify-between items-center border-b border-brand-light z-10">
      <button onclick="switchMiniView('plans')" class="w-10 h-10 mt-2 flex items-center justify-center text-brand-dark hover:text-brand-primary">
        <i class="fa-solid fa-chevron-left text-xl"></i>
      </button>
      <div class="flex-1 mt-2 flex flex-col items-center justify-center text-center px-1 truncate">
        <h1 id="header-itinerary-title" class="text-[16px] font-extrabold text-brand-dark tracking-tight truncate w-full">載入中...</h1>
      </div>
      <div class="w-10 h-10 mt-2"></div> <!-- Spacer -->
    </header>

    <!-- View: Plans List -->
    <div id="view-plans" class="flex-1 overflow-y-auto px-6 pb-6 hide-scrollbar relative">
      <div id="plans-list" class="space-y-4 mt-6"></div>
      <button onclick="createNewPlan()" class="w-full mt-6 py-4 border-2 border-dashed border-brand-primary text-brand-primary font-bold rounded-[20px] hover:bg-brand-light transition-all flex justify-center items-center gap-2">
        <i class="fa-solid fa-plus"></i> 建立新行程
      </button>
    </div>

    <!-- View: Itinerary Detail (Hidden by default) -->
    <div id="view-itinerary" class="hidden flex-1 flex flex-col h-full overflow-hidden bg-brand-card relative">
        <div id="timeline-container" class="flex-1 overflow-y-auto px-4 pb-24 pt-6 relative bg-brand-card mx-2 mt-2">
           <!-- 行程內容渲染區 -->
        </div>
    </div>

    <!-- 底部導覽列 -->
    <nav class="bg-white border-t border-brand-light shrink-0 z-40 pb-safe shadow-[0_-4px_20px_rgba(0,0,0,0.02)]">
      <div class="flex justify-around items-center h-[65px]">
        <a href="./index.html" class="flex flex-col items-center justify-center w-full h-full text-brand-textSub hover:text-brand-primary transition-colors">
          <i class="fa-solid fa-house mb-1 text-[18px]"></i><span class="text-[10px] font-bold">首頁</span>
        </a>
        <a href="./discover.html" class="flex flex-col items-center justify-center w-full h-full text-brand-textSub hover:text-brand-primary transition-colors">
          <i class="fa-solid fa-earth-americas mb-1 text-[18px]"></i><span class="text-[10px] font-bold">探索</span>
        </a>
        <a href="./mytrip.html" class="flex flex-col items-center justify-center w-full h-full text-brand-primary transition-colors">
          <i class="fa-solid fa-suitcase-rolling mb-1 text-[18px]"></i><span class="text-[10px] font-bold">行程</span>
        </a>
        <a href="./account.html" class="flex flex-col items-center justify-center w-full h-full text-brand-textSub hover:text-brand-primary transition-colors">
          <i class="fa-solid fa-user mb-1 text-[18px]"></i><span class="text-[10px] font-bold">會員</span>
        </a>
      </div>
    </nav>
  </div>

  <script type="module">
    import { initializeApp } from '[https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js](https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js)';
    import { getAuth, onAuthStateChanged } from '[https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js](https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js)';
    import { getFirestore, collection, onSnapshot, addDoc, serverTimestamp } from '[https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js](https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js)';

    const firebaseConfig = { apiKey: "AIza...", authDomain: "...", projectId: "...", storageBucket: "...", messagingSenderId: "...", appId: "..." };
    const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app); const appId = "travel-platform-v2";

    let plans = [];
    const isGuest = localStorage.getItem('isGuest') === 'true';
    let currentUser = null;

    onAuthStateChanged(auth, (user) => {
      if (user && !isGuest) {
        currentUser = user; loadPlans();
      } else if (isGuest) {
        loadPlans();
      } else {
        document.getElementById('plans-list').innerHTML = `<div class="py-24 text-center text-brand-textSub"><p>請先前往「會員」登入</p></div>`;
      }
    });

    function loadPlans() {
      if (isGuest) {
        const localPlans = localStorage.getItem('guest_plans');
        plans = localPlans ? JSON.parse(localPlans) : []; renderPlans();
      } else {
        onSnapshot(collection(db, 'artifacts', appId, 'users', currentUser.uid, 'plans'), (snapshot) => {
          plans = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })); renderPlans();
        });
      }
    }

    function renderPlans() {
      const container = document.getElementById('plans-list');
      if (plans.length === 0) { container.innerHTML = '<p class="text-center text-brand-textSub">尚無行程</p>'; return; }
      container.innerHTML = plans.map(plan => `
        <div onclick="openPlan('${plan.id}')" class="bg-brand-card rounded-[24px] p-6 border border-brand-light shadow-sm flex items-center justify-between cursor-pointer">
          <div><h3 class="font-bold text-[16px]">${plan.title || '未命名行程'}</h3></div>
          <i class="fa-solid fa-chevron-right text-brand-primary"></i>
        </div>
      `).join('');
    }

    window.switchMiniView = function(view) {
        document.getElementById('view-plans').classList.add('hidden');
        document.getElementById('view-itinerary').classList.add('hidden');
        document.getElementById('header-standard').classList.add('hidden');
        document.getElementById('header-itinerary').classList.add('hidden');

        if(view === 'plans') {
            document.getElementById('view-plans').classList.remove('hidden');
            document.getElementById('header-standard').classList.remove('hidden');
        } else if (view === 'itinerary') {
            document.getElementById('view-itinerary').classList.remove('hidden');
            document.getElementById('header-itinerary').classList.remove('hidden');
        }
    }

    window.openPlan = function(id) {
        const plan = plans.find(p => p.id === id);
        document.getElementById('header-itinerary-title').innerText = plan.title;
        document.getElementById('timeline-container').innerHTML = `<p class="text-center mt-10">正在載入詳細行程內容...</p>`;
        switchMiniView('itinerary');
    }

    window.createNewPlan = async function() {
        const title = prompt("請輸入行程名稱", "新行程");
        if(!title) return;
        const newPlan = { title: title, createdAt: isGuest ? Date.now() : serverTimestamp() };
        
        if (isGuest) {
            newPlan.id = Date.now().toString(); plans.push(newPlan);
            localStorage.setItem('guest_plans', JSON.stringify(plans)); renderPlans();
        } else {
            await addDoc(collection(db, 'artifacts', appId, 'users', currentUser.uid, 'plans'), newPlan);
        }
    }
  </script>
</body>
</html>
