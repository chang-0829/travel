<script type="module">
    // 使用立即執行函式 (IIFE) 確保變數不污染全域
    (function() {
        const updateGreeting = () => {
            const hours = new Date().getHours();
            let greeting = "";

            if (hours >= 5 && hours < 11) greeting = "早安";
            else if (hours >= 11 && hours < 14) greeting = "午安";
            else if (hours >= 14 && hours < 18) greeting = "下午好";
            else if (hours >= 18 && hours < 24) greeting = "晚安";
            else greeting = "夜深了";

            const greetingEl = document.getElementById('dynamic-greeting');
            if (greetingEl) {
                greetingEl.textContent = `${greeting}，旅人！`;
            }
        };

        updateGreeting();
    })();
</script>
